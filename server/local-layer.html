         raising the bar while the drag is still running fights the drag.

         🔴 The window is short and a recent touch skips the check entirely,
         because the cost of being wrong here is one-sided. Suppressing wrongly
         means the bar never appears, which is the whole defect; showing wrongly
         means it appears a moment early during a drag and is then repositioned
         by the mouseup that follows. iOS synthesises a mousedown for a tap, so
         a tap followed by a long press would otherwise land inside the window

             abandoning here means the bar never appears for that selection. It

      if (!el.closest('.wrap')) return;
      if (el.closest('.hl-panel') || el.closest('.sv-panel') || el.closest('.sv-edit') ||

  var vaultHome = !!(S.vault && String(S.vault.week || '').trim()
                     && String(S.vault.topicNo || '').trim());

  badge.className = 'sv-badge';
  badge.title = 'Click to save to ' + vaultName + ' now';
  if (vaultHome) { document.body.appendChild(badge); }

    badge.classList.toggle('err', !!isErr);

     rather than nine string literals disagreeing after the next edit. */
  function badgeSay(what, isErr) { setBadge(vaultName + ': ' + what, isErr); }

  function setVaultName(name) {

    var wasReady = badge.textContent === vaultName + ': ready';

    if (lab) lab.textContent = vaultName;

       status reply must not have its timestamp wiped by a rename. */

  }

  badgeSay('ready');

  function push() {
    if (caps.vault === false) return;      /* vault publishing is off here */
    if (!vaultHome) return;                /* this page has no vault home */
    if (inflight) { dirty = true; return; }
    inflight = true;
    badgeSay('saving…');
    api('/api/vault', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        doc:        S.docId,
        week:       S.vault.week,
        topicNo:    S.vault.topicNo,
        topicTitle: S.vault.topic,
        markdown:   S.vaultMd(),
        /* Nothing marked means the part's block comes out of the note, rather
           than sitting there as a heading over an empty section. */
        hasMarks:   (function () { var m = S.marks(); return !!(m.items.length || m.notes.length); })()
      })
    }).then(function (r) {
      if (!r.ok || !r.body.ok) throw new Error(r.body && r.body.error || 'refused');

        String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0'));
    }).catch(function (err) {
      badgeSay('not saved', true);

      inflight = false;
      if (dirty) { dirty = false; schedule(); }
    });

    window.clearTimeout(timer);
    timer = window.setTimeout(push, 1300);
  }

  badge.addEventListener('click', function () { window.clearTimeout(timer); push(); });

  /* ---------- keeping the selection visible ----------

    if (!el) return null;
    var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);

      if (end === null && seg.e <= next) { end = [node, Math.max(0, seg.e - pos)]; break; }

    '<div class="sv-ask" hidden>' +

  toPanel.addEventListener('click', function () {

  function autosize() {
    askBox.style.height = 'auto';
    askBox.style.height = Math.min(120, askBox.scrollHeight) + 'px';
  }
  askBox.addEventListener('input', autosize);
  askBox.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendFollowup(); }
    /* The popover closes on Escape, which would throw away the conversation
       mid-sentence, so the field swallows it and only blurs. */
    if (e.key === 'Escape') { e.stopPropagation(); askBox.blur(); }
  });
  askBtn.addEventListener('click', function () { sendFollowup(); });
  pop.querySelector('[data-explain]').addEventListener('click', function () {
    if (!current) return;
    /* The thread has to record WHAT was asked about, not just the answer,
       because it is read later in the panel with the page long gone. */
    if (chat.length) {
      /* A repeat is a real instruction, so it is sent as well as shown. The
         first one sends nothing and lets the server use its own phrasing, which
         means what the thread shows and what was asked still agree. */
      sendAsk('Explain that again, more plainly.', 'Explain that again, more plainly.');
    } else {
      sendAsk('', 'Explain: “' + current.term + '”');
    }
  });

  var levelSel = pop.querySelector('#svLevel');
  levelSel.value = level;
  levelSel.addEventListener('change', function () {
    level = levelSel.value;
    try { window.localStorage.setItem(LEVEL_KEY, level); } catch (e) {}
    S.toast(level === 'plain' ? 'Answers will be in plain language.'
          : level === 'technical' ? 'Answers will assume the vocabulary.'
          : 'Answers will be technical, with every term explained as it goes.');
  });

  /* ---------- drag the popover by its header ---------- */

  (function () {
    var head = pop.querySelector('.sv-pop-head');
    var from = null;
    head.addEventListener('mousedown', function (e) {
      if (e.target.closest('button')) return;
      /* R29: below 640px the popover is a sheet fixed to the bottom edge, and
         the CSS that pins it there is marked important, so a drag would set
         inline coordinates that never apply and leave `anchor` null, which is
         what placePop() needs to keep the sheet in step with a growing answer.
         Nothing to drag to, so nothing starts. Above 640px it is placed beside
         the selection again, so the drag comes back with it. */
      if (window.matchMedia && window.matchMedia('(max-width: 640px)').matches) return;
      var box = pop.getBoundingClientRect();
      /* Switch to viewport coordinates once dragged, so it stays put while the
         page scrolls under it. */
      from = { x: e.clientX, y: e.clientY, left: box.left, top: box.top };
      pop.style.position = 'fixed';
      pop.style.left = box.left + 'px';
      pop.style.top = box.top + 'px';
      anchor = null;
      e.preventDefault();
    });
    window.addEventListener('mousemove', function (e) {
      if (!from) return;
      var w = pop.offsetWidth, h = pop.offsetHeight;
      var x = Math.min(Math.max(4, from.left + e.clientX - from.x), window.innerWidth - w - 4);
      var y = Math.min(Math.max(4, from.top + e.clientY - from.y), window.innerHeight - h - 4);
      pop.style.left = x + 'px';
      pop.style.top = y + 'px';
    });
    window.addEventListener('mouseup', function () { from = null; });
  })();

  var current = null;   /* {term, context, b} */
  var keepable = null;  /* {term, text, source} */
  var anchor = null;    /* the selection rect the popover is pinned to */

  pop.querySelector('[data-x]').addEventListener('click', closePop);
  pop.addEventListener('mousedown', function (e) { if (e.target === pop) e.preventDefault(); });

  function closePop() {
    pop.hidden = true;
    current = null; keepable = null; anchor = null;
    chat = [];
    ask.hidden = true;
    toPanel.hidden = true;
    pop.classList.remove('chat');
    clearFocus();
  }

  /* Called again every time the body changes. Placing once, while the popover
     is still an empty box, puts a 500px panel below the fold the moment an
     answer arrives. */
  function placePop() {
    if (!anchor) return;
    pop.hidden = false;
    var h = pop.offsetHeight;
    var below = anchor.bottom + window.scrollY + 9;
    var above = anchor.top + window.scrollY - h - 9;
    var room = (window.scrollY + window.innerHeight - 8) - below;

    var top = below;
    if (h > room && above > window.scrollY + 4) {
      top = above;
    } else if (h > room) {
      top = Math.max(window.scrollY + 8, window.scrollY + window.innerHeight - h - 8);
    }
    var left = anchor.left + window.scrollX + (anchor.width / 2) - (pop.offsetWidth / 2);
    left = Math.max(8, Math.min(left, document.documentElement.clientWidth - pop.offsetWidth - 8));
    pop.style.top = top + 'px';
    pop.style.left = left + 'px';
  }

  function setTab(name) {
    Array.prototype.forEach.call(tabs, function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-tab') === name));
    });
  }

  function msg(text) {
    popBody.innerHTML = '';
    var d = document.createElement('div');
    d.className = 'sv-msg';
    d.textContent = text;
    popBody.appendChild(d);
    placePop();
  }

  function open(term, context, b, rect, tab, segments) {
    current = { term: term, context: context, b: b, segments: segments || null };
    showFocus(segments);
    keepable = null;
    keepBtn.disabled = true;
    /* A new selection is a new subject, so the previous conversation ends. */
    chat = [];
    ask.hidden = true;
    toPanel.hidden = true;
    pop.classList.remove('chat');
    askBox.value = '';
    chatBusy(false);
    popTitle.textContent = term.length > 90 ? term.slice(0, 90) + '…' : term;

    var q = encodeURIComponent(term);
    popLinks.innerHTML =
      '<a target="_blank" rel="noopener" href="https://scholar.google.com/scholar?q=' + q + '">Scholar</a>' +
      '<a target="_blank" rel="noopener" href="https://pubmed.ncbi.nlm.nih.gov/?term=' + q + '">PubMed</a>' +
      '<a target="_blank" rel="noopener" href="https://www.google.com/search?q=' + q + '">Google</a>';

    anchor = rect;
    /* A previous drag left it fixed; placePop works in page coordinates. */
    pop.style.position = '';
    pop.hidden = false;
    placePop();
    (tab === 'explain' ? runExplain : runLookup)();
  }

  /* ---------- lookup sources: order, and what stays open ----------------
     🔴 EH's expansion order, 2026-08-30: the course's own definition, then the
     installed packs, then MeSH, then Wikipedia. Sorted HERE rather than trusted
     from the server, because the order is now load-bearing: it decides which
     single source a reader sees expanded, so a quiet change to the server's
     append order would change which definition they read first.

     Packs do not exist yet (plan 10 is a proposal). Their slot is in the rank
     anyway, so the day one lands it sits above MeSH without this being
     revisited. Anything unrecognised sorts LAST, which is the safe end: it can
     then never displace the course's own definition, the one placement that
     would actually mislead.

     🔴 Used by BOTH lookup surfaces. The mini bar shows "the top two", so if
     only the popover were reordered the same term would rank its sources one
     way in one place and another way in the other. */
  /* 🔴🔴 EH RE-RULED THE ORDER 2026-09-04: *"our brain regions should show up at
     the top, then this module, then mesh, then Wikipedia."* The pack was moved
     above the course's own definition on the server the same afternoon, and
     THIS FUNCTION SILENTLY UNDID IT, which is why he still saw Wikipedia above
     the pictures.

     🔴 THE BUG WAS A RESERVED SLOT THAT NEVER MATCHED. The rank below was
     written while packs were still a proposal and reserved their slot by
     testing for the WORD "pack" in the source name. The pack that shipped calls
     itself **"Brain regions"**, so it matched nothing, fell to the catch-all 9,
     and sorted BELOW Wikipedia. ⚠️ A slot held for a future feature is only as
     good as its guess about that feature's NAME, and the catch-all being "last"
     is what made the failure quiet rather than loud.

     🟢 So the pack is matched by its REAL name as well as by the generic
     pattern, and the generic pattern is kept for the next pack. */
  function srcRank(src) {
    var n = String((src && src.source) || '');
    if (n === 'Brain regions' || /\bpacks?\b/i.test(n)) return 0;
    if (n === 'This module') return 1;
    if (n === 'MeSH') return 2;
    if (n === 'Wikipedia') return 3;
    return 9;
  }

  function orderSources(list) {
    /* Decorated with the index so the sort is stable whatever the engine does:
       two unrecognised sources keep the order the server sent them in rather
       than swapping places between one lookup and the next. */
    return (list || []).map(function (src, i) { return { src: src, i: i }; })
      .sort(function (a, b) { return (srcRank(a.src) - srcRank(b.src)) || (a.i - b.i); })
      .map(function (o) { return o.src; });
  }

  /* Which sources he has opened or closed by hand. EH asked for an expanded
     section to stay expanded, and his reason is that somebody who opens MeSH
     once is usually comparing sources deliberately, so re-collapsing it on the
     next highlight fights them. A per-viewer preference, so localStorage rather
     than the server; wrapped because a browser with site data blocked throws on
     access rather than returning null, and a lookup must not die for a
     preference. */
  var OPEN_KEY = 'sv-lookup-open';
  function openPrefs() {
    try { return JSON.parse(localStorage.getItem(OPEN_KEY)) || {}; }
    catch (e) { return {}; }
  }
  function rememberOpen(name, isOpen) {
    try {
      var m = openPrefs();
      m[name] = !!isOpen;
      localStorage.setItem(OPEN_KEY, JSON.stringify(m));
    } catch (e) { /* nothing to do, and nothing worth breaking a lookup over */ }
  }

  /* ---------- the region picture, and paging through its plates ----------
     🔴 EH, 2026-09-03: *"we're going to try to implement this thing where you
     can right- and left-scroll through different images of the same region."*

     🟢 THE SERVER SENDS `images` (a list) AND `image` (its first), and reading
     both is what lets the two halves of this change deploy at different
     moments. `local-layer.html` goes live the moment it is saved and
     `study_server.py` needs a restart, so there is always a window where a new
     reader is talking to an old server. A reader that only understood `images`
     would draw no picture at all in that window.

     ⚠️ WHY THE ARROWS WRAP RATHER THAN STOP. A disabled arrow at the end of the
     run is the complaint the entry already names for a one-plate region:
     *"NOT disabled ones nobody can tell from enabled"*. Wrapping has no ends to
     grey out, and the counter beside it is what stops wrapping being confusing:
     a reader who sees "1 of 3" knows exactly where the next press goes. A region
     with ONE plate gets no arrows and no counter at all, because there is
     nothing to page.

     🔴 THE CAPTION IS PER PLATE, not per region, and that is the honesty this
     pack was built for. `shows` differs between plates of the same structure:
     Medulla's third plate is an overview whose legend reads "Brainstem and
     neuromodulatory nuclei", and saying "Medulla" over it would be a caption
     this project wrote and the picture does not support. */
  var REGION_PREV = 'Previous picture';
  var REGION_NEXT = 'Next picture';

  function regionPlates(s) {
    var list = (s && s.images && s.images.length) ? s.images
             : (s && s.image ? [s.image] : []);
    var out = [];
    for (var i = 0; i < list.length; i++) {
      /* A src is the only thing that makes a plate drawable, and it is the one
         field here that did not originate in the repo. */
      if (list[i] && typeof list[i].src === 'string' && list[i].src) out.push(list[i]);
    }
    return out;
  }

  function regionFigure(title, plates) {
    var fig = document.createElement('figure');
    fig.className = 'sv-region';
    var im = document.createElement('img');
    /* 🔴 NOT loading="lazy", and this is the FOURTH time this project has been
       caught by the same thing: machinery that waits for the viewport does not
       run in a tab that is not painting. rAF, ResizeObserver's first callback
       and smooth scrollIntoView were the other three. Measured: with the
       attribute the image stayed at naturalWidth 0 indefinitely; removing it and
       re-requesting the same URL loaded it at 189x230. It also buys nothing,
       because the element is created at the moment the popover opens and is on
       screen immediately, so it was never deferring anything. */
    im.addEventListener('error', function () { fig.remove(); });
    fig.appendChild(im);

    var cap = document.createElement('figcaption');
    var says = document.createElement('span');
    says.className = 'sv-region-says';
    cap.appendChild(says);
    fig.appendChild(cap);

    var count = null;
    var at = 0;

    function paint() {
      var pl = plates[at];
      im.src = pl.src;
      /* 🔴 The ALT tracks the caption rather than the term. "Where X sits in
         the brain" was true of every Wikipedia lead image and is not true of
         every plate: one that does not name the structure is a picture of the
         scene, and a screen reader should hear what a sighted reader reads. */
      im.alt = 'Picture of ' + (pl.shows || title || 'this structure');
      /* 🔴🔴 THESE TWO LINES ARE LAYOUT, AND THE COMMENT THAT USED TO SIT
         HERE SAYING OTHERWISE IS WHY A DEFECT SHIPPED. It read "Metadata, not
         layout: the band's height is fixed in CSS and does not come from
         these." That was TRUE while the rule said `height: 150px`. On
         2026-09-04 the rule became `aspect-ratio: 4 / 3`, and `aspect-ratio`
         only ever supplies a MISSING dimension -- so the `height` attribute
         written here made the height DEFINITE, the rule went INERT, and every
         plate rendered in a 1200px grey band on EH's reader.

         🟢 `height: auto` in the rule is what keeps this metadata rather than
         layout, and the two are a PAIR: neither is safe to change alone.
         `test_THE_JOIN_the_attributes_are_set_SO_the_css_must_neutralise_them`
         holds them together, and `server/rig_plate_render.py` renders the
         element with these attributes set, which is the only check that can see
         the failure at all.

         ⚠️ The width and height are still worth writing: they give the browser
         the aspect ratio before the bytes arrive, which is what stops the
         caption jumping as each plate loads. */
      if (pl.width) im.width = pl.width;
      if (pl.height) im.height = pl.height;
      /* A middot rather than ", from", because several of these captions carry
         a comma of their own ("Striatum, of which this is the lower part") and a
         second one made them read as a list. */
      says.textContent = (pl.shows || 'Location') + ' · ' + (pl.credit || 'Wikipedia');
      if (count) count.textContent = (at + 1) + ' of ' + plates.length;
      /* 🔴 THE OVERLAY IS PAINTED BY THE SAME FUNCTION, DELIBERATELY. EH asked
         for the pop-out "with the left-right movement ability still intact", and
         the way that requirement gets dropped is an overlay holding its own copy
         of `at`. There is one `at`, one paint() and one step(); the overlay is a
         second view of them and cannot drift. */
      if (pop) {
        pop.img.src = pl.src;
        pop.img.alt = im.alt;
        /* Same metadata as the inline element, and the overlay's own rule
           neutralises it on both axes. See the comment on `.sv-plate-pop img`. */
        if (pl.width) pop.img.width = pl.width;
        if (pl.height) pop.img.height = pl.height;
        pop.says.textContent = says.textContent;
        if (pop.count) pop.count.textContent = (at + 1) + ' of ' + plates.length;
      }
    }

    function step(d) {
      at = (at + d + plates.length) % plates.length;
      paint();
    }

    var pop = null;

    function closePop() {
      if (!pop) return;
      pop.scrim.remove();
      pop.box.remove();
      document.removeEventListener('keydown', pop.onKey, true);
      pop = null;
      /* 🔴 Focus goes back where it came from. Without this the reader is
         returned to the top of the document, which on a long lesson means
         losing their place to look at a picture. */
      if (popBtn) popBtn.focus();
    }

    function openPop() {
      if (pop) return;
      var scrim = document.createElement('div');
      scrim.className = 'sv-plate-scrim';
      /* A tap anywhere off the picture dismisses. This is a real click target,
         not a hover-out, because hover does not exist on the iPad EH reads on. */
      scrim.addEventListener('click', closePop);

      var box = document.createElement('div');
      box.className = 'sv-plate-pop';
      box.setAttribute('role', 'dialog');
      box.setAttribute('aria-modal', 'true');
      box.setAttribute('aria-label', 'Picture of ' + (title || 'this structure'));

      var big = document.createElement('img');
      var bar = document.createElement('div');
      bar.className = 'sv-plate-bar';
      var bigSays = document.createElement('span');
      bigSays.className = 'sv-region-says';
      bar.appendChild(bigSays);

      var bigCount = null;
      if (plates.length > 1) {
        var bigPager = document.createElement('span');
        bigPager.className = 'sv-region-pager';
        bigPager.appendChild(regionArrow('\u2039', REGION_PREV, function () { step(-1); }));
        bigCount = document.createElement('span');
        bigCount.className = 'sv-region-n';
        bigPager.appendChild(bigCount);
        bigPager.appendChild(regionArrow('\u203a', REGION_NEXT, function () { step(1); }));
        bar.appendChild(bigPager);
      }
      var shut = regionArrow('\u00d7', 'Close the picture', closePop);
      if (plates.length <= 1) shut.style.marginLeft = 'auto';
      bar.appendChild(shut);

      box.appendChild(big);
      box.appendChild(bar);

      /* 🔴🔴 stopIMMEDIATEPropagation, AND THE PLAIN ONE WAS NOT ENOUGH.
         Measured in the browser: with `stopPropagation()`, Escape closed the
         overlay AND the lookup popover underneath it, so a reader who opened a
         picture to look at it lost the panel they opened it from and had to
         find the term again. `stopPropagation` does not stop OTHER listeners
         bound to the same node, and this page binds several to `document`.
         ⚠️ The overlay is a layer ON TOP of the popover: dismissing it should
         return the reader to where they were, never unwind two levels. */
      function onKey(e) {
        if (e.key === 'Escape') { e.stopImmediatePropagation(); closePop(); return; }
        if (e.key === 'ArrowLeft') { e.stopImmediatePropagation(); step(-1); return; }
        if (e.key === 'ArrowRight') { e.stopImmediatePropagation(); step(1); return; }
        /* 🔴 A FOCUS TRAP, because an overlay a reader can Tab out of leaves
           them operating the lesson underneath while a full-page picture covers
           it, with no way back that they can see. */
        if (e.key === 'Tab') {
          var able = box.querySelectorAll('button');
          if (!able.length) return;
          var first = able[0], last = able[able.length - 1];
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault(); last.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault(); first.focus();
          }
        }
      }

      pop = { scrim: scrim, box: box, img: big, says: bigSays,
              count: bigCount, onKey: onKey };
      document.body.appendChild(scrim);
      document.body.appendChild(box);
      document.addEventListener('keydown', onKey, true);
      paint();
      shut.focus();
    }

    if (plates.length > 1) {
      var pager = document.createElement('span');
      pager.className = 'sv-region-pager';
      pager.appendChild(regionArrow('\u2039', REGION_PREV, function () { step(-1); }));
      count = document.createElement('span');
      count.className = 'sv-region-n';
      pager.appendChild(count);
      pager.appendChild(regionArrow('\u203a', REGION_NEXT, function () { step(1); }));
      cap.appendChild(pager);
    }

    /* 🟢 OFFERED FOR A SINGLE PLATE TOO. The pop-out is about SIZE, which a
       lecture with one picture needs exactly as much; the paging is what needs
       more than one. */
    var popBtn = document.createElement('button');
    popBtn.type = 'button';
    popBtn.className = 'sv-region-pop';
    popBtn.textContent = 'Expand';
    popBtn.setAttribute('aria-label', 'Show this picture full page');
    popBtn.title = 'Show this picture full page';
    popBtn.addEventListener('click', function (e) {
      if (e && e.stopPropagation) e.stopPropagation();
      openPop();
    });
    if (plates.length <= 1) popBtn.style.marginLeft = 'auto';
    cap.appendChild(popBtn);

    paint();
    return fig;
  }

  function regionArrow(glyph, label, onclick) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'sv-region-b';
    b.textContent = glyph;
    /* The glyph is a shape, so the name a screen reader reads has to be words,
       and the title is what a mouse reader gets for the same reason. */
    b.setAttribute('aria-label', label);
    b.title = label;
    b.addEventListener('click', function (e) {
      /* The popover closes on clicks outside its own controls, and paging is
         emphatically inside. */
      if (e && e.stopPropagation) e.stopPropagation();
      onclick();
    });
    return b;
  }

  function runLookup() {
    setTab('lookup');
    if (!current) return;
    /* The conversation is not thrown away by looking something up; it is still
       there when the Explain tab comes back. */
    ask.hidden = true;
    pop.classList.remove('chat');
    msg('Looking up…');
    var term = current.term;
    api('/api/lookup?q=' + encodeURIComponent(term)).then(function (r) {
      if (!current || current.term !== term) return;
      var sources = (r.body && r.body.sources) || [];
      var failed = (r.body && r.body.failed) || [];
      /* R28. No definition, but the server knows which regions the phrase could
         mean, so the choice is still worth offering rather than a dead end. */
      if (!sources.length && !((r.body && r.body.suggest) || []).length) {
        /* 🔴 EH's rule 2 at the whole-popover level, and this was its worst
           case: with every lookup down, "Nothing found for that" told the reader
           the term does not exist. That sentence is identical whether MeSH and
           Wikipedia have no entry or the machine is offline, and only one of the
           two is a fact about the term. */
        if (failed.length) {
          return msg(failed.join(' and ') + ' did not answer, so nothing could be ' +
                     'looked up. That is not the same as the term having no entry. ' +
                     'Try again in a moment.');
        }
        return msg('Nothing found for that. Try a shorter selection, or ask Explain, ' +
                   'which reads the sentence around it.');
      }
      popBody.innerHTML = '';

      var ordered = orderSources(sources);
      var prefs = openPrefs();
      var panes = [];

      ordered.forEach(function (s, idx) {
        var box = document.createElement('div');
        box.className = 'sv-src';

        /* The label becomes the toggle rather than growing a control beside it:
           it already names the source and already spans the width, and a second
           target next to it would be the smallest hit area in the popover. */
        var head = document.createElement('button');
        head.type = 'button';
        head.className = 'sv-srchead';

        var lab = document.createElement('span');
        lab.className = 'lab';
        lab.textContent = s.source + (s.title && s.title !== term ? ' · ' + s.title : '');
        head.appendChild(lab);

        var chev = document.createElement('span');
        chev.className = 'sv-chev';
        chev.setAttribute('aria-hidden', 'true');
        head.appendChild(chev);
        box.appendChild(head);

        /* Everything below the label lives in the body, the picture included, so
           a collapsed source really is one line rather than a short one. */
        var body = document.createElement('div');
        body.className = 'sv-srcbody';
        box.appendChild(body);

        /* 🔴 Built with createElement, not innerHTML, because the src comes
           back from Wikipedia through the server and this is the one string here
           that did not originate in the repo. It also means a broken URL removes
           the figure rather than leaving a broken-image icon in the popover. */
        var plates = regionPlates(s);
        if (plates.length) {
          body.appendChild(regionFigure(s.title, plates));
        }

        var txt = document.createElement('div');
        txt.className = 'txt';
        txt.textContent = s.text;
        body.appendChild(txt);

        if (s.extra && s.extra.length) {
          var syn = document.createElement('div');
          syn.className = 'syn';
          syn.textContent = 'Also: ' + s.extra.join(', ');
          body.appendChild(syn);
        }
        if (s.url) {
          var a = document.createElement('a');
          a.className = 'more';
          a.href = s.url; a.target = '_blank'; a.rel = 'noopener';
          a.textContent = 'Open';
          body.appendChild(document.createElement('br'));
          body.appendChild(a);
        }
        /* R28. The server resolved a phrase to a name rather than matching it,
           so say which way round that happened. Without this, selecting "the
           posterior cingulate" and being shown "Posterior cingulate cortex"
           reads as though the page had used the longer wording. */
        if (s.resolved && s.title) {
          var res = document.createElement('div');
          res.className = 'syn';
          res.textContent = 'Shown for "' + term + '"';
          body.appendChild(res);
        }

        /* 🔴 The top-ranked source is open and the rest are closed, which is
           exactly what EH asked for, but a source he has opened or closed by
           hand wins over both. Read from the stored preference by NAME, so it
           survives the ranks moving when packs arrive. */
        var open = (s.source in prefs) ? !!prefs[s.source] : (idx === 0);
        function paint(isOpen) {
          head.setAttribute('aria-expanded', isOpen ? 'true' : 'false');

         closePop() cleared `current` and the guard below silently threw the
         answer away, so pressing "Move to panel" too early lost it entirely. */

        panelBusy(false);
        if (!panel.hidden && openChat === c) renderThread();
        return;

      chatBusy(false);
      chat.push({ role: 'claude', text: text });

     than optimises: "I just don't agree with the lazy loading. I think that slow
     load and potential errors on the first PDF load can confuse people. Why not
     just install it or load it at the very start? It's only 2 MB." So `warm()`

     would have kept exactly the pause he objected to, in the exact place he

      if (!can() || workerP) return workerP || Promise.resolve(null);
      workerP = lib().then(function (m) {

        return w.promise.then(function () { return w; });
      }).catch(function (e) {

        workerP = null;         /* so opening a deck retries rather than hanging */

       so a selection inside a slide is a real selection. */
    function drawPage(m, page, host, dpr, width, n, total) {
      var wrap = document.createElement('div');
      wrap.className = 'sv-pdfpage';
      var canvas = document.createElement('canvas');
      wrap.appendChild(canvas);
      host.appendChild(wrap);
      var num = document.createElement('div');
      num.className = 'sv-pdfnum';
      num.textContent = n + ' of ' + total;
      host.appendChild(num);

      var base = page.getViewport({ scale: 1 });
      var scale = width / base.width;
      var vp = page.getViewport({ scale: scale });
      /* The canvas is drawn at device pixels and displayed at CSS pixels, which
         is what keeps a retina iPad's slides sharp rather than soft. */
      canvas.width = Math.floor(vp.width * dpr);
      canvas.height = Math.floor(vp.height * dpr);
      /* 🔴 The box is the page's own WIDTH in CSS pixels, and its height is left
         to the canvas. Setting height instead (the first version of this) let
         the two disagree: the canvas stretched to the box's 100% width, came out
         17px taller than the height it had been told, and overflowed onto its
         own page number. The text layer is absolutely positioned against this
         box, so a box that is not exactly the page is also text that does not
         sit on the words. */
      wrap.style.width = Math.floor(vp.width) + 'px';

      var task = page.render({
        canvasContext: canvas.getContext('2d', { alpha: false }),
        viewport: vp,
        transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null

        tl.className = 'textLayer';
        wrap.appendChild(tl);
        m.setLayerDimensions(tl, vp);
        var layer = new m.TextLayer({
          textContentSource: page.streamTextContent(),
          container: tl,
          viewport: vp
        });

           shows its picture rather than losing the page. */
        return layer.render().catch(function (e) {
          console.warn('[study] text layer failed on page ' + n, e);
        });
      });

    function say(host, text) {
      host.innerHTML = '';
      var p = document.createElement('p');
      p.className = 'sv-pdfmsg';
      p.textContent = text;
      host.appendChild(p);
    }

    /* Render `src` into `host`. Resolves true if it drew, false if the caller
       should fall back to a frame. A rejection is never silent: the box says
       what happened and the way out is the link already under it. */
    function boxWidth(host) { return Math.max(120, host.clientWidth - 12); }

    /* 🔴 THE READER'S PLACE, HELD AS A PAGE AND A FRACTION, never as a pixel
       offset. EH reported this twice and reversed his own "not worth a
       substantial fix" ruling to report it again: resizing the window while a
       deck is open threw him back to slide one. The re-render below is correct
       and stays; what was missing is that `show()` restored no position.

       ⚠️ A PIXEL OFFSET IS THE WRONG THING TO STORE AND IT IS THE OBVIOUS ONE.
       The re-render happens BECAUSE the width changed, and every page's height
       changes with the width, so an offset in the old layout measures a page
       that no longer has that height. A page number survives a width change
       outright, and a fraction into that page survives it too, because a page
       scales as a whole.

       🟢 PURE, AND TAKING ROWS RATHER THAN A HOST, because this is the half an
       off-by-one would live in and a browser is not available to find it in.
       `rows` is `[{ top, height }]` in the scroller's own coordinates. */
    function placeOf(rows, top) {
      if (!rows || !rows.length) return null;
      var i = 0;
      for (var n = 0; n < rows.length; n++) {
        /* The last page that STARTS at or above the reader's line. The 1px is
           for the browser's own fractional scrollTop, not for luck. */
        if (rows[n].top <= top + 1) i = n; else break;
      }
      /* 🔴 BELT AND BRACES AGAINST ONE CASE, and a mutation sweep on 2026-09-08
         proved they are INDEPENDENTLY sufficient rather than one being
         redundant: a page whose canvas has not been sized yet measures zero, and
         `0 / 0` is NaN, which would go straight into `scrollTop`. The `|| 1`
         stops the division; `!(into > 0)` (and not `into < 0`) catches the NaN
         if the division happens anyway. Removing EITHER alone leaves the other
         doing the work and no test goes red, which is exactly what the sweep
         found. Both are kept: this is a number written into the reader's scroll
         position, and the cost of the pair is two characters. */
      var h = rows[i].height || 1;
      var into = (top - rows[i].top) / h;
      if (!(into > 0)) into = 0;
      if (into > 1) into = 1;
      return { page: i + 1, into: into };

       two renders is not the case this exists for, but the clamp is one line and
       the alternative is landing at the top, which is the defect itself. */
    function topFor(rows, keep) {
      if (!keep || !rows || !rows.length) return 0;
      var i = Math.min(Math.max(keep.page, 1), rows.length) - 1;
      return rows[i].top + (keep.into || 0) * (rows[i].height || 0);
    }

       `offsetTop`: `offsetTop` is measured from the nearest POSITIONED ancestor
       and `.sv-pdf` does not position itself, so those numbers would be against
       some other box entirely and would look plausible while being wrong. */
    function rowsOf(host) {
      var base = host.getBoundingClientRect().top - host.scrollTop;
      var pages = host.querySelectorAll('.sv-pdfpage'), out = [];
      for (var i = 0; i < pages.length; i++) {
        var r = pages[i].getBoundingClientRect();
        out.push({ top: r.top - base, height: r.height });

       first landing happens when the wanted page is the last one rendered, so
       the scroller's range can still be short. The caller uses the answer to
       tell "the reader has not moved" from "the reader has scrolled away". */
    function putBack(host, keep) {
      host.scrollTop = topFor(rowsOf(host), keep);
      return host.scrollTop;
    }

       width it first saw would be soft after every drag and wrong after a
       rotation. The re-render is debounced and only fires on a REAL change,
       because a ResizeObserver on a box whose own content changes its width is
       otherwise a loop. */
    function watch(host, src, at) {

             first version of this refused to act while one was running, which
             read as careful and was not: a deck takes seconds to draw, dragging
             the pane while it draws is the likely case rather than the rare one,
             and the pages stayed at the old width for good. The run token below
             is what makes superseding safe, so there is nothing left to protect
             here. A browser found both halves of this. */
          ro.disconnect();
          /* 🔴 READ BEFORE THE RENDER, because `show()` starts by emptying the
             box: after that there are no pages to measure and `scrollTop` is
             already 0. This is the only moment the reader's place exists. */
          show(host, src, placeOf(rowsOf(host), host.scrollTop));
        }, 300);
      });
      ro.observe(host);
      /* One observer per render. The next show() starts its own, and a pane that
         has moved on to another view takes its box out of the document with it. */
    }

    /* `keep` is `{ page, into }` from `placeOf`, and is absent on a first
       render, which is the case that must land at the top. */
    function show(host, src, keep) {

         superseded stops drawing. Without it a re-render started by a drag draws
         its pages into the same box as the one it replaced, interleaved. */
      var run = host.sv_run = (host.sv_run || 0) + 1;
      var mine = function () { return host.sv_run === run; };
      say(host, 'Opening the deck...');

         module too, and a var that exists only in the previous step is a
         ReferenceError the moment somebody actually opens a deck. Which is
         exactly how this line got written, and how a browser found it. */
      var mod = null;

        mod = both[0];
        return mod.getDocument({ url: src, worker: both[1] || undefined }).promise;

        var width = boxWidth(host);
        watch(host, src, width);
        var chain = Promise.resolve();
        /* Clamped against THIS deck rather than the last one. */
        var want = keep ? Math.min(Math.max(keep.page, 1), doc.numPages) : 0;
        var landed = null;
        for (var n = 1; n <= doc.numPages; n++) {

                   finishes. Pages are drawn in order, so everything ABOVE the
                   reader is already final, and everything added afterwards goes
                   BELOW and moves nothing. Waiting for the last page of a
                   60-slide deck would leave them staring at slide one for

                if (mine() && i === want) landed = putBack(host, keep);
                return drawn;
              });
            });

             page was the last one rendered, the scroller's range stopped at its

             arrived now and the range is real. A reader who has moved in the
             meantime is left exactly where they are: being yanked back is worse

          }

        });

        say(host, 'This file could not be opened here. The arrow above opens it ' +
                  'in a tab, which always works.');
        return false;
      });
    }

    return { can: can, warm: warm, show: show, version: function () { return version; } };
  }());
