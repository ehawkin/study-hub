<!-- study-local-layer:start -->
<!-- ================= local server layer =================

Everything here is inert unless the page is served from the local study
server. On a published artifact the CSP blocks every request this makes, so
the layer detects loopback and otherwise does nothing at all: no buttons, no
badge, no failed fetches in the console.

What it adds when the server is there:
  - automatic vault sync, so highlights reach your Obsidian vault with no
    export step;
  - Look up, which is free and instant-ish: the module glossary, MeSH, Wikipedia;
  - Explain, which asks Claude through the local CLI and costs no API key;
  - Keep, which files an explanation beside the note, never inside it.
================================================================ -->

<style>
  /* The three mark buttons carry their own colour. These do not, and a button
     with no background declared falls back to the UA's near-white, which put
     near-white text on near-white in the dark theme. Every one of these takes
     its colours from tokens so both themes are covered. */
  /* 🔴 Reduced bar for a selection with no block anchor (diagram text). The
     default is HIDDEN: a control has to declare that it works on words alone,
     so a button added next year is not silently offered somewhere it cannot
     work. Highlight, Card, Bookmark and Rewrite all need a block; Look up and
     Ask need only the string. */
  .hl-bar.sv-textonly > *:not([data-textok]) { display: none; }
  .hl-bar.sv-textonly { gap: 4px; }

  .hl-bar button.sv-act {
    background: var(--paper);
    color: var(--ink);
    border-color: var(--rule);
  }
  .hl-bar button.sv-act:hover:not([disabled]) {
    border-color: var(--hl-d-line);
    color: var(--hl-d-line);
  }
  .hl-bar button.sv-act[disabled] {
    color: var(--muted);
    border-style: dashed;
    cursor: not-allowed;
  }
  /* Marking and asking are two different acts; the rule says so. */
  .hl-bar .sv-sep {
    width: 1px; align-self: stretch; margin: 0 3px;
    background: var(--rule);
  }

  .sv-pop {
    position: absolute; z-index: 80; width: min(430px, 92vw);
    background: var(--surface); border: 1px solid var(--rule); border-radius: 9px;
    box-shadow: 0 10px 34px rgba(0,0,0,.24); overflow: hidden;
  }
  .sv-pop[hidden] { display: none; }
  /* Draggable by the header: the popover opens next to the selection, which is
     often exactly where the thing being cross-referenced is. */
  .sv-pop-head {
    display: flex; align-items: baseline; gap: 9px;
    padding: 11px 13px 9px; border-bottom: 1px solid var(--rule);
    cursor: grab; user-select: none;
  }
  .sv-pop-head:active { cursor: grabbing; }
  .sv-pop-head button { cursor: pointer; }
  .sv-pop-head .t {
    font-family: var(--display); font-size: 15.5px; font-weight: 600;
    line-height: 1.3; overflow-wrap: anywhere;
  }
  .sv-pop-head button {
    margin-left: auto; flex: none; font: 600 11.5px var(--body); background: none;
    border: 1px solid var(--rule); border-radius: 4px; color: var(--muted);
    padding: 3px 8px; cursor: pointer;
  }
  .sv-tabs { display: flex; gap: 6px; padding: 9px 13px 0; align-items: center; }
  .sv-tabs .lvl { margin-left: auto; display: flex; align-items: center; gap: 5px; }
  .sv-tabs .lvl label {
    font-family: var(--mono); font-size: 10px; letter-spacing: .07em;
    text-transform: uppercase; color: var(--muted);
  }
  .sv-tabs .lvl select {
    font: 11.5px var(--body); color: var(--ink); background: var(--paper);
    border: 1px solid var(--rule); border-radius: 4px; padding: 3px 5px;
  }

  /* Selecting inside an answer: the same two moves as on the page, but Ask
     continues the conversation you are already in rather than starting one. */
  .sv-mini {
    position: fixed; z-index: 96; display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--rule); border-radius: 7px;
    box-shadow: 0 8px 26px rgba(0,0,0,.26); overflow: hidden; max-width: min(360px, 92vw);
  }
  .sv-mini[hidden] { display: none; }
  .sv-mini .row { display: flex; gap: 5px; padding: 5px; }
  .sv-mini button {
    font: 600 11.5px var(--body); border: 1px solid var(--rule); background: var(--paper);
    color: var(--ink); border-radius: 4px; padding: 5px 11px; cursor: pointer;
  }
  .sv-mini button:hover { border-color: var(--hl-d-line); color: var(--hl-d-line); }
  .sv-mini .out {
    border-top: 1px solid var(--rule); padding: 9px 11px; font-size: 13px; line-height: 1.5;
    max-height: 220px; overflow-y: auto;
  }
  .sv-mini .out[hidden] { display: none; }
  .sv-mini .out .lab {
    font-family: var(--mono); font-size: 10px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 3px;
  }
  .sv-tabs button {
    font: 600 12px var(--body); border: 1px solid var(--rule); background: var(--paper);
    color: var(--ink); border-radius: 999px; padding: 5px 12px; cursor: pointer;
  }
  .sv-tabs button[aria-pressed="true"] { background: var(--hl-d); border-color: var(--hl-d-line); }
  .sv-tabs button[disabled] { opacity: .45; cursor: not-allowed; }
  /* 🔴 Raised from min(46vh, 380px) on 2026-08-30, and it is the collapse that
     asks for it rather than a taste for bigger popovers. EH's proof for that
     unit is that "every other source is visibly present and one click away",
     and measured on a 779px window with the amygdala looked up, the content is
     422px against a 358px box: the module's definition and its picture fill the
     body and push the Wikipedia row out of sight, so the reader cannot see that
     the other views exist, which is the whole point of the feature.

     min(58vh, 450px) holds that case with headroom and still leaves 200px of
     page on this window. It does NOT solve every case, and is not meant to: a
     source with a picture AND a long definition can still overflow, and the
     real fix is EH's rule 1b, which lifts the picture into its own band above
     the sections. That is knowledge-pack work and he scoped it out of this
     entry deliberately. */
  .sv-body { max-height: min(58vh, 450px); overflow-y: auto; padding: 11px 13px 13px; }
  /* Explain is a conversation, so it gets more room and scrolls its history. */
  .sv-pop.chat { width: min(520px, 94vw); }
  .sv-pop.chat .sv-body { max-height: min(52vh, 440px); }

  .sv-turn { padding: 9px 0; border-top: 1px solid var(--rule-soft); }
  .sv-turn:first-child { border-top: 0; padding-top: 3px; }
  .sv-turn .who {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 3px;
  }
  .sv-turn .txt { font-size: 14px; line-height: 1.55; white-space: pre-wrap; }
  .sv-turn.me .txt {
    background: var(--paper); border-left: 2px solid var(--hl-d-line);
    border-radius: 0 5px 5px 0; padding: 7px 10px;
  }
  .sv-turn.pending .txt { color: var(--muted); font-style: italic; }

  .sv-scope {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 7px 12px 0; font: 500 11.5px var(--body);
  }
  .sv-scopelab { color: var(--muted); text-transform: uppercase;
                 letter-spacing: .05em; font-size: 10px; margin-right: 2px; }
  .sv-scope button {
    font: 500 11.5px var(--body); color: var(--muted); background: none;
    border: 1px solid var(--rule); border-radius: 999px; padding: 3px 10px;
    cursor: pointer;
  }
  .sv-scope button[aria-pressed="true"] {
    color: var(--regulated); border-color: var(--regulated);
    background: var(--reg-wash);
  }
  .sv-ask {
    display: flex; gap: 7px; padding: 10px 13px;
    border-top: 1px solid var(--rule); background: var(--surface);
  }
  .sv-ask[hidden] { display: none; }
  .sv-ask textarea {
    flex: 1; font: 13.5px/1.5 var(--body); color: var(--ink); background: var(--paper);
    border: 1px solid var(--rule); border-radius: 5px; padding: 8px 10px;
    /* Two lines of 13.5px/1.5 text (40.5px) plus 8px padding each side and the
       1px borders. Kept as a floor rather than a fixed height so the box still
       grows as somebody types. */
    resize: none; min-height: 59px; max-height: 120px;
  }
  .sv-ask button {
    align-self: flex-end; font: 600 12px var(--body);
    border: 1px solid var(--hl-d-line); background: var(--hl-d); color: var(--ink);
    border-radius: 5px; padding: 9px 14px; cursor: pointer;
  }
  .sv-ask button[disabled] { opacity: .45; cursor: default; }
  /* 🔴 The Shift+Enter affordance lives HERE, under the box, and not inside the
     placeholder. QA measured the old arrangement: the placeholder needed 41px in
     a 20px one-row box, so the half that taught Shift+Enter was invisible on
     every device without a stored panel width.

     Making the box two rows fixed the default width and NOT the narrowest one:
     at the 320px minimum panel the placeholder still wants three lines and gets
     two. A textarea's placeholder cannot wrap past its fixed height, so any
     answer that leaves the text in there is a bet on the window being wide
     enough. A div has no such limit: this wraps, and nothing clips it at any
     width. */
  .sv-askhint {
    padding: 0 13px 9px; margin-top: -4px;
    font: 11.5px/1.45 var(--body); color: var(--muted);
    background: var(--surface); border-bottom: 1px solid var(--rule);
  }
  .sv-askhint[hidden] { display: none; }
  /* 🔴 Found in the FULL pass on the collapse, 2026-08-30, and it predates it:
     the hint was shown during a LOOK UP, where there is no box to type into.
     `ask.hidden = true` hides the textarea at three call sites and the hint is
     its sibling, so it stayed on screen advising the reader to press Enter with
     nothing to press it in, and ate 27px of the room the sources needed.

     A sibling selector rather than a fourth `hidden` assignment: the hint's
     state IS the ask box's state, so binding them in CSS means a future call
     site cannot hide one and forget the other. The PANEL's `.sv-ask` carries no
     `hidden` attribute, so this cannot reach it. */
  .sv-ask[hidden] + .sv-askhint { display: none; }
  .sv-src { padding: 9px 0; border-top: 1px solid var(--rule-soft); }
  .sv-src:first-child { border-top: 0; padding-top: 3px; }
  .sv-src .lab {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 3px;
  }

  /* ---- Collapsible lookup sources (EH, 2026-08-30) ------------------------
     "we can't actually display all of them ... we only show the top one as
     expanded and then all the ones underneath that are collapsed. This way,
     the person can see that there are other views."

     The label becomes the toggle rather than growing a separate control beside
     it: it is already the row that names the source, it already spans the
     width, and a second target next to it would be the smallest hit area in the
     popover. A real <button>, so the keyboard and a screen reader get this for
     free; `aria-expanded` is what actually announces the state, the chevron is
     the sighted half of the same fact. */
  /* 🔴 STICKY, AND IT IS AN AFFORDANCE FIX RATHER THAN A HEIGHT FIX.
     QA measured `Salience network` — the longest definition in the course, 477
     characters with an anatomy picture — at **515px of content in a 419px
     body**, with the `Wikipedia` header 54px below the fold and `visibleInBody`
     false. **Nothing on screen said a second source existed.**

     🔴 The body already scrolls (`overflow-y: auto` above), so the
     content was never unreachable. The reader was given no SIGNAL that it was
     there, and EH's proof point is "every other source visibly present and ONE
     CLICK AWAY". A section needing an undiscoverable scroll fails that whether
     it is 3px below the fold or 300px.

     🔴 CHASING IT WITH HEIGHT CANNOT WIN, and this file's own history is
     the proof: `46vh → 58vh` fixed `Amygdala` and landed 100px short of the
     worst real case. Expansion memory makes content UNBOUNDED — with Wikipedia
     remembered as expanded the same term is 800px in a 419px body — so any
     height is one remembered expansion away from being too small again.

     ⚠️ Rule 1b (lifting the picture into its own band) is NOT the fix for
     this and is not cancelled by it. **Five of the six longest definitions in
     the course have no picture at all**, so 1b lifts nothing out of their
     bodies; and on the term QA measured it leaves 655px in 419px from the
     second visit onward.

     🔴 A pinned header was believed to be structurally true instead — "at
     any content height the collapsed source's header is on screen" — and **that
     is FALSE. Measured in a browser 2026-09-01 by `study-hub-qa`, on the exact
     term this was built for.** `Salience network` at 1440x723: the `Wikipedia`
     header is still **54px below the fold**, `visibleInBody` false, fresh and
     with both sections remembered as expanded, in both themes and at both
     addresses. 118px below at a 386px viewport.

     🔴 WHY, and it is a property of `sticky` rather than of these
     declarations: **a sticky box moves only within its own containing block.**
     Each header's containing block is its own `.sv-src` (see the DOM built at
     `renderSources`, head appended to box), and for a collapsed second source
     that is a 39px block which is ITSELF entirely below the fold. No offset can
     lift a box out of a box that is off screen. `top: 0` pins a header the
     reader has ALREADY SCROLLED PAST; it does nothing for one they have not
     reached, and those are different guarantees.

     🟢 The control that proves the constraint is the containing block and
     not the choice of edge: `bottom: 0` on `.sv-srchead` measures IDENTICALLY,
     54px below. `bottom: 0` on `.sv-src`, whose containing block IS the body's
     content area, does put the header on screen — **recorded as a measurement,
     not as the fix**; its side effects are untested and the design call is the
     manager's. The reopened entry is at the top of the build lane.

     ⚠️ **These four declarations still EARN their place and are not to be
     reverted on the way past.** Four of the six proof points passed in that same
     browser run: no regression on `Amygdala`, the phone-width sheet scrolls and
     pins, three expanded sources never stack more than one pinned header (swept
     every 8px of a 444px range), and the pinned header is opaque in both themes.
     `--surface` rather than `none` because content scrolls underneath it, and a
     transparent pinned header shows the definition sliding through its own
     label.

     ⚠️ THE STACKING HAZARD, and why it does not arise: every header pins
     at the SAME `top: 0`, so an arriving header displaces the one above it
     rather than accumulating beside it. Headers stack only when given
     increasing offsets. 🟢 **Reasoned from the rule here and then
     CONFIRMED in a browser 2026-09-01**: with all three sources expanded, swept
     every 8px of a 444px scroll range, never more than one header pinned and
     zero positions with two. Worth noting which way round that went — the rule
     was right about the hazard it was aimed at, and wrong about the guarantee
     above, in the same four declarations. */
  .sv-srchead {
    display: flex; align-items: center; gap: 8px; width: 100%;
    background: var(--surface); border: 0; padding: 0; margin: 0 0 3px;
    font: inherit; text-align: left; cursor: pointer;
    position: sticky; top: 0; z-index: 1;
  }
  .sv-srchead .lab { margin-bottom: 0; flex: 1 1 auto; }
  .sv-srchead:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 🔴 The chevron is `--muted`, the same token as the label it sits beside, and
     that is a deliberate refusal of the obvious choice. The instinct for quiet
     furniture is a rule token, and `--rule-soft` on `--surface` is **1.16:1 in
     light and 1.12:1 in dark**: invisible. The recolour picker shipped a marker
     at 1.05:1 this same day by exactly that reasoning. `--muted` measures
     4.96:1 in light and 5.32:1 at its worst dark ground, and the test beside
     this recomputes it from the palette so it goes red if the tokens move.

     Drawn from borders rather than a glyph so its colour IS `--muted` and can
     be checked from the stylesheet. A character (▸, ❯) carries its own font
     metrics and, if it ever resolved to an emoji presentation, its own colour
     that `color` cannot touch, which is how the bulb in the rating scale became
     unmeasurable. */
  .sv-chev {
    flex: 0 0 auto; width: 6px; height: 6px; margin-right: 1px;
    border-right: 1.5px solid var(--muted);
    border-bottom: 1.5px solid var(--muted);
    transform: rotate(-45deg);
    transition: transform .15s ease;
  }
  .sv-srchead[aria-expanded="true"] .sv-chev { transform: rotate(45deg); }
  @media (prefers-reduced-motion: reduce) { .sv-chev { transition: none; } }

  /* A collapsed source is a promise that there is something underneath, so the
     label stays fully legible when closed; only the body goes. */
  .sv-srcbody[hidden] { display: none; }

  /* 🔴 A source that FAILED must look like neither an answer nor an absence
     (EH's rule 2). It is not collapsible: it is one line, and hiding the fact
     that a lookup did not come back behind a click is the whole defect. The
     left rule and the warmer label are what stop it reading as a quiet source
     with a short definition. */
  /* 🔴 ONE value for both themes, not a token pair, and it is checked rather
     than chosen: #C2792E measures 3.37:1 on the light popover ground and 4.72:1
     on the darkest of the dark ones. A theme pair would be two more numbers to
     keep true for no gain, since one amber clears 3:1 on both. Declared once
     here so the test has a single place to read it from; `--warn` does NOT
     exist in this project's palette, and writing `var(--warn, …)` would have
     looked like a token reference while always silently using the fallback. */
  .sv-src { --sv-warn: #C2792E; }
  .sv-failed {
    border-left: 2px solid var(--sv-warn); padding-left: 8px;
  }
  .sv-failed .lab { color: var(--sv-warn); }
  .sv-failed .txt { color: var(--muted); font-size: 13px; }
  .sv-src .txt { font-size: 14px; line-height: 1.55; }
  .sv-src .syn { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .sv-src a.more { font-size: 12.5px; }

  /* R14, asked 2026-08-13: "if I highlight the name of a brain region for the
     little pop over to either automatically or with the press of a button, show
     me its location on a picture", extended with "showing me its core
     functions". The picture appears on its own, without a button, because a
     button that is usually absent and sometimes does nothing is worse than a
     panel that quietly grows a picture when there is one to grow.

     A fixed height with object-fit lets a tall coronal section and a wide
     sagittal one sit in the same popover without either being cropped to
     uselessness. The pale ground matters: several of these are transparent PNGs
     drawn for a white page, and on the dark theme they would otherwise be black
     on black. */
  /* 🔴 The picture goes ABOVE the definition, which is the opposite of the
     order everything else in this popover uses. It is deliberate: the popover is
     about 420px tall, the definition runs four or five lines, and with the
     picture underneath it was cut off by the popover's edge and had to be
     scrolled to. The picture is the half of R14 he asked for first, so it should
     not be the half that needs finding. */
  .sv-src figure.sv-region { margin: 4px 0 8px; }
  /* 🔴 `height: auto` IS LOAD-BEARING AND MUST NOT BE TIDIED AWAY. `regionFigure`
     sets `im.width`/`im.height` from the plate metadata (all 236 records carry
     them), which makes the height DEFINITE -- and `aspect-ratio` only ever
     supplies a MISSING dimension, so without this line the rule is INERT and the
     picture renders letterboxed in a 1200px grey band. Measured live on EH's
     reader 2026-09-04: 356 x 1200 instead of 356 x 267.
     🟢 The anti-reflow property still holds: a non-4:3 plate letterboxes inside
     a 4:3 band rather than resizing it, so paging never moves the caption. */
  .sv-src figure.sv-region img {
    display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: contain;
    background: #f4f5f7; border: 1px solid var(--rule); border-radius: 6px;
  }
  /* 🔴 THE BAND'S SHAPE IS FIXED AND DOES NOT COME FROM THE PICTURE, which is
     the opposite of the usual advice and is right here: sizing the band from
     each image's own width and height would make PAGING between two differently
     shaped plates move the caption and the text below it, which is the reflow
     class this project has spent a week on.

     🔴 IT WAS `height: 150px` UNTIL 2026-09-04, AND THAT IS WHAT EH WAS SEEING.
     A fixed height with `object-fit: contain` and a 4:3 picture means the HEIGHT
     binds on any panel wider than 200px, so the plate rendered 200px wide
     however much room it was given: "the image is not full width... it's
     currently too small". Measured by QA in a real browser on this very rule:
     200px at panel widths of 320, 400 and 520 alike.

     🟢 `aspect-ratio` KEEPS THE PROPERTY AND DROPS THE CEILING. Space is still
     reserved before the picture loads, every plate is still shaped identically
     so paging moves nothing, and the picture now fills the width it is given.
     🔴 The reflow guarantee is what the fixed height was FOR, and it is the
     thing not to lose while making it bigger.

     ⚠️ `object-fit: contain` STAYS, and it is not redundant now that the box is
     4:3. It is what makes a future non-4:3 plate LETTERBOX inside the band
     rather than distort or reflow. That is a safe failure and a SILENT one, so
     the pack's own uniformity is pinned by a test
     (`test_no_plate_in_the_pack_has_a_different_SHAPE_from_the_others`) rather
     than by this comment: every plate is 1600x1200 today, and "today" is exactly
     the kind of guarantee that stops being true when somebody adds a plate. */
  .sv-src figure.sv-region figcaption {
    font-size: 11px; color: var(--muted); margin-top: 3px;
    display: flex; align-items: center; gap: 8px;
  }
  /* The caption text yields, the pager does not: a long honest caption
     ("Striatum, of which this is the lower part") must not push the arrows off
     the end of the row. */
  .sv-region-says { min-width: 0; overflow-wrap: anywhere; }
  .sv-region-pager {
    margin-left: auto; flex: none; display: flex; align-items: center; gap: 4px;
  }
  /* Tabular figures so "1 of 8" and "8 of 8" are the same width and the arrows
     do not shift under the reader's finger as they page. */
  .sv-region-n { font-variant-numeric: tabular-nums; }

  /* ---------- The plate pops out to a full-page overlay ----------
     EH: "make the image viewer take up most of the page as an overlay, WITH THE
     LEFT-RIGHT MOVEMENT ABILITY STILL INTACT". The paging is the half most
     easily dropped, so the overlay does not own any state: it renders the SAME
     `at` through the SAME paint(), and its arrows call the SAME step(). An
     overlay that opened on plate 1 and could not reach plates 2 to 5 would
     satisfy the sentence about size and fail the sentence he actually wrote. */
  .sv-plate-scrim { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.62); }
  .sv-plate-pop {
    position: fixed; inset: 0; z-index: 91; margin: 0; padding: 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; pointer-events: none;
  }
  .sv-plate-pop > * { pointer-events: auto; }
  /* 🔴🔴 `width: auto; height: auto` IS NOT TIDYING, IT IS THE SAME PAIR THAT
     SHIPPED A DEFECT ON 2026-09-04. paint() writes the plate's width and height
     ATTRIBUTES on the element (they give the browser the aspect ratio before the
     bytes arrive, which stops the caption jumping). An attribute makes the
     dimension DEFINITE, so any rule that does not neutralise it renders the
     picture at the plate's own pixel size inside the overlay. The inline figure
     neutralises them with `height: auto`; this one has to do it on BOTH axes
     because it constrains both. */
  .sv-plate-pop img {
    width: auto; height: auto; max-width: min(1180px, 94vw); max-height: 78vh;
    object-fit: contain; background: var(--surface);
    border: 1px solid var(--rule); border-radius: 8px;
  }
  .sv-plate-bar {
    display: flex; align-items: center; gap: 10px; max-width: min(1180px, 94vw);
    font: 12px/1.4 var(--body); color: var(--ink);
    background: var(--surface); border: 1px solid var(--rule);
    border-radius: 8px; padding: 8px 11px;
  }
  .sv-plate-bar .sv-region-says { color: var(--muted); }
  /* 🔴 A REAL BUTTON, NOT A HOVER TARGET. EH reads on an iPad, where hover does
     not exist: a control that only answers a mouse is not a control there. Same
     reason the dismiss route is a button and Escape rather than "move away". */
  .sv-region-pop {
    font: 600 12px/1 var(--body); background: var(--surface); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 4px; padding: 3px 7px;
    cursor: pointer; flex: none;
  }
  @media print { .sv-plate-scrim, .sv-plate-pop { display: none !important; } }
  .sv-region-b {
    font: 600 12px/1 var(--body); background: var(--surface); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 4px; padding: 3px 7px;
    cursor: pointer;
  }
  .sv-region-b:hover { border-color: var(--regulated); color: var(--regulated); }
  /* R28. The choice offered when a phrase names more than one region. Buttons
     rather than links, because pressing one looks the term up again in place
     rather than going anywhere. */
  .sv-pick { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .sv-pick .lab { flex: 0 0 100%; }
  .sv-pickbtn {
    font: 600 11.5px var(--body); background: var(--surface); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 999px; padding: 4px 11px;
    cursor: pointer;
  }
  .sv-pickbtn:hover { border-color: var(--hl-d-line); color: var(--hl-d-line); }
  .sv-msg { font-size: 13.5px; color: var(--muted); line-height: 1.55; padding: 4px 0; }
  .sv-foot {
    display: flex; flex-wrap: wrap; align-items: center; gap: 7px;
    padding: 9px 13px; border-top: 1px solid var(--rule); background: var(--paper);
  }
  .sv-foot button {
    font: 600 11.5px var(--body); border: 1px solid var(--rule); background: var(--surface);
    color: var(--ink); border-radius: 4px; padding: 4px 10px; cursor: pointer;
  }
  .sv-foot button:hover:not([disabled]) { border-color: var(--regulated); color: var(--regulated); }
  .sv-foot button[disabled] { opacity: .45; cursor: default; }
  .sv-foot .links { margin-left: auto; display: flex; gap: 9px; }
  .sv-foot .links a { font-size: 11.5px; color: var(--muted); }
  .sv-foot .links a:hover { color: var(--regulated); }

  .sv-badge {
    position: fixed; left: 18px; bottom: 20px; z-index: 55;
    font: 500 11.5px var(--mono); color: var(--muted);
    background: var(--surface); border: 1px solid var(--rule); border-radius: 999px;
    padding: 6px 13px; cursor: pointer; box-shadow: 0 3px 12px rgba(0,0,0,.10);
  }
  .sv-badge[hidden] { display: none; }
  .sv-badge.err { color: var(--distress, #B04A3A); border-color: currentColor; }
  /* R39: the same button, sitting in Settings instead of floating over the
     lesson. It stops being a pill in a corner and becomes a row. */
  /* 🔴 Without this, `badge.hidden = true` does nothing: the rule below is a
     class selector and `[hidden] { display: none }` is only a UA rule. Same trap
     as the emptied Notes footer, same fix. */
  .sv-badge[hidden] { display: none !important; }

  .sv-badge.sv-inset {
    position: static; display: block; width: 100%; text-align: left;
    border-radius: 5px; box-shadow: none; padding: 9px 12px;
    font: 500 12.5px var(--mono);
  }

  .sv-add {
    border-left: 3px solid var(--hl-d-line); background: var(--paper);
    border-radius: 0 6px 6px 0; padding: 11px 14px; margin: 14px 0;
  }
  .sv-add .hd {
    display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .07em;
    text-transform: uppercase; color: var(--muted);
  }
  .sv-add .hd .term { text-transform: none; letter-spacing: 0; font-family: var(--body);
    font-size: 12.5px; font-weight: 600; color: var(--ink); }
  .sv-add .hd button {
    margin-left: auto; font: 600 10.5px var(--body); background: none;
    border: 1px solid var(--rule); border-radius: 4px; color: var(--muted);
    padding: 2px 7px; cursor: pointer; letter-spacing: 0; text-transform: none;
  }
  .sv-add .bd { font-size: 14.5px; line-height: 1.6; }

  .sv-edit {
    position: fixed; z-index: 85; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(680px, 94vw); max-height: 88vh; display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
    box-shadow: 0 18px 60px rgba(0,0,0,.32);
  }
  .sv-edit[hidden] { display: none; }
  .sv-edit header {
    display: flex; align-items: baseline; gap: 10px;
    padding: 14px 17px; border-bottom: 1px solid var(--rule);
  }
  .sv-edit header strong { font-family: var(--display); font-size: 18px; font-weight: 600; }
  .sv-edit header .sub { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .sv-edit header button {
    margin-left: auto; font: 600 12px var(--body); background: none;
    border: 1px solid var(--rule); border-radius: 4px; color: var(--ink);
    padding: 4px 10px; cursor: pointer;
  }
  .sv-edit .body { overflow-y: auto; padding: 15px 17px; display: flex; flex-direction: column; gap: 12px; }
  .sv-edit label.lab {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 5px;
  }
  .sv-edit textarea {
    width: 100%; font: 14.5px/1.6 var(--body); color: var(--ink); background: var(--paper);
    border: 1px solid var(--rule); border-radius: 5px; padding: 11px 12px; resize: vertical;
  }
  .sv-edit textarea.main { min-height: 150px; }
  /* A pipe table only reads as a table if its columns line up, so table mode is
     monospace, wider, and scrolls sideways rather than wrapping a row. */
  .sv-edit.sv-tbl { width: min(1000px, 96vw); }
  .sv-edit.sv-tbl textarea.main {
    font: 13px/1.75 var(--mono); min-height: 280px;
    white-space: pre; overflow-x: auto;
  }
  .sv-edit .pick {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 11.5px; color: var(--muted);
  }
  .sv-edit .pick button {
    font: 600 12px var(--body); background: none; border: 1px solid var(--rule);
    border-radius: 4px; color: var(--ink); padding: 2px 9px; cursor: pointer; margin: 0;
  }
  .sv-edit .pick button[disabled] { opacity: .4; cursor: default; }
  .sv-edit input[type="text"] {
    width: 100%; font: 14px var(--body); color: var(--ink); background: var(--paper);
    border: 1px solid var(--rule); border-radius: 5px; padding: 9px 11px;
  }
  .sv-edit .ask { display: flex; gap: 8px; align-items: flex-end; }
  .sv-edit .ask > div:first-child { flex: 1; }
  .sv-edit .hint { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .sv-edit .hint.err { color: var(--distress, #B04A3A); }
  .sv-edit footer {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 17px; border-top: 1px solid var(--rule); background: var(--paper);
  }
  .sv-edit footer .right { margin-left: auto; display: flex; gap: 8px; }
  .sv-edit button.act {
    font: 600 12.5px var(--body); border: 1px solid var(--rule); background: var(--surface);
    color: var(--ink); border-radius: 5px; padding: 7px 14px; cursor: pointer;
  }
  .sv-edit button.act.go { background: var(--hl-d); border-color: var(--hl-d-line); }
  .sv-edit button.act[disabled] { opacity: .45; cursor: default; }
  .sv-scrim {
    position: fixed; inset: 0; z-index: 84; background: rgba(0,0,0,.28);
  }
  .sv-scrim[hidden] { display: none; }

  /* A cross-reference to another part. Present in every note whether or not the
     server is there, so the styling sits with the other always-on rules. */
  a.xref {
    color: inherit; text-decoration: none;
    border-bottom: 1px dotted var(--hl-d-line);
    cursor: pointer;
  }
  a.xref:hover { color: var(--hl-d-line); border-bottom-style: solid; }
  a.xref:focus-visible { outline: 2px solid var(--hl-d-line); outline-offset: 2px; }

  /* ---- the chat panel: same geometry as the notes panel ---- */
  .sv-chatfab {
    position: fixed; right: 20px; bottom: 66px; z-index: 55;
    font: 600 13px var(--body); color: var(--ink); background: var(--surface);
    border: 1px solid var(--rule); border-radius: 999px; padding: 10px 17px;
    cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.16);
  }
  .sv-chatfab[hidden] { display: none; }
  .sv-chatfab:focus-visible { outline: 2px solid var(--hl-d-line); outline-offset: 2px; }

  /* Third in the stack: Notes sits at 20px, Chat at 66px, this above both. */
  .sv-matfab {
    position: fixed; right: 20px; bottom: 112px; z-index: 55;
    font: 600 13px var(--body); color: var(--ink); background: var(--surface);
    border: 1px solid var(--rule); border-radius: 999px; padding: 10px 17px;
    cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.16);
  }
  .sv-matfab[hidden] { display: none; }
  .sv-matfab:hover { border-color: var(--hl-d-line); color: var(--hl-d-line); }
  .sv-matfab:focus-visible { outline: 2px solid var(--hl-d-line); outline-offset: 2px; }

  .sv-matbar {
    display: flex; flex-wrap: wrap; gap: 7px;
    padding: 12px 17px; border-bottom: 1px solid var(--rule); background: var(--paper);
  }
  .sv-matbar:empty { display: none; }
  /* 🔴 The one slot for a COURSE-LEVEL sentence in this pane, above the view
     bar so it belongs to the course rather than to whichever tab happens to be
     open. Empty on every healthy course, and `:empty` means it costs no space
     rather than an invisible band.

     🔴 If you are adding a second quiet line to this pane, REUSE THIS SLOT
     rather than inventing another mechanism. Two independent ways to say a
     quiet thing in one pane is how a pane ends up saying two of them at once,
     stacked, to a reader who needed neither. (A line about the FILES view
     belongs inside `renderFiles`, which is a different question and a
     different place.)

     `.sv-matmsg.quiet` carries a `border-top`, which is right when it sits
     UNDER something and would double up against the header here, so it is
     swapped for a bottom rule. */
  .sv-matnote:empty { display: none; }
  /* R51: recolour an existing highlight from its row. The button borrows the
     lesson's own `.mini` shape and adds a chip plus the colour's LABEL, because
     the palette head already reads "the label is the key", so naming it is what
     answers EH's word "type" rather than only his word "colour".

     Labels run to 40 characters, so the text truncates rather than pushing
     Remove off the row. Colours come from inline styles (the palette is data,
     and every entry generates its own dark values), so nothing here paints a
     swatch and there is no second copy of the palette to drift. */
  .sv-recolour {
    display: inline-flex; align-items: center; gap: 6px;
    max-width: 42%; min-width: 0;
  }
  .sv-recolour[disabled] { opacity: .55; cursor: not-allowed; }
  .sv-rechip {
    width: 11px; height: 11px; border-radius: 3px; flex: 0 0 auto;
    border: 1px solid var(--rule);
  }
  .sv-recolabel {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
  }
  .sv-repick {
    display: inline-flex; align-items: center;
    /* 🔴 9px, up from 5px, and the number is arithmetic rather than taste. The
       focus ring now sits 4px out and is 2px thick, so it reaches 6px past a
       swatch's border box; its neighbour's current-marker reaches 2px the other
       way. Anything under 8px lets a focus ring touch the next swatch's marker
       and the two read as one smear. */
    gap: 9px;
    padding: 3px 6px; margin-left: 4px;
    border: 1px solid var(--rule); border-radius: 6px;
    background: var(--surface);
  }
  .sv-reopt {
    width: 15px; height: 15px; padding: 0; border-radius: 4px;
    border: 1px solid var(--rule); cursor: pointer;
  }
  .sv-reopt:hover { border-color: var(--hl-d-line); }
  /* Offset raised 1px → 4px so this clears the 2px current-marker below and
     leaves a band of `--surface` between them. Two rings with a gap read as two
     things; two rings touching read as one thick one. */
  .sv-reopt:focus-visible { outline: 2px solid var(--hl-d-line); outline-offset: 4px; }

  /* The mark's current colour, when it is still one the picker offers. A
     stranded mark on a retired colour marks nothing here rather than lying.

     🔴 THE RING IS OUTSIDE THE SWATCH, and that word is the whole fix. It was
     `inset`, which put a near-white `--ink` ring on a pale pastel: QA measured
     it at **1.05:1 in dark**, reproduced here exactly (`#DFE7E7` on the `#F3DDBE`
     swatch). The token was never the problem. A swatch background is a palette
     colour and is the LIGHT value in both themes, so nothing themed can be
     relied on to show up inside one. Outside, the ring lands on `--surface`,
     which IS themed: **14.70:1 light, 12.77:1 at the worst dark ground**.

     The geometry is not invented. `.sv-swatch[aria-current="true"]` marks the
     palette UI's current entry on a container, and this control's own focus
     ring already sits outside at 6.89:1 in dark. Both were passing; this one
     was the odd one out.

     🔴 It must not be mistaken for the focus ring, which lands on the same
     element in the ordinary case of tabbing onto the colour you are already on.
     Colour alone does not carry it: `--ink` against `--hl-d-line` is only
     1.85:1 in dark. So they are separated by geometry too, a ring hugging the
     swatch and an outline 4px out with clear ground between. */
  .sv-reopt[aria-current="true"] { box-shadow: 0 0 0 2px var(--ink); }

  /* 🔴 THE CARD SWATCH IS THE ONE OPTION HERE THAT IS NOT A CHANGE OF
     APPEARANCE, and until 2026-08-30 its only label was a `title` tooltip. An
     iPad has no hover, so on the device several open items already point at,
     the control was unlabelled. EH's answer: make it visually distinct.

     🔴 A CORNER FOLD, INSIDE THE SWATCH, AND THE ZONE IS THE ARGUMENT.
     This picker already spends its OUTSIDE geometry on two marks a reader has
     to tell apart, and the comment above is the record of what that cost: the
     current-marker hugs the swatch, the focus ring sits 4px out, and they are
     separated by geometry because colour alone could not carry it. A third
     outside mark would have to compete with both. Inside the swatch is
     unoccupied, so this cannot be mistaken for either, and it survives the case
     that made this a defect rather than a preference: it is visible with no
     hover, no focus and no press.

     🔴 THE INK IS COMPUTED FROM THE SWATCH, NOT TAKEN FROM A TOKEN.
     A swatch background is a palette colour and is the LIGHT value in BOTH
     themes, so a themed ink repeats the 1.05:1 defect measured just above.
     `inkOn()` picks near-black or near-white from the background's own
     luminance; on Card's `#CBDCEA` that is `#1b1f1f`, in both themes, at
     **11.85:1** against the standing bar of 3:1. Nothing here reads a theme,
     which is why it cannot drift with one.

     ⚠️ That number is COMPUTED IN THE SUITE, not written here and
     trusted. This comment first said 13.09:1, which was a guess typed while
     writing the rule and was wrong by a fifth; `test_contrast.py` now derives
     it from the same transcription of `inkOn` that the guard uses.

     The colour reaches the fold through `currentColor`: the render sets
     `color` on the button, which carries no text of its own, so nothing else
     can be tinted by it.

     🔴 AND THAT IS A LOADED GUN POINTED AT THE FOCUS RING, which QA
     found on the FULL pass of this unit and neither builder had measured.
     `outline-color` ALSO defaults to `currentColor`. So a focus ring written
     without a colour would become this fold's near-black on the one swatch
     that has to carry three separate marks at once, collapsing the ring and
     the fold onto one colour. **The only thing preventing it is that
     `.sv-reopt:focus-visible` names its colour**, 30 lines above: the ring
     measures `rgb(47,97,135)` and the fold `rgb(27,31,31)`, three zones and
     three colours. Do not "tidy" that colour out of the shorthand.
     Pinned by `TheFocusRingCannotInheritTheFoldsInk` in
     `test_card_swatch.py`, because a comment is not a witness. */
  .sv-reopt-card { position: relative; overflow: hidden; }
  .sv-reopt-card::after {
    content: ''; position: absolute; top: 0; right: 0;
    /* 5px on a 13px content box: enough to read as a folded corner at a glance,
       small enough that the swatch still reads as its colour. */
    border-top: 5px solid currentColor;
    border-left: 5px solid transparent;
  }
  .sv-matnote .sv-matmsg.quiet {
    border-top: 0; border-bottom: 1px solid var(--rule);
  }
  a.sv-matbtn {
    font: 600 12px var(--body); color: var(--ink); background: var(--surface);
    border: 1px solid var(--rule); border-radius: 5px; padding: 7px 11px;
    text-decoration: none; border-bottom: 1px solid var(--rule);
  }
  a.sv-matbtn:hover { border-color: var(--hl-d-line); color: var(--hl-d-line); }
  a.sv-matbtn:focus-visible { outline: 2px solid var(--hl-d-line); outline-offset: 2px; }

  /* R20. The bar used to be links out of the pane. Two of the things on it can
     be shown IN the pane instead, so those two become a switch and only the
     genuinely external ones stay links. Styled to match the links exactly,
     because they share a row and a difference in weight would read as a
     difference in kind that is not there. */
  button.sv-matbtn {
    font: 600 12px var(--body); color: var(--ink); background: var(--surface);
    border: 1px solid var(--rule); border-radius: 5px; padding: 7px 11px;
    cursor: pointer;
  }
  button.sv-matbtn:hover { border-color: var(--hl-d-line); color: var(--hl-d-line); }
  button.sv-matbtn:focus-visible { outline: 2px solid var(--hl-d-line); outline-offset: 2px; }
  button.sv-matbtn[aria-pressed="true"] {
    background: var(--hl-d); border-color: var(--hl-d-line); color: var(--ink);
  }

  /* R25, asked 2026-08-13: "we should have a little link outside to each of the
     'Watch Lecture', 'Slides', and 'Transcript' buttons. That can be the little
     box with an arrow that comes out of it."

     One shared "Open in Drive" became three, one per item, so the label and its
     way out are the same control. They are joined into a single pill with a
     divider rather than left as two loose things, because a gap here reads as a
     fourth and fifth button on a row that already has three. */
  .sv-matitem {
    display: inline-flex; align-items: stretch;
    border: 1px solid var(--rule); border-radius: 5px; overflow: hidden;
    background: var(--surface);
  }
  .sv-matitem button.sv-matbtn { border: 0; border-radius: 0; background: none; }
  /* R49: what this tab needs, before you click it. Quiet on purpose: it is a
     fact about the link, not a warning, and most tabs carry none. */
  .sv-matneed {
    display: inline-block; margin-left: 6px; padding: 1px 5px;
    font: 600 9.5px/1.5 var(--body); letter-spacing: .04em; text-transform: uppercase;
    color: var(--muted); background: var(--paper);
    border: 1px solid var(--rule); border-radius: 3px; vertical-align: 1px;
    cursor: help;
  }
  .sv-matitem:hover { border-color: var(--hl-d-line); }
  .sv-matitem a.sv-matout {
    display: flex; align-items: center; padding: 0 8px; color: var(--muted);
    border-left: 1px solid var(--rule); text-decoration: none;
  }
  .sv-matitem a.sv-matout:hover { color: var(--hl-d-line); background: var(--paper); }
  .sv-matitem a.sv-matout:focus-visible { outline: 2px solid var(--hl-d-line); outline-offset: -2px; }
  .sv-matitem a.sv-matout svg { display: block; }

  /* The lecture is the one item with nothing to show inline: see the comment on
     VIEWS. This is what its pane says instead of an empty frame. */
  .sv-matwhy { padding: 18px 17px; }
  .sv-matwhy p { margin: 0 0 12px; font-size: 13.5px; line-height: 1.55; color: var(--ink); }
  /* The instruction comes first and plainly, at EH's wording, 2026-08-14.
     The reason is true and worth having, but it is not what he needs to read. */
  .sv-matwhy p.sv-matwhy-sub { font-size: 12.5px; color: var(--muted); }
  .sv-matwhy a {
    display: inline-block; font: 600 13px var(--body); color: var(--ink);
    background: var(--hl-d); border: 1px solid var(--hl-d-line); border-radius: 6px;
    padding: 9px 15px; text-decoration: none;
  }
  .sv-matwhy a:hover { border-color: var(--regulated); }

  /* ---- the highlight colour picker ---- */
  /* 🔴 inline-flex, and that is the fix rather than a preference. The button's
     content is an SVG followed by the caret span, and `.sv-palbtn svg` is
     `display:block` (it has to be: an inline SVG sits on the text baseline and
     leaves a descender gap under it). In a non-flex button a block child takes
     the whole line, so the caret was pushed UNDERNEATH the pen instead of
     sitting beside it. EH, 2026-08-29, with a screenshot: bigger, and to the
     right. Flex puts them on one row without the svg having to go back to
     inline, so R23's icon-colour variables riding on it are untouched. */
  .sv-palbtn {
    display: inline-flex; align-items: center; gap: 4px;
    font: 13px var(--body); line-height: 1; color: var(--muted);
    background: var(--surface); border: 1px solid var(--rule); border-radius: 5px;
    padding: 6px 8px; cursor: pointer;
  }
  /* 🔴 A course name is arbitrary length where a code was always eight
     characters, so the crumb is now the one part of the header that could push
     the nav off the row. Capped and ellipsized instead: the full name stays in
     the link's title for anyone who needs it. */
  /* 🔴 `min-width` is EH's decision of 2026-08-30 and it is the whole of this
     entry: the course name stops being a caption the row may spend, and gets a
     floor it cannot be squeezed below. Without it `.sv-headcrumbs` (which
     carries `min-width: 0`) absorbs every squeeze and the name bottoms out as
     a rounded box with no text in it, 28px of padding and nothing else.

     🔴 100px, not the 60 to 70px the entry specced, and the difference was
     measured rather than argued. `box-sizing` is border-box and the pill
     carries 28px of padding and border, so the number is the BOX and only what
     is left over draws glyphs. Measured against the real 13px/600 face:

       60px -> "Ps…"        90px  -> "Psychol…"
       70px -> "Psyc…"      100px -> "Psycholo…"   <- what the entry promised
       80px -> "Psych…"     110px -> "Psycholog…"

     The entry's own words were "enough for Psycholo…", and its number was 40px
     short of its sentence. The sentence is the decision; the number was
     arithmetic, so the sentence wins. */
  /* 🔴 THE 22ch CAP IS GONE, 2026-08-30, and its removal is EH's
     decision rather than a tidy-up: "I think we should show the long name when
     it fits, by the way, and if it doesn't, then show the short name." A cap
     truncates a name the row had room for, which is the bug; the ladder below
     degrades by STEPS instead, long name -> short name -> ellipsis, and the
     step is chosen in JS because only JS can measure a name.

     `overflow`, `text-overflow` and `white-space` all stay and all three are
     load-bearing: they are the LAST rung, for a header too narrow even for the
     short name. `min-width` stays too; it is EH's floor of the same day. */
  .sv-crumbname {
    display: inline-block; min-width: 100px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom;
  }
  /* 🔴 A CONTAINER query, not a viewport one. QA, 2026-08-30: this was the
     second of two crowding rules keying on the viewport while sitting on an
     element inside `svhead`, so a full-size window with a wide pane kept the
     long form in a header far too narrow for it. See the ladder near the
     bottom of this stylesheet for the rest of them and for the invariant. */
  /* 🔴 The 12ch rung was here and is GONE with the cap above. A width
     rung cannot tell a long name from a short one, so at 700px it cut
     "Affective Disorders" exactly as hard as it cut the full title. What
     replaces it is `fitCrumbName()`, which swaps the whole NAME rather than
     shortening the text, and which therefore has something to say that a
     media query does not. */

  .sv-palbtn:hover { border-color: var(--hl-d-line); color: var(--hl-d-line); }
  .sv-palbtn:focus-visible { outline: 2px solid var(--hl-d-line); outline-offset: 2px; }

  /* 🔴 R23, asked 2026-08-13: "the icon for highlight is currently like a circle
     inside a box. Can we make it a highlighter with the current selected
     color?" It was &#9673;, a bullseye, which says nothing about what the
     control does and nothing about which colour it will use.

     The colour arrives as two CSS variables on the button rather than as an
     inline fill, because the palette carries a light value AND a dark one and
     an inline fill cannot ask which theme is on. This mirrors, deliberately,
     what paintPaletteCss() already does for the marks themselves, so the icon
     and the highlight it draws can never disagree about a colour. */
  .sv-palbtn svg { display: block; }
  .sv-palbtn .ink { fill: var(--sv-icol, var(--hl-key)); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .sv-palbtn .ink { fill: var(--sv-icold, var(--sv-icol, var(--hl-key))); }
  }
  :root[data-theme="dark"] .sv-palbtn .ink { fill: var(--sv-icold, var(--sv-icol, var(--hl-key))); }

  /* The selection toolbar's highlight button, painted the same way, and for the
     same reason: an inline background cannot ask which theme is on.

     🔴 Reported by QA 2026-08-29: in dark mode it rendered #dfe7e7 on #f3ddbe,
     a contrast of 1.05:1, which is not "low" but invisible, the label at the
     same luminance as its own background. Every other button in the bar
     measured 9.59:1 or better. syncHighlightButton() ended with
     `b.style.background = c.color`, the palette's LIGHT value, and an inline
     style beats the theme while the label colour followed the theme as normal.

     Keyed on a marker class rather than [data-c], because the button KEEPS its
     original `class="k"` while its data-c is retargeted to the current colour,
     so `.hl-bar button.k` (0,2,1) still supplies a background underneath. The
     :root prefix takes these to (0,3,1) and settles it by specificity rather
     than by which stylesheet happens to be injected last. */
  :root .hl-bar button.sv-hlbtn {
    background: var(--sv-hlbg, var(--hl-key));
    color: var(--sv-hlink, inherit);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .hl-bar button.sv-hlbtn {
      background: var(--sv-hlbgd, var(--sv-hlbg, var(--hl-key)));
      color: var(--sv-hlinkd, var(--sv-hlink, inherit));
    }
  }
  :root[data-theme="dark"] .hl-bar button.sv-hlbtn {
    background: var(--sv-hlbgd, var(--sv-hlbg, var(--hl-key)));
    color: var(--sv-hlinkd, var(--sv-hlink, inherit));
  }

  .sv-pal {
    position: absolute; z-index: 97; width: min(310px, 92vw);
    background: var(--surface); border: 1px solid var(--rule); border-radius: 9px;
    box-shadow: 0 12px 36px rgba(0,0,0,.26); padding: 11px 12px;
  }
  .sv-pal[hidden] { display: none; }
  .sv-palhead {
    font-family: var(--mono); font-size: 10px; letter-spacing: .07em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 9px;
    display: flex; justify-content: space-between; gap: 8px;
  }
  .sv-palhead span { text-transform: none; letter-spacing: 0; font-style: italic; }
  .sv-palrows { display: flex; flex-direction: column; gap: 5px; }
  /* R45. A row is [pick] [rename] [remove]: picking is the whole row's wide
     button, renaming is an explicit pencil, and deleting exists at all. The
     old row was an input INSIDE the pick button, which is why clicking the
     name silently became an edit. */
  .sv-swatch {
    display: flex; align-items: center; gap: 4px; width: 100%;
    border: 1px solid transparent; border-radius: 6px; padding: 2px;
  }
  .sv-swatch[aria-current="true"] { border-color: var(--hl-d-line); background: var(--paper); }
  .sv-swatch .pick {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px;
    text-align: left; background: none; border: 1px solid transparent;
    border-radius: 5px; padding: 4px 5px; cursor: pointer;
  }
  .sv-swatch .pick:hover { border-color: var(--rule); }
  .sv-swatch .chip {
    flex: 0 0 auto; width: 22px; height: 22px; border-radius: 5px;
    border: 1px solid rgba(0,0,0,.18);
  }
  .sv-swatch .plab {
    flex: 1; min-width: 0; font: 13px var(--body); color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sv-swatch .pedit, .sv-swatch .pdel {
    flex: 0 0 auto; font: 13px var(--body); color: var(--muted); background: none;
    border: 1px solid transparent; border-radius: 5px; padding: 4px 7px; cursor: pointer;
  }
  .sv-swatch .pedit:hover { color: var(--hl-d-line); border-color: var(--rule); }
  .sv-swatch .pdel:hover { color: var(--broken); border-color: var(--broken); }
  .sv-swatch.editing input {
    flex: 1; min-width: 0; font: 13px var(--body); color: var(--ink);
    background: var(--paper); border: 1px solid var(--hl-d-line); border-radius: 4px;
    padding: 4px 6px;
  }
  .sv-swatch.editing button, .sv-swatch.deleting button {
    flex: 0 0 auto; font: 600 12px var(--body); color: var(--ink); background: var(--surface);
    border: 1px solid var(--rule); border-radius: 5px; padding: 4px 9px; cursor: pointer;
  }
  .sv-swatch.editing button:hover, .sv-swatch.deleting button:hover {
    border-color: var(--hl-d-line); color: var(--hl-d-line);
  }
  .sv-swatch.deleting {
    flex-direction: column; align-items: stretch; gap: 6px;
    border-color: var(--broken); padding: 7px 8px;
  }
  .sv-swatch.deleting .dq { font: 600 13px var(--body); color: var(--ink); }
  .sv-swatch.deleting .dopt {
    display: flex; align-items: center; gap: 7px; font: 12.5px var(--body);
    color: var(--ink-soft); cursor: pointer;
  }
  .sv-swatch.deleting .dact { display: flex; justify-content: flex-end; gap: 6px; }
  .sv-swatch.deleting [data-confirmdel] { color: var(--broken); border-color: var(--broken); }
  .sv-swatch.deleting [data-confirmdel]:hover {
    background: var(--broken); color: var(--paper); border-color: var(--broken);
  }
  /* 12px, up from 9px: at 9px it read as a speck rather than a control. The
     margin is gone because the button's own `gap` now does that job. */
  .sv-palbtn .pcaret { font-size: 12px; opacity: .75; }
  .sv-paladd {
    display: flex; gap: 6px; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--rule);
  }
  .sv-paladd input[type="color"] {
    flex: 0 0 auto; width: 30px; height: 30px; padding: 0;
    border: 1px solid var(--rule); border-radius: 5px; background: none; cursor: pointer;
  }
  .sv-paladd input[type="text"] {
    flex: 1; min-width: 0; font: 12.5px var(--body); color: var(--ink);
    background: var(--paper); border: 1px solid var(--rule); border-radius: 5px; padding: 6px 7px;
  }
  .sv-paladd button {
    font: 600 12px var(--body); color: var(--ink); background: var(--surface);
    border: 1px solid var(--rule); border-radius: 5px; padding: 6px 11px; cursor: pointer;
  }
  .sv-paladd button:hover { border-color: var(--hl-d-line); color: var(--hl-d-line); }
  @media print { .sv-pal { display: none !important; } }

  /* Back and forward. No block-level tags in here: see installNav(). */
  .sv-nav {
    display: flex; gap: 12px; align-items: stretch; justify-content: space-between;
    margin: 22px 0; padding: 0;
  }
  .sv-nav[hidden] { display: none; }
  .sv-nav-top { margin-bottom: 30px; }
  .sv-nav-bottom { margin-top: 34px; border-top: 1px solid var(--rule); padding-top: 20px; }
  a.sv-navbtn {
    flex: 1 1 0; min-width: 0; display: flex; align-items: baseline; gap: 9px;
    text-decoration: none; border: 1px solid var(--rule); border-radius: 7px;
    padding: 11px 14px; background: var(--surface); color: var(--ink);
    font-family: var(--body); font-size: 13.5px; line-height: 1.35;
  }
  a.sv-navbtn.fwd { justify-content: flex-end; text-align: right; }
  a.sv-navbtn:hover { border-color: var(--hl-d-line); color: var(--hl-d-line); }
  a.sv-navbtn:focus-visible { outline: 2px solid var(--hl-d-line); outline-offset: 2px; }
  a.sv-navbtn.fwd .sv-navdir { order: 2; }
  .sv-navdir { font-size: 17px; line-height: 1; color: var(--muted); }
  /* Wraps rather than truncating. Reported 2026-08-13: "Currently, I see some
     titles going too far and not wrapping." Six lesson titles run past 57
     characters and the longest is 62, against roughly 336px of button at
     13.5px, so the ellipsis was firing on the desktop and not only on a phone.
     The end of a title is the half that distinguishes it from its neighbour
     ("...and the Choice Between Them"), so truncating cuts the informative
     end and keeps the generic start. A second line costs 18px. */
  .sv-navttl { min-width: 0; overflow-wrap: break-word; }
  .sv-navend {
    flex: 1 1 0; padding: 11px 14px; font-family: var(--mono); font-size: 11px;
    letter-spacing: .04em; text-transform: uppercase; color: var(--muted);
    border: 1px dashed var(--rule); border-radius: 7px;
  }
  .sv-nav .sv-navend:last-child { text-align: right; }
  @media print { .sv-nav { display: none !important; } }

  /* ---------- the update / restart notice ----------

     🔴 QUIET IS A REQUIREMENT, not a taste: this sits on a reading surface, and
     a reader who has to dismiss something before reading learns to dismiss the
     surface. So it is one line, the muted colour, no fill, and it never moves
     the lesson: `margin` above the top nav, no fixed position, no animation.

     🔴 The two producers get DIFFERENT weights on purpose. A restart owed means
     the change you already made is not in effect, so it carries the accent rule
     and the action. A new version means somebody else has something better
     whenever you like, so it is a sentence and a link. Giving them the same
     weight is what makes the urgent one ignorable. */
  .sv-notice {
    /* 🔴 `flex-wrap: wrap` IS LOAD-BEARING AND WAS MISSING FOR A MONTH.
       Without it the button never shrinks (`.sv-notice-act` is `0 0 auto`) and
       the sentence collapses around it: measured on a 320px screen, the button
       held 154px at EVERY width from 320 to 1240 while the text ran in a 69px
       column, 30 lines, 685px tall on a 568px phone. Found by `study-hub-qa`
       against a pass they had already given, because that pass measured one
       width. */
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px;
    margin: 0 0 18px; padding: 9px 12px;
    border: 1px solid var(--rule); border-left-width: 3px; border-radius: 7px;
    font-size: .92em; color: var(--muted); background: none;
  }
  .sv-notice[hidden] { display: none; }
  /* 🔴 The two weights, in the project's own tokens (`lesson-base.css`), so
     both follow the reader's light or dark choice: the quiet one is `--muted`
     text on a `--rule` edge; the urgent one is `--ink` text on a `--regulated`
     edge, which is the palette's own "this is in hand" green and is already
     used for the states the reader is meant to notice. */
  .sv-notice-restart { border-left-color: var(--regulated); color: var(--ink); }
  /* 🔴 260px IS A WRAP THRESHOLD, NOT A WIDTH, and it was chosen by sweeping
     rather than by taste. `auto` here means "as wide as the whole sentence",
     which makes the button wrap onto its own line at EVERY width including
     1240, where it is not wanted. Measured across 320 / 375 / 414 / 440 / 480 /
     560 / 720 / 1240: a 260px basis wraps the button below 480 and nowhere
     above it, and is shorter or identical at every one of the eight. 220px is
     the same idea and leaves 480 unimproved; 300px measures identically to 260. */
  .sv-notice-txt { flex: 1 1 260px; min-width: 0; }
  .sv-notice-act {
    flex: 0 0 auto; background: none; border: 1px solid var(--rule); border-radius: 6px;
    color: inherit; font: inherit; padding: 2px 9px; cursor: pointer;
  }
  .sv-notice-act:hover { border-color: var(--muted); }
  .sv-notice-x {
    flex: 0 0 auto; background: none; border: 0; color: var(--muted);
    font: inherit; line-height: 1; padding: 2px 4px; cursor: pointer;
  }
  @media print { .sv-notice { display: none !important; } }

  /* ---- tables that scroll sideways should say so ----

     Asked 2026-08-13: "so things are visible and tables are easy to scroll
     left to right as well."

     🔴 Checked before building, and the container already exists. All 124
     tables in the module are already inside `<div class="tblwrap">`, and all
     27 lessons that have a table already carry
     `.tblwrap { overflow-x: auto; margin: 24px 0 }`. `.wrap` and `.col` are
     plain blocks with no flex or grid anywhere above them, so nothing defeats
     it: `table.tbl` is `width:100%; min-width:520px`, and in a column narrower
     than 520px the wrapper genuinely scrolls instead of pushing the page.

     So the gap is not the scrolling, it is that nothing announces it. macOS
     hides scrollbars until something scrolls, so a table cut off at the column
     edge looks like a table that ends there. Three things are added here and
     the lesson files are not touched:

       - an edge fade on whichever side has more table behind it,
       - keyboard reachability, since a scroll region that can only be reached
         by trackpad cannot be reached at all without one,
       - and both only on the wrappers that actually overflow, so a table that
         fits keeps its own drop shadow unclipped.

     🔴 The edge fade is a mask, and an inset box-shadow was tried first and
     does not work. A shadow paints on the container's own background, and
     `table.tbl` carries an opaque `background: var(--surface)` filling the
     whole container, so the shadow paints underneath the table and is never
     seen. It was measured at three strengths, all invisible, before the reason
     turned up. A mask applies to the element and everything inside it, so it
     fades the table itself and there is nothing left to paint over it. */
  .tblwrap.sv-canscroll {
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 34px, #000 calc(100% - 34px), transparent 100%);
            mask-image: linear-gradient(to right, transparent 0, #000 34px, #000 calc(100% - 34px), transparent 100%);
  }
  /* Fade only the side that has something behind it. */
  .tblwrap.sv-canscroll.sv-atstart {
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 34px), transparent 100%);
            mask-image: linear-gradient(to right, #000 calc(100% - 34px), transparent 100%);
  }
  .tblwrap.sv-canscroll.sv-atend {
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 34px, #000 100%);
            mask-image: linear-gradient(to right, transparent 0, #000 34px, #000 100%);
  }

  /* 🔴 The mask clips to the border box, so it eats an outline drawn outside
     it: a focus ring at outline-offset 3px was confirmed invisible while the
     wrapper genuinely held focus. Dropping the mask while focused is the fix,
     and it costs nothing, because the fade is a passive hint and focus is the
     moment the reader is already looking. */
  .tblwrap.sv-canscroll:focus-visible,
  .tblwrap.sv-canscroll.sv-atstart:focus-visible,
  .tblwrap.sv-canscroll.sv-atend:focus-visible {
    -webkit-mask-image: none; mask-image: none;
    outline: 2px solid var(--hl-d-line); outline-offset: 3px;
  }
  /* Every table and diagram is a permanent stop from 2026-08-15, so the ones
     that currently fit need a ring of their own: without this they take focus
     and nothing on screen says where you are. */
  .wrap .tblwrap:focus-visible, .wrap .figbox:focus-visible {
    outline: 2px solid var(--hl-d-line); outline-offset: 3px;
  }

  /* Paper has no viewport to overflow, and a clipped table would lose columns. */
  @media print {
    .tblwrap.sv-canscroll,
    .tblwrap.sv-canscroll.sv-atstart,
    .tblwrap.sv-canscroll.sv-atend {
      overflow-x: visible; -webkit-mask-image: none; mask-image: none;
    }
  }

  /* ---- a written note reads as text until you ask to edit it ----

     Asked 2026-08-13: "I kind of like the idea of having save and edit buttons
     so that the note edit boxes don't stay open at all times, so they don't
     get edited by mistake."

     The view is a sibling of the textarea rather than a replacement for it.
     🔴 That is the whole safety argument: the textarea is never destroyed, so
     the `input` listener the lesson attached to it survives, and autosave goes
     on being the crash net exactly as before. Nothing here ever writes to the
     note's text. */
  .sv-noteview {
    font: 14.5px var(--body); color: var(--ink); line-height: 1.5;
    white-space: pre-wrap; overflow-wrap: break-word;
    padding: 9px 10px; border: 1px solid transparent; border-radius: 4px;
    min-height: 22px;
  }
  .sv-noteview.blank { color: var(--muted); font-style: italic; }
  .hl-note .mini.sv-editnote { color: var(--hl-d-line); font-weight: 600; }

  /* R37: several notes on one highlight, each read until you ask to edit it. */
  .sv-notes { margin: 2px 0 0; }
  .sv-noteask { display:inline-flex; gap:8px; align-items:center;
                font-size:12.5px; color:var(--muted); }
  .sv-noteask .mini.danger { color:var(--broken); border-color:var(--broken); }
  .sv-inote {
    border-left: 2px solid var(--rule); padding-left: 9px; margin: 8px 0 0;
  }
  .sv-inote textarea {
    width: 100%; font: 14.5px var(--body); color: var(--ink); background: var(--paper);
    border: 1px solid var(--rule); border-radius: 4px; padding: 9px 10px;
    resize: vertical; min-height: 62px; line-height: 1.5;
  }
  .sv-inote textarea:focus { outline: 2px solid var(--regulated); outline-offset: -1px; }
  .sv-inote .sv-noteview { padding: 2px 0; }
  .sv-inote .sv-irow { display: flex; gap: 4px; align-items: center; margin-top: 4px; }
  .sv-inote .mini {
    font: 500 12px var(--body); background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 4px 7px; border-radius: 3px;
  }
  .sv-inote .mini:hover { color: var(--ink); background: var(--paper); }
  .sv-inote .mini.sv-editnote { color: var(--hl-d-line); font-weight: 600; }
  .sv-addnote { color: var(--hl-d-line) !important; font-weight: 600; }

  /* ---- text size in the right-hand panel ----

     Asked 2026-08-13: "we need a way to adjust text size in the right-hand
     panel."

     🔴 There are two right-hand panels, so this has to cover both: the layer's
     own .sv-panel (chat) and the lesson's .hl-panel (notes). Neither is one
     font size. Between them they set type in more than a dozen rules at half a
     dozen sizes, all in literal pixels and most of them inside the 29 lesson
     files where they cannot be rewritten from here. A variable would mean
     touching every rule; `zoom` scales the whole subtree, type and the spacing
     around it together, in one declaration.

     Applied to the panel's CHILDREN rather than the panel itself, deliberately.
     Zooming the panel would scale its width too, and its width is measured at
     runtime by setPanelSpace() to decide how far to inset the lesson: the text
     would grow and slide straight back under the panel it was meant to fit. */
  :root { --sv-pzoom: 1; }
  .sv-panel > *, .hl-panel > * { zoom: var(--sv-pzoom); }

  /* ---- the LESSON's text size, EH 2026-09-03 ------------------------------

     *"it would be nice to have something that lets you change the font size,
     especially in the main left pane with the lessons."*

     `zoom` again, and for the reason above: the lesson stylesheet sets type in
     dozens of places in px, and a `font-size` cascade over it would scale the
     paragraphs and leave the headings, rules and figure captions where they
     were. `zoom` takes the whole subtree, type and the spacing around it, in
     one declaration.

     🔴 THE CAP IS THE HALF THAT IS EASY TO MISS. `.wrap` is `max-width: 960px`
     in `reader/lesson-base.css`, and `zoom` scales that cap along with
     everything else: at Largest a 960px column becomes 1248px, so "make the
     text bigger" would also make the line 30% longer, which is worse
     typography than the small text it was fixing. Dividing the cap by the same
     number holds the RENDERED column at 960px and lets only the text grow.

     ⚠️ It cannot overflow a narrow window, which is the objection to read the
     `calc` with: `zoom` lays the subtree out in its own scaled coordinate
     space, so a cap of `960/1.3` = 738 scaled units IS 960 rendered pixels and
     binds only where 960 pixels exist. Below that the column is bounded by the
     viewport exactly as it is today.

     🔴 The 960 is duplicated from `lesson-base.css` and there is no way to
     write it once across a stylesheet and a layer. `test_lesson_size.py` reads
     both files and asserts the two numbers are equal, which is the join this
     project keeps asking for. */
  :root { --sv-lzoom: 1; }
  .wrap { zoom: var(--sv-lzoom); max-width: calc(960px / var(--sv-lzoom)); }

  /* ---- chat and notes as one sidebar, with a toggle at the top ----

     Asked 2026-08-13: "It would also be good in the right-hand pane menu to
     quickly tab switch between chat and notes because I could be taking notes
     on the chat." Asked again the same evening, which is how we know it was
     never built: "did we ever implement that thing where chat and notes are
     really the same sidebar, and at the top I can toggle between the two?"

     🔴 They are not merged into one element, and that is the design rather than
     a shortcut. The notes panel is the LESSON'S element, built and driven by
     code inside each of the 29 files; the chat panel is this file's. Merging
     the DOM would mean either editing 29 lessons or reimplementing the notes
     panel here, and both are worse than the problem.

     What actually makes them feel like two panels is not the DOM, it is that
     they are different widths, open from different buttons, and overlap so you
     can never see both. All three are fixed here: identical width, a shared tab
     strip at the top of each, and one open at a time. From the reader's side
     that is one sidebar with two tabs, which is what he asked for.

     🔴 The widths must match exactly, and not only for looks: setPanelSpace()
     measures the open panel to decide how far to inset the lesson (R4), so two
     different widths made the text jump sideways on every switch. */
  .hl-panel { width: var(--sv-panel-w) !important; }

  /* 🔴 NOT .sv-tabs. That class already exists on the popover's Look up and
     Explain strip, and reusing it did two things at once: it restyled the
     popover, and it made paintTabs() throw on a strip with no Chat button,
     which aborted the loop before it reached the second panel. Caught by a
     probe reporting three strips where two were expected. */
  .sv-panetabs {
    display: flex; gap: 0; flex: none;
    border-bottom: 1px solid var(--rule); background: var(--paper);
  }
  .sv-panetabs button {
    flex: 1 1 0; font: 600 12.5px var(--body); color: var(--muted);
    background: none; border: 0; border-bottom: 2px solid transparent;
    padding: 11px 8px; cursor: pointer;
  }
  .sv-panetabs button:hover { color: var(--ink); }
  .sv-panetabs button[aria-selected="true"] {
    color: var(--ink); border-bottom-color: var(--hl-d-line); background: var(--surface);
  }
  .sv-panetabs button:focus-visible { outline: 2px solid var(--hl-d-line); outline-offset: -2px; }
  /* 🔴 R22, 2026-08-13: "In the notes tab up top, we don't need to show the
     number of notes and the number of highlights." The tab read "Notes0 notes,
     6 highlights", which is R6's idea of keeping the total legible from the
     chat side taken further than it earns: the zero was on screen more often
     than any real number, and the panel lists all of them one click away. The
     count on R18's header button went with it, on the same argument. */
  /* The panel's own heading now repeats what the selected tab says.
     Hidden rather than removed: this is the lesson's markup and its own code
     still writes to both.

     🔴 The notes panel's header goes entirely, because hiding those two left it
     as an empty bar carrying one Close button, which read as a mistake. Its
     Close moves onto the strip. The chat panel keeps its header, because that
     one still holds History, New and the excerpt, and only its Close is
     dropped as the duplicate.

     🔴 The third line matched THREE panels, not the two it was written for.
     The materials panel is also a .sv-panel (class="sv-panel sv-mat"), it never
     got a strip, and its header's Close was the only one it had: R6 left it
     openable and not closable except by pressing Materials again. R21 gives it
     the strip, which is what makes hiding its Close correct rather than a bug,
     so the rule stays and the panel gains what the rule assumed it had. Logged
     in the QA log, because the layer and the 29 lessons share one namespace and
     this is the second time in two days a selector caught something nobody was
     thinking about. */
  .sv-panel header strong, .hl-panel header strong { display: none; }
  .hl-panel header { display: none; }
  .sv-panel header [data-close] { display: none; }
  /* Nothing is left in it once the heading and the Close have gone: unlike the
     chat header there is no History, no New and no excerpt, so it renders as an
     empty bar with a border under it.

     🔴 Two classes rather than one, and not for tidiness: `.sv-mat header`
     matches at the same specificity as the `.sv-panel header { display: flex }`
     that sets it further down this stylesheet, and later wins a tie, so the
     one-class version was simply ignored. It failed silently, the way a hidden
     element that is still visible always does, and was caught by asking the
     browser for the computed value rather than by looking at the panel. */
  .sv-panel.sv-mat header { display: none; }

  /* R24, asked 2026-08-13: "Let's use an X for the close and then a gear for
     settings." Both are icons now, so both are sized as icons: square, equal,
     and off the flex:1 sharing the three tabs do. */
  .sv-panetabs .sv-tabicon {
    flex: 0 0 auto; color: var(--muted); padding: 0 12px;
    border-left: 1px solid var(--rule); border-bottom-color: transparent;
    display: flex; align-items: center; justify-content: center;
  }
  .sv-panetabs .sv-tabicon:hover { color: var(--ink); }
  .sv-panetabs .sv-tabicon svg { display: block; }
  .sv-panetabs .sv-tabicon[aria-expanded="true"] { color: var(--hl-d-line); }

  /* 🔴 R24: "When the right pane is open, we don't need a second set of
     materials, chat, and notes buttons." R18 gave the header the four controls
     and R6 and R21 gave the pane a strip carrying three of them, so opening the
     pane put both on screen at once.

     The pane's strip wins while the pane is open, and the header's buttons stand
     down. That direction rather than the other because below 900px the pane is
     full-screen and covers the header entirely, so the strip is the only surface
     that exists there; stripping the strip back instead would have left a phone
     with no way to change panes at all. The header keeps its identity and its
     way back to the hub.

     html.sv-panel-open is set by setPanelSpace() whenever any of the three is
     showing, so this needs no state of its own. The burger goes with them: it is
     only ever a stand-in for that same row. */
  html.sv-panel-open .sv-headnav,
  html.sv-panel-open .sv-burger { display: none; }

  /* ---- R15: the cards, with their definitions, in the panel ---- */
  .sv-cards .hl-sechead h3 { margin: 0; }
  .sv-card { border-bottom: 1px solid var(--rule-soft); padding: 12px 0; }
  .sv-card .term {
    font: 600 14.5px var(--body); color: var(--ink); line-height: 1.4;
    border-left: 3px solid var(--hl-d-line); padding-left: 11px;
  }
  .sv-card .def {
    font-size: 13.5px; line-height: 1.55; color: var(--ink); margin: 7px 0 0 14px;
  }
  .sv-card .def.pending, .sv-card .def.none { color: var(--muted); font-style: italic; }
  .sv-card .src {
    font-family: var(--mono); font-size: 10.5px; color: var(--muted);
    margin: 6px 0 0 14px; display: flex; gap: 8px; align-items: baseline;
  }
  .sv-card .src a { color: var(--muted); }
  .sv-card .src a:hover { color: var(--hl-d-line); }
  .sv-card .again {
    font: 500 11.5px var(--body); background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 2px 6px; border-radius: 3px; margin-left: auto;
  }
  .sv-card .again:hover { color: var(--ink); background: var(--paper); }
  .sv-cards .empty { color: var(--muted); font-size: 13.5px; padding: 10px 0 2px; }
  /* R44. The section nav at the top of the notes panel. Sticky above the
     section heads, which are themselves sticky at top 0 in the lesson's CSS,
     so they are pushed down by the nav's measured height (the variable is set
     from JS; a hardcoded height would drift the first time a font or padding
     changed on the phone). */
  /* R47: one pill in four segments, and it NEVER wraps. A grid of four
     equal columns cannot put Bookmarks on a second line the way the old
     wrapping flex row did; the labels shrink instead. */
  .sv-secnav {
    position: sticky; top: 0; z-index: 3;
    background: var(--surface); border-bottom: 1px solid var(--rule-soft);
    padding: 8px 0 7px; margin: 0 0 2px;
  }
  .sv-secnav .rail {
    display: grid; grid-template-columns: repeat(4, 1fr);
    border: 1px solid var(--rule); border-radius: 999px; overflow: hidden;
    background: var(--paper);
  }
  .sv-secnav button {
    font: 600 11.5px var(--body); color: var(--ink-soft); background: none;
    border: 0; border-left: 1px solid var(--rule); border-radius: 0;
    padding: 6px 2px; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
  }
  .sv-secnav button:first-child { border-left: 0; }
  .sv-secnav button:hover { color: var(--hl-d-line); background: var(--surface); }
  .hl-panel .hl-sechead { top: var(--sv-secnav-h, 0px) !important; }
  /* R44. Adding a card by typing the term. */
  .sv-cardadd { display: flex; gap: 7px; margin: 2px 0 8px; }
  .sv-cardadd[hidden] { display: none; }
  .sv-cardadd input {
    flex: 1; font: 13.5px var(--body); color: var(--ink); background: var(--paper);
    border: 1px solid var(--rule); border-radius: 5px; padding: 7px 9px; min-width: 0;
  }
  .sv-cardadd button {
