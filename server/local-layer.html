  function svNoteRow(it, note, editing) {
    var row = document.createElement('div');
    row.className = 'sv-inote';

    var view = document.createElement('div');
    view.className = 'sv-noteview';
    var ta = document.createElement('textarea');
    ta.value = note.t || '';
    ta.placeholder = 'What this passage made you think';

    var bar = document.createElement('div');
    bar.className = 'sv-irow';
    var edit = document.createElement('button');
    edit.type = 'button';
    edit.className = 'mini sv-editnote';
    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'mini';
    del.textContent = 'Remove note';

    function paint(open) {
      if (!open) {
        view.textContent = (ta.value.trim() || 'Empty note');
        view.classList.toggle('blank', !ta.value.trim());
      }
      ta.hidden = !open;
      view.hidden = open;
      edit.textContent = open ? 'Save' : 'Edit';
      edit.setAttribute('aria-label', open ? 'Save this note and close the box' : 'Edit this note');
      if (open) { try { ta.focus(); } catch (e) {} }
    }

    /* The button closes the box; it does not perform the save, because the save
       has already happened. Same answer R2 got: autosave stays as the crash
       net, on a debounce, and the button is what stops the box being open by
       default. */
    var timer = 0;
    ta.addEventListener('input', function () {
      note.t = ta.value;
      window.clearTimeout(timer);
      timer = window.setTimeout(function () { svSyncNotes(it); }, 600);
    });
    ta.addEventListener('blur', function () {
      window.clearTimeout(timer);
      note.t = ta.value;
      svSyncNotes(it);
    });

    edit.addEventListener('click', function () {
      var open = ta.hidden;
      if (open) {
        /* Opening: remember what was there, so a select-all typed over by
           mistake has a way back when the empty save asks. */
        row._was = ta.value;
      }
      if (!open) {
        /* Closing empty. Until 2026-08-22 this deleted the note silently; the
           only silent delete in the reader, and EH overruled it: ask, and
           let Keep bring the words back. */
        note.t = ta.value;
        if (!ta.value.trim()) {
          svAskDelete(bar, edit, del, function () {
            svRemoveNote(it, note, row);
          }, function () {
            var was = (row._was || '');
            if (was.trim()) { ta.value = was; note.t = was; }
            paint(false);
            svSyncNotes(it);
          });
          return;
        }
      }
      paint(open);
      if (!open) svSyncNotes(it);
    });

    del.addEventListener('click', function () {
      svAskDelete(bar, edit, del, function () { svRemoveNote(it, note, row); });
    });

    bar.appendChild(edit);
    bar.appendChild(del);
    row.appendChild(view);
    row.appendChild(ta);
    row.appendChild(bar);
    paint(!!editing);
    return row;
  }

  /* EH, 2026-08-22: nothing may delete a note without asking. Both routes
     (the Remove button, and saving a note emptied by mistake) come through
     this: the row's buttons give way to a one-line question until answered. */
  function svAskDelete(bar, edit, del, onDelete, onKeep) {
    var ask = document.createElement('span');
    ask.className = 'sv-noteask';
    var q = document.createElement('span');
    q.textContent = 'Delete this note?';
    var yes = document.createElement('button');
    yes.type = 'button'; yes.className = 'mini danger'; yes.textContent = 'Delete';
    var no = document.createElement('button');
    no.type = 'button'; no.className = 'mini'; no.textContent = 'Keep it';
    ask.appendChild(q); ask.appendChild(yes); ask.appendChild(no);
    edit.hidden = true; del.hidden = true;
    bar.appendChild(ask);
    function done() {
      if (ask.parentNode) ask.parentNode.removeChild(ask);
      edit.hidden = false; del.hidden = false;

    yes.addEventListener('click', function () { done(); onDelete(); });
    no.addEventListener('click', function () { done(); if (onKeep) onKeep(); });

  function svRemoveNote(it, note, row) {
    var list = svNotes(it);
    var at = list.indexOf(note);
    if (at >= 0) list.splice(at, 1);
    if (row && row.parentNode) row.parentNode.removeChild(row);

  /* 🔴 IT SITS HERE, ABOVE THE PANEL DECORATORS, RATHER THAN BESIDE THE SAVE
     GUARDS IT BELONGS WITH, and moving it back breaks the page. `installItemNotes`
     below is an IIFE that paints once at definition time, so it runs while a
     `var` declared further down is hoisted but still undefined. That is not a
     crash you get told about clearly: it threw
     "Cannot read properties of undefined" from inside a `some()` callback three
     frames deep, on the very first render, measured 2026-09-01. */
  /* ---------- an item the server never took says so, on the item ----------

     EH chose this himself on 2026-09-01, from three options the manager put to
     him: keep the change visible AND mark it as not yet saved. Rolling the page
     back to the disk copy was refused, because for a highlight the local copy is
     the reader's own work. Leaving it exactly as it was is what this replaces,
     and it claims a save that never happened.

     🔴 REPRODUCED BEFORE BUILDING, on a rig whose course directory was made
     read-only so that every write returns the 500 `api()` RESOLVES on. Three
     highlights and one bookmark made during the outage, ONE of the four actually
     on disk, and the panel drew four rows whose text was character-identical:
     "Jump to / Add a note / Remove". Two things were worse than the entry
     predicted:
       - only the FIRST failure in a collection speaks, because the message
         allowance is once per outage per collection, so highlights two and
         three were completely silent;
       - the bookmark was GONE after a reload, because bookmarks have no local
         store at all. Its wording therefore cannot be a highlight's.

     🔴 DRIVEN BY THE WRITE RESULT AND BY NOTHING ELSE. A badge that fails to
     CLEAR when the item does land is the same lie in the other direction, and it
     is the failure this design invites. There is no timer here, no retry and no
     interval: `svHeld` is written only where a write LANDED or a read was
     ADOPTED, and `svStranded` only where a write came back refused.

     🔴 AND IT IS NOT "everything in the payload that failed". Every writer here
     sends the WHOLE collection, so a failed payload names every mark the reader
     owns, including ones that have been safely on disk since last week. Badging
     the payload would print "not saved" across saved work, which is this
     entry's own defect pointing backwards. An item is marked only when the write
     carrying it failed AND the server has never been seen to hold it.

     🔴 AND THE THIRD STATE, which is neither, and which the first draft of this
     got wrong. On the first load after this shipped, or in a browser whose
     storage was cleared, the page holds marks and has no record of what the
     server has. If the server is ALSO unreachable at that moment, nothing here
     knows anything, and painting "not saved" over the lot would be a guess
     wearing a fact's clothes. So marks that were already on the page when it
     loaded stay unbadged until some read or write succeeds; marks made
     afterwards are badged, because those the page did watch arrive. */

  /* 🔴 The course, because a docId does NOT identify a lesson. Measured
     2026-09-01 across EH's own two courses: 25 of 51 docIds exist in BOTH of
     them, so a key built from the docId alone names two different lessons on one
     server. The marks store itself is safe (the shell keys it by the course's
     `store_prefix`); `kcl-study-synced-<docId>` is NOT, and that is filed
     separately rather than fixed here. Empty on a single-course install, where
     the URL carries no code and there is nothing to collide with. */
  function svCoursePart() {
    var m = /\/m\/([A-Za-z0-9_.-]+)\//.exec(window.location.pathname || '');
    return m ? m[1] + '-' : '';
  }

  var SAVE_STATE_KEY = 'kcl-study-savestate-' + svCoursePart() + S.docId;

  /* Three collections, one letter each: h a highlight, n a page note, b a
     bookmark. Highlights and notes travel in the SAME write (/api/marks), so
     they are judged together and kept apart only for their wording. */
  var svHeld = {};       /* key -> the server has been SEEN to hold this */
  var svStranded = {};   /* key -> a write carrying it failed, and it is not held */
  var svSeen = {};       /* kind -> some read or write of it has succeeded, ever */
  var svAtLoad = {};     /* key -> was already on the page before anything ran */

  function svKey(kind, id) { return kind + ':' + id; }
  function svKindOf(key) { return key.slice(0, key.indexOf(':')); }
  function svKeys(kind, ids) {
    return (ids || []).map(function (id) { return svKey(kind, id); });
  }

  function svReadState() {
    try {
      var raw = JSON.parse(window.localStorage.getItem(SAVE_STATE_KEY) || 'null');
      if (!raw || typeof raw !== 'object') { return; }
      if (raw.held && typeof raw.held === 'object') { svHeld = raw.held; }
      if (raw.stranded && typeof raw.stranded === 'object') { svStranded = raw.stranded; }
      if (raw.seen && typeof raw.seen === 'object') { svSeen = raw.seen; }
    } catch (e) {}
  }

  /* 🔴 Persisted, because requirement 4 is that the mark survives a reload: the
     item is still on the device and still unsaved, and a page that forgets
     overnight is back to claiming a save that did not happen. */
  function svWriteState() {
    try {
      window.localStorage.setItem(SAVE_STATE_KEY, JSON.stringify(
        { held: svHeld, stranded: svStranded, seen: svSeen }));
    } catch (e) {}
  }

  /* Whatever the write does next, the collection now consists of exactly these
     keys. Anything remembered about a key that is no longer among them names an
     item the reader has since removed, and a map that only grows is a leak with
     a badge on it. */
  function svCollectionIs(kinds, keys) {
    var live = {};
    keys.forEach(function (k) { live[k] = true; });
    kinds.forEach(function (kind) {
      [svHeld, svStranded].forEach(function (map) {
        Object.keys(map).forEach(function (k) {
          if (svKindOf(k) === kind && !live[k]) { delete map[k]; }
        });
      });
    });
  }

  /* 🔴 NEITHER WRITER MAY BREAK ITS CALLER, and this is not defensive
     habit. `svServerHolds` is called from inside `restoreFromDisk`, whose whole
     chain ends `.catch(function () { return false; })`, so an exception thrown
     while painting a chip would be swallowed into "there was nothing on disk"
     and the reader's RESTORE would silently not happen. A badge is cosmetic and
     the marks are the reader's work; the cosmetic half is not allowed to cost
     the other one anything.

     🔴 FOUND BY THE EXISTING TESTS, not by reasoning: adding the call turned
     nine `test_sync_merge` cases red, three of them reporting "no restore"
     rather than the real cause, which is exactly the shape of the failure this
     guard prevents in the product. */
  function svSafely(work) {
    try { work(); } catch (e) {}
  }

  /* A write LANDED, or a read came back and was adopted. Either way the server
     holds these, so any mark on them is now false and comes off. */
  function svServerHolds(kinds, keys) {
    svSafely(function () {
      svCollectionIs(kinds, keys);
      keys.forEach(function (k) { svHeld[k] = true; delete svStranded[k]; });
      kinds.forEach(function (kind) { svSeen[kind] = true; });
      svWriteState();
      svPaintUnsaved();
    });
  }

  /* A write that did not land. The two guards are the whole design and each one
     prevents a badge that would be false. */
  function svServerRefused(kinds, keys) {
    svSafely(function () {
      svCollectionIs(kinds, keys);
      keys.forEach(function (k) {
        /* The server is known to hold it: it is on disk from an earlier save
           and only the newest change failed. */
        if (svHeld[k]) { return; }
        /* Nothing has ever succeeded for this collection and this item was here
           before the page ran, so its state is genuinely unknown. */
        if (!svSeen[svKindOf(k)] && svAtLoad[k]) { return; }
        svStranded[k] = true;
      });
      svWriteState();
      svPaintUnsaved();
    });
  }

  /* 🔴 The wording is per collection because the TRUTH is per collection, which
     is the same reason `noticeSave` already carries two sentences. A highlight
     is safe in this browser and merely absent elsewhere. A bookmark has no local
     store at all, so it is gone at the next reload - reproduced, not assumed.
     Neither says "error": nothing is broken and nothing is lost yet. */
  var SV_UNSAVED = {
    h: ['On this device only',
        'This highlight is safe in this browser, but it has not reached the server, '
        + 'so it is not on your other devices.'],
    n: ['On this device only',
        'This note is safe in this browser, but it has not reached the server, '
        + 'so it is not on your other devices.'],
    b: ['Not saved',
        'This bookmark has not reached the server. Unlike a highlight it is not kept '
        + 'in this browser, so it will not be here when you reload the page.']
  };

  /* 🔴 A DIRECT child, never `querySelector('.row')`: the note rows this layer
     adds inside a highlight are also called `row` by the lesson's stylesheet and
     sit EARLIER in the document, so the first match is one of those. The same
     trap is commented at `decorateItems`, which is why this is one function
     rather than the same five lines written twice. */
  function svRowOf(wrap) {
    for (var i = 0; i < wrap.children.length; i++) {
      if (wrap.children[i].classList.contains('row')) { return wrap.children[i]; }
    }
    return null;
  }

  function svMarkRow(row, kind, ids) {
    if (!row) { return; }
    var want = ids.some(function (id) { return !!svStranded[svKey(kind, id)]; });
    var had = row.querySelector('.sv-unsaved');
    if (!want) {
      if (had) { had.parentNode.removeChild(had); row.classList.remove('sv-unsavedrow'); }
      return;
    }
    if (had) { return; }
    var chip = document.createElement('span');
    chip.className = 'sv-unsaved';
    chip.textContent = SV_UNSAVED[kind][0];
    chip.title = SV_UNSAVED[kind][1];
    /* 🔴 The full sentence for a screen reader rather than the three-word chip.
       The scroll affordance shipped a signal sighted readers alone could use and
       was filed for it the same day; this one is text, and the text a screen
       reader gets is the one that actually explains the state. */
    chip.setAttribute('aria-label', SV_UNSAVED[kind][1]);
    /* 🔴 `role="note"` because ARIA does not guarantee that a label on a
       GENERIC element is exposed at all: a bare `<span>` with an `aria-label`
       is allowed to be ignored, and then the sentence above reaches nobody.
       QA raised this on 2026-09-01 and said honestly that they could not check
       Chrome's accessibility tree from their harness. ⚠️ NOR CAN I: this is the
       documented fix rather than a measured one, and it degrades gracefully
       either way, because the chip's visible text is read when the label is
       not. Verifying it in a real accessibility tree is still open. */
    chip.setAttribute('role', 'note');
    row.insertBefore(chip, row.firstChild);
    row.classList.add('sv-unsavedrow');

  /* Repainted from the state, never toggled incrementally: this runs after every
     write result AND after every render the lesson does, and the two orders must
     not be able to disagree. */
  function svPaintUnsaved() {
    var list = document.getElementById('hlList');
    if (list) {
      Array.prototype.forEach.call(list.querySelectorAll('.hl-item[data-item]'),
        function (wrap) {
          /* 🔴 A GROUP wears its head's id and hides the rest in `data-group`. A
             selection across two blocks is stored as two items, and only one of
             them is the row's `data-item`, so asking about the head alone would
             miss a group whose second half is the stranded one. */
          var ids = [wrap.getAttribute('data-item')];
          var g = wrap.getAttribute('data-group');
          if (g) { ids = g.split(','); }
          svMarkRow(svRowOf(wrap), 'h', ids);
        });
    }
    var noteBox = document.getElementById('hlNotes');
    if (noteBox) {

     🔴 Reported to the server rather than to localStorage, because the hub's
     existing read state is per browser and his two Macs have therefore always

  (function recordVisit() {
    if (!S.docId) return;

                          headers: { 'Content-Type': 'application/json' },
                          body: JSON.stringify({ doc: S.docId }) })
        .catch(function () {});
    } catch (e) {}
  }());

     🔴 THE DEFECT THIS CLOSES, and it is measured rather than reasoned. Every
     collection below loads with a GET and saves by POSTing THE WHOLE ARRAY, so
     "the load failed" and "the file is empty" are the same thing from here, and
     the next save replaces the reader's sidecar with whatever this browser
     happens to hold. QA drove it on 2026-09-01: two bookmarks kept, the GET made
     to fail, one more bookmark kept, and the file held one.

     `keep_the_losing_copy` on the server keeps the copy that is about to be
     replaced, so the loss is no longer permanent. This is the other half: the
     replacement does not happen at all.

     placed AFTER the `.catch`, so it is true on the failure path too. It guards

     not this flag and the two must not be confused.

     🔴 AN ABSENT SIDECAR IS A SUCCESS, checked at the source and not assumed.
     `read_bookmarks`, `read_cards`, `read_chatmarks`, `read_chats` and
     `read_additions` all answer 200 with an empty list when the file does not
     exist, so a first-ever visit loads cleanly and the first bookmark on a fresh

     that path would make this guard refuse every reader's first mark, which is

  function loadSidecar(name, path, adopt) {

         said nothing. A save is a deliberate act and every one of them deserves
         an answer.

         both halves: one deliberate press causes one re-read and so gets one
         message, while a burst of automatic saves inside a single re-read window

  /* ---------- a save that REACHED the server and failed there ----------

     writer that swallows a 500 is exactly that, and the manager's ruling of
     2026-09-01 is the part worth keeping in the source: **a defect that
     swallows its own evidence cannot be reported by a user**, so waiting for
     somebody to report it is waiting for the one thing the bug prevents.

     🔴 REPRODUCED 2026-09-01 on a rig, and it was worse than the entry
     predicted in one direction and narrower in another:
       - a HIGHLIGHT on a failing server: nothing is said, and the mark is NOT
         lost on reload in this browser, because the local store holds it. It is
         simply absent from the disk and from every other device, for ever, with
         the making device showing it as safe. A silent divergence, not a loss
         the reader could notice.

  var saveTrouble = {};

     unguarded message would speak every 900ms for as long as the server is
     unwell. Re-arming on success is what keeps a later outage audible. */

         failure needs to be audible against. */

      if (r && r.status === 0) { return r; }

         a defect QA found in the first version of this guard rather than a
         precaution. `937a2e7` shipped with the load-time mirror sharing the
         allowance, so on a lesson the reader had highlighted BEFORE, the page
         load pushed, failed, closed the once-per-outage rule, and every
         highlight they then made was silent. **The readers who lost the message
         were exactly the readers the feature is for.**

         ⚠️ Worse than QA could show, measured here: the load-time failure
         displays NO toast either, so the allowance was spent by a message
         nobody ever saw. Their run could not read the element in time.

         still get one because this path leaves the flag alone. */
      if (background) { return r; }

     success unconditionally, which was harmless while a save could not be
     refused and is a flat contradiction now.

  /* ---------- R15: cards, with their definitions resolved on the spot ----------

     definitions listed right there. We might as well be doing it on the spot
     and recording them instead of waiting for the Obsidian Vault to do it."

     A card is a mark whose colour is `d`. This lists them in their own section
     of the notes panel, and resolves each one's definition once, the first time
     it is seen, through /api/lookup: the glossary first, then MeSH, then
     Wikipedia, all of which already existed and are already cached.

     🔴 The definitions live in their own sidecar, keyed by mark id, and this

     already lost once; a definition can always be fetched again, so it has no
     business sharing a file with the only copy of his highlights.

     and deleting nothing it can name. That is the correct answer while this

     counts UTF-16 code units where a Python slice counts code points, so one
     emoji before the cut makes the two sides disagree. Here the key IS the
     identity and is copied out whole.

     which is a local ordinal and not an identity at all: two Macs both call a
     card `3`, and `merge_marks` renumbers every mark it adopts, so a mark card
     on disk under a key this page does not hold names a mark that has already
     been renumbered to something else. The server's `card_key` argues it in
     full, including what it costs (a lookup, never a row). */

       in flight, and a base computed in the callback would claim agreement to a
       card the server has not been told about. */
    var mine = cardKeys(cards);

                               headers: { 'Content-Type': 'application/json' },

      .catch(function () {})
      .then(noticeSave('cards', 'your cards'))
      .then(function (r) {
        /* 🔴 MOVED ONLY ON A LANDED SAVE, and to what was SENT rather than to
           what came back. A base advanced after a refused save would claim
           agreement to a file this page never wrote, and the next save would
           delete whatever the other Mac had added in between.

           🔴 AND TO WHAT WAS SENT rather than to the file's own keys, for the
           reason the kept notes give: this page does not adopt the merged

           license deleting it on the next save. */
        if (saveLanded(r)) { CARDS_BASE = mine; }

  function cardItems() {

    return svGroups(S.marks().items).filter(function (it) { return it.c === 'd'; });

           because the server happens to append the glossary first. That
           coincidence is worth not relying on now the order is stated in

        var src = (orderSources((r.body && r.body.sources) || [])[0]) || null;

      cardBox.appendChild(p);

      var t = document.createElement('div');
      t.className = 'term';

      } else {

      }

      s.className = 'src';

  /* ---------- marks that live in a conversation, not on the page ----------

  var chatMarks = [];      /* [{c, i, s, e, t}] highlights inside turns */
  var chatBooks = [];      /* [{c, t}] whole conversations */

  /* 🔴 THE KEYS THIS PAGE LAST AGREED THE FILE HELD, exactly as for bookmarks,
     and 🔴 TWO OF THEM because this sidecar carries two independent
     collections. A single base would let a page that knew the marks be treated
     as knowing the bookmarked conversations, and it would then delete the half
     it had never seen.

     `null` means "has agreed to nothing", which the server reads as a client
     too old to say and answers by adopting everything and deleting nothing. */
  /* 🔴 `null` until the conversations have actually been loaded, and that is
     not the same as `[]`. Null says "this page has agreed to nothing", so a
     save before the load adopts everything on disk instead of deleting it. */
  var CHATS_BASE = null;
  var CM_BASE = null;
  var CB_BASE = null;

  /* 🔴 THESE MUST AGREE WITH `chatmark_key` AND `chatbook_key` IN THE SERVER,
     CHARACTER FOR CHARACTER, truncation included: `write_chatmarks` cuts `t` to
     400 for a mark and 300 for a conversation BEFORE storing it, so a page
     keying the untruncated text would send a base matching nothing and the
     server would adopt the reader's own row back as a stranger's. Pinned by a
     test that runs over-long text through both sides. */
  /* ---------- cutting text the way the OTHER side cuts it ----------

     🔴 `String.prototype.slice` counts UTF-16 CODE UNITS and Python's `[:n]`
     counts CODE POINTS, so one astral character (an emoji, a few CJK extension
     characters) before the cut makes the two sides spell one key two different
     ways. Measured 2026-09-04, both languages, before this was written down:

       node   "a😀b".slice(0, 2)   ->  "a\ud83d"   half an emoji
       python "a😀b"[:2]           ->  "a😀"        the whole one

     🔴 WHAT IT COSTS, and it is not a duplicate: the base is the only thing the
     browser keys. The server keys the disk rows and the sent rows with its own
     function, so a divergent base cannot fuse two rows. What it does is make a
     REMOVAL SILENTLY FAIL TO LAND: the reader presses Remove, the save is
     accepted, and the row is adopted straight back off the disk because the
     server cannot find it in the base.

     🟢 `Array.from` iterates by code point, so this is Python's cut exactly.
     ⚠️ ALL THREE KEYS USE IT OR NONE DO. They were filed as one entry for that
     reason: a fix that moved one of them would leave two spellings of the same
     idea in one file, which is how the next reader gets it wrong. */
  function cutText(t, n) {
    var s = String(t || '');
    /* The common case never allocates an array: a string with no astral
       character has as many code units as code points, and if it is already
       short enough there is nothing to cut. */
    if (s.length <= n) return s;
    return Array.from(s).slice(0, n).join('');
  }

  function cmKey(x) {
    var n = ['c', 'i', 's', 'e'].map(function (f) {
      return (typeof x[f] === 'number' && isFinite(x[f])) ? Math.trunc(x[f]) : null;
    });
    if (n.indexOf(null) !== -1) return null;
    var t = cutText(x.t, 400);
    if (!t) return null;
    return 'cm:' + n.join(':') + ':' + t;
  }

  function cbKey(x) {
    if (typeof x.c !== 'number' || !isFinite(x.c)) return null;
    var t = cutText(x.t, 300);
    if (!t) return null;
    return 'cb:' + Math.trunc(x.c) + ':' + t;
  }

  function keysOf(rows, fn) {
    return (rows || []).map(fn).filter(function (k) { return k !== null; });
  }

  /* 🔴 A CONTROL REMOVES THE ROW IT DREW, AND NEVER A SECOND ONE. One rule,
     shared by the bookmarks and the bookmarked conversations, because they had
     one defect: QA found it against `dbe5c2b` and the same shape was recorded
     in `chatbook_key` while the chat half was being written.

     🔴 THE CAUSE IS A MISMATCH OF GRAIN, AND NEITHER HALF WAS WRONG ON ITS OWN.
     The server keys a bookmark `(b, t)` and a conversation `(c, t)` on purpose,
     so that two devices disagreeing about which paragraph is block 5 -- or
     which conversation is chat 1 -- produce a DUPLICATE rather than a deletion.
     This page removed by `b` and by `c` alone, which was correct while one
     block could hold only one row and became wrong the moment a merge could
     land two. One click then took both, and the save behind it carried a base
     naming both, so the other device's row left the file as well as the panel.

     ⚠️ REMOVING BY THE SERVER'S KEY WOULD NOT HAVE BEEN ENOUGH: a row whose `t`
     is empty has no key at all -- `bmKey` and `cbKey` both return null for it --
     and a Remove button that cannot delete an unkeyable row is a new defect in
     place of the old one. So the panel removes the OBJECT it drew, which is
     exact, needs no key, and cannot over-reach by construction. */
  function dropRow(rows, row) {
    var i = rows.indexOf(row);
    /* 🔴 -1 MEANS THE ARRAY WAS REPLACED UNDER THE CONTROL -- a sidecar load
       landing between the render and the click -- and the answer to that is to
       delete NOTHING. The render that follows redraws from the state, so the
       reader sees what is really there instead of a click that quietly took an
       unrelated row with it. It fails toward keeping, like everything else in
       these two collections. */
    return i < 0 ? rows.slice() : rows.slice(0, i).concat(rows.slice(i + 1));
  }

  /* The other half, for the two controls that name a BLOCK or a CONVERSATION
     rather than a row: the selection bar's Bookmark button and the chat
     header's. They still remove exactly one row, and `inFront` picks the one
     the reader is actually looking at out of however many a merge has left
     sitting on that block or that chat. */
  function pickRow(rows, onTarget, inFront) {
    var there = rows.filter(onTarget);
    if (!there.length) return null;
    for (var i = 0; i < there.length; i++) {
      if (inFront(there[i])) return there[i];
    }
    /* Nothing here matches what is on screen, so every row on this target was
       made when it read differently. Take the first: pressing again takes the
       next, and the marker clears when the last one goes. Removing the lot in
       one press is the defect this function exists to end. */
    return there[0];
  }

  function saveChatMarks() {
    if (!maySaveSidecar('chatmarks', 'chat highlights')) { return sidecarRefused('chat highlights'); }
    var agreed = { marks: CM_BASE, chats: CB_BASE };
    var mineMarks = keysOf(chatMarks, cmKey);
    var mineChats = keysOf(chatBooks, cbKey);
    return api('/api/chatmarks', { method: 'POST',
                                   headers: { 'Content-Type': 'application/json' },
                                   body: JSON.stringify({ doc: S.docId, marks: chatMarks,
                                                          chats: chatBooks,
                                                          base: agreed }) })
      .catch(function () {})
      .then(noticeSave('chatmarks', 'that chat highlight'))
      .then(function (r) {
        /* 🔴 MOVED ONLY ON A LANDED SAVE, and to what was SENT rather than to
           what came back. A base advanced after a refused save would claim
           agreement to a file this page never wrote, and the next save would
           delete whatever the other device added in between. */
        if (saveLanded(r)) { CM_BASE = mineMarks; CB_BASE = mineChats; }
        return r;
      });
  }

  /* Offset of a point inside a .txt element, counted in that element's own text,
     which is exactly the turn's text. The same trick the page uses: a range from
     the start of the element to the point, measured by its string length. */
  function offsetInTxt(txt, node, off) {
    var r = document.createRange();
    r.selectNodeContents(txt);
    try { r.setEnd(node, off); } catch (e) { return -1; }
    return r.toString().length;
  }

  function paintChatTurn(txt, turnIndex, chatId) {
    var mine = chatMarks.filter(function (m) { return m.c === chatId && m.i === turnIndex; });
    if (!mine.length) return;
    var len = txt.textContent.length;
    /* Painted last range first, so an earlier one's offsets are still valid when
       it is reached: splitting text later in the string cannot move it. */
    mine.slice().sort(function (a, z) { return z.s - a.s; }).forEach(function (m) {
      if (m.s < 0 || m.e > len || m.e <= m.s) return;
      var walker = document.createTreeWalker(txt, NodeFilter.SHOW_TEXT, null);
      var pos = 0, node;
      while ((node = walker.nextNode())) {
        var n = node.data.length;
        if (pos + n >= m.e && pos <= m.s) {
          var range = document.createRange();
          range.setStart(node, m.s - pos);
          range.setEnd(node, m.e - pos);
          var el = document.createElement('mark');
          el.className = 'sv-chl';
          try { range.surroundContents(el); } catch (e) {}
          return;
        }
        pos += n;
      }
    });
  }

  /* 🔴 `:not(.pending)` IN ALL FOUR PLACES BELOW, and the reason is one bug.
     A chat mark is stored as an INDEX into this walk, and the "Thinking." box
     is a `.sv-turn` with a `.txt` child, so it was in the walk. Mark it while an
     answer is in flight and the index names the pending box; when the answer
     lands, `renderThread` replaces that box with a real turn AT THE SAME INDEX,
     and the mark paints on the first characters of an answer the reader never
     asked to highlight and never saw.

     🟢 REPRODUCED IN A BROWSER 2026-09-09, which nobody had done: the entry
     rested on four code readings that agreed, and the proof list said to close
     it if the bar did not actually appear. It does. Selecting the nine
     characters of "Thinking." raises the mini bar with its Highlight button,
     and the pending box sits in the walk at index 1 of 2.

     ⚠️ The pending box is always appended LAST, so it never shifts the index of
     a real turn. That is why this is a wrong highlight and not data loss, and
     it is also why excluding it cannot renumber anything that already exists. */
  function paintChatMarks() {
    if (!openChat || !pThread) return;
    Array.prototype.forEach.call(pThread.querySelectorAll(CHAT_TXT),
      function (txt, i) { paintChatTurn(txt, i, openChat.id); });
  }

  function addChatHighlight() {
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount || sel.isCollapsed || !openChat) return false;
    var r = sel.getRangeAt(0);
    var start = r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentNode;
    var txt = start && start.closest ? start.closest(CHAT_TXT) : null;
    if (!txt) return false;
    var boxes = Array.prototype.slice.call(pThread.querySelectorAll(CHAT_TXT));
    var i = boxes.indexOf(txt);
    if (i < 0) return false;
    var s = offsetInTxt(txt, r.startContainer, r.startOffset);
    var e = offsetInTxt(txt, r.endContainer, r.endOffset);
    if (s < 0 || e < 0 || e <= s) return false;
    /* 🔴 cutText, not .slice(0, 400). A raw slice cuts by UTF-16 code UNIT, so
       a cut landing inside an emoji stores a LONE SURROGATE: half a character,
       at the end of the text, which then travels through JSON, display and
       search. It never caused the key divergence the three keys were fixed
       for (a string of 400 units has at most 400 code points, so both sides
       agree on a mangled string as happily as a clean one), which is why it
       was left out of that unit and given its own. */
    chatMarks.push({ c: openChat.id, i: i, s: s, e: e,
                     t: cutText(txt.textContent.slice(s, e), 400),
                     at: new Date().toISOString() });
    sel.removeAllRanges();
    renderThread();
    saveChatMarks().then(function (r) {
      if (!saveLanded(r)) { return; }
      S.toast('Highlighted in this chat.');
    });
    return true;
  }

  function chatIsBookmarked(id) {
    return chatBooks.some(function (x) { return x.c === id; });
  }

  /* Opening a bookmarked conversation from the Bookmarks list. It has to switch
     the sidebar to the chat side as well as load the conversation, since the
     list it was clicked from lives on the notes side. */
  /* 🔴 THE ROW IS THE ARGUMENT NOW, NOT ITS `c`. Passing the ordinal was the
     defect: `c` names a conversation only on the device that made it, so a
     bookmark adopted from the other Mac opened whatever this Mac happened to
     hold at that number. Nothing warned, and the conversation that opened was a
     real one of the reader's, which reads as having pressed the wrong row.

     🟢 The identity is tried first and the ordinal is the FALLBACK, for rows
     written before `k` existed. ⚠️ And the fallback is guarded by the TITLE:
     without that guard it is the original bug, because an ordinal on its own is
     exactly what cannot be trusted. A row that can be named neither way says so
     rather than opening something. */
  function openSavedChat(row) {
    var want = (row && typeof row === 'object') ? row : { c: row };
    var c = null;
    if (want.k) {
      c = chats.filter(function (x) { return chatKey(x) === want.k; })[0] || null;
    }
    if (!c && want.c !== undefined && want.c !== null) {
      c = chats.filter(function (x) { return x.id === want.c; })[0] || null;
      /* The other Mac's ordinal landing on one of ours. A title that disagrees
         is the only evidence available here, and it is enough to refuse. */
      if (c && want.t && String(chatTitle(c) || '') !== String(want.t)) { c = null; }
    }
    if (!c) { S.toast('That conversation is not saved on this Mac.'); return; }
    openChat = c;
    showChat();
    renderThread();
    showFocus(c.segments);
  }

  function paintChatBookmarkButton() {
    var b = panel && panel.querySelector('[data-bmchat]');
    if (!b) return;
    b.hidden = !openChat;
    b.setAttribute('aria-pressed', (openChat && chatIsBookmarked(openChat.id)) ? 'true' : 'false');
    b.textContent = (openChat && chatIsBookmarked(openChat.id)) ? 'Bookmarked' : 'Bookmark';
  }

  function toggleChatBookmark() {
    if (!openChat) return;
    var id = openChat.id;
    var title = chatTitle(openChat) || 'A conversation';
    var here = function (x) { return x.c === id; };
    /* 🔴 THE ADD IS STILL PER CONVERSATION, and that is not the old rule left
       lying about: `chatbook_key` rests on this page never making two bookmarks
       on one `c`, and its docstring names a client that allows them as the
       change that would invalidate the key. A merge may deliver two rows here;
       this page may not create them. */
    var gone = pickRow(chatBooks, here,
                       function (x) { return String(x.t || '') === title; });
    if (gone) {
      chatBooks = dropRow(chatBooks, gone);
    } else {
      /* 🔴 `k` IS THE ONE THAT SURVIVES THE TRIP TO THE OTHER MAC. `c` is a
         per-device ordinal, so a row adopted from the other Mac named ITS chat
         3 and opening it here opened OUR chat 3, silently, and the conversation
         that opened was a real one of the reader's, which is what made it hard
         to notice. `c` is kept because `chatbook_key` rests on it and because a
         row written before this still has only that. */
      chatBooks.push({ c: id, k: chatKey(openChat), t: title,
                       at: new Date().toISOString() });
    }
    var others = chatBooks.filter(here).length;
    saveChatMarks().then(function (r) {
      if (!saveLanded(r)) { return; }
      /* 🔴 SAID OUT LOUD WHEN ONE PRESS DOES NOT CLEAR THE BUTTON, because the
         alternative is a control that looks broken: the header still reads
         Bookmarked and the reader has no way to know why. */
      S.toast(!gone ? 'Chat bookmarked.'
              : others ? 'Bookmark removed. This conversation still has another bookmark on it.'
                       : 'Bookmark removed.');
    });
    renderBookmarks();
    paintChatBookmarkButton();
  }

  /* The lookup for a card with no mark on the page: chat cards and, since R44,
     typed ones. One implementation, because the retry button calls it too. */
  function lookupMarkless(key, quiet) {
    if (!cards[key] || cardsBusy[key]) return;
    cardsBusy[key] = true;
    renderCards();
    api('/api/lookup?q=' + encodeURIComponent(cards[key].term))
      .then(function (r) {
        /* 🔴 The SAME order the popover and the mini bar use, so "the
           definition" means one thing everywhere. This read `sources[0]`
           straight off the wire, which agrees with EH's order today only
           because the server happens to append the glossary first. That
           coincidence is worth not relying on now the order is stated in
           one place, and a card is the copy that reaches the vault, so it
           is the worst place for two orders to drift apart quietly. */
        var src = (orderSources((r.body && r.body.sources) || [])[0]) || null;
        cards[key].def = src ? String(src.text || '') : '';
        cards[key].source = src ? String(src.source || src.title || '') : '';
        cards[key].url = src ? String(src.url || '') : '';
        delete cardsBusy[key];
        renderCards();
        saveCards();
        if (!quiet) {
          S.toast(cards[key].def ? 'Card made, with its definition.' : 'Card made. Nothing found to define it with.');
        }
      })
      .catch(function () { delete cardsBusy[key]; renderCards(); saveCards(); });
  }

  function markless(term, from) {
    term = String(term || '').replace(/\s+/g, ' ').trim();
    if (!term) return;
    var key = 'c' + Date.now().toString(36);
    cards[key] = { term: term, def: '', source: '', url: '', from: from,
                   at: new Date().toISOString() };
    lookupMarkless(key);
  }

  /* R5: a card made from inside a chat answer. No mark to key on, so it issues
     its own key and carries from:'chat' so the list can tell them apart. */
  function cardFromChat(term) { markless(term, 'chat'); }

  /* Anything marked as a card and not yet resolved gets resolved. Serial
     rather than all at once: a fresh lesson could have a dozen, and the lookup
     goes out to MeSH and Wikipedia.

     🔴 IT USED TO RESOLVE THE HEAD AND STOP. The comment above said "serial",
     and serial is what it looked like, but nothing re-invoked this after a
     success: `fillCards` has two callers, the load path and `S.onChange` on the
     MARKS store, and a resolved card renders and calls `saveCards()`, which
     never touches marks. So the second pending card waited for another page
     load, the third for the one after that.

     ⚠️ THE REASON IT SURVIVED ITS OWN PROOF: the scenario it was proved on had
     two windows with one card each, so each side lacked EXACTLY ONE definition,
     and one is the number the old code handled. A proof built on the smallest
     case cannot tell "resolves the pending set" from "resolves the first
     pending item". The ordinary case after a real spell of work on two machines
     is several at once. Found 2026-09-09 by `study-hub-qa`, from the code.

     🟢 Still serial: the continuation runs inside the previous lookup's `then`,
     so there is never more than one request in flight, and `cardsBusy` still
     guards each card individually. */
  function fillCards() {
    if (!cardsLoaded) return;
    var pending = cardItems().filter(function (it) {
      return !cards[String(it.id)] && !cardsBusy[String(it.id)];
    });
    if (pending.length) { resolveCard(pending[0], false, fillCards); }
  }

  /* ---------- R7: bookmarks ----------

     Asked 2026-08-13: "I wonder if we should also add bookmarks where I can
     bookmark a whole paragraph or image or a section or a chat."

     🔴 A bookmark is a pointer, not a highlight with different styling. A
     highlight is a range and exists to say something about the words inside it;
     a bookmark names a whole block and exists to be come back to. So it has its
     own store, its own sidecar and its own list, and the marks file is untouched.

     Bookmarking a CHAT is not built. It is a different target with a different
     store, and doing it badly here would mean pretending a chat is a block. */

  var bookmarks = [];
  var bmBox = null;

  /* 🔴 THE KEYS THIS PAGE LAST AGREED THE FILE HELD, which is the whole of what
     lets the server tell a DELETION from a bookmark this page has simply never
     seen. Without it every save is "here is the entire truth", and on two
     devices that is the deletion the marks merge was built to stop.

     🔴 SEEDED FROM THE LOAD AND MOVED ONLY BY THIS PAGE'S OWN SAVES. `null`
     means "has agreed to nothing", which the server reads as a client too old
     to say and answers by adopting everything and deleting nothing. That is the
     correct answer while this page has never managed to read the file. */
  var BM_BASE = null;

  /* 🔴 IT MUST AGREE WITH `bookmark_key` IN THE SERVER, CHARACTER FOR
     CHARACTER, and the 400 is the part that is easy to miss: `write_bookmarks`
     truncates `t` before it stores it, so a page keying the untruncated text
     would send a base that matches nothing on a long paragraph, and the
     server would adopt the reader's own bookmark back as a stranger's. Pinned
     by a test that runs a >400-character block through both sides. */
  function bmKey(x) {
    if (typeof x.b !== 'number' || !isFinite(x.b)) return null;
    var t = cutText(x.t, 400);
    if (!t) return null;
    return 'b:' + Math.trunc(x.b) + ':' + t;
  }

  function bmKeys(rows) {
    return (rows || []).map(bmKey).filter(function (k) { return k !== null; });
  }

  function saveBookmarks() {
    var sent = svKeys('b', bookmarks.map(function (x) { return x.b; }));
    var agreed = BM_BASE;
    var mine = bmKeys(bookmarks);
    if (!maySaveSidecar('bookmarks', 'bookmarks')) {
      /* 🔴 A refusal made HERE still leaves a bookmark the server does not have,
         and it is the likeliest way to strand one: the guard refuses precisely
         because this page never managed to READ the file, which is the same
         outage seen one step earlier. */
      svServerRefused(['b'], sent);
      return sidecarRefused('bookmarks');
    }
    return api('/api/bookmarks', { method: 'POST',
                                   headers: { 'Content-Type': 'application/json' },
                                   body: JSON.stringify({ doc: S.docId, marks: bookmarks,
                                                          base: agreed }) })
      .catch(function () {})
      .then(noticeSave('bookmarks', 'that bookmark'))
      .then(function (r) {
        if (saveLanded(r)) {
          svServerHolds(['b'], sent);
          /* 🔴 MOVED ONLY ON A LANDED SAVE, and to what was SENT rather than to
             what came back. A base advanced after a refused save would claim
             agreement to a file this page never wrote, and the next save would
             delete whatever the other device had added in between. */
          BM_BASE = mine;
        } else { svServerRefused(['b'], sent); }
        return r;
      });
  }

  function blockEl(b) { return document.querySelector('.wrap [data-hb="' + b + '"]'); }

  function paintBookmarks() {
    Array.prototype.forEach.call(document.querySelectorAll('.wrap [data-hb].sv-bm'),
      function (el) { el.classList.remove('sv-bm'); });
    bookmarks.forEach(function (bm) {
      var el = blockEl(bm.b);
      if (el) el.classList.add('sv-bm');
    });
  }

  function goToBookmark(bm) {
    var el = blockEl(bm.b);
    if (!el) { S.toast('That paragraph is no longer on the page.'); return; }
    /* 🔴 Not behavior:'smooth'. Smooth scrolling is animation-driven, and this
       project has already been caught twice by animation machinery not running
       in a tab that is not painting: rAF never fired for the focus rectangles,
       and ResizeObserver never delivered its initial callback. Measured here
       too, from a scroll position of 3000: smooth moved nothing, instant landed
       at 7. Jumping to a bookmark should also just arrive. */
    el.scrollIntoView({ block: 'center' });
    el.classList.remove('sv-bmflash');
    /* Reading offsetWidth restarts the animation; without it a second visit to
       the same bookmark flashes nothing. */
    void el.offsetWidth;
    el.classList.add('sv-bmflash');
    window.setTimeout(function () { el.classList.remove('sv-bmflash'); }, 1600);
  }

  function renderBookmarks() {
    if (!bmBox) return;
    bmBox.innerHTML = '';
    if (!bookmarks.length && !chatBooks.length) {
      var p = document.createElement('p');
      p.className = 'empty';
      p.textContent = 'Nothing yet. Select anything in a paragraph and press Bookmark, or press Bookmark at the top of a chat, to be able to come back to it.';
      bmBox.appendChild(p);
      return;
    }

    /* Bookmarked conversations first: they are the shorter list and the one you
       cannot find by scrolling the page. */
    chatBooks.forEach(function (cb) {
      var wrap = document.createElement('div');
      wrap.className = 'sv-bmark sv-bmchat';
      var go = document.createElement('button');
      go.type = 'button';
      go.className = 'go';
      go.textContent = cb.t || 'A conversation';
      go.addEventListener('click', function () { openSavedChat(cb); });
      wrap.appendChild(go);
      var row = document.createElement('div');
      row.className = 'row';
      var w = document.createElement('span');
      w.className = 'where';
      w.textContent = 'chat';
      row.appendChild(w);
      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'mini';
      del.textContent = 'Remove';
      del.addEventListener('click', function () {
        /* The row it drew, not every row sharing this conversation's id. */
        chatBooks = dropRow(chatBooks, cb);
        renderBookmarks(); paintChatBookmarkButton(); saveChatMarks();
      });
      row.appendChild(del);
      wrap.appendChild(row);
      bmBox.appendChild(wrap);
    });

    if (!bookmarks.length) return;
    bookmarks.slice().sort(function (a, z) { return a.b - z.b; }).forEach(function (bm) {
      var wrap = document.createElement('div');
      wrap.className = 'sv-bmark';
      /* 🔴 THE BLOCK, WHICH IS NO LONGER THE ROW'S IDENTITY and can repeat
         across two rows since the merge shipped. It is left as the block on
         purpose: its only reader is `svPaintUnsaved`, and every bookmark on a
         block travels in ONE POST, so two rows there always share a save state
         and a per-block chip cannot say anything false about either. **The

    function setH() {

    /* 🔴 Measured when the PANEL OPENS, not at install. At install the panel is
       hidden and offsetHeight is 0, so the section heads would stick at 0 and
       slide under the nav. A ResizeObserver alone is not enough either: its
       callbacks ride the rendering pipeline, so it never fires in a

    setH();

  /* ---------- R46: the export carries everything ----------

     Asked 2026-08-16: "we especially need to make sure that we have export
     functions for our notes, our highlights, and our cards", because the vault
     automation is EH's own integration and nobody else will have it.

     The lesson's export covered notes and highlights only; cards were nowhere
     in it, and highlights in HIS OWN added colours appeared only inside the
     machine block, invisible to a reader. The lesson's builder cannot be
     reached from here (closure), so these capture-phase handlers stop the
     click before the lesson's own listener and write the fuller file. The
     machine block keeps the exact "highlight-data v1" marker and the
     items/notes keys, so the lesson's own Import reads the new files. */

  /* 🔴 The shell's grouper, never a copy of it. One selection is one highlight
     (EH, 2026-08-30), and the fold that makes that true lives in shell.html
     beside the store it folds. A second implementation here would drift from
     that one the first time either changed, and the drift would show up as an
     export that disagrees with the notebook it was exported from. The fallback
     is the OLD behaviour, unchanged, for a page whose shell predates this. */
  function svGroups(list) {
    return (S && S.groupMarks) ? S.groupMarks(list)
      : (list || []).slice().sort(function (a, z) { return (a.b - z.b) || (a.s - z.s); });
  }

  function fullExportMd() {
    var m = S.marks();
    var rows = cardRows();
    var nHl = svGroups(m.items).length;
    var L = [];
    L.push('# Highlights: ' + (S.title || S.docId));
    L.push('');
    L.push('Exported ' + new Date().toISOString().slice(0, 10) + '. ' +
           m.notes.length + (m.notes.length === 1 ? ' note, ' : ' notes, ') +
           nHl + (nHl === 1 ? ' highlight, ' : ' highlights, ') +
           rows.length + (rows.length === 1 ? ' card, ' : ' cards, ') +
           (bookmarks.length + chatBooks.length) +
           ((bookmarks.length + chatBooks.length) === 1 ? ' bookmark.' : ' bookmarks.'));
    L.push('');
    L.push('Import this same file from Settings to restore the notes and highlights.');
    L.push('');

    if (m.notes.length) {
      L.push('## Notes');
      L.push('');
      m.notes.slice().sort(function (a, z) { return (a.ts || 0) - (z.ts || 0); }).forEach(function (nt) {
        if (nt.text) L.push('- ' + nt.text.replace(/\n+/g, ' ').trim());
      });
      L.push('');
    }

    /* Grouped by the palette itself, so his own colours head their own
       sections instead of vanishing. Retired colours still group, because
       their highlights still exist. */
    var sorted = svGroups(m.items);
    var grouped = {};
    function group(title, arr) {
      if (!arr.length) return;
      L.push('## ' + title);
      L.push('');
      arr.forEach(function (it) {
        L.push('> ' + it.t.replace(/\s+/g, ' ').trim());
        if (it.n) { L.push(''); L.push('**Note:** ' + it.n.replace(/\n/g, ' ')); }
        L.push('');
      });
    }
    (palette || []).forEach(function (c) {
      var arr = sorted.filter(function (it) { return (it.c || 'k') === c.id; });
      arr.forEach(function (it) { grouped[String(it.id)] = true; });
      group(c.id === 'd' ? 'Cards to make' : c.label, arr);
    });
    group('Other colours', sorted.filter(function (it) { return !grouped[String(it.id)]; }));

    if (rows.length) {
      L.push('## Cards');
      L.push('');
      rows.forEach(function (row) {
        var d = row.got && row.got.def ? row.got.def.replace(/\s+/g, ' ').trim() : '';
        L.push('- **' + row.term + '**' + (d ? ': ' + d : ''));
        if (row.got && row.got.source) L.push('    - ' + row.got.source + (row.got.url ? ' \u00B7 ' + row.got.url : ''));
      });
      L.push('');
    }

    if (bookmarks.length || chatBooks.length) {
      L.push('## Bookmarks');
      L.push('');
      bookmarks.forEach(function (bm) {
        var t = (S.blockText(bm.b) || '').replace(/\s+/g, ' ').trim();
        if (t.length > 180) t = t.slice(0, 177) + '\u2026';
        if (t) L.push('- ' + t);
      });
      chatBooks.forEach(function (cb) {
        L.push('- Chat: ' + (cb.t || 'a conversation'));
      });
      L.push('');
    }

    L.push('---');
    L.push('');
    L.push('<!-- highlight-data v1, do not edit below this line -->');
    L.push('');
    L.push('```' + 'json');
    L.push(JSON.stringify({ doc: S.docId, items: m.items, notes: m.notes,
                            cards: cards, bookmarks: bookmarks, chatBookmarks: chatBooks }));
    L.push('```');
    L.push('');
    return L.join('\n');
  }

  (function completeTheExport() {
    function anything() {
      var m = S.marks();
      return m.items.length || m.notes.length || cardRows().length ||
             bookmarks.length || chatBooks.length;
    }
    document.addEventListener('click', function (e) {
  /* 🔴 THE FALLBACK THAT WAS NEVER TRIED, and the measurement is what
     makes it a defect rather than a preference: on the tailnet origin the old
     code made **zero** `execCommand` attempts before toasting "Copy blocked
     here". It did not try and then report failure; it reported failure without
     trying. EH reads over Tailscale, which is not a secure context, so the Copy
     button has never once worked for him.

     🔴 The ruling that refused this has expired with its condition. It
     said: do not route round the missing secure context a fourth time, because
     the certificate will close it for free. EH parked the certificate on
     2026-08-31, so there is nothing coming to close it, and this is the only
     fix left.

     ⚠️ It is a COPY of `fallbackCopy` in `shell.html`, deliberately,
     and the seam is the same one `window.STUDY` exists for: the shell's script
     is an IIFE, so its `fallbackCopy` is not a global and the layer cannot
     reach it. The alternative is exporting a clipboard helper across the
     STUDY boundary, which is a wider change than this is worth; if a third
     copy ever appears, that is the moment to move it. `execCommand` is
     deprecated and is the ONLY route without a secure context. */
  function copyByTextarea(md) {
    var ta = document.createElement('textarea');
    ta.value = md;
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    ta.remove();
    /* Only NOW is the old message honest: it is said after an attempt. */
    S.toast(ok ? 'Copied. Paste it anywhere.'
               : 'Copy blocked here. Use Export instead.');
    return ok;
  }

      var t = e.target;
      if (!t || !t.closest) return;
      var which = t.closest('#hlExport') ? 'export' : (t.closest('#hlCopy') ? 'copy' : null);
      if (!which) return;
      e.stopPropagation();      /* the lesson's own handler must not also run */
      e.preventDefault();
      if (!anything()) return S.toast('Nothing to export yet.');
      var md = fullExportMd();
      if (which === 'copy') {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(md)
            .then(function () { S.toast('Copied. Paste it anywhere.'); })
            .catch(function () { copyByTextarea(md); });
        } else { copyByTextarea(md); }
        return;
      }
      try {
        var url = URL.createObjectURL(new Blob([md], { type: 'text/markdown' }));
        var a = document.createElement('a');
        a.href = url; a.download = S.docId + '-highlights.md';
        document.body.appendChild(a); a.click(); a.remove();
        window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        S.toast('Saved ' + S.docId + '-highlights.md');
      } catch (err) {
        S.toast('Save unavailable here. Use Copy instead.');
      }
    }, true);
  }());

  /* ---------- R38: the quoted passage takes you back to it ----------

     Asked 2026-08-15: "when I have a chat based on a selection at the top of
     the chat, it says 'In' and then it quotes the selection, but I can't click
     it to jump to that selected area."

     The History rows have done this since R5. The subtitle, which is the thing
     actually on screen while the answer is being read, did not. One function
     now, used by both, so they cannot drift. */

  function chatBlock(c) {
    if (!c) return null;
    var want = (c.term || '').replace(/\s+/g, ' ').trim().slice(0, 40);
    /* 🔴 A conversation saved before R5 has a quoted passage and no segments at
       all, and three of the ones on disk are like that. The words are still the
       words, so look for them rather than showing a dead quote. */
    if (!c.segments || !c.segments.length) {
      if (!want) return null;
      for (var j = 0; S.blockAt(j); j++) {
        var old = S.blockAt(j);
        if (old.textContent.replace(/\s+/g, ' ').indexOf(want) >= 0) {
          return { el: old, moved: true };
        }
      }
      return null;
    }
    var seg = c.segments[0];
    var el = S.blockAt(seg.b);
    var flat = el ? el.textContent.replace(/\s+/g, ' ') : '';
    if (el && (!want || flat.indexOf(want) >= 0)) return { el: el, moved: false };
    if (!want) return el ? { el: el, moved: false } : null;

    /* 🔴 The index went stale. A chat's segments are not re-anchored the way a
       mark is, and rewriting a table now changes how many blocks there are, so
       this went from unlikely to ordinary. Find the words again, searching
       outward from where they were, which is what reanchor() does for marks. */
    var order = [], i = 0;
    while (S.blockAt(i)) { order.push(i); i++; }
    order.sort(function (a, z) { return Math.abs(a - seg.b) - Math.abs(z - seg.b); });
    for (i = 0; i < order.length; i++) {
      var cand = S.blockAt(order[i]);
      if (cand && cand.textContent.replace(/\s+/g, ' ').indexOf(want) >= 0) {
        return { el: cand, moved: true };
      }
    }
    return el ? { el: el, moved: true } : null;
  }

  /* `leave` says whether going there is the POINT of the click. It is for the
     subtitle, which means "take me to this passage". It is not for a History
     row, which means "open this conversation" and only scrolls the lesson
     behind as a courtesy.

     🔴 The distinction only exists because of the phone. Below 900px the pane
     IS the screen and the body is pinned behind it, so a jump has to close the
     pane to be a jump at all, and a History row that closed the pane would
     shut the conversation it was just asked to open. */
  function jumpToChat(c, leave) {
    var found = chatBlock(c);
    if (!found) return false;
    var phone = window.matchMedia && window.matchMedia('(max-width: 899px)').matches;
    /* Close before drawing: closePanel clears the rectangle on its way out. */
    if (phone && leave) closePanel();
    /* The rectangle is drawn from the stored offsets, so it is only honest when
       the stored index is still the right one. */
    if (!found.moved) showFocus(c.segments);

    /* 🔴 THE SCROLL WAITS FOR THE UNLOCK, NOT FOR THE CLOSE, and this is the
       same repair the shell's Jump-to took on 2026-09-01, for the same reason,
       measured again here rather than assumed. `closePanel()` above only sets
       `panel.hidden`. The unlock is `lockPage(false)`, which this file reaches
       through the `spaceWatch` MutationObserver, so it lands a task LATER;
       until it does the body is `position: fixed` and there is nothing to
       scroll.

       QA drove this caller at a genuine 382px with pass-through recorders,
       sentinel-tested before use, three starting positions and both
       directions. Every run recorded the same two calls six milliseconds
       apart:

         scrollIntoView   body: fixed, top: -Npx, html.sv-locked
         scrollTo(0, N)                                     (+6ms)

         started 300     the passage 10,876px below   ended 300
         started 15,000  the passage  3,824px above   ended 15,000
         started 1,200   the passage  9,976px below   ended 1,200

       🔴 So reordering these two calls, or delaying the scroll by a few
       milliseconds, would still fail: the second call is `lockPage(false)`
       restoring the position the jump had just tried to leave. Waiting on the
       class waits out both, because `lockPage` removes `sv-locked` and calls
       `scrollTo` synchronously in one task, and a MutationObserver callback is
       delivered on the microtask checkpoint after that task.

       ⚠️ `S.whenUnlocked` is the SHELL's, exported for this caller; see the
       comment on the export for why it is shared rather than copied, and for
       why there is no fallback. 🔴 That comment also carries the window this
       one used to understate: `render()` composes both files into one document
       so a TAB always holds a matched pair, but the saves ARE the deploy here,
       so a request landing between them composes a new layer against an old
       shell for as long as a builder takes between two saves.

       🟢 NOT `behavior: 'smooth'`, and QA's own control is why this is a
       consistency change rather than a second fix. At 1240px they measured
       smooth moving the page 0px while an instant scroll landed at 6,962, and
       said plainly that the wide failure is their non-painting harness rather
       than a reader's tab. So smooth is dropped to match the sibling and to
       keep this verifiable, and 🔴 it is NOT a second cause of the defect: the
       lock is the defect at narrow width.

       ⚠️ A CORRECTION TO THE ENTRY THAT ASKED FOR THIS, checked rather than
       repeated: it says this is "the last caller still using it" and that is
       not quite true. `behavior: 'smooth'` still lives on the highlight panel's
       rail buttons a few hundred lines above, and it is deliberately LEFT
       there: that one scrolls a CONTAINER's own list, not the document, so the
       page lock cannot reach it and no measurement says it is wrong for a
       reader. What is true, and is what the entry meant, is that this was the
       last `scrollIntoView` in the reader still asking for smooth. */
    if (!phone || leave) {
      S.whenUnlocked(function () {
        found.el.scrollIntoView({ block: 'center' });
      });
    }
    return true;
  }

  pSub.addEventListener('click', function () {
    if (pSub.classList.contains('sv-jump')) jumpToChat(openChat, true);
  });
  pSub.addEventListener('keydown', function (e) {
    if (!pSub.classList.contains('sv-jump')) return;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); jumpToChat(openChat, true); }
  });

  function renderThread() {
    paintScope();          /* the thread on screen owns the scope buttons */
    pThread.innerHTML = '';
    if (!openChat) {
      var empty = document.createElement('div');
      empty.className = 'sv-msg';
      empty.style.padding = '18px 0';
      empty.textContent = 'Ask something below, or press History to reopen an earlier conversation.';
      pThread.appendChild(empty);
      pSub.textContent = '';
      pSub.title = '';
      pSub.classList.remove('sv-jump');
      pSub.removeAttribute('role');
      pSub.removeAttribute('tabindex');
      return;
    }
    pSub.textContent = openChat.term ? ('on “' + chatTitle(openChat) + '”') : 'this lesson';
    /* The excerpt truncates on the single header line, so the whole of it has
       to be reachable somewhere: hovering gives it back. */
    pSub.title = openChat.term ? String(openChat.term) : '';

    /* Only a control when there is somewhere to go: a chat about the whole
       lesson has no passage, and a chat saved before R5 has no segments. An
       affordance that does nothing is worse than none. */
    var target = chatBlock(openChat);
    pSub.classList.toggle('sv-jump', !!target);
    if (target) {
      pSub.setAttribute('role', 'button');
      pSub.setAttribute('tabindex', '0');
      pSub.title = 'Jump to this passage in the lesson' +
                   (openChat.term ? '\n\n' + String(openChat.term) : '');
    } else {
      pSub.removeAttribute('role');
      pSub.removeAttribute('tabindex');
    }
    openChat.turns.forEach(function (turn) {
      var box = document.createElement('div');
      box.className = 'sv-turn' + (turn.role === 'user' ? ' me' : '');
      var who = document.createElement('span');
      who.className = 'who';
      who.textContent = turn.role === 'user' ? 'You' : ('Claude · ' + (caps.model || ''));
      var txt = document.createElement('div');
      txt.className = 'txt';
      txt.textContent = turn.text;
      box.appendChild(who); box.appendChild(txt);
      pThread.appendChild(box);
    });
    /* Pending belongs to the conversation, not the panel: switching chats while
       one is thinking must not put its "Thinking." line on the other. */
    if (openChat.pending) {
      var p = document.createElement('div');
      p.className = 'sv-turn pending';
      var t = document.createElement('div');
      t.className = 'txt';
      t.textContent = openChat.pending;
      p.appendChild(t);
      pThread.appendChild(p);
    }
    /* Repaint the conversation's own highlights, because this function has just
       rebuilt every turn from the store and thrown away whatever was painted
       into them. This is why a chat mark is stored as offsets rather than as
       markup: the markup does not survive, the offsets do. */
    paintChatMarks();
    paintChatBookmarkButton();
    pThread.scrollTop = pThread.scrollHeight;
  }

  function renderHistory() {
    pHist.innerHTML = '';
    if (!chats.length) {
      var none = document.createElement('div');
      none.className = 'none';
      none.textContent = 'No saved conversations for this lesson yet.';
      pHist.appendChild(none);
      return;
    }
    chats.slice().sort(function (a, z) { return (z.ts || 0) - (a.ts || 0); }).forEach(function (c) {
      var row = document.createElement('button');
      row.type = 'button';
      row.className = 'row';
      if (openChat && openChat.id === c.id) row.setAttribute('aria-current', 'true');

      var del = document.createElement('span');
      del.className = 'del';
      del.textContent = 'Delete';
      del.addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (!window.confirm('Delete this conversation?')) return;
        chats = chats.filter(function (x) { return x.id !== c.id; });
        if (openChat && openChat.id === c.id) openChat = null;
        saveChats().then(function () { renderHistory(); renderThread(); });
      });

      var ttl = document.createElement('span');
      ttl.className = 'ttl';
      ttl.textContent = chatTitle(c);

      var meta = document.createElement('span');
      meta.className = 'meta';
      var when = c.ts ? new Date(c.ts) : null;
      meta.textContent = (c.turns ? c.turns.length : 0) + ' messages' +
        (when ? ' · ' + when.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) +
                ' ' + when.toTimeString().slice(0, 5) : '');

      row.appendChild(del); row.appendChild(ttl); row.appendChild(meta);
      row.addEventListener('click', function () {

           is most of the point of reopening it. */
