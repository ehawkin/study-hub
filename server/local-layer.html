  /* A docked panel is position:fixed, so on its own it takes no layout space
     and paints over the note. Prose survives that, because it wraps inside its
     own column and only its right edge goes under; a figure does not, because
     it is a fixed-width block that slides underneath and cannot be scrolled
     out. Reported 2026-08-13: "a lot of the images in the left-hand lesson
     panel end up getting hidden underneath the right-hand chat and notes
     panel."

     🔴 TWO panels dock to the right edge, not one: this layer's .sv-panel
     (chat, 440px) and the note's own .hl-panel (notes, 410px). They open
     independently and can both be open at once, so the width to reserve is
     measured at runtime rather than written here. See setPanelSpace() below.

     While either is open, that width is reserved on <body>. The note's own
     .wrap is max-width with auto margins, so it re-centres in what is left and
     nothing ends up underneath. Below the breakpoint a panel is nearly the
     whole viewport, where reflowing would leave no room to read, so there it
     stays an overlay and all of this does nothing. */
  /* 🔴 R19 drags --sv-panel-set, NOT --sv-panel-w, and the indirection is
     load bearing. A dragged width has to be an inline style on :root, and an
     inline style beats a media query, so writing it straight into
     --sv-panel-w would have silently killed R18 item 4: the first time he ever
     resized the pane, the full-screen rule below would stop applying and never
     apply again, on every device, because the setting is shared. Setting a
     different variable and computing --sv-panel-w from it leaves the media
     query the last word on which formula is used. */
  :root { --sv-panel-set: 440px; --sv-panel-w: min(var(--sv-panel-set), 96vw); --sv-reserved: 0px; }

  @media (min-width: 900px) {
    html.sv-panel-open body { padding-right: var(--sv-reserved); }

    /* The furniture is fixed to the viewport's right edge, so it needs moving
       too or it sits underneath the panel it opened. .sv-badge is anchored
       left and is deliberately not in this list. */
    html.sv-panel-open .sv-chatfab,
    html.sv-panel-open .sv-matfab,
    html.sv-panel-open .hl-fab,
    html.sv-panel-open .sv-gear { margin-right: var(--sv-reserved); }

    /* 🔴 .sv-set was in this list, and R24 is why it is not any more. The
       sheet was pushed clear of the pane because the gear that opened it was in
       the header; the gear now lives IN the pane's strip while the pane is open,
       so pushing the sheet left would have opened it on the far side of the
       screen from the button that was just pressed. It sits at the right edge
       and paints over the pane, which its z-index of 88 already allowed for. */

    /* 🔴 R18's header is the same problem arriving by a new route, and it is
       worse than the pills were: it spans the whole width, so an open panel
       covers its right end, which is exactly where its four controls sit. It is
       anchored on both edges rather than floated, so it shrinks by moving its
       right edge rather than by taking a margin. The menu sheet is anchored the
       same way and needs the same treatment, even though it only ever opens
       below 700px where none of this applies, because the two breakpoints are
       independent and nothing guarantees they stay apart. */
    html.sv-panel-open .sv-head,
    html.sv-panel-open .sv-menu { right: var(--sv-reserved); }

    /* Centred on the viewport, so it re-centres on half the reserved width. */
    html.sv-panel-open .sv-token { margin-left: calc(var(--sv-reserved) / -2); }
  }
  .sv-panel header {
    display: flex; align-items: baseline; gap: 9px;
    padding: 15px 17px; border-bottom: 1px solid var(--rule);
  }
  .sv-panel header strong { font-family: var(--display); font-size: 19px; font-weight: 600; }
  /* It holds a quoted excerpt of whatever was highlighted, so its length has no
     upper bound. It used to truncate on one line, sharing the row with the
     controls; EH asked on 2026-08-14 for it to move below the header and
     wrap, so it now takes a line of its own underneath.

     The row is DOM-ordered title, excerpt, controls, and `order` moves the
     excerpt last visually without touching the markup or the JavaScript that
     fills it. `flex: 0 0 100%` is what forces it onto its own line; the wrap on
     the header is what lets that line exist. Nothing clamps its height, which is
     the deliberate cost of the change: a long excerpt makes a tall header. */
  .sv-panel header { flex-wrap: wrap; }
  .sv-panel header .sub {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    flex: 0 0 100%; order: 2; min-width: 0;
    white-space: normal; overflow-wrap: anywhere; line-height: 1.5;
  }
  .sv-panel header .sub:empty { display: none; }
  /* R38: the quoted passage is a way back to itself, when the passage can still
     be found. It only looks like a control when it is one. */
  .sv-panel header .sub.sv-jump {
    cursor: pointer; color: var(--ink);
    text-decoration: underline; text-decoration-style: dotted;
    text-underline-offset: 3px; text-decoration-color: var(--rule);
    border-radius: 3px;
  }
  .sv-panel header .sub.sv-jump:hover {
    color: var(--hl-d-line); text-decoration-color: var(--hl-d-line);
  }
  .sv-panel header .sub.sv-jump:focus-visible {
    outline: 2px solid var(--hl-d-line); outline-offset: 2px;
  }
  .sv-panel header .grow { margin-left: auto; order: 1; display: flex; gap: 6px; }
  .sv-panel header button {
    font: 600 11.5px var(--body); background: var(--paper);
    border: 1px solid var(--rule); border-radius: 4px; color: var(--ink);
    padding: 5px 10px; cursor: pointer;
  }
  .sv-panel header button:hover { border-color: var(--hl-d-line); color: var(--hl-d-line); }
  .sv-panel header button[aria-pressed="true"] { background: var(--hl-d); border-color: var(--hl-d-line); }
  .sv-panel .thread { flex: 1; overflow-y: auto; padding: 4px 17px 14px; }
  .sv-panel .thread .sv-turn:first-child { padding-top: 12px; }

  .sv-hist { border-bottom: 1px solid var(--rule); background: var(--paper); max-height: 46vh; overflow-y: auto; }
  .sv-hist[hidden] { display: none; }
  .sv-hist .none { padding: 16px 17px; font-size: 13.5px; color: var(--muted); }
  .sv-hist button.row {
    display: block; width: 100%; text-align: left; background: none;
    border: 0; border-bottom: 1px solid var(--rule-soft); padding: 11px 17px; cursor: pointer;
    color: var(--ink); font: inherit;
  }
  .sv-hist button.row:hover { background: var(--surface); }
  .sv-hist button.row[aria-current="true"] { border-left: 3px solid var(--hl-d-line); padding-left: 14px; }
  .sv-hist .row .ttl { font: 600 13.5px var(--body); display: block; }
  .sv-hist .row .meta { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .sv-hist .row .del {
    float: right; font: 600 10.5px var(--body); color: var(--muted);
    border: 1px solid var(--rule); border-radius: 4px; padding: 2px 7px; background: var(--surface);
  }

  /* What the question is about, kept visible while you ask it. Drawn as
     rectangles over the text rather than as markup inside it: the note's own
     DOM carries highlight offsets, and wrapping the selection would disturb
     them. Absolute positioning in page coordinates, so it scrolls with the
     text and intercepts nothing. */
  .sv-focus {
    position: absolute; z-index: 1; pointer-events: none;
    background: rgba(127, 176, 208, .30);
    box-shadow: 0 0 0 1px rgba(127, 176, 208, .55);
    border-radius: 2px;
  }

  .sv-gear {
    position: fixed; right: 20px; top: 18px; z-index: 60;
    font: 600 12px var(--body); color: var(--ink); background: var(--surface);
    border: 1px solid var(--rule); border-radius: 999px; padding: 7px 14px;
    cursor: pointer; box-shadow: 0 3px 12px rgba(0,0,0,.10);
  }
  .sv-gear:hover { border-color: var(--hl-d-line); color: var(--hl-d-line); }
  .sv-set {
    position: fixed; right: 20px; top: 56px; z-index: 88; width: min(360px, 92vw);
    background: var(--surface); border: 1px solid var(--rule); border-radius: 9px;
    box-shadow: 0 12px 36px rgba(0,0,0,.26); padding: 15px 16px;
    display: flex; flex-direction: column; gap: 13px;
  }
  .sv-set[hidden] { display: none; }
  .sv-set h3 {
    margin: 0; font-family: var(--display); font-size: 16px; font-weight: 600;
  }
  .sv-set label.lab {
    font-family: var(--mono); font-size: 10px; letter-spacing: .07em;
    text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 4px;
  }
  .sv-set select {
    width: 100%; font: 13px var(--body); color: var(--ink); background: var(--paper);
    border: 1px solid var(--rule); border-radius: 5px; padding: 7px 8px;
  }
  .sv-set .hint { font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: 5px; }
  /* R16's relaunch control. Matches the selects above it rather than the panel
     buttons, because it sits in the same column as them. */
  .sv-set button {
    width: 100%; font: 600 13px var(--body); color: var(--ink); background: var(--paper);
    border: 1px solid var(--rule); border-radius: 5px; padding: 8px 10px; cursor: pointer;
  }
  .sv-set button:hover:not(:disabled) { border-color: var(--hl-d-line); color: var(--hl-d-line); }
  .sv-set button:disabled { opacity: .55; cursor: default; }
  /* 🔴 R40. `hidden` alone does not hide either of these. The attribute's
     effect is a user-agent rule, `[hidden] { display: none }`, and the lesson
     styles both of them by selector: `.hl-panel footer { display: flex }` and
     the footer's own button rule. A class selector beats the UA sheet, so the
     emptied footer went on rendering its 29px and its top border, which is
     exactly how it looked before except with nothing in it. Measured, not
     guessed: 29px tall and display:flex with the attribute set. */
  .hl-panel footer[hidden] { display: none !important; }
  .hl-panel footer button[hidden], .hl-panel footer label[hidden] { display: none !important; }
  /* R40. The notes footer's controls, regrouped. Two columns, because
     .sv-set button is full width by default and five stacked would push The
     Box and the server clean off the bottom of the sheet on a phone. */
  .sv-marks { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  /* Import is a <label> around a hidden file input, so it has to be made to
     look like the buttons beside it; in the footer the lesson's own CSS did
     that, and out here nothing does. */
  .sv-marks label {
    width: 100%; font: 600 13px var(--body); color: var(--ink); background: var(--paper);
    border: 1px solid var(--rule); border-radius: 5px; padding: 8px 10px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; text-align: center;
  }
  .sv-marks label:hover { border-color: var(--hl-d-line); color: var(--hl-d-line); }
  /* 🔴 Clear all wipes every highlight and note in the lesson and the wipe
     reaches disk 900ms later, so it does not share a row with Copy. Alone,
     last, and in the colour this design already uses for damage. */
  .sv-marks-danger { grid-column: 1 / -1; margin-top: 3px; }
  .sv-marks button.sv-danger { color: var(--broken); border-color: var(--broken); }
  .sv-marks button.sv-danger:hover {
    background: var(--broken); border-color: var(--broken); color: var(--paper);
  }
  /* R41. The gate in front of Clear all. Above .sv-set's 88, because it opens
     from inside that sheet and has to paint over it, and below the toast so the
     line confirming what was cleared is still readable afterwards.

     ⚠️ This comment said "the toast at 96" and the toast was at 90, so the claim
     was false when written: the dialog was ABOVE the toast, not below it. QA
     checked the consequence rather than assuming one and there was none, because
     `shut()` runs before `S.toast('Cleared ...')` in the confirm handler, so the
     scrim is gone before the toast paints. 🟢 The toast is now at 98 and the
     sentence is true again, but it was fixed here because a number stated where
     nothing rechecks it is how this rotted in the first place. */
  .sv-wipescrim { z-index: 91; background: rgba(0,0,0,.42); }
  .sv-wipe {
    position: fixed; z-index: 92; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(400px, 92vw); background: var(--surface); color: var(--ink);
    border: 1px solid var(--broken); border-radius: 9px; padding: 18px 18px 15px;
    box-shadow: 0 18px 48px rgba(0,0,0,.34);
    display: flex; flex-direction: column; gap: 10px;
  }
  .sv-wipe[hidden] { display: none; }
  .sv-wipe strong { font-family: var(--display); font-size: 16px; font-weight: 600; }
  .sv-wipe p { margin: 0; font-size: 13px; line-height: 1.5; }
  .sv-wipe p.keep { color: var(--muted); font-size: 12px; }
  /* 🔴 Not the mono uppercase every other .lab uses. This label contains a word
     he has to reproduce exactly, and the house style rendered it "CLEAR" while
     the field wanted "Clear", which is a confusing thing to do to somebody
     being asked to type carefully. Sentence case, and the word itself in the
     mono face so it reads as a literal string rather than as prose. */
  .sv-wipe .lab { font: 13px var(--body); color: var(--ink-soft); }
  .sv-wipe .lab b {
    font-family: var(--mono); font-weight: 600; color: var(--ink);
    background: var(--broken-wash); border-radius: 3px; padding: 1px 5px;
  }
  /* 🔴 16px here rather than the 15px the rest of the sheet uses. The narrow
     rule that lifts every control to 16px, so iOS does not zoom the page in on
     focus, is written as a bare `input` selector, and `.sv-wipe input` outranks
     it. Easier to be right at both widths than to fight the cascade. */
  .sv-wipe input {
    font: 16px var(--body); color: var(--ink); background: var(--paper);
    border: 1px solid var(--rule); border-radius: 5px; padding: 9px 10px;
  }
  .sv-wipe input:focus-visible { outline: 2px solid var(--broken); outline-offset: 1px; }
  .sv-wipe footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 2px; }
  .sv-wipe .act {
    font: 600 13px var(--body); color: var(--ink); background: var(--paper);
    border: 1px solid var(--rule); border-radius: 5px; padding: 10px 14px; cursor: pointer;
  }
  .sv-wipe .act.go { color: var(--paper); background: var(--broken); border-color: var(--broken); }
  .sv-wipe .act.go[disabled] { opacity: .4; cursor: default; }
  .sv-set .where {
    font-family: var(--mono); font-size: 10.5px; color: var(--muted);
    overflow-wrap: anywhere; border-top: 1px solid var(--rule); padding-top: 10px;
  }

  .sv-token {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 95;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    width: min(640px, 94vw); padding: 13px 16px;
    background: var(--surface); border: 1px solid var(--hl-d-line); border-radius: 9px;
    box-shadow: 0 10px 34px rgba(0,0,0,.26);
  }
  .sv-token .msg { flex: 1 1 100%; font-size: 13px; line-height: 1.5; color: var(--ink); }
  .sv-token .msg strong { display: block; margin-bottom: 2px; }
  /* The consequence, above the instructions. It is the half a reader
     actually needs: the bar explained the CREDENTIAL and never what was
     lost by not having it. */
  .sv-token .sv-tokwhy {
    margin: 0 0 9px; padding: 8px 10px; border-radius: 6px;
    background: var(--hl-y-wash, var(--paper)); border-left: 3px solid var(--broken, #A25E14);
  }
  .sv-token .sv-tokwhy strong { display: inline; margin: 0; }
  .sv-token code { font-family: var(--mono); font-size: .92em; }
  .sv-token input {
    flex: 1; min-width: 200px; font: 13px var(--mono); color: var(--ink);
    background: var(--paper); border: 1px solid var(--rule); border-radius: 5px; padding: 8px 10px;
  }
  .sv-token button {
    font: 600 12.5px var(--body); border: 1px solid var(--hl-d-line); background: var(--hl-d);
    color: var(--ink); border-radius: 5px; padding: 8px 16px; cursor: pointer;
  }
  /* Quieter than Save, because it is the second choice and not the cancel of a
     destructive act. Same size, so it is as easy to hit. */
  .sv-token .sv-tokclose {
    border-color: var(--rule); background: var(--surface); color: var(--muted);
  }
  .sv-token .sv-tokclose:hover { border-color: var(--hl-d-line); color: var(--ink); }

  @media print { .sv-pop, .sv-badge, .sv-edit, .sv-scrim { display: none !important; } }

  /* ---- R18 item 3: a header, so the controls have somewhere to live ----

     Reported 2026-08-13: "a lot of the materials, chat notes, and settings, all
     those buttons are too small. Maybe we need a header at the top and a
     hamburger menu to access some of that stuff."

     Four floating pills had accumulated in two corners: Settings at the top
     right, and Notes, Chat and Materials stacked up the bottom right at 20px,
     66px and 112px. Each was about 33px tall against the 44px that every
     finger-size guideline asks for, they were the reason R4 needed a rule
     teaching furniture to move out from under an opening panel, and a fourth
     one would have had nowhere to go.

     🔴 The pills are MOVED, not rebuilt. Every header button drives the
     original control's own handler and the original is hidden rather than
     removed, because .hl-fab belongs to the lesson and not to this layer: its
     listener, its aria-expanded and its own count all keep working, and a
     programmatic click still reaches a display:none button. Same argument as
     R2's textarea, and the reason no lesson file is edited for this.

     🔴 The hiding is conditional on html.sv-head-on, which the script sets only
     after the header is built. If any of this fails the pills are still there
     and the reader still works, which is the same degraded path the token bar
     and the hub's visit markers were given. */

  :root { --sv-head-h: 52px; }

  html.sv-head-on body { padding-top: var(--sv-head-h); }
  html.sv-head-on .sv-gear,
  html.sv-head-on .sv-chatfab,
  html.sv-head-on .sv-matfab,
  html.sv-head-on .hl-fab { display: none; }

  /* Below the panels (70 and 72) on purpose: at a narrow width a panel is
     full-screen and is meant to cover this. Above the note, and below the
     settings sheet (88) which opens out of it. */
  /* 🔴 IT WRAPS, AND THAT IS THE WHOLE FIX. EH, 2026-09-03: "if I compress
     that left section, the red-watched stars and light bulbs completely
     disappear. Wouldn't it make sense for them to get moved as one, to a second
     line underneath where it says 'Courses' and the name of the course?"

     It used to be a fixed 52px row with no wrap, and four things were dropped
     out of it as it narrowed (the Week/Topic/Part text at 1048, Read and
     Watched at 858, the tools at 730, the bulbs and stars at 509). He reported
     the last of those; the other three had never been reported because nobody
     knew they were there to miss. EH ruled the scope: "go ahead and carry all
     four."

     `height` becomes `min-height` because the bar now has as many rows as it
     needs, and `--sv-head-h` is measured from the real box by
     `trackHeadHeight()` rather than being a constant this file promises to keep
     true. That token pads the body and positions the menu, so a header that
     grew while the token stood still would slide the top of the lesson under
     it: the join most likely to be missed, because the header looks right while
     the page beneath it is wrong. */
  .sv-head {
    position: fixed; top: 0; left: 0; right: 0; z-index: 62;
    box-sizing: border-box; min-height: var(--sv-head-h);
    display: flex; align-items: center; flex-wrap: wrap;
    gap: 13px; row-gap: 7px; padding: 7px 14px;
    background: var(--surface); border-bottom: 1px solid var(--rule);
    /* 🔴 The question is whether the row fits in the HEADER, which is not the
       same as whether it fits in the viewport, and a media query can only ask
       the second one. An open panel takes 440px off the header while the
       viewport does not move at all, so at a 1000px window with the chat open
       the header is 560px and a viewport breakpoint still believes there is
       room for a 634px row. Found by measuring rather than by looking: the
       overflow is silent, because the last button simply sits past the right
       edge under the panel. */
    container-type: inline-size; container-name: svhead;
  }
  .sv-headhome {
    font: 600 13px var(--body); color: var(--ink); text-decoration: none;
    border: 1px solid var(--rule); border-radius: 6px; padding: 9px 13px;
    white-space: nowrap;
  }
  .sv-headhome:hover { border-color: var(--hl-d-line); color: var(--hl-d-line); }
  .sv-headhome:focus-visible { outline: 2px solid var(--hl-d-line); outline-offset: 2px; }
  /* 🔴 `overflow: hidden` is the whole reason the header no longer overlaps
     itself, and the cause is not obvious. `.sv-headhome` carries 13px of
     padding a side, so a crumb pill cannot shrink below 26px however long its
     text is: squeeze the row and the pill overflows its own container and
     paints across whatever is next. Measured across a 1200-to-300 sweep of the
     header: 272 widths had a pair of header items sitting on each other, and
     this one declaration takes it to 34, all of which are pure overflow with
     nothing overlapping. QA found the visible end of it (2026-08-30, a 40x23px
     `Courses` on `Read` at a 354px header with the pane dragged wide).

     `min-width: 0` alone does NOT fix it, checked: it lets the flex item
     shrink, and the padding floor stops the shrinking before it is enough. */
  .sv-headcrumbs { display: inline-flex; align-items: center; gap: 6px;
                   min-width: 0; overflow: hidden; }
  .sv-crumbsep { color: var(--muted); }

  /* 🔴 Rating this lesson from inside it. EH, 2026-08-29: "while I'm looking at
     the lesson, I can be like, 'Oh, I really like this one,' or 'I found this
     really interesting.'" Same two scales and the same keys as the hub rows, so
     a mark set here shows there with no sync step: the store is one.

     Sits between the crumb and the tools, which is the one part of the header
     that is empty at every width. Hidden below 700px, where the header already
     collapses to a burger and there is no room for ten more targets. */
  /* 🔴 The group that must break AS ONE, which is the load-bearing half of
     what EH asked for: Read, Watched, the bulbs and the stars are one element
     and one line. A wrap that left the stars on row 1 and the bulbs on row 2
     would be a worse bug than the one he reported, because it would look
     deliberate. `flex-wrap: nowrap` says so to the browser and a test says so
     to the next editor. */
  .sv-headrate { display: inline-flex; align-items: center; gap: 8px;
                 flex-wrap: nowrap; margin-left: 12px; }
  /* The second line: the Week/Topic/Part text and the controls group, in that
     order. It sits inline while the bar is wide, and takes a whole line of its
     own once the container is too narrow to hold everything on one, which puts
     it directly under "Courses" and the course name, his own placement.
     `flex-wrap` on THIS element (rather than on the group inside it) is what
     lets a genuinely narrow phone give the key its own line without ever
     splitting the controls. */
  .sv-headline2 { display: inline-flex; align-items: center; flex-wrap: wrap;
                  gap: 8px; row-gap: 6px; min-width: 0; }
  .sv-headrate .sv-rgrp { display: inline-flex; }

  /* 🔴 Read and Watched on the same line, EH 2026-08-30: "when I'm in the
     lesson, I can mark it off as read straight from there... I would add
     watched as well." They are BOOLEANS, so they take a different shape from
     the 1-to-5 scales rather than two more rows of glyphs, and the shape is
     the hub's `.hflag` pill unchanged: same word, same pill, same pressed
     colour. EH said "a little checkbox"; a pill that already means exactly
     this on the other surface beats inventing a second vocabulary for a flag
     whose store is literally the same file.

     One element holds both, so the pair can never half-disappear. At a narrow
     header they go together and the scales keep the room, which is the
     priority the entry set: five bulbs and five stars say more at a glance
     than one of two toggles. */
  .sv-headflags { display: inline-flex; align-items: center; gap: 6px; }
  .sv-hflag {
    font: 500 11px var(--body); color: var(--muted);
    background: transparent; border: 1px solid var(--rule);
    border-radius: 999px; padding: 4px 9px; cursor: pointer;
    white-space: nowrap;
  }
  .sv-hflag:hover { border-color: var(--hl-d-line); color: var(--hl-d-line); }
  .sv-hflag[aria-pressed="true"] {
    color: var(--accent, var(--hl-d-line));
    border-color: var(--accent, var(--hl-d-line));
    background: var(--hl-d);
  }
  .sv-hflag:focus-visible { outline: 2px solid var(--hl-d-line); outline-offset: 1px; }
  .sv-rbtn { font-size: 14px; line-height: 1; padding: 2px 1px; cursor: pointer;
             background: none; border: 0; }
  .sv-rbtn:hover { transform: scale(1.15); }
  .sv-rbtn.star.on { color: var(--accent, var(--hl-d-line)); }

  /* The same off-state rule as the hub's, and it has to be the same: EH reads
     one row here and the same row there. The full reasoning, the measurements
     and why `brightness` replaced `opacity` live beside the hub's copy in
     `study_server.py` (search `.hrate:not(.on)`); the short version is that the
     off star was 1.21:1 in light, a greyscaled 💡 cannot reach 3:1 on a light
     page at ANY opacity, and the ON state does not change.

     🔴 These numbers are measured against `--surface`, not `--paper`: the header
     is a bar of its own colour sitting over the page, and measuring an off state
     against a ground it never appears on is how the 1.21 got approved in the
     first place. */
  .sv-rbtn:not(.on) { color: #888D8B; }             /* 3.29:1 on #FBFCFC */
  .sv-rbtn.bulb { font-size: 12px; }
  .sv-rbtn.bulb:not(.on) { filter: grayscale(1) brightness(.70); opacity: 1; }
  .sv-rbtn.bulb.on { filter: none; opacity: 1; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .sv-rbtn:not(.on) { color: #747E82; }
    :root:not([data-theme="light"]) .sv-rbtn.bulb:not(.on) {
      filter: grayscale(1) brightness(.49); }
  }
  :root[data-theme="dark"] .sv-rbtn:not(.on) { color: #747E82; }   /* 3.85:1 on #182328 */
  :root[data-theme="dark"] .sv-rbtn.bulb:not(.on) { filter: grayscale(1) brightness(.49); }
  .sv-rbtn:focus-visible { outline: 2px solid var(--hl-d-line); outline-offset: 1px; }

  /* Deliberately the SHORT form of the identity and not the title. A header of
     fixed height cannot wrap, and R18 item 1 was about titles being cut off, so
     putting a 62-character title in here would have reintroduced exactly what
     item 1 removed. "Week 3 · Topic 3 · Part 3" has a known maximum length and
     never truncates, and the full title is in the masthead directly below. */
  .sv-headkey {
    font: 500 11px var(--mono); letter-spacing: .04em; color: var(--muted);
    white-space: nowrap;
  }
  .sv-headnav { margin-left: auto; display: flex; align-items: center; gap: 7px; }
  .sv-headnav button, .sv-menu button, .sv-textmenu button {
    font: 600 13px var(--body); color: var(--ink); background: var(--surface);
    border: 1px solid var(--rule); border-radius: 6px; cursor: pointer;
  }
  /* 38px here rather than 44px: this row only ever shows on a pointer device,
     because below the breakpoint it is replaced by the menu, whose rows are
     52px. The old pills were 33px. */
  .sv-headnav button { min-height: 38px; padding: 0 13px; white-space: nowrap; }
  .sv-headnav button:hover { border-color: var(--hl-d-line); color: var(--hl-d-line); }
  .sv-headnav button:focus-visible { outline: 2px solid var(--hl-d-line); outline-offset: 2px; }
  .sv-headnav button[aria-expanded="true"] {
    border-color: var(--hl-d-line); color: var(--hl-d-line); background: var(--hl-d);
  }

  .sv-burger {
    display: none; margin-left: auto; align-items: center; gap: 9px;
    font: 600 13px var(--body); color: var(--ink); background: var(--surface);
    border: 1px solid var(--rule); border-radius: 6px;
    min-height: 40px; padding: 0 14px; cursor: pointer;
  }
  .sv-burger:focus-visible { outline: 2px solid var(--hl-d-line); outline-offset: 2px; }
  .sv-burger[aria-expanded="true"] { border-color: var(--hl-d-line); color: var(--hl-d-line); }
  /* Three bars drawn from one element, so no glyph has to be trusted to exist
     in whatever font the page falls back to. */
  .sv-bars { position: relative; display: block; width: 17px; height: 2px;
             background: currentColor; border-radius: 2px; }
  .sv-bars::before, .sv-bars::after {
    content: ''; position: absolute; left: 0; width: 17px; height: 2px;
    background: currentColor; border-radius: 2px;
  }
  .sv-bars::before { top: -6px; }
  .sv-bars::after  { top: 6px; }

  /* ---- the lesson text size, and where EH put it -------------------------

     *"it can live as an icon. You can click, and then it opens something up in
     the top bar, maybe to the right of where the stars are, locked to the very
     right of that bar."*

     🔴 HIS TWO PHRASES PULL SLIGHTLY APART and this is the reading. The stars
     live inside `.sv-headline2`, which drops to a second line as one unit; the
     very right of the bar is past the tools and the burger. Taking "locked to
     the very right of that bar" as the literal one puts the icon last in the
     DOM with no `order`, so it is last on the row at every width, and it is
     also to the right of the stars, which satisfies both halves of the
     sentence. **His word would settle it; this is the assumption until then.**

     🟢 IT IS NOT DUPLICATED INTO `.sv-menu`, unlike the four tools, and that is
     a decision rather than an omission: the tools are duplicated because they
     are HIDDEN below 730px and while a panel is open. This is never hidden by
     either, so a copy would be a second implementation that can only drift.

     Two A's rather than a glyph, for the reason `.sv-bars` draws its own lines:
     a letter renders in any fallback font and an icon character may not. */
  .sv-textbtn {
    margin-left: 8px; display: inline-flex; align-items: center;
    justify-content: center; gap: 1px;
    color: var(--ink); background: var(--surface);
    border: 1px solid var(--rule); border-radius: 6px;
    min-height: 40px; min-width: 46px; padding: 0 10px; cursor: pointer;
    font-family: var(--body);
  }
  .sv-textbtn:hover { border-color: var(--hl-d-line); color: var(--hl-d-line); }
  .sv-textbtn:focus-visible { outline: 2px solid var(--hl-d-line); outline-offset: 2px; }
  .sv-textbtn[aria-expanded="true"] { border-color: var(--hl-d-line); color: var(--hl-d-line); }
  .sv-tsz i { font-style: normal; font-size: 11px; font-weight: 700; }
  .sv-tsz b { font-size: 16px; font-weight: 700; }
  /* 🔴 The tools and the burger both carry `margin-left: auto`, and two auto
     margins SHARE the free space rather than both pushing right. So this one
     takes the auto only in the state where those two are gone: a panel open,
     which is exactly when it would otherwise sit against the breadcrumb. */
  html.sv-panel-open .sv-textbtn { margin-left: auto; }

  .sv-textmenu {
    position: fixed; top: var(--sv-head-h); right: 8px; z-index: 62;
    background: var(--surface); border: 1px solid var(--rule);
    border-radius: 8px; box-shadow: 0 14px 34px rgba(0,0,0,.20);
    display: flex; flex-direction: column; padding: 8px; gap: 6px;
    min-width: 196px;
  }
  .sv-textmenu[hidden] { display: none; }
  .sv-textmenu button { min-height: 44px; padding: 0 14px; text-align: left; }
  .sv-textmenu button:focus-visible { outline: 2px solid var(--hl-d-line); outline-offset: -2px; }
  .sv-textmenu button[aria-pressed="true"] {
    border-color: var(--hl-d-line); color: var(--hl-d-line); background: var(--hl-d);
  }
  /* Same offset the tools menu takes, so an open pane does not sit on top of
     it; the extra 8px keeps the gap this one has and that one does not. */
  html.sv-panel-open .sv-textmenu { right: calc(var(--sv-reserved) + 8px); }

  .sv-menu {
    position: fixed; top: var(--sv-head-h); left: 0; right: 0; z-index: 61;
    background: var(--surface); border-bottom: 1px solid var(--rule);
    box-shadow: 0 14px 34px rgba(0,0,0,.20);
    display: flex; flex-direction: column; padding: 8px;  gap: 6px;
  }
  .sv-menu[hidden] { display: none; }
  .sv-menu button { min-height: 52px; padding: 0 15px; text-align: left; font-size: 14.5px; }
  .sv-menu button:focus-visible { outline: 2px solid var(--hl-d-line); outline-offset: -2px; }
  .sv-menu button[aria-expanded="true"] {
    border-color: var(--hl-d-line); color: var(--hl-d-line); background: var(--hl-d);
  }

  /* Measured on the header rather than guessed: the whole row wants 634px
     (Lessons 80, the key 177, the four buttons 323, two gaps and 28px of
     padding), and 444px once the key goes. So there is a real 190px band where
     four labelled buttons still fit and only the key has to go, and spending it
     on a hamburger would hide four controls behind an extra tap for nothing.
     The key is the one to drop because it is the only decoration here: the
     masthead says the same thing eight lines below it. */
  /* 🔴 Measured, not guessed, and the number MOVED when Read and Watched joined
     the row on 2026-08-30. A container query on inline-size reads the CONTENT
     box, so these are header width minus the 28px of padding.

     Swept in Chrome on a real lesson, reading the right edge of the last
     visible child against the header's own width:

       everything shown ................ stops fitting at 860px of header
       key hidden, flags shown ......... stops fitting at 672px of header
       key hidden, flags hidden ........ never stops fitting (the tools go at 450)

     🔴 The 640 that stood here before was already too late by 64px: with the
     key in place the old row stopped fitting at 732 and the key did not leave
     until 668, so the last tool sat past the right edge over a 64px band, in
     silence. The flags widened that band rather than creating it, and moving
     this number closes both. The key is the right thing to drop first for the
     reason written above it: it is the only decoration in the row, and the
     masthead repeats it eight lines below.

     🔴 THE RULE HERE USED TO READ "a control is never dropped to keep a
     caption", and EVERY NUMBER BELOW WAS TUNED UNDER IT. EH overturned it on
     2026-08-30, so the numbers moved with it. Do not restore them without
     reading this. **The amended rule: a control is never dropped to keep
     DECORATION, but the name of the course you are reading is IDENTITY.**
     Everything else in this row is one click away if it is dropped; which
     course you are in is not something the row can tell you afterwards.

     🔴 So the ladder is now tuned to a DIFFERENT event, and this is the part
     that is easy to get wrong. The old numbers were the widths at which the
     row stopped FITTING, which could only ever happen after the name had
     already been eaten down to an empty pill: `.sv-headcrumbs` is the only
     shrinkable item, so it silently absorbed every squeeze and the row never
     overflowed at all. The new numbers are the widths at which the crumbs
     would have to CLIP the name at its floor, which is the thing a reader
     actually sees. Measured in Chrome against the live server with the ladder
     DISABLED and each state stated explicitly, so the states are isolated
     rather than measured through each other:

       state              cuts at (header)   so this rung fires at (content)
       everything shown ......... 1076 ................ 1048
       key gone ................. 886 ................. 858
       key+flags gone ........... 758 ................. 730
       tools are a burger ....... 513 ................. 509 *
       scales gone .............. 330 ................. nothing left to drop

       * 509 rather than 485, because a panel being OPEN is the tighter case
         for this rung: it stands the tools down but KEEPS the scales, and the
         name is cut there at a 537px header. Sweep BOTH panel states or this
         one number comes out 24px too low.

     🔴 THE TEST FOR "IS IT CUT" IS `scrollWidth > getBoundingClientRect().width
     + 0.5`, AND THE TOLERANCE IS NOT COSMETIC. `scrollWidth` is an integer and
     the box width is fractional, so a strict `>` reports a cut at every width
     including 1400, and a `> ceil(width) + 1` (which is what produced the
     first version of this table) silently misses the first two pixels of every
     boundary. It reported this row as never cut when it is cut at 1076 and
     again below 330. QA caught the second; re-measuring properly found the
     first. Half a pixel absorbs the rounding and nothing else.

     🔴 At a 330px header the crumbs begin to cut the name and there is nothing
     left in the row to spend on it. That is the honest floor of this design,
     not a width anybody reads at. */
  /* 🔴 THIS RUNG USED TO HIDE THE KEY AND NOW MOVES THE WHOLE SECOND LINE.
     It is the measured width at which the single row stops fitting, so it is
     the right width to stop trying to be a single row. Nothing is dropped
     here: `order` puts the crumbs and the tools on row 1 and the line below
     them, and `flex-basis: 100%` is what makes it a row rather than a wrap
     that lands wherever it fits.

     🔴 1115, NOT THE 1048 THAT STOOD HERE, and the 67px is the text-size icon
     added 2026-09-09 (46px of button, the row's 13px gap, its own 8px margin).
     ⚠️ THE NUMBER IS A CONTENT-BOX WIDTH: `container-type: inline-size` queries
     the content box, and this element carries 14px of padding each side, so the
     rung fires at a 1143px header rather than an 1115px one. Measuring the
     border box against this number is how somebody concludes the query is
     broken.

     🔴 WHAT MOVING IT ACTUALLY BUYS, measured in Chrome on a real lesson with
     the icon hidden as the control, because the honest answer is not "it fixes
     it": wrapping begins at a 1203px header WITH the icon and at 1136px
     WITHOUT it, and this rung fired at 1076px. So a band where the row wraps
     with no ordering rule to catch it ALREADY EXISTED and was 59px wide; the
     icon took it to 126px, and in the new part of it the icon dropped to a
     second line ON ITS OWN, under the breadcrumb. 1115 puts the band back to
     exactly the 59px that was here before this change.

     ⚠️ SO THE BAND IS NOT GONE AND THIS NUMBER CANNOT CLOSE IT. The row's width
     depends on the BREADCRUMB, which is a course name and varies per page (it
     was 249px on the page this was measured on), so no single threshold is
     right for every lesson. Closing it needs the second line to take a whole
     line whenever it wraps at all, which is a different mechanism from a
     measured rung. Left as it was found, deliberately, rather than widened in
     silence. */
  @container svhead (max-width: 1115px) {
    .sv-headcrumbs { order: 1; }
    /* 🔴 THE TEXT BUTTON ORDERS WITH THE TOOLS, and leaving it out is the
       silent bug: with no `order` it defaults to 0, which is BEFORE `order: 1`,
       so the icon would jump from the far right of the row to the far LEFT of
       it the moment the header crossed 1048px. Same value as the tools, later
       in the DOM than them, so it stays last on row 1 at every width. */
    .sv-headnav, .sv-burger, .sv-textbtn { order: 2; }
    .sv-headline2 { order: 3; flex-basis: 100%; margin-left: 0; }
    .sv-headrate { margin-left: 0; }
  }
  /* 🔴 THE FLAGS RUNG IS GONE, DELIBERATELY, and this comment is its headstone.
     It read `@container svhead (max-width: 858px) { .sv-headflags { display:
     none; } }`. Read and Watched now travel with the group on the second line,
     which is where EH asked for them, and nothing in the header is hidden by
     width any more except the tools, which become the Menu button and lose
     nothing. */
  /* 🔴 THE PANEL-OPEN EXCEPTION IS GONE WITH THE RULE IT EXCEPTED, and the
     entry warned specifically against tidying it away without checking, so it
     is checked here rather than deleted quietly. It read
     `html.sv-panel-open .sv-headflags { display: inline-flex; }` and existed to
     stop the flags blinking out every time EH opened the chat, because opening
     a panel is itself what narrowed the header. Nothing hides the flags now, so
     nothing needs to un-hide them; opening a panel makes the bar take a second
     line instead, which is the behaviour the exception was reaching for. */
  /* 🔴 Then the scales, and this rule used to be `@media (max-width: 700px)`,
     which is the defect QA reported on 2026-08-30: a VIEWPORT query on an
     element inside a container, in a stylesheet whose own comment says "where
     containers DO work, the viewport never gets a vote". At a 1087px window
     with the pane dragged wide the header was 354px, the media query never
     fired, and 286px of ratings were drawn straight through the breadcrumb.

     400 rather than something rounder because it is where the row actually
     stops having space for them once the tools are a burger.

     🔴 THAT RULE IS NOW GONE, and this is the defect EH actually reported:
     `@container svhead (max-width: 509px) { .sv-headrate { display: none; } }`
     is what made the bulbs and stars "completely disappear" when he compressed
     the pane. They wrap instead. ⚠️ The measurement above is kept because it is
     still true and still useful: 509 is where a SINGLE row runs out of space
     for them, which is why the row above stops being a single row at 1048. */
  /* 🔴 516, not the 450 that stood here. Measured the same way as the rest:
     with the four tools in the row it stops fitting at a 544px header, which is
     a 516px content box, and the old number let it overflow in silence over the
     whole 544-to-480 band. That band was filed as its own entry the same
     morning and this is it. */
  @container svhead (max-width: 730px) {
    .sv-headnav { display: none; }
    .sv-burger  { display: flex; }
  }

  /* Container queries have been in Chrome and Safari since 2022 and both Macs
     are current, so this is a floor rather than a real path: without them the
     header would never collapse at all, and a phone would get a row that runs
     off the edge. Guarded so that where containers DO work, the viewport never
     gets a vote: a 700px window with no panel open has a 700px header, which
     fits the key perfectly well. */
  @supports not (container-type: inline-size) {
    /* 🔴 The same two changes as above, in the same order: the second line
       breaks rather than the key being dropped, and the flags and scales are
       not dropped at all. The +28px on each number is the padding and gap the
       viewport carries and the container does not. */
    @media (max-width: 1076px) {
      .sv-headcrumbs { order: 1; }
      .sv-headnav, .sv-burger, .sv-textbtn { order: 2; }
      .sv-headline2 { order: 3; flex-basis: 100%; margin-left: 0; }
      .sv-headrate { margin-left: 0; }
    }
    @media (max-width: 758px) {
      .sv-headnav { display: none; }
      .sv-burger  { display: flex; }
    }
    /* No `.sv-crumbname` rung here either: the swap is JavaScript and runs
       whether or not the browser has container queries, so this floor has
       nothing left to cover for it. And no `.sv-headrate` rung: it is not
       dropped at any width any more, here or above. */
  }

  /* ---- R19: the right-hand pane can be dragged wider ----

     Asked 2026-08-13: "Now that we have the materials section on the left-hand
     side, it would be great if we could resize that right-hand pane." The slide
     deck R11 puts in there is the first thing the pane has held that has its own
     idea of how wide it wants to be; 440px was chosen when the pane only ever
     held text.

     A 5px strip is too thin to hit, so the target is 11px wide and sits half
     outside the panel, while the line he sees is 1px of it. That is the usual
     trick for a window split, and it is why the grip has no background of its
     own until it is hovered. */
  .sv-grip {
    position: absolute; left: -5px; top: 0; bottom: 0; width: 11px; z-index: 2;
    cursor: col-resize; background: none; border: 0; padding: 0;
    -webkit-appearance: none; appearance: none;
  }
  .sv-grip::before {
    content: ''; position: absolute; left: 5px; top: 0; bottom: 0; width: 1px;
    background: var(--rule);
  }
  .sv-grip:hover::before, .sv-grip:focus-visible::before, html.sv-dragging .sv-grip::before {
    left: 4px; width: 3px; background: var(--hl-d-line);
  }
  .sv-grip:focus-visible { outline: none; }

  /* 🔴 Held on <html> for the length of a drag, because the pointer leaves
     the grip immediately and everything it crosses would otherwise fight it: an
     iframe swallows pointer events outright, which is exactly what the slide
     deck is, and text selection turns a drag over the lesson into a highlight.
     pointer-events:none on the panels is what lets the deck be dragged past. */
  html.sv-dragging { cursor: col-resize; }
  html.sv-dragging, html.sv-dragging * { user-select: none; -webkit-user-select: none; }
  html.sv-dragging .sv-panel, html.sv-dragging .hl-panel { pointer-events: none; }
  html.sv-dragging .sv-grip { pointer-events: auto; }

  @media print { .sv-grip { display: none !important; } }

  @media print {
    .sv-head, .sv-menu { display: none !important; }
    html.sv-head-on body { padding-top: 0; }
  }

  /* ---- R18 item 4: below 900px the panel is the screen ----

     Asked 2026-08-13: "consider how to best design a mobile mode."

     R4 reflows the note out from under an open panel, and deliberately stops
     doing it below 900px because a 440px panel on a 390px screen leaves nothing
     to reflow into. That left the panel as a 96vw overlay with a sliver of note
     showing down one edge, which reads as a mistake rather than a mode.

     🔴 Done by moving the variable rather than by overriding two widths. The
     chat panel reads --sv-panel-w and R6 made the notes panel read it too, so
     one line covers both, and anything measuring the panel later still measures
     the truth. setPanelSpace still runs and still reserves the width, but the
     rule that spends the reservation is inside @media (min-width: 900px), so
     nothing reflows and nothing needs a second breakpoint to agree with. */
  @media (max-width: 899px) {
    :root { --sv-panel-w: 100%; }
    .sv-panel, .hl-panel { left: 0; border-left: 0; box-shadow: none; }
    /* Nothing to drag against when the pane is the screen. */
    .sv-grip { display: none; }

    /* Full-screen means the way out has to be obvious and hittable: there is no
       edge of the note left to click on, which is how an overlay is normally
       dismissed. Escape also closes both, added in the script for the same
       reason. */
    .sv-panetabs button { min-height: 46px; font-size: 14px; }
    .sv-panel header [data-close],
    .sv-panel header [data-hist],
    .sv-panel header [data-bmchat] { min-height: 40px; padding: 0 14px; }
  }

  /* ================= R29: the mobile mode, switched on =================

     Asked 2026-08-15: "Go ahead and implement a mobile mode. Take into account
     all of our features and make sure everything works well on mobile from a UX
     standpoint."

     🔴 R18 built a mobile mode on 2026-08-13 and not one line of it has ever
     run on a phone, because none of the 30 files in notes/ carried a viewport
     meta tag. Without that tag a phone does not lay out at the device's width:
     it lays out at 980px and scales the result down. So `max-width: 899px` never
     matched, the hamburger never appeared, the pane was never full-screen, and
     16.5px body text arrived at about 6.5px. Everything R18 measured that day
     was true, and none of it was true on a phone. The tag is installed at the
     top of every lesson by apply_layer.py and by hand in the hub; everything
     below is what having it exposes.

     Three ideas run through this block.

     🔴 **Anything that floats becomes a sheet at the bottom.** Placing a surface
     beside the selection is a pointer idea: it assumes room either side, and a
     drag to move it when there is not. On a phone there is no room, the drag is
     wired to mousedown/mousemove so on a touch screen it does not work at all,
     and the placement code knows nothing about the 52px fixed header it can
     land under. A sheet pinned to the bottom edge is always on screen, always
     the same shape, and always under the thumb. It also removes the class of bug
     that made this necessary: the selection toolbar is 487px wide, which cannot
     be clamped into a 390px screen by any amount of arithmetic, so Look up, Ask
     and Rewrite simply sat past the right edge.

     **Nothing a finger has to hit is under 44px, and no form control is under
     16px.** The second is not taste. Below 16px, iOS Safari zooms the page in
     when the control takes focus and does not zoom back out, so the reader is
     left at 1.3x with the text running off the side. Fifteen controls were
     under it, including every note box and the chat composer.

     **The viewport is not the screen.** A notch takes the top, a home indicator
     takes the bottom, and the keyboard takes up to half. env() covers the first
     two, and --sv-kb (set from the VisualViewport API) covers the third. */

  :root { --sv-kb: 0px; }

  /* The notch, and the home indicator. viewport-fit=cover is what makes these
     report anything but zero, and it is set in the same meta tag. */
  .sv-head { padding-left: max(14px, env(safe-area-inset-left));
             padding-right: max(14px, env(safe-area-inset-right)); }

  @media (max-width: 899px) {
    /* A tap should not wait 300ms to find out whether it was a double tap, and
       should not paint a grey rectangle while it decides. */
    .sv-head, .sv-menu, .sv-panel, .hl-panel, .sv-pop, .sv-mini, .sv-pal,
    .sv-set, .sv-edit, .hl-bar, .sv-token, .sv-badge {
      -webkit-tap-highlight-color: rgba(0,0,0,0);
    }
    .sv-head button, .sv-head a, .sv-menu button, .sv-panel button, .hl-panel button,
    .sv-pop button, .sv-mini button, .sv-pal button, .sv-set button, .sv-edit button,
    .hl-bar button, .sv-token button, .sv-badge, .tblwrap, .figbox {
      touch-action: manipulation;
    }

    /* Scrolling a pane to its end should not then scroll the lesson behind it,
       and should not trigger the browser's pull-to-refresh. */
    .sv-panel .thread, .sv-hist, .hl-scroll, .sv-body, .sv-matbody,
    .sv-set, .sv-mini .out { overscroll-behavior: contain; }

    /* The page behind a full-screen pane. lockPage() pins the body; these two
       stop the document itself from having anything left to scroll, and stop a
       drag that starts on the pane from being handed to the page underneath. */
    html.sv-locked, html.sv-locked body { overflow: hidden; overscroll-behavior: none; }
    /* The sync badge is fixed to the viewport rather than to the body, so it
       does not move with the lock. Its z-index already puts it under the pane,
       so this is belt and braces for the moment the pane is opening or closing
       and has not covered the screen yet; in the screenshot from 2026-08-15 it
       is sitting over the lesson text that was showing below the Ask box. */
    html.sv-locked .sv-badge { display: none; }

    html.sv-head-on body { padding-top: calc(var(--sv-head-h) + env(safe-area-inset-top)); }
    .sv-head { height: auto; min-height: var(--sv-head-h);
               padding-top: env(safe-area-inset-top); }
    .sv-menu { top: calc(var(--sv-head-h) + env(safe-area-inset-top)); }

    /* The pane is the screen (R18 item 4), so it owes the same debts: the notch
       above it, the home indicator below it, and the keyboard when the composer
       has focus. Shrinking the pane rather than sliding it is what keeps the
       composer visible instead of merely on the page. */
    .sv-panel, .hl-panel {
      top: env(safe-area-inset-top);
      bottom: var(--sv-kb);
      padding-bottom: env(safe-area-inset-bottom);
    }
  }

  /* ---- 640px: where a surface stops being placed and starts being a sheet ----

     🔴 Two breakpoints rather than one, on EH's answer of 2026-08-15. R29
     shipped with everything at 899px, which is where R18 decided the pane is the
     whole screen, and that put the bottom sheets on a 768px tablet as well. His
     call, and it is the better one: at 768px there IS room beside the selection,
     and a control that appears where you are already looking is easier to hit
     than one at the far edge of a big screen. The forced case is a phone, where
     the toolbar is 487px wide and cannot fit at all.

     So the split runs along what each rule is FOR. Everything about being a
     touch device stays at 899px: finger-sized targets, 16px form controls (iPadOS
     Safari zooms on focus below that exactly as the phone does), safe areas, the
     tap delay, and the full-screen pane. Only the rules that MOVE a surface to
     the bottom edge come down here, plus the narrow gutter, which is a phone
     measure and would just be a tight margin on a tablet. */
  @media (max-width: 640px) {
    /* 🔴 The layer cannot reach the inside of the lesson's own type scale, but
       it can reach the page's gutter, and 24px each side of a 390px screen
       spends a seventh of the line on nothing. */
    body { padding-left: max(15px, env(safe-area-inset-left));
           padding-right: max(15px, env(safe-area-inset-right)); }

    /* 🔴 And narrowing the gutter is not free, which is worth saying because it
       was not obvious and the browser caught it rather than the reading did.
       R7's bookmark marker is drawn OUTSIDE the block it marks, at left:-18px,
       so it was living in that gutter: 24px of padding left it 6px of clearance
       and 15px puts it at -3px, off the side of the screen. It moves in to
       -11px here, which is 4px clear of the edge and still outside the text. */
    .wrap [data-hb].sv-bm::before { left: -11px; }

    /* ---- the selection toolbar, as a bar across the bottom ----

       🔴 !important throughout, and that is the mechanism rather than a shortcut.
       The lesson's own onSelect() writes `top` and `left` as inline styles on
       every selection, from arithmetic that cannot know about a fixed header or
       a screen narrower than the bar. A stylesheet declaration marked important
       beats an inline one that is not, so this wins without a single edit to any
       of the 29 files, and without disabling the code that keeps working
       perfectly well on a desktop. `display` is deliberately NOT set here:
       .hl-bar[hidden] is what hides it. */
    .hl-bar {
      position: fixed !important;
      left: max(8px, env(safe-area-inset-left)) !important;
      right: max(8px, env(safe-area-inset-right)) !important;
      top: auto !important;
      bottom: calc(8px + var(--sv-kb) + env(safe-area-inset-bottom)) !important;
      width: auto !important;
      flex-wrap: wrap;
      justify-content: center;
      padding: 7px;
      gap: 6px;
    }
    .hl-bar button { min-height: 44px; font-size: 13.5px; padding: 6px 13px; }
    /* The rule between marking and asking reads as a divider on one line and as
       a stray tick once the row wraps. */
    .hl-bar .sv-sep { display: none; }

    /* ---- the popover, as a sheet ---- */
    .sv-pop, .sv-pop.chat {
      position: fixed !important;
      left: 0 !important;
      right: 0 !important;
      top: auto !important;
      bottom: var(--sv-kb) !important;
      width: auto !important;
      max-width: none !important;
      max-height: 86vh;
      max-height: 86dvh;
      display: flex;
      flex-direction: column;
      border-width: 1px 0 0;
      border-radius: 13px 13px 0 0;
      box-shadow: 0 -12px 40px rgba(0,0,0,.34);
      padding-bottom: env(safe-area-inset-bottom);
    }
    /* Specificity 0,2,0 against the 0,1,0 above, so hiding still wins. */
    .sv-pop[hidden] { display: none; }
    /* The body is the part that should give, so the title, the tabs, the ask box
       and the footer stay put while the answer grows. */
    .sv-pop .sv-body { max-height: none; flex: 1 1 auto; min-height: 0; }
    /* There is nowhere to drag it to, and the drag never worked on touch. */
    .sv-pop-head { cursor: default; }
    .sv-pop-head .t { font-size: 17px; }
    .sv-pop-head button { min-height: 40px; padding: 6px 14px; font-size: 13px; }
    .sv-tabs { padding: 10px 13px 0; flex-wrap: wrap; }
    .sv-tabs button { min-height: 40px; padding: 6px 16px; font-size: 13.5px; }
    .sv-foot button { min-height: 40px; padding: 6px 13px; font-size: 12.5px; }
    .sv-foot .links { flex: 0 0 100%; margin-left: 0; justify-content: flex-start; }
    .sv-foot .links a { padding: 9px 0; font-size: 13px; }
    .sv-pickbtn { min-height: 38px; padding: 6px 14px; font-size: 12.5px; }
    /* 🔴 THE PHONE OVERRIDE IS GONE, 2026-09-04, AND ITS INTENT IS WHAT REMOVED
       IT. It read `height: 190px`, and its comment said a region picture is the
       answer to the question on a phone even more than on a desktop. That is
       right, and a fixed height was the wrong way to get it: with `object-fit:
       contain` and a 4:3 plate the HEIGHT binds, so 190px rendered the picture
       253px wide no matter how much of the sheet was free.

       🟢 The `aspect-ratio` rule above governs here too now, so on a phone the
       plate fills the sheet's width, which on a 390px screen is about 364px
       rather than 253px. **Bigger, which is what this rule wanted, and one
       sizing mechanism for the element instead of two.**

       ⚠️ THE SHEET HAS THE ROOM: `.sv-pop .sv-body` above sets `max-height: none`
       with `flex: 1 1 auto`, so the body grows and the title, tabs and footer
       stay put. That is the opposite of the desktop case, where the body is
       capped and a taller plate pushes the definition into a scroll. */

    /* ---- looking something up from inside an answer, as a sheet ---- */
    .sv-mini {
      left: 0 !important;
      right: 0 !important;
      top: auto !important;
      bottom: var(--sv-kb) !important;
      width: auto !important;
      max-width: none !important;
      border-width: 1px 0 0;
      border-radius: 13px 13px 0 0;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .sv-mini .row { padding: 8px; gap: 7px; }
    .sv-mini button { min-height: 44px; flex: 1 1 0; font-size: 13.5px; }
    .sv-mini .out { max-height: 40vh; }

    /* ---- the colour palette, as a sheet ---- */
    .sv-pal {
      position: fixed !important;
      left: 0 !important;
      right: 0 !important;
      top: auto !important;
      bottom: var(--sv-kb) !important;
      width: auto !important;
      max-width: none !important;
      max-height: 80vh;
      max-height: 80dvh;
      overflow-y: auto;
      border-width: 1px 0 0;
      border-radius: 13px 13px 0 0;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }
    .sv-swatch { padding: 9px 8px; }
    .sv-swatch .chip { width: 28px; height: 28px; }
    .sv-swatch .lab { min-height: 44px; font-size: 16px; padding: 10px 8px; }
    .sv-paladd input[type="color"] { width: 44px; height: 44px; }
    .sv-paladd button { min-height: 44px; padding: 10px 14px; }

    /* ---- settings, as a sheet ---- */
    .sv-set {
      left: 0; right: 0; top: auto;
      bottom: var(--sv-kb);
      width: auto; max-width: none;
      border-width: 1px 0 0;
      border-radius: 13px 13px 0 0;
      padding-bottom: max(15px, env(safe-area-inset-bottom));
    }
    .sv-set select, .sv-set button, .sv-marks label { min-height: 46px; }

    /* ---- R41's confirm gate ----
       🔴 Centred with a transform is wrong on a phone the moment the field is
       focused: the keyboard comes up, and a dialog centred in the layout
       viewport ends up behind it, with the input he is being asked to type in
       the part that is covered. Same treatment as every other sheet here,
       pinned above the keyboard by --sv-kb. */
    .sv-wipe {
      left: 0; right: 0; top: auto; bottom: var(--sv-kb);
      transform: none;
      width: auto; max-width: none;
      border-width: 1px 0 0;
      border-radius: 13px 13px 0 0;
      padding-bottom: max(15px, env(safe-area-inset-bottom));
    }
    .sv-wipe .act { min-height: 46px; }

    /* ---- rewriting a paragraph ---- */
    .sv-edit {
      left: 0; right: 0; top: auto; bottom: var(--sv-kb);
      transform: none;
      width: auto; max-width: none;
      max-height: 92vh;
      max-height: 92dvh;
      border-width: 1px 0 0;
      border-radius: 13px 13px 0 0;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .sv-edit button { min-height: 44px; }
  }

  /* Back to the touch-device tier: everything below is about a finger and a
     soft keyboard, both of which a tablet has. */
  @media (max-width: 899px) {
    /* ---- everything else a finger has to find ---- */
    .sv-headhome { min-height: 44px; display: flex; align-items: center; }
    .sv-panetabs .sv-tabicon { padding: 0 16px; }
    /* 🔴 `.mini` is the lesson's class for the small text buttons that hang off
       a highlight, a note and a bookmark: Jump to, Remove, Edit. There are
       three separate rules for it across the lesson and this layer, so this
       names the panels rather than the rows, which is the one description that
       cannot go stale when a fourth is added. Measured at 61x23 before. */
    .sv-panel .mini, .hl-panel .mini,
    .sv-card .again, .sv-add .hd button,
    .hl-sechead button, .sv-hist .row .del, .sv-cardadd button {
      min-height: 38px; padding: 8px 12px; font-size: 12.5px;
    }
    /* R47: the pill's segments grow tall for a thumb but never wide enough to
       wrap; the shared rule above would pad them into overflowing. */
    .sv-secnav button { min-height: 38px; padding: 8px 2px; font-size: 11.5px; }
    /* The notes panel's own footer held six controls at 31px, one of which
       wiped every highlight in the lesson: the worst possible thing to put a
       mis-tap away from a note. R40 emptied it into Settings and hid it, so
       this now only sizes the fallback, which is Restore put back here when no
       Settings sheet can be found. Kept for exactly that case. */
    .hl-panel footer button, .hl-panel footer label {
      min-height: 40px; padding: 9px 13px;
    }
    .sv-badge { min-height: 36px; padding: 8px 14px;
                bottom: calc(20px + env(safe-area-inset-bottom)); }
    .sv-token { bottom: calc(22px + env(safe-area-inset-bottom));
                width: auto; left: 8px; right: 8px; transform: none; }
    .sv-token button, .sv-token input { min-height: 46px; }
    .sv-matbar button, .sv-matbar a { min-height: 42px; }
    /* R8/R9. A file row is a whole line to itself on a phone, because the name
       is the long part and the three controls beside it are the small ones. */
    .sv-file { padding: 6px 15px 10px; flex-wrap: wrap; }
    .sv-filename { flex: 1 1 100%; min-height: 40px; font-size: 15px; padding: 8px 0 0; }
    .sv-filedel, .sv-fileedit { min-height: 40px; padding: 8px 12px; }
    .sv-fileedit { margin-left: auto; }
    .sv-filedesc input, .sv-descsave { min-height: 44px; }
    .sv-file .sv-matout { min-height: 40px; display: flex; align-items: center; padding: 0 8px; }
    .sv-filesempty, .sv-filesfoot { padding-left: 15px; padding-right: 15px; }
    .sv-fileadd { min-height: 46px; display: flex; align-items: center; }
    .sv-fileback { padding: 8px 15px; }
    .sv-filetext { padding: 12px 15px; font-size: 13px; }

    /* 🔴 Every control the reader can focus goes to 16px, because below that
       iOS Safari zooms the page in on focus and never zooms back out. This is
       the whole reason the rule exists, so it covers the lesson's own note
       boxes and import field as well as the layer's, and it is scoped to narrow
       screens so the desktop keeps the smaller scale it was designed at. */
    input, textarea, select,
    .sv-ask textarea, .sv-panel textarea, .hl-panel textarea,
    .sv-tabs .lvl select, .sv-set select, .sv-edit input, .sv-edit textarea,
    .sv-paladd input[type="text"], .sv-token input,
    .sv-swatch.editing input, .sv-cardadd input {
      font-size: 16px !important;
    }
    /* A 16px composer needs the room to be 16px in. */
    .sv-ask textarea { min-height: 64px; }   /* two rows at the phone's 15px */
    .sv-ask button { min-height: 46px; padding: 10px 15px; font-size: 13px; }
  }

  /* A short window is not only a landscape phone: the settings sheet is 490px
     tall and any window under that clipped its last two controls, Relaunch the
     server and the path beneath it, with no way to scroll to them. Capping it
     here rather than inside the narrow block fixes the desktop case too. */
  .sv-set { max-height: calc(100vh - 76px); overflow-y: auto; }
  @media (max-width: 899px) {
    .sv-set { max-height: 86vh; max-height: 86dvh; }
  }

  /* ---- R29: a diagram that scrolls should say so, exactly as a table does ----

     48 diagrams across the module, at least one in every one of the 29 lessons,
     sit in a `.figbox` that already scrolls sideways. R18 item 2 accepted the
     argument for tables and built the fade for `.tblwrap` only, so a 620px
     diagram in a 342px column has been reading as a diagram that ends there.
     The mask, the focus ring and the print rules are the same ones; only the
     selector list grows. Shrinking the diagram to fit was considered and is
     worse: the drawings are 860 units wide, so fitting one to a phone would set
     its labels at about 5px. */
  .figbox.sv-canscroll {
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 34px, #000 calc(100% - 34px), transparent 100%);
            mask-image: linear-gradient(to right, transparent 0, #000 34px, #000 calc(100% - 34px), transparent 100%);
  }
  .figbox.sv-canscroll.sv-atstart {
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 34px), transparent 100%);
            mask-image: linear-gradient(to right, #000 calc(100% - 34px), transparent 100%);
  }
  .figbox.sv-canscroll.sv-atend {
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 34px, #000 100%);
            mask-image: linear-gradient(to right, transparent 0, #000 34px, #000 100%);
  }
  .figbox.sv-canscroll:focus-visible,
  .figbox.sv-canscroll.sv-atstart:focus-visible,
  .figbox.sv-canscroll.sv-atend:focus-visible {
    -webkit-mask-image: none; mask-image: none;
    outline: 2px solid var(--hl-d-line); outline-offset: 3px;
  }
  @media print {
    .figbox.sv-canscroll,
    .figbox.sv-canscroll.sv-atstart,
    .figbox.sv-canscroll.sv-atend {
      overflow-x: visible; -webkit-mask-image: none; mask-image: none;
    }
  }

  /* ---- 🔴 AN ITEM THE SERVER NEVER TOOK WEARS A SMALL LABEL ----

     🔴 NOT `--broken-wash` BEHIND IT, and the measurement is the reason.
     `--broken` on `--broken-wash` is **4.13:1 in LIGHT**, under the 4.5:1 this
     text size needs, while the same pair in dark is 6.63:1. Straight on the
     panel's `--surface` it is **4.93:1 light and 7.25:1 dark**, so the chip is
     drawn with a border and no fill and both themes clear the bar. Light
     failing first is the same asymmetry the scroll band found from the other
     side: there the light margin was 0.03, here the light pair simply fails.

     ⚠️ It shares `--broken` with the ORPHAN row, and that is deliberate. Both
     say the same class of thing - this is still here and still yours, and
     something about it is not right - and inventing a second attention colour
     for the second such state is how a palette stops meaning anything. The
     WORDING is what separates them, and neither of them says "error".

     ⚠️ NO `@media print` RULE HERE, and its absence is the considered half.
     Every one of these chips lives inside `.hl-panel`, which `shell.html` already
     hides with `display: none !important` when printing. A print rule would look
     like care and execute never, which is the "a comment that promises more than
     its test delivers" class this project keeps catching. */
  .sv-unsaved {
    font: 600 11.5px/1.35 var(--body);
    color: var(--broken);
    border: 1px solid var(--broken);
    border-radius: 4px;
    padding: 2px 6px;
    align-self: center;
    white-space: nowrap;
  }

  /* 🔴 The shell's `.row` is a flex line that does NOT wrap, so adding a chip
     to a full row on a narrow panel pushes `Remove` out of reach. Only the rows
     that actually carry a chip are changed, so a healthy panel keeps the exact
     layout it has today. */
  .sv-unsavedrow { flex-wrap: wrap; }

  /* ---- 🔴 THE SCROLL AFFORDANCE, SHARED BY EVERY SCROLLING PANE ----

     WHY THIS IS A FAMILY AND NOT A POPOVER FIX. EH's complaint was never about
     the popover: it was CONTENT BELOW A FOLD WITH NOTHING ANNOUNCING IT. The
     first version shipped into `.sv-body` alone, and the entry that closed it
     was written as though the popover were the defect. It was an instance. QA
     swept for the condition and found nine more scrolling panes.

     🔴 THE WORKED CASE, and it is why this is not cosmetic. Settings is
     `max-height: calc(100vh - 76px)`, so on any window shorter than about
     1075px it scrolls silently. Measured here on a 641px viewport: 1009px of
     content in a 563px pane, 446px hidden, and FOUR controls entirely below the
     fold including `Relaunch the server`, the control a reader wants exactly
     when something is wrong. The visible bottom edge ends on a
     completed-looking "Publish highlights and notes to the vault", so nothing
     even suggests dragging it.

     ⚠️ AND THE CAP THAT HID IT WAS ITSELF A FIX. See the `.sv-set` comment
     above: the cap was added because a short window CLIPPED those same last two
     controls with no way to scroll at all. That fix turned "unreachable" into
     "reachable but undiscoverable", and it names the same control. Worth
     knowing before anybody removes the cap to fix this.

     HOW IT WORKS: two background layers, cover then band.
       - the COVER is `local`, anchored to the bottom of the scrollable content,
         so it travels with it;
       - the BAND is `scroll`, so it stays at the bottom of the scrollport.
     At the end of the scroll the two edges coincide and the cover, being the
     first layer, paints over the band and leaves a clean edge. So the signal is
     TRUTHFUL BY CONSTRUCTION: it appears exactly when there is content below,
     and cannot be a false positive. No scroll listener, no state, no layout.

     🔴 THE COVER COLOUR IS PER PANE AND MUST BE. This is the thing that does
     not survive a copy-paste. `--sv-edge-cover` defaults to `--surface`, but
     `.sv-hist` and `.sv-filetext` are painted `--paper`. A cover that does not
     match its pane never hides the band, which turns a truthful signal into a
     PERMANENT one, and a permanent signal is worse than none.

     🔴 TWO PANES ARE DELIBERATELY EXCLUDED, each for a measured reason.
       - `.sv-pdf` (`:1466`): its `.sv-pdfpage canvas` children are full-width
         and opaque, and a container background paints BEHIND them.
         🔴 CORRECTED 2026-09-01 by `study-hub-qa`, who drove a REAL rendered
         PDF that I could not: this used to say the band would be "invisible over
         any rendered page". Measured on a real two-page transcript, 924px per
         page with 28px gaps: it is hidden at **1309 of 1381 offsets, 94.8 per
         cent**,
         and shows in the inter-page gaps. **That is worse than invisible, not
         better**: an intermittent band reads "nothing below" 94.8 per cent of
         the time while 1381px sits below it, which this family's own rule
         against a false signal already forbids. Same exclusion, firmer ground.
         It also uses `overflow-y: scroll` rather than `auto`, deliberately, for
         the re-render reason documented on that rule. It needs the
         `sv-canscroll` mask vocabulary if it needs anything; it does not need
         this.
         🟢 EXCLUDED IS NOT UNHANDLED, and 2026-09-04 is when the second half
         landed: the pane now styles its OWN scrollbar (`.sv-pdf::-webkit-scrollbar`,
         beside the rule above), which paints in front of the canvases because a
         scrollbar is not a background, and shows a thumb only when there is
         something to scroll. **Read that comment before touching this one.** The
         two are the same decision seen from opposite ends: the band cannot work
         here, so the platform's own affordance was made visible instead.
       - `.sv-matbody` (`:1446`): it declares no overflow of its own. It is a
         flex column whose SCROLLING CHILDREN are `.sv-pdf` and `.sv-filetext`.
         QA measured it as a negative live, 624px of content in a 624px pane.

     🔴 8px, AND THE ARGUMENT IS BOUNDED DAMAGE RATHER THAN HEADROOM. QA swept
     every reachable offset: a line the scrollport has NOT clipped sits under the
     band at 31.4 per cent of desktop offsets and 32.7 per cent at 386px, worst
     case the full 8px. There is no headroom at any height, only a lucky offset,
     and the worst case always EQUALS the band height. So take the SMALLEST
     height that still clears 3:1, which is a far stronger argument against 13px
     and 26px than the "it has 5px of clearance" sentence it replaces. Do not
     read that sentence back into this and raise the height.

     🟢 CLEARANCE WAS CHECKED PER PANE RATHER THAN INHERITED, on the manager's
     instruction, because 8px was tuned for `.sv-body`. The line boxes across
     this family run 19.5px (`.sv-mini .out`, 13px/1.5) to 21.7px (`.sv-src
     .txt`, 14px/1.55), with `.sv-filetext` at 20px (12.5px/1.6). 8px is 37 to
     41 per cent of a line across the whole family, so one height holds.
     `--sv-edge-h` is per pane regardless, so a pane that later grows different
     type can be tuned without touching the mechanism.

     ⚠️ WHAT THIS DOES NOT DO, and the horizontal affordance below DOES: it gives
     a keyboard or screen-reader user nothing. `sv-canscroll` marks its scrollers
     `tabindex="0"`, `role="region"` and labels them "scrolls sideways". These
     panes get a visual band and no such announcement. Out of scope for this
     entry, and raised to the manager rather than done quietly. */
  .sv-mini .out,
  .sv-body,
  .sv-edit .body,
  .sv-filetext,
  .sv-panel .thread,
  .sv-hist,
  .sv-pal,
  .sv-set {
    --sv-edge-cover: var(--surface);
    --sv-edge: rgba(0, 0, 0, .42);
    --sv-edge-0: rgba(0, 0, 0, 0);
    --sv-edge-h: 8px;
    background-image:
      linear-gradient(var(--sv-edge-cover), var(--sv-edge-cover)),
      linear-gradient(to top, var(--sv-edge), var(--sv-edge-0));
    background-position: 0 100%, 0 100%;
    background-size: 100% var(--sv-edge-h), 100% var(--sv-edge-h);
    background-repeat: no-repeat, no-repeat;
    background-attachment: local, scroll;
  }

  /* The two panes painted `--paper` rather than `--surface`. Derived from the
     stylesheet rather than assumed: `.sv-hist` sets it at `:1805`, and
     `.sv-filetext` inherits it from `.sv-fileback` at `:1666`. */
  .sv-hist,
  .sv-filetext { --sv-edge-cover: var(--paper); }

  /* 0.34 white on `--surface` #182328 and 0.42 black on #FBFCFC measure 3.09:1
     and 3.03:1 from the composite, both clearing 3:1. 🔴 Light has 0.03 of
     margin, so if `--surface` is ever lightened the LIGHT theme drops below 3:1
     first, which is the opposite of where anybody would look. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .sv-mini .out,
    :root:not([data-theme="light"]) .sv-body,
    :root:not([data-theme="light"]) .sv-edit .body,
    :root:not([data-theme="light"]) .sv-filetext,
    :root:not([data-theme="light"]) .sv-panel .thread,
    :root:not([data-theme="light"]) .sv-hist,
    :root:not([data-theme="light"]) .sv-pal,
    :root:not([data-theme="light"]) .sv-set {
      --sv-edge: rgba(255, 255, 255, .34);
      --sv-edge-0: rgba(255, 255, 255, 0);
    }
  }
  :root[data-theme="dark"] .sv-mini .out,
  :root[data-theme="dark"] .sv-body,
  :root[data-theme="dark"] .sv-edit .body,
  :root[data-theme="dark"] .sv-filetext,
  :root[data-theme="dark"] .sv-panel .thread,
  :root[data-theme="dark"] .sv-hist,
  :root[data-theme="dark"] .sv-pal,
  :root[data-theme="dark"] .sv-set {
    --sv-edge: rgba(255, 255, 255, .34);
    --sv-edge-0: rgba(255, 255, 255, 0);
  }

  /* Paper has no fold, so the signal is meaningless and the tint is not. The
     horizontal affordance below drops its mask in print for the same reason. */
  @media print {
  .sv-mini .out,
  .sv-body,

<script>
(function () {
  'use strict';

  /* ---------- R29: make the page render at the width of the screen ----------

     🔴 This runs BEFORE every other gate in this file, including the one that
     makes the layer inert away from the local server, and that is deliberate.
     A page with no viewport meta is laid out by a phone at 980px and then
     scaled down to fit, which is not a small defect: it is the reason R18's
     entire mobile mode has never run. That is true of this note wherever it is
     opened, on the server, from the disk, or published, so the fix is not
     something to make conditional on the server being there.

     The tag is normally already in the file, put there at the top of the head
     by apply_layer.py, which is where it belongs: applied at parse time it
     costs no reflow, while doing it from here means a phone lays the page out
     once at 980px before this line corrects it. This is the belt to that
     braces, for a file that has not been through the build, and it stands
     down the moment it finds a tag already there rather than adding a second.

                                 the home indicator instead of zero.
       interactive-widget=…      so the layout viewport shrinks when the keyboard
                                 opens rather than sliding the page under it.

                                 which is what --sv-kb below is for.

     sit on top of it instead of underneath it.

     Chrome honours interactive-widget=resizes-content, so the layout viewport

       whatever is covering the visual viewport, and on iOS that is usually
       Safari's own toolbar, which appears and disappears as you scroll.

       the phone by the height of the toolbar, showing four lines of the lesson
       under the Ask box, and it came and went with no pattern he could see

    tokenBar.innerHTML =

      '<input type="password" autocomplete="off" spellcheck="false" placeholder="paste the token">' +
