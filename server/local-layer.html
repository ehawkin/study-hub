      .sv-burger  { display: flex; }
    }
  }

  /* ---- R19: the right-hand pane can be dragged wider ----

     Asked 2026-08-13: "Now that we have the materials section on the left-hand
     side, it would be great if we could resize that right-hand pane." The slide
     deck R11 puts in there is the first thing the pane has held that has its own
     idea of how wide it wants to be; 440px was chosen when the pane only ever
     held text.

     A 5px strip is too thin to hit, so the target is 11px wide and sits half
     outside the panel, while the line he sees is 1px of it. That is the usual
     trick for a window split, and it is why the grip has no background of its
     own until it is hovered. */
  .sv-grip {
    position: absolute; left: -5px; top: 0; bottom: 0; width: 11px; z-index: 2;
    cursor: col-resize; background: none; border: 0; padding: 0;
    -webkit-appearance: none; appearance: none;
  }
  .sv-grip::before {
    content: ''; position: absolute; left: 5px; top: 0; bottom: 0; width: 1px;
    background: var(--rule);
  }
  .sv-grip:hover::before, .sv-grip:focus-visible::before, html.sv-dragging .sv-grip::before {
    left: 4px; width: 3px; background: var(--hl-d-line);
  }
  .sv-grip:focus-visible { outline: none; }

  /* 🔴 Held on <html> for the length of a drag, because the pointer leaves
     the grip immediately and everything it crosses would otherwise fight it: an
     iframe swallows pointer events outright, which is exactly what the slide
     deck is, and text selection turns a drag over the lesson into a highlight.
     pointer-events:none on the panels is what lets the deck be dragged past. */
  html.sv-dragging { cursor: col-resize; }
  html.sv-dragging, html.sv-dragging * { user-select: none; -webkit-user-select: none; }
  html.sv-dragging .sv-panel, html.sv-dragging .hl-panel { pointer-events: none; }
  html.sv-dragging .sv-grip { pointer-events: auto; }

  @media print { .sv-grip { display: none !important; } }

  @media print {
    .sv-head, .sv-menu { display: none !important; }
    html.sv-head-on body { padding-top: 0; }
  }

  /* ---- R18 item 4: below 900px the panel is the screen ----

     Asked 2026-08-13: "consider how to best design a mobile mode."

     R4 reflows the note out from under an open panel, and deliberately stops
     doing it below 900px because a 440px panel on a 390px screen leaves nothing
     to reflow into. That left the panel as a 96vw overlay with a sliver of note
     showing down one edge, which reads as a mistake rather than a mode.

     🔴 Done by moving the variable rather than by overriding two widths. The
     chat panel reads --sv-panel-w and R6 made the notes panel read it too, so
     one line covers both, and anything measuring the panel later still measures
     the truth. setPanelSpace still runs and still reserves the width, but the
     rule that spends the reservation is inside @media (min-width: 900px), so
     nothing reflows and nothing needs a second breakpoint to agree with. */
  @media (max-width: 899px) {
    :root { --sv-panel-w: 100%; }
    .sv-panel, .hl-panel { left: 0; border-left: 0; box-shadow: none; }
    /* Nothing to drag against when the pane is the screen. */
    .sv-grip { display: none; }

    /* Full-screen means the way out has to be obvious and hittable: there is no
       edge of the note left to click on, which is how an overlay is normally
       dismissed. Escape also closes both, added in the script for the same
       reason. */
    .sv-panetabs button { min-height: 46px; font-size: 14px; }
    .sv-panel header [data-close],
    .sv-panel header [data-hist],
    .sv-panel header [data-bmchat] { min-height: 40px; padding: 0 14px; }
  }

  /* ================= R29: the mobile mode, switched on =================

     Asked 2026-08-15: "Go ahead and implement a mobile mode. Take into account
     all of our features and make sure everything works well on mobile from a UX
     standpoint."

     🔴 R18 built a mobile mode on 2026-08-13 and not one line of it has ever
     run on a phone, because none of the 30 files in notes/ carried a viewport
     meta tag. Without that tag a phone does not lay out at the device's width:
     it lays out at 980px and scales the result down. So `max-width: 899px` never
     matched, the hamburger never appeared, the pane was never full-screen, and
     16.5px body text arrived at about 6.5px. Everything R18 measured that day
     was true, and none of it was true on a phone. The tag is installed at the
     top of every lesson by apply_layer.py and by hand in the hub; everything
     below is what having it exposes.

     Three ideas run through this block.

     🔴 **Anything that floats becomes a sheet at the bottom.** Placing a surface
     beside the selection is a pointer idea: it assumes room either side, and a
     drag to move it when there is not. On a phone there is no room, the drag is
     wired to mousedown/mousemove so on a touch screen it does not work at all,
     and the placement code knows nothing about the 52px fixed header it can
     land under. A sheet pinned to the bottom edge is always on screen, always
     the same shape, and always under the thumb. It also removes the class of bug
     that made this necessary: the selection toolbar is 487px wide, which cannot
     be clamped into a 390px screen by any amount of arithmetic, so Look up, Ask
     and Rewrite simply sat past the right edge.

     **Nothing a finger has to hit is under 44px, and no form control is under
     16px.** The second is not taste. Below 16px, iOS Safari zooms the page in
     when the control takes focus and does not zoom back out, so the reader is
     left at 1.3x with the text running off the side. Fifteen controls were
     under it, including every note box and the chat composer.

     **The viewport is not the screen.** A notch takes the top, a home indicator
     takes the bottom, and the keyboard takes up to half. env() covers the first
     two, and --sv-kb (set from the VisualViewport API) covers the third. */

  :root { --sv-kb: 0px; }

  /* The notch, and the home indicator. viewport-fit=cover is what makes these
     report anything but zero, and it is set in the same meta tag. */
  .sv-head { padding-left: max(14px, env(safe-area-inset-left));
             padding-right: max(14px, env(safe-area-inset-right)); }

  @media (max-width: 899px) {
    /* A tap should not wait 300ms to find out whether it was a double tap, and
       should not paint a grey rectangle while it decides. */
    .sv-head, .sv-menu, .sv-panel, .hl-panel, .sv-pop, .sv-mini, .sv-pal,
    .sv-set, .sv-edit, .hl-bar, .sv-token, .sv-badge {
      -webkit-tap-highlight-color: rgba(0,0,0,0);
    }
    .sv-head button, .sv-head a, .sv-menu button, .sv-panel button, .hl-panel button,
    .sv-pop button, .sv-mini button, .sv-pal button, .sv-set button, .sv-edit button,
    .hl-bar button, .sv-token button, .sv-badge, .tblwrap, .figbox {
      touch-action: manipulation;
    }

    /* Scrolling a pane to its end should not then scroll the lesson behind it,
       and should not trigger the browser's pull-to-refresh. */
    .sv-panel .thread, .sv-hist, .hl-scroll, .sv-body, .sv-matbody,
    .sv-set, .sv-mini .out { overscroll-behavior: contain; }

    /* The page behind a full-screen pane. lockPage() pins the body; these two
       stop the document itself from having anything left to scroll, and stop a
       drag that starts on the pane from being handed to the page underneath. */
    html.sv-locked, html.sv-locked body { overflow: hidden; overscroll-behavior: none; }
    /* The sync badge is fixed to the viewport rather than to the body, so it
       does not move with the lock. Its z-index already puts it under the pane,
       so this is belt and braces for the moment the pane is opening or closing
       and has not covered the screen yet; in the screenshot from 2026-08-15 it
       is sitting over the lesson text that was showing below the Ask box. */
    html.sv-locked .sv-badge { display: none; }

    html.sv-head-on body { padding-top: calc(var(--sv-head-h) + env(safe-area-inset-top)); }
    .sv-head { height: auto; min-height: var(--sv-head-h);
               padding-top: env(safe-area-inset-top); }
    .sv-menu { top: calc(var(--sv-head-h) + env(safe-area-inset-top)); }

    /* The pane is the screen (R18 item 4), so it owes the same debts: the notch
       above it, the home indicator below it, and the keyboard when the composer
       has focus. Shrinking the pane rather than sliding it is what keeps the
       composer visible instead of merely on the page. */
    .sv-panel, .hl-panel {
      top: env(safe-area-inset-top);
      bottom: var(--sv-kb);
      padding-bottom: env(safe-area-inset-bottom);
    }
  }

  /* ---- 640px: where a surface stops being placed and starts being a sheet ----

     🔴 Two breakpoints rather than one, on EH's answer of 2026-08-15. R29
     shipped with everything at 899px, which is where R18 decided the pane is the
     whole screen, and that put the bottom sheets on a 768px tablet as well. His
     call, and it is the better one: at 768px there IS room beside the selection,
     and a control that appears where you are already looking is easier to hit
     than one at the far edge of a big screen. The forced case is a phone, where
     the toolbar is 487px wide and cannot fit at all.

     So the split runs along what each rule is FOR. Everything about being a
     touch device stays at 899px: finger-sized targets, 16px form controls (iPadOS
     Safari zooms on focus below that exactly as the phone does), safe areas, the
     tap delay, and the full-screen pane. Only the rules that MOVE a surface to
     the bottom edge come down here, plus the narrow gutter, which is a phone
     measure and would just be a tight margin on a tablet. */
  @media (max-width: 640px) {
    /* 🔴 The layer cannot reach the inside of the lesson's own type scale, but
       it can reach the page's gutter, and 24px each side of a 390px screen
       spends a seventh of the line on nothing. */
    body { padding-left: max(15px, env(safe-area-inset-left));
           padding-right: max(15px, env(safe-area-inset-right)); }

    /* 🔴 And narrowing the gutter is not free, which is worth saying because it
       was not obvious and the browser caught it rather than the reading did.
       R7's bookmark marker is drawn OUTSIDE the block it marks, at left:-18px,
       so it was living in that gutter: 24px of padding left it 6px of clearance
       and 15px puts it at -3px, off the side of the screen. It moves in to
       -11px here, which is 4px clear of the edge and still outside the text. */
    .wrap [data-hb].sv-bm::before { left: -11px; }

    /* ---- the selection toolbar, as a bar across the bottom ----

       🔴 !important throughout, and that is the mechanism rather than a shortcut.
       The lesson's own onSelect() writes `top` and `left` as inline styles on
       every selection, from arithmetic that cannot know about a fixed header or
       a screen narrower than the bar. A stylesheet declaration marked important
       beats an inline one that is not, so this wins without a single edit to any
       of the 29 files, and without disabling the code that keeps working
       perfectly well on a desktop. `display` is deliberately NOT set here:
       .hl-bar[hidden] is what hides it. */
    .hl-bar {
      position: fixed !important;
      left: max(8px, env(safe-area-inset-left)) !important;
      right: max(8px, env(safe-area-inset-right)) !important;
      top: auto !important;
      bottom: calc(8px + var(--sv-kb) + env(safe-area-inset-bottom)) !important;
      width: auto !important;
      flex-wrap: wrap;
      justify-content: center;
      padding: 7px;
      gap: 6px;
    }
    .hl-bar button { min-height: 44px; font-size: 13.5px; padding: 6px 13px; }
    /* The rule between marking and asking reads as a divider on one line and as
       a stray tick once the row wraps. */
    .hl-bar .sv-sep { display: none; }

    /* ---- the popover, as a sheet ---- */
    .sv-pop, .sv-pop.chat {
      position: fixed !important;
      left: 0 !important;
      right: 0 !important;
      top: auto !important;
      bottom: var(--sv-kb) !important;
      width: auto !important;
      max-width: none !important;
      max-height: 86vh;
      max-height: 86dvh;
      display: flex;
      flex-direction: column;
      border-width: 1px 0 0;
      border-radius: 13px 13px 0 0;
      box-shadow: 0 -12px 40px rgba(0,0,0,.34);
      padding-bottom: env(safe-area-inset-bottom);
    }
    /* Specificity 0,2,0 against the 0,1,0 above, so hiding still wins. */
    .sv-pop[hidden] { display: none; }
    /* The body is the part that should give, so the title, the tabs, the ask box
       and the footer stay put while the answer grows. */
    .sv-pop .sv-body { max-height: none; flex: 1 1 auto; min-height: 0; }
    /* There is nowhere to drag it to, and the drag never worked on touch. */
    .sv-pop-head { cursor: default; }
    .sv-pop-head .t { font-size: 17px; }
    .sv-pop-head button { min-height: 40px; padding: 6px 14px; font-size: 13px; }
    .sv-tabs { padding: 10px 13px 0; flex-wrap: wrap; }
    .sv-tabs button { min-height: 40px; padding: 6px 16px; font-size: 13.5px; }
    .sv-foot button { min-height: 40px; padding: 6px 13px; font-size: 12.5px; }
    .sv-foot .links { flex: 0 0 100%; margin-left: 0; justify-content: flex-start; }
    .sv-foot .links a { padding: 9px 0; font-size: 13px; }
    .sv-pickbtn { min-height: 38px; padding: 6px 14px; font-size: 12.5px; }
    /* A region picture is the answer to the question on a phone even more than
       on a desktop, where there is no room to put anything beside it. */
    .sv-src figure.sv-region img { height: 190px; }

    /* ---- looking something up from inside an answer, as a sheet ---- */
    .sv-mini {
      left: 0 !important;
      right: 0 !important;
      top: auto !important;
      bottom: var(--sv-kb) !important;
      width: auto !important;
      max-width: none !important;
      border-width: 1px 0 0;
      border-radius: 13px 13px 0 0;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .sv-mini .row { padding: 8px; gap: 7px; }
    .sv-mini button { min-height: 44px; flex: 1 1 0; font-size: 13.5px; }
    .sv-mini .out { max-height: 40vh; }

    /* ---- the colour palette, as a sheet ---- */
    .sv-pal {
      position: fixed !important;
      left: 0 !important;
      right: 0 !important;
      top: auto !important;
      bottom: var(--sv-kb) !important;
      width: auto !important;
      max-width: none !important;
      max-height: 80vh;
      max-height: 80dvh;
      overflow-y: auto;
      border-width: 1px 0 0;
      border-radius: 13px 13px 0 0;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }
    .sv-swatch { padding: 9px 8px; }

<script>
(function () {
  'use strict';

  /* ---------- R29: make the page render at the width of the screen ----------

     🔴 This runs BEFORE every other gate in this file, including the one that
     makes the layer inert away from the local server, and that is deliberate.
     A page with no viewport meta is laid out by a phone at 980px and then
     scaled down to fit, which is not a small defect: it is the reason R18's
     entire mobile mode has never run. That is true of this note wherever it is
     opened, on the server, from the disk, or published, so the fix is not
     something to make conditional on the server being there.

     The tag is normally already in the file, put there at the top of the head
     by apply_layer.py, which is where it belongs: applied at parse time it
     costs no reflow, while doing it from here means a phone lays the page out
     once at 980px before this line corrects it. This is the belt to that
     braces, for a file that has not been through the build, and it stands
     down the moment it finds a tag already there rather than adding a second.

       viewport-fit=cover        so env(safe-area-inset-*) reports the notch and
                                 the home indicator instead of zero.
       interactive-widget=…      so the layout viewport shrinks when the keyboard
                                 opens rather than sliding the page under it.
                                 Chrome honours it; anything else ignores it,
                                 which is what --sv-kb below is for.

     and the 48 diagrams are wider than any phone by design, and pinch-zoom is
     how they are read. */

     a desktop that is 0px and means nothing. On a phone with the keyboard open
     it is the height of the keyboard, so a sheet carrying a text box rises to
     sit on top of it instead of underneath it.

     🔴 The two engines need opposite treatment and this reads both correctly.
     Chrome honours interactive-widget=resizes-content, so the layout viewport
     itself shrinks: innerHeight and visualViewport.height fall together and
     this returns 0, which is right, because the sheet has already moved. iOS
     ignores the hint and shrinks only the VISUAL viewport, so innerHeight stays

     viewport up, and without it the sheet overshoots by that amount. */

    if (!vv) return;

       whatever is covering the visual viewport, and on iOS that is usually
       Safari's own toolbar, which appears and disappears as you scroll.

       the phone by the height of the toolbar, showing four lines of the lesson
       under the Ask box, and it came and went with no pattern he could see
       because the toolbar does. The first guard was `covered < 24`, which is
       far below a toolbar.

       **a text field having focus**. No caret, no keyboard, whatever the two
       viewports say. The floor stays as a second net, set above any browser
       chrome and below any soft keyboard. */

    vv.addEventListener('scroll', onChange);

    document.addEventListener('focusout', function () { window.setTimeout(measure, 60); }, true);

    /^(127\.0\.0\.1|localhost|\[::1\])$/.test(location.hostname) ||
    /^100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\./.test(location.hostname)  /* Tailscale */

  var caps = { explain: false, model: '', vault: true };

  var LEVEL_KEY = 'kcl-study-level';

     to be asked for inside the question itself. "explained" is MSc level with
     every technical term unpacked as it arrives. */
  var level = 'explained';
  try { level = window.localStorage.getItem(LEVEL_KEY) || 'explained'; } catch (e) {}

      'It is the <code>token</code> line in <code>~/.kcl-study/config.json</code> on the ' +
      'machine running the server. To print it, run this in a terminal there:<br>' +
      '<code>python3 -c "import json,pathlib;print(json.loads(pathlib.Path.home()' +
      '.joinpath(\'.kcl-study/config.json\').read_text())[\'token\'])"</code><br>' +

     highlight, ask, and so forth menu. I wonder if it's because mobile
     selection acts differently."

     🔴 He is right, and the cause is one line in each lesson: the toolbar is
     raised from `mouseup` and `keyup`, and a phone produces neither for the
     gesture that makes a selection. iOS synthesises mouse events for a tap, not
     for a long press and drag, and moving the grab handles afterwards fires
     `selectionchange` alone. **So the toolbar has never once appeared on a
     phone**, and everything R29 did to place it was about where it sits after
     it appears. Same shape of finding as the missing viewport tag.

     `onSelect` lives in the lesson's closure and cannot be called from here, so
     this dispatches the event the lesson is already listening for. The lesson's
     own handler ignores events aimed at the bar, and a dispatched event's
     target is the document, which that guard already tolerates. */

       mousedown whose mouseup lands outside the window, or is swallowed by a
       drag, would leave a boolean stuck at true and this feature dead for the

       tested. A press older than four seconds is not a drag any more. */

         raising the bar while the drag is still running fights the drag.

         🔴 The window is short and a recent touch skips the check entirely,
         because the cost of being wrong here is one-sided. Suppressing wrongly
         means the bar never appears, which is the whole defect; showing wrongly
         means it appears a moment early during a drag and is then repositioned
         by the mouseup that follows. iOS synthesises a mousedown for a tap, so
         a tap followed by a long press would otherwise land inside the window

             abandoning here means the bar never appears for that selection. It

         the toolbar is somebody else's business. */
      if (!el.closest('.wrap')) return;
      if (el.closest('.hl-panel') || el.closest('.sv-panel') || el.closest('.sv-edit') ||

     numeric") and the badge would sit there saying "not saved" forever, which

        topicTitle: S.vault.topic,

        d.className = 'sv-focus';
        d.style.left = (rect.left + window.scrollX) + 'px';
        d.style.top = (rect.top + window.scrollY) + 'px';
        d.style.width = rect.width + 'px';
        d.style.height = rect.height + 'px';
        focusBox.appendChild(d);
      });
    });
  }

  function showFocus(segments) {
    focusOn = (segments && segments.length) ? segments : null;
    drawFocus();
  }

  function clearFocus() {
    focusOn = null;
    focusBox.innerHTML = '';
  }

  window.addEventListener('resize', drawFocus);


  /* Clicking back on the page is the signal that you are done with it. Clicks
     inside any of the layer's own surfaces are not. */
  document.addEventListener('mousedown', function (e) {
    if (!focusOn) return;
    var t = e.target;
    if (t.closest && (t.closest('.sv-pop') || t.closest('.sv-panel') ||
                      t.closest('.sv-mini') || t.closest('.sv-edit') ||
                      t.closest('.sv-set') || t.closest('.hl-bar') ||
                      t.closest('.sv-wipe') || t.closest('.hl-panel'))) return;
    clearFocus();
  });

  /* ---------- the popover ---------- */

  var pop = document.createElement('div');
  pop.className = 'sv-pop';
  pop.hidden = true;
  pop.innerHTML =
    '<div class="sv-pop-head"><span class="t"></span><button type="button" data-x>Close</button></div>' +
    '<div class="sv-tabs">' +
      '<button type="button" data-tab="lookup">Look up</button>' +
      '<button type="button" data-tab="explain">Ask</button>' +
      '<span class="lvl"><label for="svLevel">answers</label>' +
        '<select id="svLevel">' +
          '<option value="plain">plain</option>' +
          '<option value="explained">terms explained</option>' +
          '<option value="technical">technical</option>' +
        '</select></span>' +
    '</div>' +
    '<div class="sv-body"></div>' +
    '<div class="sv-ask" hidden>' +
      '<textarea rows="1" placeholder="Ask about this. Enter sends, Shift+Enter for a new line."></textarea>' +
      '<button type="button" data-explain title="Just explain it">Explain</button>' +
      '<button type="button" data-send>Ask</button>' +
    '</div>' +
    '<div class="sv-foot">' +
      '<button type="button" data-keep disabled>Keep in this lesson</button>' +
      '<button type="button" data-panel hidden>Move to panel</button>' +
      '<span class="links"></span>' +
    '</div>';
  document.body.appendChild(pop);

  var popTitle = pop.querySelector('.t');
  var popBody  = pop.querySelector('.sv-body');
  var popLinks = pop.querySelector('.links');
  var keepBtn  = pop.querySelector('[data-keep]');
  var tabs     = pop.querySelectorAll('[data-tab]');
  var ask      = pop.querySelector('.sv-ask');
  var askBox   = ask.querySelector('textarea');
  var askBtn   = ask.querySelector('[data-send]');
  var toPanel  = pop.querySelector('[data-panel]');

  /* Carry the conversation out of the popover and onto the side, where it is
     saved and can be reopened. The popover is for a quick answer; anything you
     want to keep talking about should not be sitting over the text. */
  toPanel.addEventListener('click', function () {
    if (!chat.length || !current) return;
    var c = newChat(current.term, current.context, current.b);
    c.turns = chat.slice();
    c.segments = current.segments || null;
    chats.push(c);

    /* An answer still on its way is handed over rather than abandoned. */
    if (inflight) {
      inflight.moved = c;
      c.pending = 'Thinking.';
    }
    saveChats();

    var keep = current.segments;
    closePop();
    openPanel(c);
    if (c.pending) panelBusy(true);
    /* The conversation moved, not ended, so what it is about stays marked. */
    showFocus(keep);
  });

  function autosize() {
    askBox.style.height = 'auto';
    askBox.style.height = Math.min(120, askBox.scrollHeight) + 'px';
  }
  askBox.addEventListener('input', autosize);
  askBox.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendFollowup(); }
    /* The popover closes on Escape, which would throw away the conversation
       mid-sentence, so the field swallows it and only blurs. */
    if (e.key === 'Escape') { e.stopPropagation(); askBox.blur(); }
  });
  askBtn.addEventListener('click', function () { sendFollowup(); });
  pop.querySelector('[data-explain]').addEventListener('click', function () {
    if (!current) return;
    /* The thread has to record WHAT was asked about, not just the answer,
       because it is read later in the panel with the page long gone. */
    if (chat.length) {
      /* A repeat is a real instruction, so it is sent as well as shown. The
         first one sends nothing and lets the server use its own phrasing, which
         means what the thread shows and what was asked still agree. */
      sendAsk('Explain that again, more plainly.', 'Explain that again, more plainly.');
    } else {
      sendAsk('', 'Explain: “' + current.term + '”');
    }
  });

  var levelSel = pop.querySelector('#svLevel');
  levelSel.value = level;
  levelSel.addEventListener('change', function () {
    level = levelSel.value;
    try { window.localStorage.setItem(LEVEL_KEY, level); } catch (e) {}
    S.toast(level === 'plain' ? 'Answers will be in plain language.'
          : level === 'technical' ? 'Answers will assume the vocabulary.'
          : 'Answers will be technical, with every term explained as it goes.');
  });

  /* ---------- drag the popover by its header ---------- */

  (function () {
    var head = pop.querySelector('.sv-pop-head');
    var from = null;
    head.addEventListener('mousedown', function (e) {
      if (e.target.closest('button')) return;
      /* R29: below 640px the popover is a sheet fixed to the bottom edge, and
         the CSS that pins it there is marked important, so a drag would set
         inline coordinates that never apply and leave `anchor` null, which is
         what placePop() needs to keep the sheet in step with a growing answer.
         Nothing to drag to, so nothing starts. Above 640px it is placed beside
         the selection again, so the drag comes back with it. */
      if (window.matchMedia && window.matchMedia('(max-width: 640px)').matches) return;
      var box = pop.getBoundingClientRect();
      /* Switch to viewport coordinates once dragged, so it stays put while the
         page scrolls under it. */
      from = { x: e.clientX, y: e.clientY, left: box.left, top: box.top };
      pop.style.position = 'fixed';
      pop.style.left = box.left + 'px';
      pop.style.top = box.top + 'px';
      anchor = null;
      e.preventDefault();
    });
    window.addEventListener('mousemove', function (e) {
      if (!from) return;
      var w = pop.offsetWidth, h = pop.offsetHeight;
      var x = Math.min(Math.max(4, from.left + e.clientX - from.x), window.innerWidth - w - 4);
      var y = Math.min(Math.max(4, from.top + e.clientY - from.y), window.innerHeight - h - 4);
      pop.style.left = x + 'px';
      pop.style.top = y + 'px';
    });
    window.addEventListener('mouseup', function () { from = null; });
  })();

  var current = null;   /* {term, context, b} */
  var keepable = null;  /* {term, text, source} */
  var anchor = null;    /* the selection rect the popover is pinned to */

  pop.querySelector('[data-x]').addEventListener('click', closePop);
  pop.addEventListener('mousedown', function (e) { if (e.target === pop) e.preventDefault(); });

  function closePop() {
    pop.hidden = true;
    current = null; keepable = null; anchor = null;
    chat = [];
    ask.hidden = true;
    toPanel.hidden = true;
    pop.classList.remove('chat');
    clearFocus();
  }

  /* Called again every time the body changes. Placing once, while the popover
     is still an empty box, puts a 500px panel below the fold the moment an
     answer arrives. */
  function placePop() {
    if (!anchor) return;
    pop.hidden = false;
    var h = pop.offsetHeight;
    var below = anchor.bottom + window.scrollY + 9;
    var above = anchor.top + window.scrollY - h - 9;
    var room = (window.scrollY + window.innerHeight - 8) - below;

    var top = below;
    if (h > room && above > window.scrollY + 4) {
      top = above;
    } else if (h > room) {
      top = Math.max(window.scrollY + 8, window.scrollY + window.innerHeight - h - 8);
    }
    var left = anchor.left + window.scrollX + (anchor.width / 2) - (pop.offsetWidth / 2);
    left = Math.max(8, Math.min(left, document.documentElement.clientWidth - pop.offsetWidth - 8));
    pop.style.top = top + 'px';
    pop.style.left = left + 'px';
  }

  function setTab(name) {
    Array.prototype.forEach.call(tabs, function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-tab') === name));
    });
  }

  function msg(text) {
    popBody.innerHTML = '';
    var d = document.createElement('div');
    d.className = 'sv-msg';
    d.textContent = text;
    popBody.appendChild(d);
    placePop();
  }

  function open(term, context, b, rect, tab, segments) {
    current = { term: term, context: context, b: b, segments: segments || null };
    showFocus(segments);
    keepable = null;
    keepBtn.disabled = true;
    /* A new selection is a new subject, so the previous conversation ends. */
    chat = [];
    ask.hidden = true;
    toPanel.hidden = true;
    pop.classList.remove('chat');
    askBox.value = '';
    chatBusy(false);
    popTitle.textContent = term.length > 90 ? term.slice(0, 90) + '…' : term;

    var q = encodeURIComponent(term);
    popLinks.innerHTML =
      '<a target="_blank" rel="noopener" href="https://scholar.google.com/scholar?q=' + q + '">Scholar</a>' +
      '<a target="_blank" rel="noopener" href="https://pubmed.ncbi.nlm.nih.gov/?term=' + q + '">PubMed</a>' +
      '<a target="_blank" rel="noopener" href="https://www.google.com/search?q=' + q + '">Google</a>';

    anchor = rect;
    /* A previous drag left it fixed; placePop works in page coordinates. */
    pop.style.position = '';
    pop.hidden = false;
    placePop();
    (tab === 'explain' ? runExplain : runLookup)();
  }

  function runLookup() {
    setTab('lookup');
    if (!current) return;
    /* The conversation is not thrown away by looking something up; it is still
       there when the Explain tab comes back. */
    ask.hidden = true;
    pop.classList.remove('chat');
    msg('Looking up…');
    var term = current.term;
    api('/api/lookup?q=' + encodeURIComponent(term)).then(function (r) {
      if (!current || current.term !== term) return;
      var sources = (r.body && r.body.sources) || [];
      /* R28. No definition, but the server knows which regions the phrase could
         mean, so the choice is still worth offering rather than a dead end. */
      if (!sources.length && !((r.body && r.body.suggest) || []).length) {
        return msg('Nothing found for that. Try a shorter selection, or ask Explain, ' +
                   'which reads the sentence around it.');
      }
      popBody.innerHTML = '';
      sources.forEach(function (s) {
        var box = document.createElement('div');
        box.className = 'sv-src';

        var lab = document.createElement('span');
        lab.className = 'lab';
        lab.textContent = s.source + (s.title && s.title !== term ? ' · ' + s.title : '');
        box.appendChild(lab);

        /* 🔴 Built with createElement, not innerHTML, because the src comes
           back from Wikipedia through the server and this is the one string here
           that did not originate in the repo. It also means a broken URL removes
           the figure rather than leaving a broken-image icon in the popover. */
        if (s.image && s.image.src) {
          var fig = document.createElement('figure');
          fig.className = 'sv-region';
          var im = document.createElement('img');
          im.src = s.image.src;
          im.alt = 'Where ' + (s.title || 'this structure') + ' sits in the brain';
          /* 🔴 NOT loading="lazy", and this is the FOURTH time this project has
             been caught by the same thing: machinery that waits for the viewport
             does not run in a tab that is not painting. rAF, ResizeObserver's
             first callback and smooth scrollIntoView were the other three.
             Measured here: with the attribute the image stayed at naturalWidth 0
             indefinitely; removing it and re-requesting the same URL loaded it at
             189x230. It also buys nothing, because the element is created at the
             moment the popover opens and is on screen immediately, so it was
             never deferring anything. */
          im.addEventListener('error', function () { fig.remove(); });
          fig.appendChild(im);
          var cap = document.createElement('figcaption');
          /* 🔴 The caption now NAMES what the picture is of, and that is a
             correctness fix rather than a flourish. "Location, from Wikipedia"
             let every picture read as a picture of the term that was selected,
             which is not always true: Ventral striatum has no article and no
             picture of its own, so it borrows the striatum's, and a reader who
             was not told would take the whole striatum for the ventral part.
             `shows` comes from the server, which takes it from the glossary's
             picOf where one is set and from Wikipedia's own article title
             otherwise, so it is right for all 31 without a table of exceptions. */
          /* A middot rather than ", from", because several of these captions carry
             a comma of their own ("Striatum, of which this is the lower part")
             and a second one made them read as a list. */
          cap.textContent = (s.image.shows || 'Location') + ' · ' +
                            (s.image.credit || 'Wikipedia');
          fig.appendChild(cap);
          box.appendChild(fig);
        }

        var txt = document.createElement('div');
        txt.className = 'txt';
        txt.textContent = s.text;
        box.appendChild(txt);

        if (s.extra && s.extra.length) {
          var syn = document.createElement('div');
          syn.className = 'syn';
          syn.textContent = 'Also: ' + s.extra.join(', ');
          box.appendChild(syn);
        }
        if (s.url) {
          var a = document.createElement('a');
          a.className = 'more';
          a.href = s.url; a.target = '_blank'; a.rel = 'noopener';
          a.textContent = 'Open';
          box.appendChild(document.createElement('br'));
          box.appendChild(a);
        }
        /* R28. The server resolved a phrase to a name rather than matching it,
           so say which way round that happened. Without this, selecting "the
           posterior cingulate" and being shown "Posterior cingulate cortex"
           reads as though the page had used the longer wording. */
        if (s.resolved && s.title) {
          var res = document.createElement('div');
          res.className = 'syn';
          res.textContent = 'Shown for "' + term + '"';
          box.appendChild(res);
        }

        popBody.appendChild(box);
      });

      /* 🔴 R28. More than one region answers to the selection, and guessing
         between them would put the wrong picture on the page: "cingulate
         cortex" is used 42 times in the module and is anterior in some of them
         and posterior in others. So the choice goes to him, as buttons that
         look the term up again.

         It goes at the TOP, above MeSH and Wikipedia. Measured, not assumed:
         appended at the bottom it landed below two encyclopaedia entries and
         off the end of the popover, so the question being asked was the one
         thing not on screen. */
      var amb = (r.body && r.body.suggest) || [];
      if (amb.length) {
        var pick = document.createElement('div');
        pick.className = 'sv-src sv-pick';
        var plab = document.createElement('span');
        plab.className = 'lab';
        plab.textContent = 'Which one?';
        pick.appendChild(plab);
        amb.forEach(function (name) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'sv-pickbtn';
          b.textContent = name;
          b.addEventListener('click', function () {
            current = { term: name, node: current && current.node };
            runLookup();
          });
          pick.appendChild(b);
        });
        popBody.insertBefore(pick, popBody.firstChild);
      }

      var first = sources[0];
      keepable = first ? { term: term, text: first.text, source: first.source } : null;
      keepBtn.disabled = !first;
      placePop();
    }).catch(function () {
      msg('The lookup failed. The server may have stopped.');
    });
  }

  /* ---------- Explain, as a conversation ---------- */

  var chat = [];   /* [{role:'user'|'claude', text}] for THIS selection */

  /* The request in the air, if any. It is a ticket rather than a bare flag
     because the conversation can move to the panel while the answer is still
     coming: `moved` is then set to the chat that inherited it, and the answer
     is delivered there instead of being dropped on the floor. */
  var inflight = null;

  function renderChat(pendingLine) {
    popBody.innerHTML = '';
    chat.forEach(function (turn) {
      var box = document.createElement('div');
      box.className = 'sv-turn' + (turn.role === 'user' ? ' me' : '');
      var who = document.createElement('span');
      who.className = 'who';
      who.textContent = turn.role === 'user' ? 'You' : ('Claude · ' + (caps.model || ''));
      var txt = document.createElement('div');
      txt.className = 'txt';
      txt.textContent = turn.text;
      box.appendChild(who); box.appendChild(txt);
      popBody.appendChild(box);
    });
    if (pendingLine) {
      var p = document.createElement('div');
      p.className = 'sv-turn pending';
      var t = document.createElement('div');
      t.className = 'txt';
      t.textContent = pendingLine;
      p.appendChild(t);
      popBody.appendChild(p);
    }
    toPanel.hidden = chat.length === 0;
    placePop();
    /* Keep the newest turn in view without yanking the page around. */
    popBody.scrollTop = popBody.scrollHeight;
  }

  function chatBusy(on) {
    askBtn.disabled = on;
    askBox.disabled = on;
  }

  function runExplain() {
    setTab('explain');
    if (!current) return;
    pop.classList.add('chat');
    ask.hidden = false;

    if (!caps.explain) {
      ask.hidden = true;
      return msg('Asking is not available: the Claude Code CLI was not found, or it ' +
                 'is switched off in the config.');
    }
    renderChat();
    askBox.focus();
  }

  /* One path for everything asked about a selection. "Explain this" is a preset
     question rather than a separate mode: explaining is one of the things you
     might want to ask, not a different feature. */
  function sendAsk(question, shownAs) {
    if (!current) return;
    if (!caps.explain) return msg('The Claude Code CLI was not found.');
    setTab('explain');
    pop.classList.add('chat');
    ask.hidden = false;

    var history = chat.map(function (x) { return { role: x.role, text: x.text }; });
    if (shownAs) chat.push({ role: 'user', text: shownAs });
    chatBusy(true);
    renderChat(chat.length > 1 ? 'Thinking.' :
               'Thinking. This takes a few seconds, unlike Look up.');

    var term = current.term;
    var ticket = { term: term, moved: null };
    inflight = ticket;

    function land(text, ok) {
      if (inflight === ticket) inflight = null;

      /* Moved to the panel mid-flight: deliver it there. Before this existed,
         closePop() cleared `current` and the guard below silently threw the
         answer away, so pressing "Move to panel" too early lost it entirely. */
      if (ticket.moved) {
        var c = ticket.moved;
        c.turns.push({ role: 'claude', text: text });
        c.ts = Date.now();
        c.pending = null;
        saveChats();
        panelBusy(false);
        if (!panel.hidden && openChat === c) renderThread();
        return;
      }

      if (!current || current.term !== term) return;
      chatBusy(false);
      chat.push({ role: 'claude', text: text });
      renderChat();
      if (ok) {
        keepable = { term: term, text: text, source: 'Claude' };
        keepBtn.disabled = false;
      }
      askBox.focus();
    }

    api('/api/explain', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        doc: S.docId, term: term, context: current.context,
        question: question || '', level: level, history: history
      })
    }).then(function (r) {
      if (!r.body || !r.body.ok) {
        return land('(' + ((r.body && r.body.error) || 'no answer') + ')', false);
      }
      caps.model = r.body.model || caps.model;
      land(r.body.text, true);
    }).catch(function () {
      land('(could not reach the server)', false);
    });
  }

  function sendFollowup() {
    var q = askBox.value.trim();
    if (!q) { askBox.focus(); return; }
    askBox.value = '';
    autosize();
    sendAsk(q, q);
  }

  Array.prototype.forEach.call(tabs, function (b) {
    b.addEventListener('mousedown', function (e) { e.preventDefault(); });
    b.addEventListener('click', function () {
      (b.getAttribute('data-tab') === 'explain' ? runExplain : runLookup)();
    });
  });

  /* ---------- the chat panel ----------

     The popover is for a quick answer next to the thing you selected. Once a
     conversation is worth keeping it belongs on the side, out of the way of the
     text, where it persists and can be reopened. Chats live in
     notes/<DOC>-chats.json, next to the marks, in Dropbox. */

  var chats = [];        /* every saved conversation for this note */
  var openChat = null;   /* the one on screen */

  var chatFab = document.createElement('button');
  chatFab.type = 'button';
  chatFab.className = 'sv-chatfab';
  chatFab.textContent = 'Chat';
  chatFab.setAttribute('aria-expanded', 'false');
  document.body.appendChild(chatFab);

  var panel = document.createElement('aside');
  panel.className = 'sv-panel';
  panel.hidden = true;
  panel.setAttribute('aria-label', 'Chat');
  panel.innerHTML =
    '<header><strong>Chat</strong><span class="sub"></span>' +
      '<span class="grow">' +
        '<button type="button" data-bmchat aria-pressed="false" hidden>Bookmark</button>' +
        '<button type="button" data-hist aria-pressed="false">History</button>' +
        '<button type="button" data-new>New</button>' +
        '<button type="button" data-close>Close</button>' +
      '</span></header>' +
    '<div class="sv-hist" hidden></div>' +
    '<div class="thread"></div>' +
    '<div class="sv-scope" role="group" aria-label="Answer from the context of">' +
      '<span class="sv-scopelab">Context</span>' +
      '<button type="button" data-scope="lesson" aria-pressed="true">This lesson</button>' +
      '<button type="button" data-scope="topic" aria-pressed="false">This topic</button>' +
      '<button type="button" data-scope="course" aria-pressed="false">Whole course</button>' +
    '</div>' +
    '<div class="sv-ask">' +
      '<textarea rows="1" placeholder="Ask anything about this lesson. Enter sends, Shift+Enter for a new line."></textarea>' +
      '<button type="button" data-send>Ask</button>' +
    '</div>';
  document.body.appendChild(panel);

  /* ---------- the part's own video and slides ----------

     Asked 2026-08-13: "the ability to open up the videos as well as the actual
     slides from inside the note for that particular part."

     Both facts were already recorded, in _admin/KEATS-LINKS.md and
     _admin/MATERIALS-INDEX.md. build_materials.py joins them into
     notes/materials.json and the server serves the row for this doc, so this
     needed no edit to any of the 29 notes.

     The slide deck embeds, because Drive's /preview URL is designed to be
     framed. The lecture does not: KEATS is behind a KCL login and refuses to be
     framed, so its button opens a tab. Pretending otherwise would give a blank
     rectangle instead of a lecture. */

  var matFab = document.createElement('button');
  matFab.type = 'button';
  matFab.className = 'sv-matfab';
  matFab.textContent = 'Materials';
  matFab.setAttribute('aria-expanded', 'false');
  document.body.appendChild(matFab);

  var matPanel = document.createElement('aside');
  matPanel.className = 'sv-panel sv-mat';
  matPanel.hidden = true;
  matPanel.setAttribute('aria-label', 'Slides and lecture for this part');
  matPanel.innerHTML =
    '<header><strong>Materials</strong><span class="sub"></span>' +
      '<span class="grow"><button type="button" data-close>Close</button></span></header>' +
    '<div class="sv-matbar"></div>' +
    /* 🔴 Two children, and that is the fix for the lecture restarting every time
       you glanced at a slide. Everything used to render by overwriting the
       body's innerHTML, which destroyed the <video> element and built a new one
       on the way back, so the recording began again from zero. EH asked for
       it on 2026-08-15. The player now lives in `sv-matkeep` and is HIDDEN
       rather than removed when another view is showing, so it keeps its position,
       its buffer and its volume; everything else renders into `sv-matswap` and
       goes on being rebuilt freely. */
    '<div class="sv-matbody">' +
      '<div class="sv-matkeep" hidden></div>' +
      '<div class="sv-matswap"><p class="sv-matmsg">Loading…</p></div>' +
    '</div>';
  document.body.appendChild(matPanel);

  var matBar  = matPanel.querySelector('.sv-matbar');
  var matBody = matPanel.querySelector('.sv-matbody');
  var matKeep = matPanel.querySelector('.sv-matkeep');
  var matSwap = matPanel.querySelector('.sv-matswap');
  var matData = null;      /* the row, once fetched */
  var matPromise = null;

  /* One fetch feeds two features: this panel and the back/forward pair. */
  function loadMaterials() {
    if (!matPromise) {
      matPromise = api('/api/materials?doc=' + encodeURIComponent(S.docId))
        .then(function (r) { matData = r.body || {}; return matData; })
        .catch(function () {
          matPromise = null;   /* so it can be retried rather than stuck */
          matData = { ok: false, error: 'The server did not answer. Is it running?' };
          return matData;
        });
    }
    return matPromise;
  }

  function matLink(href, label, title) {
    return '<a class="sv-matbtn" href="' + href + '" target="_blank" rel="noopener"' +
           (title ? ' title="' + title + '"' : '') + '>' + label + '</a>';
  }

  /* ---------- R20: the transcript shows in the pane, not only out of it ----------

     Asked 2026-08-13: "when we're in the materials view, I can't see the
     transcript in the side pane, which would be good as well." It was a link
     that opened Drive in a new tab, which is the opposite of being in the pane.

     🔴 The bar was four ways OUT of the pane; two of them are things Drive
     will preview, so those two become a switch and only the genuinely external
     ones stay links. The lecture stays a link because it is a video on KEATS
     behind a separate login and nothing here can embed that.

     The embed URL is derived server side in read_materials() rather than stored,
     so no rebuild of materials.json was needed and all 50 parts gained it at
     once. Checked first: every one of the 50 transcripts is a Drive
     /file/d/<id>/ link, so one derivation covers them all. */

  /* 🔴 R25 asked for the lecture to play in the pane, and KEATS will not
     allow it. Measured, not assumed: the response carries

       content-security-policy: frame-ancestors 'self' https://kaf.keats.kcl.ac.uk
         https://*.kaltura.com moodleappfs://* http://localhost https://localhost

     and this reader is served from the tailnet address, which is on no part of
     that list, so the browser refuses the frame before a byte is drawn. It is
     KCL's decision and nothing here can override it. `localhost` is on the list,
     but the server binds the tailnet IP precisely so both Macs can reach it, and
     he reads from the MacBook where localhost is not this server.

     ✅ R26 got there anyway, by not framing anything. The header above governs
     who may put the KEATS *page* inside a frame; it says nothing about loading a
     media file, and a <video> needs no CORS permission unless it is given a
     crossorigin attribute. KEATS hands its recordings to Kaltura, and Kaltura's
     CDN serves them with no session token at all: checked from this reader's own
     origin and again from a shell with no cookies, both 206 with a fast-start
     H.264 MP4 and byte ranges honoured, so it plays and it seeks.

     So the lecture is now a real view. What is stored for it is one entry id per
     part, harvested once from KEATS into the last column of KEATS-LINKS.md;
     nothing is downloaded and nothing is cached. 41 of the 50 parts have one.
     The other nine are narrated slide packages rather than recordings, so there
     is no video to point at and they keep the button out to KEATS. */
  /* The three labels are EH's own words, 2026-08-14, and they are plural on
     purpose: they name what kind of thing the tab holds rather than counting
     what is in it, which is the reading that survives R8 and R9 attaching more
     files to a lesson. The runtime stays on the first one because it is the
     fact he uses to decide whether to start it now. */
  var VIEWS = [
    { id: 'lecture',    label: 'Videos',      embed: 'video_embed',
      href: 'video',      what: 'Lecture recording',         noun: 'lecture',
      kind: 'video',
      out: 'Open the lecture on KEATS in a new tab' },
    { id: 'slides',     label: 'Slides',      embed: 'slides_embed',
      href: 'slides',     what: 'Slide deck for this part',  noun: 'deck',
      out: 'Open the slide deck in Drive, in a new tab' },
    { id: 'transcript', label: 'Transcripts', embed: 'transcript_embed',
      href: 'transcript', what: 'Transcript of this lecture', noun: 'transcript',
      out: 'Open the transcript in Drive, in a new tab' },
    /* R8 and R9. The fourth item is not a URL, it is a directory, so it carries
       no `embed` and no `href` and is the only view that is ALWAYS offered:
       R9 means the first file has to be attachable from an empty list, and a tab
       that appears once there is something in it could never be used to put the
       something there. */
    { id: 'files',      label: 'Files',       kind: 'files',  always: true,
      what: 'Files attached to this lesson' }
  ];

  /* The box with the arrow coming out of it, which is what he asked for by
     description. Hand-authored so the layer stays self-contained. */
  var ICON_OUT =
    '<svg viewBox="0 0 20 20" width="13" height="13" aria-hidden="true" focusable="false">' +
      '<g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" ' +
         'stroke-linejoin="round">' +
        '<path d="M13.2 11.8 V15.4 H4.6 V6.8 H8.2"/>' +
        '<path d="M11.4 4.6 H15.4 V8.6"/>' +
        '<path d="M15.4 4.6 L9.4 10.6"/>' +
      '</g>' +
    '</svg>';

  var matView = 'slides';
  var matShownSrc = null;      /* so switching back does not reload the iframe */
  var matKeepSrc = null;       /* the src the persistent player was built with */

  function availableViews() {
    /* A view earns its place if it can be shown inline OR opened out. The
       lecture only ever qualifies on the second, which is the whole reason the
       test is written this way. Files qualifies on neither and is always there;
       see the note on the VIEWS entry. */
    return VIEWS.filter(function (v) {
      return v.always || (matData && ((v.embed && matData[v.embed]) || matData[v.href]));
    });
  }

  function renderMaterials() {
    if (!matData || matData.ok === false) {
      matBar.innerHTML = '';
      matShownSrc = null;
      matSwap.innerHTML = '<p class="sv-matmsg">' +
        ((matData && matData.error) || 'Could not load this part\'s materials.') +
        '</p>';
      return;
    }
    var views = availableViews();
    /* A part with no deck should not open on an empty deck view. */
    if (!views.some(function (v) { return v.id === matView; })) {
      matView = views.length ? views[0].id : 'slides';
    }
    var cur = views.filter(function (v) { return v.id === matView; })[0] || null;

    /* Hidden, never emptied. One line in one place, so no branch below can
       forget it and leave the player showing under a slide deck. */
    matKeep.hidden = !(cur && cur.kind === 'video' &&
                       (v_embed(cur) || matData.package_embed));

    /* Every item is now a label that switches the pane joined to a glyph that
       opens the real thing, so the way out is never more than one click from
       whatever is showing. That also stays the fix for a blank frame: the Drive
       embeds only render for someone signed in to the right Google account, and
       that click is what prompts for it. */
    var bits = views.map(function (v) {
      var label = v.label + (v.id === 'lecture' && matData.minutes
                             ? ' · ' + matData.minutes + ' min' : '');
      /* The only count in this bar, and it earns its place where R22's did not:
         "Notes 0 notes" was restating what the panel showed one click away,
         whereas nothing else on screen says whether this lesson has anything
         attached, and the answer is usually nothing. */
      if (v.id === 'files' && matFiles.length) label += ' · ' + matFiles.length;
      var out = matData[v.href]
        ? '<a class="sv-matout" href="' + matData[v.href] + '" target="_blank" rel="noopener"' +
          ' title="' + v.out + '" aria-label="' + v.out + '">' + ICON_OUT + '</a>'
        : '';
      return '<span class="sv-matitem">' +
               '<button type="button" class="sv-matbtn" data-view="' + v.id + '"' +
               ' aria-pressed="' + (v.id === matView ? 'true' : 'false') + '">' +
               label + needChip(v) + '</button>' + out +
             '</span>';
    });
    matBar.innerHTML = bits.join('');

    if (cur && cur.kind === 'files') { matShownSrc = null; renderFiles(); return; }

    if (!cur) {
      matShownSrc = null;
      matSwap.innerHTML = '<p class="sv-matmsg">Nothing is recorded for this part ' +
        'that can be shown here.</p>';
      return;
    }

    /* A mirrored slide package: the whole narrated export is saved on this
       server, so the part plays here with no KEATS session and no internet.
       Same build-once rule as the player below: the iframe IS the running
       player, and rebuilding it on a tab switch would put the narration back
       to the start. */
    if (cur.kind === 'video' && !v_embed(cur) && matData.package_embed) {
      var psrc = matData.package_embed;
      matKeep.hidden = false;
      if (matKeepSrc !== psrc) {
        matKeepSrc = psrc;
        matKeep.innerHTML =
          '<iframe class="sv-matframe sv-matpkg" src="' + psrc +
          '" title="' + cur.what + '" allow="autoplay"></iframe>';
      }
      matShownSrc = null;    /* the swap area is a caption now, not a document */
      matSwap.innerHTML =
        '<p class="sv-matmsg quiet">Playing from your own copy on this server, ' +
        'saved from the course site: slides, narration and all, so it needs no ' +
        'login. The arrow beside "' + cur.label + '" above opens the original ' +
        'on KEATS instead.</p>';
      return;
    }

    /* A narrated slide package that has NOT been mirrored: there is
       no video file to play and no honest way to show one. Saying which of the
       two it is beats an empty box, and the button below is the same link as the
       glyph above. */
    if (!v_embed(cur)) {
      matShownSrc = null;
      matSwap.innerHTML =
        '<div class="sv-matwhy">' +
          '<p>This one cannot be played here. Please open it in a separate tab.</p>' +
          (cur.kind === 'video'
            ? '<p class="sv-matwhy-sub">It is a set of slides with narration that runs on KEATS itself ' +
              'rather than a recording, so there is no video file to play. You will need your KCL login.</p>'
            : '') +
          (matData[cur.href]
            ? '<a href="' + matData[cur.href] + '" target="_blank" rel="noopener">' +
              (cur.out || 'Open it in a new tab') + '</a>'
            : '') +
        '</div>';
      return;
    }

    var src = matData[cur.embed];

    /* The lecture is a media file, not a page, so it gets a player rather than a
       frame. `preload="metadata"` keeps opening the tab cheap: it fetches the
       header and the duration and stops, and nothing streams until it is played.
       The upgrade below then swaps in the better of the two flavours, quietly,
       and leaves this one in place if anything about that fails. */
    if (cur.kind === 'video') {
      /* 🔴 The player is BUILT ONCE and then only shown and hidden. Coming back
         to it must not touch the element at all: setting src again, even to the
         same string, reloads the media and puts the recording back to zero,
         which is the whole defect being fixed. */
      matKeep.hidden = false;
      if (matKeepSrc !== src) {
        matKeepSrc = src;
        matKeep.innerHTML =
          '<video class="sv-matvid" controls preload="metadata" playsinline ' +
            'src="' + src + '"></video>';
        upgradeFlavour(matKeep.querySelector('.sv-matvid'), matData.video_hls, src);
      }
      matShownSrc = null;    /* the swap area is a caption now, not a document */
      /* Two true sentences, chosen by where the file actually is: a local
         copy starts with / (this server), the stream is an absolute URL. */
      matSwap.innerHTML = (src.charAt(0) === '/')
        ? '<p class="sv-matmsg quiet">Playing from your own downloaded copy on ' +
          'this server: no login, works offline. The arrow beside "' + cur.label +
          '" above opens the original instead. Your place is kept if you look at ' +
          'the slides.</p>'
        : '<p class="sv-matmsg quiet">Playing from KCL\'s video service, the same ' +
          'recording KEATS shows. The arrow beside "' + cur.label + '" above opens ' +
          'it on KEATS instead. Your place is kept if you look at the slides.</p>';
      return;
    }

    if (src === matShownSrc) return;      /* already showing it */
    matShownSrc = src;
    /* R49, 2026-08-16: "someone who's not in the program at all might still end
       up using this software, and if they do, they should still have all the
       content and just show that those links are not valid."

       🔴 So the line under a frame says what this link REQUIRES, taken from the
       server, rather than assuming the reader is EH and merely signed into
       the wrong Google account. Nothing detects whether it loaded: a blank frame
       and a login wall look identical from in here, and guessing would be the
       dishonest half of this. The old wording is kept as the fallback for a
       server that does not send `access` yet. */
    matSwap.innerHTML = '<iframe class="sv-matframe" src="' + src +
      '" title="' + cur.what + '" allow="autoplay"></iframe>' +
      '<p class="sv-matmsg quiet">' + accessLine(cur) + '</p>' +
      accessActions(cur);
    /* Reload rather than "try again": after signing in in the other tab, the
       frame here is still showing whatever it got the first time, and there is
       no event that tells us the session changed. Re-setting src is the whole
       mechanism, and it is offered rather than done automatically because
       reloading under someone reading is worse than a button they can ignore. */
    var again = matSwap.querySelector('[data-matreload]');
    if (again) {
      again.addEventListener('click', function () {
        var frame = matSwap.querySelector('.sv-matframe');
        if (frame) frame.src = frame.src;
      });
    }
  }

  function v_embed(v) { return !!(v && v.embed && matData && matData[v.embed]); }

  /* What this view needs in order to open, said plainly. `none` means the file
     is served without any session at all, so there is nothing to say. */
  /* The way out, named for what it will actually do. A KEATS link sends you to
     KEATS to sign in; a Drive link sends you to Drive to sign in; anything that
     needs nothing just opens. */
  /* R49's second half: what a tab will need, shown ON the tab.

     🔴 The requirement is per TAB and not per file, because the two differ. A
     lecture normally plays from the video service with no session at all, so
     Videos needs nothing; the nine narrated parts have no playable file, so the
     same tab falls back to its KEATS link and does need one. Marking the tab
     from `access[embed]` alone would therefore have called every Videos tab
     free, including the ones that are not.

     Empty string means "nothing needed", which is the common case and draws
     nothing. */
  function needOf(v) {
    if (!matData || !matData.access) return '';
    var key = (v.embed && matData[v.embed]) ? v.embed
            : (v.kind === 'video' && matData.package_embed) ? 'package_embed'
            : v.href;
    var need = key ? (matData.access[key] || '') : '';
    return (need && need !== 'none') ? need : '';
  }

  var NEED_LABEL = { keats: 'KEATS', drive: 'Drive' };

  function needChip(v) {
    var need = needOf(v);
    if (!need) return '';
    var says = (matData.access_notes && matData.access_notes[need]) || '';
    return '<span class="sv-matneed" title="' + says + '" aria-label="' + says + '">'
         + (NEED_LABEL[need] || need) + '</span>';
  }

  function accessActions(v) {
    var need = (matData && matData.access && matData.access[v.embed]) || '';
    var href = matData && matData[v.href];
    var label = need === 'keats' ? 'Sign in to KEATS and open it there'
              : need === 'drive' ? 'Open it in Drive, where you can sign in'
              : (v.out || 'Open it in a new tab');
    return '<p class="sv-matacts">' +
      (href ? '<a class="sv-matact" href="' + href + '" target="_blank" rel="noopener">' +
              label + '</a>' : '') +
      '<button type="button" class="sv-matact" data-matreload>Reload this view</button>' +
      '</p>';
  }

  function accessLine(v) {
    var need = (matData && matData.access && matData.access[v.embed]) || '';
    var says = (matData && matData.access_notes && matData.access_notes[need]) || '';
    if (!says) {
      return 'If the ' + v.noun + ' stays blank, you are probably not signed in to ' +
             'the account that can see it. The arrow beside "' + v.label + '" above ' +
             'opens it in a tab, which will prompt you.';
    }
    return 'If the ' + v.noun + ' stays blank: ' + says + ' The arrow beside "' +
           v.label + '" above opens it in a tab, which is where you would sign in.';
  }

  /* ---------- R8 and R9: files attached to this lesson ----------

     Asked 2026-08-13, two requests that are one feature: "the ability to open
     associated slides or any other associated file or set of files that's
     associated with that lesson in a side panel or a new tab", and "ability to
     load and attach files to each lesson."

     🔴 They ship together because either one alone is unusable. R9 with no R8
     puts files somewhere you cannot look at them; R8 with no R9 is a viewer for
     a directory nothing can put anything into. Built as a fourth view in the
     pane that already holds this lesson's other material, rather than as a new
     panel, because "beside the lesson" is what he asked for and the pane is
     already that.

     Where they live is HIS decision, 2026-08-14: `resources/<DOC>/`, a directory
     of its own, "which keeps the data clean". There is no manifest; the
     directory is the record, so a file dropped in from Finder appears here and
     nothing can drift out of step. See the server for why.

     Four shapes of preview, decided by the server from the extension so the two
     cannot disagree: pdf and page get a frame, image gets an <img>, video and
     audio get a player, text gets a <pre>, and anything else says so and offers
     a tab. Nothing is guessed from the bytes. */

  var matFiles = [];           /* [{name, size, kind, url, added}] */
  var matFilesLoaded = false;
  var matFileShown = null;     /* the one being previewed, or null for the list */
  var matFileEditing = null;   /* the one whose title and note are open */
  var matBusy = false;

  function loadFiles(force) {
    if (matFilesLoaded && !force) return Promise.resolve(matFiles);
    return api('/api/resources?doc=' + encodeURIComponent(S.docId))
      .then(function (r) {
        matFiles = (r.body && r.body.files) || [];
        matFilesLoaded = true;
        return matFiles;
      })
      .catch(function () { matFiles = []; matFilesLoaded = false; return matFiles; });
  }

  function niceSize(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return Math.round(n / 1024) + ' KB';
    return (n / 1048576).toFixed(n < 10485760 ? 1 : 0) + ' MB';
  }

  /* 🔴 Every one of these builds its row with textContent and setAttribute, not
     with an HTML string. The rest of this pane is built from strings safely,
     because everything in it comes from materials.json, which this project
     writes. A filename does not: it is whatever he called the file, it can
     contain angle brackets and quotes, and it is the one piece of text in this
     reader that arrives from outside it. */
  function fileRow(f) {
    var row = document.createElement('div');
    row.className = 'sv-file';

    var open = document.createElement('button');
    open.type = 'button';
    open.className = 'sv-filename';
    /* 🔴 The title wins over the filename when there is one, which is the whole
       point of the manifest EH asked for on 2026-08-15: a paper kept as
       "Nierenberg 2023, bipolar.pdf" is a filename, and "Nierenberg's review of
       bipolar diagnosis" is what it is. The filename is still shown underneath,
       because it is what he will look for in Finder. */
    open.textContent = f.title || f.name;
    open.title = 'Show it here';
    open.addEventListener('click', function () { matFileShown = f.name; renderFiles(); });

    var meta = document.createElement('span');
    meta.className = 'sv-filemeta';
    meta.textContent = niceSize(f.size);

    var out = document.createElement('a');
    out.className = 'sv-matout';
    out.href = f.url;
    out.target = '_blank';
    out.rel = 'noopener';
    out.title = 'Open it in a new tab';
    out.setAttribute('aria-label', 'Open ' + f.name + ' in a new tab');
    out.innerHTML = ICON_OUT;

    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'sv-filedel';
    del.textContent = 'Remove';
    /* The server renames rather than unlinks, so this wording is true: the file
       leaves the list and stays on the disk as a .bak beside where it was. */
    del.title = 'Take it off this lesson. The file itself is kept.';
    del.addEventListener('click', function () { removeFile(f.name); });

    var edit = document.createElement('button');
    edit.type = 'button';
    edit.className = 'sv-fileedit';
    edit.textContent = f.title || f.note ? 'Edit' : 'Describe';
    edit.title = 'Give it a name of your own and a note about why it is here';
    edit.addEventListener('click', function () {
      matFileEditing = (matFileEditing === f.name) ? null : f.name;
      renderFiles();
    });

    row.appendChild(open);
    row.appendChild(meta);
    row.appendChild(out);
    row.appendChild(edit);
    row.appendChild(del);

    /* The second line only exists when there is something on it: the real
       filename once a title has replaced it at the top, and the note. */
    if ((f.title && f.title !== f.name) || f.note) {
      var sub = document.createElement('div');
      sub.className = 'sv-filesub';
      if (f.title && f.title !== f.name) {
        var fn = document.createElement('span');
        fn.className = 'sv-filereal';
        fn.textContent = f.name;
        sub.appendChild(fn);
      }
      if (f.note) {
        var nt = document.createElement('span');
        nt.className = 'sv-filenote';
        nt.textContent = f.note;
        sub.appendChild(nt);
      }
      row.appendChild(sub);
    }

    if (matFileEditing === f.name) row.appendChild(describeBox(f));
    return row;
  }

  /* The little form for one file's title and note. Built and thrown away with
     the row, because nothing about it is worth keeping open. */
  function describeBox(f) {
    var box = document.createElement('div');
    box.className = 'sv-filedesc';

    var t = document.createElement('input');
    t.type = 'text';
    t.className = 'sv-desctitle';
    t.placeholder = 'Call it something';
    t.value = f.title || '';
    t.maxLength = 200;

    var n = document.createElement('input');
    n.type = 'text';
    n.className = 'sv-descnote';
    n.placeholder = 'Why it is here';
    n.value = f.note || '';
    n.maxLength = 200;

    var save = document.createElement('button');
    save.type = 'button';
    save.className = 'sv-descsave';
    save.textContent = 'Save';

    function commit() {
      save.disabled = true;
      api('/api/resources/about', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ doc: S.docId, name: f.name,
                               title: t.value, note: n.value })
      }).then(function (r) {
        save.disabled = false;
        if (!r.body || !r.body.ok) {
          return filesToast('Could not save that: ' + ((r.body && r.body.error) || 'refused'));
        }
        matFileEditing = null;
        return loadFiles(true).then(renderMaterials);
      })['catch'](function () {
        save.disabled = false;
        filesToast('Could not reach the server.');
      });
    }
    save.addEventListener('click', commit);
    /* Enter saves from either box, which is how every other small form in this
       reader behaves. */
    [t, n].forEach(function (el) {
      el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); commit(); }
        if (e.key === 'Escape') { e.stopPropagation(); matFileEditing = null; renderFiles(); }
      });
    });

    box.appendChild(t);
    box.appendChild(n);
    box.appendChild(save);
    window.setTimeout(function () { t.focus(); t.select(); }, 0);
    return box;
  }

  function renderFiles() {
    matSwap.innerHTML = '';

    if (matFileShown) return renderFilePreview();

    var wrap = document.createElement('div');
    wrap.className = 'sv-files';

    if (!matFiles.length) {
      var empty = document.createElement('p');
      empty.className = 'sv-filesempty';
      empty.textContent = 'Nothing is attached to this lesson yet. Add a paper, a ' +
        'handout, a screenshot, anything you want beside it while you read.';
      wrap.appendChild(empty);
    } else {
      matFiles.forEach(function (f) { wrap.appendChild(fileRow(f)); });
    }

    var foot = document.createElement('div');
    foot.className = 'sv-filesfoot';

    /* A real <input type=file> behind a label, rather than a button that calls
       click() on a hidden one: the label IS the control as far as the browser is
       concerned, so it is keyboard reachable and works on a phone, where the
       same tap offers the camera and the files app. */
    var lab = document.createElement('label');
    lab.className = 'sv-fileadd';
    lab.textContent = matBusy ? 'Adding…' : 'Attach files';
    var input = document.createElement('input');
    input.type = 'file';
    input.multiple = true;
    input.addEventListener('change', function () {
      var picked = Array.prototype.slice.call(input.files || []);
      input.value = '';                    /* so the same file can be re-picked */
      addFiles(picked);
    });
    lab.appendChild(input);

    var hint = document.createElement('span');
    hint.className = 'sv-fileshint';
    hint.textContent = 'or drop them here';

    foot.appendChild(lab);
    foot.appendChild(hint);
    wrap.appendChild(foot);

    var note = document.createElement('p');
    note.className = 'sv-matmsg quiet';
    note.textContent = 'Kept in resources/' + S.docId + ' on the Mini, beside the ' +
      'lesson rather than inside it, so nothing here changes the lesson itself.';
    matSwap.appendChild(wrap);
    matSwap.appendChild(note);
  }

  function renderFilePreview() {
    var f = matFiles.filter(function (x) { return x.name === matFileShown; })[0];
    if (!f) { matFileShown = null; return renderFiles(); }

    var bar = document.createElement('div');
    bar.className = 'sv-fileback';
    var back = document.createElement('button');
    back.type = 'button';
    back.className = 'sv-matbtn';
    back.textContent = '‹ All files';
    back.addEventListener('click', function () { matFileShown = null; renderFiles(); });
    var name = document.createElement('span');
    name.className = 'sv-filemeta';
    name.textContent = f.title || f.name;
    bar.appendChild(back);
    bar.appendChild(name);
    matSwap.appendChild(bar);

    if (f.note) {
      var note = document.createElement('p');
      note.className = 'sv-matmsg quiet';
      note.textContent = f.note;
      matSwap.appendChild(note);
    }

    if (f.kind === 'image') {
      var img = document.createElement('img');
      img.className = 'sv-fileimg';
      img.src = f.url;
      img.alt = f.name;
      matSwap.appendChild(img);
      return;
    }
    if (f.kind === 'video' || f.kind === 'audio') {
      var media = document.createElement(f.kind === 'video' ? 'video' : 'audio');
      media.className = f.kind === 'video' ? 'sv-matvid' : 'sv-fileaudio';
      media.controls = true;
      media.setAttribute('playsinline', '');
      media.setAttribute('preload', 'metadata');
      media.src = f.url;
      matSwap.appendChild(media);
      return;
    }
    if (f.kind === 'pdf' || f.kind === 'page') {
      var frame = document.createElement('iframe');
      frame.className = 'sv-matframe';
      frame.src = f.url;
      frame.title = f.name;
      matSwap.appendChild(frame);
      return;
    }
    if (f.kind === 'text') {
      var pre = document.createElement('pre');
      pre.className = 'sv-filetext';
      pre.textContent = 'Loading…';
      matSwap.appendChild(pre);
      api(f.url, { raw: true })
        .then(function (r) { pre.textContent = r.text || '(empty)'; })
        ['catch'](function () { pre.textContent = 'Could not read it.'; });
      return;
    }

    var why = document.createElement('div');
    why.className = 'sv-matwhy';
    var p = document.createElement('p');
    p.textContent = 'This one cannot be shown here. Please open it in a separate tab.';
    var sub = document.createElement('p');
    sub.className = 'sv-matwhy-sub';
    sub.textContent = 'The browser has no built-in viewer for this kind of file, so ' +
      'opening it will hand it to whichever app on your machine does.';
    var a = document.createElement('a');
    a.href = f.url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = 'Open it in a tab';
    why.appendChild(p); why.appendChild(sub); why.appendChild(a);
    matSwap.appendChild(why);
  }

  function filesToast(text) { try { S.toast(text); } catch (e) {} }

  /* One at a time rather than in parallel, deliberately: a 64MB cap times four
     files is enough to matter on a home connection, and the count in the label
     is only honest if they land in order. */
  function addFiles(picked) {
    if (!picked || !picked.length || matBusy) return;
    matBusy = true;
    renderFiles();

    var done = 0, failed = [];
    function next() {
      if (!picked.length) {
        matBusy = false;
        return loadFiles(true).then(function () {
          renderMaterials();
          if (failed.length) {
            filesToast(failed.length === 1
              ? ('Could not attach ' + failed[0].name + ': ' + failed[0].why)
              : (failed.length + ' files could not be attached. ' + failed[0].why));
          } else {
            filesToast(done === 1 ? 'Attached.' : ('Attached ' + done + ' files.'));
          }
        });
      }
      var file = picked.shift();
      return api('/api/resources?doc=' + encodeURIComponent(S.docId) +
                 '&name=' + encodeURIComponent(file.name),
                 { method: 'POST', body: file })
        .then(function (r) {
          if (r.body && r.body.ok) done++;
          else failed.push({ name: file.name, why: (r.body && r.body.error) || 'refused' });
        })
        ['catch'](function () {
          failed.push({ name: file.name, why: 'the server did not answer' });
        })
        .then(next);
    }
    next();
  }

  function removeFile(name) {
    if (matBusy) return;
    matBusy = true;
    api('/api/resources/remove', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ doc: S.docId, name: name })
    }).then(function (r) {
      matBusy = false;
      if (!r.body || !r.body.ok) {
        return filesToast('Could not remove it: ' + ((r.body && r.body.error) || 'refused'));
      }
      if (matFileShown === name) matFileShown = null;
      return loadFiles(true).then(function () {
        renderMaterials();
        filesToast('Removed. The file is kept on the disk beside where it was.');
      });
    })['catch'](function () {
      matBusy = false;
      filesToast('Could not reach the server.');
    });
  }

  /* Drop anywhere on the pane, not only on the Files view, and switch to it.
     🔴 dragover must be cancelled or the browser navigates the whole reader to
     the dropped file, which loses whatever is unsaved and is a genuinely bad
     way to find out that dropping is not supported. */
  (function installDrop() {
    var depth = 0;
    function hasFiles(e) {
      var t = e.dataTransfer && e.dataTransfer.types;
      if (!t) return false;
      for (var i = 0; i < t.length; i++) if (t[i] === 'Files') return true;
      return false;
    }
    matPanel.addEventListener('dragenter', function (e) {
      if (!hasFiles(e)) return;
      e.preventDefault();
      depth++;
      matPanel.classList.add('sv-dropping');
    });
    matPanel.addEventListener('dragover', function (e) {
      if (!hasFiles(e)) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
    });
