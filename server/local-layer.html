         screen; declining and mirroring deletes the disk's. **Both branches lose
         somebody's work, so the safe move is to take neither**, leave the file
         and the page exactly as they are, and let the reader's own next change
         resolve it: that push writes the new key and the browser is KNOWN from
         then on, so this state lasts one visit.

         ⚠️ MERGE IS NOT AVAILABLE HERE, answered from the code rather than
         assumed. `S.replaceMarks` recomputes `seq` from the highest id, and two
         devices assign ids from 0 independently, so disk item 3 and local item 3
         are different highlights. A union by id would silently fuse them. A
         merge needs an identity that survives two devices, which marks do not
         have; that is a design change and not this fix.

         ⚠️ AND IT IS NOT SILENT. The marks on screen that the server is not
         known to hold are badged "On this device only", which is exactly true
         here and is the vocabulary already shipped for it. A toast was refused:
         it would fire on load, before the reader has done anything, and it is
         gone in seconds, while the badge stays on the item it is about.

         🔴 THE BOUND, MEASURED RATHER THAN GLOSSED. This stops the deletion
         that needed NO reader action, which is the one that was reproduced and
         the one that happened on every visit. It does NOT make the next push
         safe: every writer here sends the WHOLE collection, so if the reader
         highlights during this one visit, that push still writes their set over
         the file and the other device's extra mark goes. Measured on the rig:
         disk `[0,1,2,99]`, one highlight later, disk `[0,1,2,77,78]`.

         🟢 What makes that bounded rather than a hole: UNKNOWN lasts ONE visit,
         and from the next load the stamp is per-course, the restore works, and
         the disk's extras are learned and kept. **The remaining loss is the
         pre-existing whole-collection write, which this fix does not introduce
         and does not claim to close**; it belongs to the data-loss audit.

         ⚠️ A refinement was considered and REFUSED here: if every local mark is
         already on disk there is nothing to lose by restoring, so UNKNOWN could
         restore and learn the extras. Sound only with a CONTENT comparison
         (`b`, `s`, `e`, colour and notes), because ids collide across devices,
         and a subset test that is wrong deletes the reader's own work. That is
         the manager's property 2 pointing straight at it, so it is filed rather
         than guessed at in a unit this size. */
      if (!force && agree.state === AGREED_UNKNOWN &&
          (here.items.length || here.notes.length)) {
        svServerRefused(SV_MARK_KINDS, svMarkKeys(here));
        return restoreOutcome(false, false, 'unknown');
      }

      if (!force && (here.items.length || here.notes.length) && !diskIsNewer) {
        /* 🔴 THE ONE PLACE A DELETION MADE ELSEWHERE CAN REACH THIS
           BROWSER. This is the branch where the local copy wins and is mirrored
           up, so it is the branch that used to write a deleted mark back to the
           file. The other three cannot: a restore replaces the collection
           wholesale, UNKNOWN deliberately touches neither side, and an empty
           disk is the case the function's own comment declines. */
        var dropped = svPruneDeletedElsewhere(d, agree);
        if (dropped) {
          /* mirror is FALSE now, and that is not a detail: `replaceMarks`
             already scheduled the push through the change handler, and the
             caller's mirror would send the same collection a second time. */
          return restoreOutcome(false, false, 'pruned');
        }
        return restoreOutcome(false, true, 'kept');
      }

      /* Read by the change handler above, which this call is about to fire. */
      marksFromRestore = true;
      S.replaceMarks(d.items || [], d.notes || []);
      /* We now hold exactly what the disk holds, so that is the new agreement.
         Without this the next load would restore all over again. */
      if (diskAt) setAgreed(diskAt, svSyncKeys(d));
      /* 🔴 The toast announced what ARRIVED and never what was dropped, which
         is the more precise defect behind QA's cold-origin finding: a reader who
         highlighted on an unpaired origin sees "Restored 6 highlights" and is
         never told that the one they just made is gone. The merge itself is
         RIGHT and is not touched here; only the sentence about it changes.

         Silent when nothing was displaced, so an ordinary first visit stays
         quiet and the clause means something when it does appear. */
      var said = 'Restored ' + (d.items || []).length + ' highlights and ' +
                 (d.notes || []).length + ' notes from disk.';
      if (mine) {
        said += ' ' + mine + ' mark' + (mine === 1 ? '' : 's') +
                ' held only on this device ' + (mine === 1 ? 'was' : 'were') +
                ' discarded.';
      }
      S.toast(said);
      return restoreOutcome(true, false, 'restored');
      /* ⚠️ The read FAILED, and this still mirrors, exactly as it did before.
         Writing having never read the disk is its own defect and QA flagged it
         as unmeasured on this path; the cold-origin entry covers its 401 form.
         **Changing it here would be altering untested behaviour inside a fix for
         a different defect**, so the verdict is named and the action is left
         alone. */
    }).catch(function () { return restoreOutcome(false, true, 'failed'); });
  }

  /* ---------- rewriting a paragraph ---------- */

  var scrim = document.createElement('div');
  scrim.className = 'sv-scrim';
  scrim.hidden = true;
  document.body.appendChild(scrim);

  var ed = document.createElement('div');
  ed.className = 'sv-edit';
  ed.hidden = true;
  ed.setAttribute('role', 'dialog');
  ed.setAttribute('aria-label', 'Rewrite this paragraph');
  ed.innerHTML =
    '<header><strong data-title>Rewrite this paragraph</strong><span class="sub"></span>' +
      '<span class="pick" hidden>' +
        '<button type="button" data-prev>&lsaquo;</button>' +
        '<span data-count></span>' +
        '<button type="button" data-next>&rsaquo;</button>' +
        '<button type="button" data-all>Rewrite them as one</button>' +
      '</span>' +
      '<button type="button" data-x>Close</button></header>' +
    '<div class="body">' +
      '<div>' +
        '<label class="lab" for="svEdText" data-textlab>The text, yours to change</label>' +
        '<textarea class="main" id="svEdText" spellcheck="true"></textarea>' +
        '<div class="hint" data-syntax>Plain text. <code>**bold**</code>, <code>*italic*</code> and ' +
          '<code>[label](https://…)</code> are kept. Everything else is written as you type it.</div>' +
      '</div>' +
      '<div class="ask">' +
        '<div>' +
          '<label class="lab" for="svEdAsk">Or say what is wrong with it</label>' +
          '<input type="text" id="svEdAsk" placeholder="too vague about the mechanism, and it mentions a lecturer">' +
        '</div>' +
        '<button type="button" class="act" data-ask>Ask Claude</button>' +
      '</div>' +
      '<div class="hint" data-status></div>' +
    '</div>' +
    '<footer>' +
      '<button type="button" class="act" data-revert disabled>Back to the original</button>' +
      '<span class="right">' +
        '<button type="button" class="act" data-cancel>Cancel</button>' +
        '<button type="button" class="act go" data-save>Save to the lesson</button>' +
      '</span>' +
    '</footer>';
  document.body.appendChild(ed);

  var edText   = ed.querySelector('#svEdText');
  var edAsk    = ed.querySelector('#svEdAsk');
  var edStatus = ed.querySelector('[data-status]');
  var edSub    = ed.querySelector('.sub');
  var edAskBtn = ed.querySelector('[data-ask]');
  var edSave   = ed.querySelector('[data-save]');
  var edRevert = ed.querySelector('[data-revert]');
  var edTitle  = ed.querySelector('[data-title]');
  var edTextLab = ed.querySelector('[data-textlab]');
  var edSyntax = ed.querySelector('[data-syntax]');
  var edPick   = ed.querySelector('.pick');
  var edCount  = ed.querySelector('[data-count]');

  var editing = null;   /* {kind, b|t, expect, originalMd} */
  var edChoice = null;  /* {blocks: [n], at: i} when a selection covered several */

  var SYNTAX_BLOCK =
    'Plain text. <code>**bold**</code>, <code>*italic*</code> and ' +
    '<code>[label](https://…)</code> are kept. Everything else is written as you type it.';
  var SYNTAX_RANGE =
    'Paragraphs separated by blank lines; how many is yours to change. ' +
    '<code>**bold**</code>, <code>*italic*</code> and <code>[label](https://…)</code> are kept. ' +
    'A line starting <code>## </code> to <code>#### </code> is a heading; lines starting ' +
    '<code>- </code> make a list.';
  var SYNTAX_TABLE =
    'One row per line, cells between <code>|</code>. The first row is the header. ' +
    'A cell of <code>^</code> on its own means <b>the cell above continues down here</b>, and a cell of ' +
    '<code>&lt;</code> means <b>the cell to the left continues across</b>: that is how a cell that spans ' +
    'rows or columns is written. Cells take <code>**bold**</code>, <code>*italic*</code>, ' +
    '<code>[label](https://…)</code> and a literal <code>&lt;br&gt;</code>. Write a real ' +
    '<code>|</code> as <code>\\|</code>. Rows and columns may be added or removed.';

  /* ---------- tables are not blocks, and that is the whole bug ----------
     The page numbers `td` and `th` individually, so a table has no index of its
     own and a selection across one produces a segment per cell. Rewrite took
     the first, which is how asking for a table to be fixed rewrote its first
     header cell (reported 2026-08-15). A table is now addressed as a table. */

  function tableOf(b) {
    var el = S.blockAt(b);
    var t = el && el.closest ? el.closest('table') : null;
    return (t && t.closest('.wrap')) ? t : null;
  }

  function tableIndex(t) {
    var all = document.querySelectorAll('.wrap table');
    return Array.prototype.indexOf.call(all, t);
  }

  /* Kept literal on the way out, because markdown cannot say either and the
     notes' tables use both. Everything else in a cell becomes markdown. */
  var CELL_KEEP = /<br\s*\/?>|<\/?(?:span|sub|sup|abbr)\b[^>]*>/gi;

  function decodeEntities(s) {
    var d = document.createElement('textarea');
    d.innerHTML = s;
    return d.value;
  }

  function cellToMd(el) {
    var s = el.innerHTML;
    s = s.replace(/<a\s[^>]*href="([^"]+)"[^>]*>([\s\S]*?)<\/a>/gi, '[$2]($1)');
    s = s.replace(/<code[^>]*>([\s\S]*?)<\/code>/gi, '`$1`');
    s = s.replace(/<\/?(?:strong|b)\s*>/gi, '**');
    s = s.replace(/<\/?(?:em|i)\s*>/gi, '*');
    /* The entities have to be decoded so `p&lt;0.001` reaches the server as the
       text it is, but decoding the whole string would eat the tags above that
       are meant to stay tags. So they step aside first. */
    /* Private-use characters, and written as escapes rather than typed: a NUL
       would be the obvious placeholder and is wrong twice over, because the
       HTML parser inside decodeEntities turns U+0000 into a replacement
       character, and a NUL in this file makes every grep call it binary. */
    var holes = [];
    s = s.replace(CELL_KEEP, function (m) {
      holes.push(m);
      return '\uE000' + (holes.length - 1) + '\uE001';
    });
    s = decodeEntities(s).replace(/\s+/g, ' ').trim().replace(/\|/g, '\\|');
    return s.replace(/\uE000(\d+)\uE001/g, function (m, i) { return holes[+i]; });
  }

  function tableToMd(t) {
    var out = [], pending = {};
    var trs = t.querySelectorAll('tr');
    for (var r = 0; r < trs.length; r++) {
      var cells = trs[r].querySelectorAll('td, th');
      var row = [], col = 0, ci = 0;
      while (ci < cells.length || pending[col]) {
        if (pending[col]) {
          row.push('^');
          if (--pending[col] === 0) delete pending[col];
          col++;
          continue;
        }
        var cell = cells[ci++];
        var rs = parseInt(cell.getAttribute('rowspan') || '1', 10) || 1;
        var cs = parseInt(cell.getAttribute('colspan') || '1', 10) || 1;
        row.push(cellToMd(cell));
        if (rs > 1) pending[col] = rs - 1;
        col++;
        for (var k = 1; k < cs; k++) { row.push('<'); col++; }
      }
      out.push(row);
    }
    /* Pad the columns so the pipes line up, which is most of what makes a pipe
       table readable rather than a wall of bars. */
    var width = 0, i, j;
    for (i = 0; i < out.length; i++) width = Math.max(width, out[i].length);
    var wide = [];
    for (j = 0; j < width; j++) {
      var w = 0;
      for (i = 0; i < out.length; i++) w = Math.max(w, (out[i][j] || '').length);
      wide.push(Math.min(w, 60));
    }
    return out.map(function (row) {
      var cells = [];
      for (j = 0; j < width; j++) {
        var v = row[j] || '';
        cells.push(j === width - 1 ? v : v + Array(Math.max(1, wide[j] - v.length + 1)).join(' '));
      }
      return '| ' + cells.join(' | ') + ' |';
    }).join('\n');
  }

  /* Round-trips the note's own inline markup so an edit cannot silently flatten
     a DOI link or a bolded claim. */
  function htmlToMd(h) {
    var s = String(h);
    s = s.replace(/<a\s[^>]*href="([^"]+)"[^>]*>([\s\S]*?)<\/a>/gi, '[$2]($1)');
    /* Monospace runs, however the note happens to express them, become
       backticks so an edit does not silently flatten a DOI to body text. */
    s = s.replace(/<code[^>]*>([\s\S]*?)<\/code>/gi, '`$1`');
    s = s.replace(/<span[^>]*var\(--mono\)[^>]*>([\s\S]*?)<\/span>/gi, '`$1`');
    s = s.replace(/<\/?(?:strong|b)\s*>/gi, '**');
    s = s.replace(/<\/?(?:em|i)\s*>/gi, '*');
    s = s.replace(/<br\s*\/?>/gi, '\n');
    s = s.replace(/<[^>]+>/g, '');
    var d = document.createElement('textarea');
    d.innerHTML = s;
    return d.value.replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
  }

  function setStatus(text, isErr) {
    edStatus.textContent = text || '';
    edStatus.classList.toggle('err', !!isErr);
  }

  function openTable(t) {
    editing = {
      kind: 'table',
      t: tableIndex(t),
      el: t,
      expect: t.textContent.replace(/\s+/g, ' ').trim(),
      originalMd: tableToMd(t)
    };
    var rows = t.querySelectorAll('tr').length;
    edTitle.textContent = 'Rewrite this table';
    ed.setAttribute('aria-label', 'Rewrite this table');
    edTextLab.textContent = 'The table, yours to change';
    edSyntax.innerHTML = SYNTAX_TABLE;
    edSub.textContent = 'table ' + (editing.t + 1) + ', ' + rows + ' rows';
    edAsk.placeholder = 'I cannot tell which rows go with which heading';
    ed.classList.add('sv-tbl');
    return editing;
  }

  /* A range is rewritten as ONE unit and may change the paragraph count
     (EH's queued design). Only plain prose runs qualify: a list item or a
     table cell in the middle would make the splice structurally unsafe, and
     the server refuses those too. */
  var RANGE_TAGS = { P: 1, H2: 1, H3: 1, H4: 1, BLOCKQUOTE: 1 };
  function rangeEligible(blocks) {
    if (!blocks || blocks.length < 2) return false;
    for (var i = 0; i < blocks.length; i++) {
      var el = S.blockAt(blocks[i]);
      if (!el || !RANGE_TAGS[el.tagName]) return false;
      if (el.closest && el.closest('td, th')) return false;
      if (i && blocks[i] !== blocks[i - 1] + 1) return false;
    }
    return true;
  }

  function mdOfBlock(b) {
    var el = S.blockAt(b);
    var md = htmlToMd(S.blockHtml(b));
    if (!el) return md;
    if (el.tagName === 'H2') return '## ' + md;
    if (el.tagName === 'H3') return '### ' + md;
    if (el.tagName === 'H4') return '#### ' + md;
    return md;
  }

  function openRange(blocks) {
    editing = {
      kind: 'range',
      blocks: blocks.slice(),
      expects: blocks.map(function (b) {
        return S.blockText(b).replace(/\s+/g, ' ').trim();
      }),
      originalMd: blocks.map(mdOfBlock).join('\n\n')
    };
    edTitle.textContent = 'Rewrite these ' + blocks.length + ' paragraphs as one unit';
    ed.setAttribute('aria-label', edTitle.textContent);
    edTextLab.textContent = 'The run, yours to change';
    edSyntax.innerHTML = SYNTAX_RANGE;
    edSub.textContent = 'paragraphs ' + blocks[0] + ' to ' + blocks[blocks.length - 1];
    edAsk.placeholder = 'these three repeat each other; merge them into one tight paragraph';
    ed.classList.remove('sv-tbl');
    return editing;
  }

  function openBlock(b) {
    editing = {
      kind: 'block',
      b: b,
      expect: S.blockText(b).replace(/\s+/g, ' ').trim(),
      originalMd: htmlToMd(S.blockHtml(b))
    };
    var el = S.blockAt(b);
    var inCell = el && el.closest && el.closest('td, th');
    edTitle.textContent = inCell ? 'Rewrite this cell' : 'Rewrite this paragraph';
    ed.setAttribute('aria-label', edTitle.textContent);
    edTextLab.textContent = 'The text, yours to change';
    edSyntax.innerHTML = SYNTAX_BLOCK;
    edSub.textContent = (inCell ? 'cell ' : 'paragraph ') + b;
    edAsk.placeholder = 'too vague about the mechanism, and it mentions a lecturer';
    ed.classList.remove('sv-tbl');
    return editing;
  }

  /* The picker only appears when a selection covered more than one block and
     they are not one table. Before this, Rewrite silently took the first and
     said nothing, which is how a table selection rewrote a header cell. */
  function renderPick() {
    if (!edChoice) { edPick.hidden = true; return; }
    edPick.hidden = false;
    edCount.textContent = (edChoice.at + 1) + ' of ' + edChoice.blocks.length;
    edPick.querySelector('[data-prev]').disabled = edChoice.at === 0;
    edPick.querySelector('[data-next]').disabled = edChoice.at === edChoice.blocks.length - 1;
    edPick.querySelector('[data-all]').hidden = !rangeEligible(edChoice.blocks);
  }

  function fillEditor() {
    edText.value = editing.originalMd;
    edAsk.value = '';
    setStatus('');
    edRevert.disabled = true;
    renderPick();
  }

  /* A target is a table, or one block, or a choice of several blocks. */
  function openEditor(sel) {
    var first = sel.segments && sel.segments.length ? sel.segments[0].b : sel.b;
    var table = tableOf(first);

    if (table && tableIndex(table) >= 0) {
      /* Anywhere inside a table means the table. Selecting one whole is close
         to impossible with a pointer, which is what he ran into, and a cell on
         its own is almost never what somebody means by "fix this table". */
      edChoice = null;
      openTable(table);
    } else {
      var seen = [], i;
      for (i = 0; i < (sel.segments || []).length; i++) {
        if (seen.indexOf(sel.segments[i].b) < 0) seen.push(sel.segments[i].b);
      }
      if (seen.length < 2) seen = [first];
      edChoice = seen.length > 1 ? { blocks: seen, at: 0 } : null;
      openBlock(first);
    }

    fillEditor();
    if (edChoice) {
      setStatus('That selection covered ' + edChoice.blocks.length +
                ' paragraphs. Use the arrows to rewrite one at a time' +
                (rangeEligible(edChoice.blocks)
                  ? ', or rewrite them as one unit.' : '.'));
    }
    scrim.hidden = false;
    ed.hidden = false;
    if (!window.matchMedia || !window.matchMedia('(max-width: 899px)').matches) edText.focus();
  }

  edPick.querySelector('[data-prev]').addEventListener('click', function () {
    if (!edChoice || edChoice.at === 0) return;
    edChoice.at--;
    openBlock(edChoice.blocks[edChoice.at]);
    fillEditor();
    showFocus([{ b: edChoice.blocks[edChoice.at], s: 0, e: S.blockText(edChoice.blocks[edChoice.at]).length }]);
  });

  edPick.querySelector('[data-all]').addEventListener('click', function () {
    if (!edChoice || !rangeEligible(edChoice.blocks)) return;
    var blocks = edChoice.blocks.slice();
    edChoice = null;
    openRange(blocks);
    fillEditor();
    showFocus(blocks.map(function (b) {
      return { b: b, s: 0, e: S.blockText(b).length };
    }));
    setStatus('The whole run is in the box. Merging, splitting and reordering are all allowed.');
  });

  edPick.querySelector('[data-next]').addEventListener('click', function () {
    if (!edChoice || edChoice.at >= edChoice.blocks.length - 1) return;
    edChoice.at++;
    openBlock(edChoice.blocks[edChoice.at]);
    fillEditor();
    showFocus([{ b: edChoice.blocks[edChoice.at], s: 0, e: S.blockText(edChoice.blocks[edChoice.at]).length }]);
  });

  function closeEditor() {
    ed.hidden = true;
    scrim.hidden = true;
    editing = null;
    edChoice = null;
    edPick.hidden = true;
    ed.classList.remove('sv-tbl');
    clearFocus();
  }

  ed.querySelector('[data-x]').addEventListener('click', closeEditor);
  ed.querySelector('[data-cancel]').addEventListener('click', closeEditor);
  scrim.addEventListener('click', closeEditor);

  edRevert.addEventListener('click', function () {
    if (!editing) return;
    edText.value = editing.originalMd;
    edRevert.disabled = true;
    setStatus('Back to what the lesson says now.');
  });

  edAskBtn.addEventListener('click', function () {
    if (!editing) return;
    var instruction = edAsk.value.trim();
    if (!instruction) { edAsk.focus(); return setStatus('Say what is wrong with it first.', true); }
    if (!caps.explain) return setStatus('The Claude Code CLI was not found.', true);

    edAskBtn.disabled = true;
    setStatus('Rewriting. This takes a few seconds.');
    var isRange = editing.kind === 'range';
    api('/api/rewrite', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        doc: S.docId, b: isRange ? editing.blocks[0] : editing.b,
        target: editing.kind === 'table' ? 'table' : (isRange ? 'range' : 'block'),
        current: edText.value,
        instruction: instruction,
        context: isRange ? contextAroundRange() : contextAround(editing.b)
      })
    }).then(function (r) {
      edAskBtn.disabled = false;
      if (!r.body || !r.body.ok) return setStatus(r.body && r.body.error || 'No answer came back.', true);
      edText.value = r.body.text;
      edRevert.disabled = false;
      setStatus('Claude’s version, yours to edit. Nothing is written until you save.');
    }).catch(function () {
      edAskBtn.disabled = false;
      setStatus('Could not reach the server.', true);
    });
  });

  /* A table's own previousElementSibling is nothing useful: it sits inside a
     .tblwrap inside a column, so the heading above it is several levels up and
     back. Climbing is the only way to find what the table is under. */
  function headingBefore(el) {
    var node = el, hops = 0;
    while (node && node !== document.body && hops < 40) {
      var sib = node.previousElementSibling;
      while (sib && hops < 40) {
        hops++;
        if (/^H[1-4]$/.test(sib.tagName)) return sib.textContent.trim();
        var inner = sib.querySelectorAll ? sib.querySelectorAll('h1,h2,h3,h4') : null;
        if (inner && inner.length) return inner[inner.length - 1].textContent.trim();
        sib = sib.previousElementSibling;
      }
      node = node.parentElement;
    }
    return '';
  }

  function textNear(el, forward) {
    var node = el, hops = 0;
    while (node && node !== document.body && hops < 40) {
      var sib = forward ? node.nextElementSibling : node.previousElementSibling;
      while (sib && hops < 40) {
        hops++;
        var t = (sib.textContent || '').trim();
        if (t && !sib.querySelector('table')) return t.slice(0, 700);
        sib = forward ? sib.nextElementSibling : sib.previousElementSibling;
      }
      node = node.parentElement;
    }
    return '';
  }

  function contextAroundRange() {
    if (!editing || editing.kind !== 'range') return '';
    var out = [];
    var first = editing.blocks[0], last = editing.blocks[editing.blocks.length - 1];
    var el = S.blockAt(first);
    var h = el && el.previousElementSibling, hops = 0;
    while (h && hops < 14) {
      if (/^H[1-4]$/.test(h.tagName)) { out.push('Section: ' + h.textContent.trim()); break; }
      h = h.previousElementSibling; hops++;
    }
    var before = S.blockAt(first - 1), after = S.blockAt(last + 1);
    if (before) out.push('Paragraph before the run: ' + before.textContent.trim());
    if (after) out.push('Paragraph after the run: ' + after.textContent.trim());
    return out.join('\n\n');
  }

  function contextAround(b) {
    var out = [];
    if (editing && editing.kind === 'table') {
      var head = headingBefore(editing.el);
      if (head) out.push('Section: ' + head);
      var pre = textNear(editing.el, false), post = textNear(editing.el, true);
      if (pre) out.push('The text that introduces the table: ' + pre);
      if (post) out.push('The text after it: ' + post);
      return out.join('\n\n');
    }
    var el = S.blockAt(b);
    if (!el) return '';
    var h = el.previousElementSibling, hops = 0;
    while (h && hops < 14) {
      if (/^H[1-4]$/.test(h.tagName)) { out.push('Section: ' + h.textContent.trim()); break; }
      h = h.previousElementSibling; hops++;
    }
    var before = S.blockAt(b - 1), after = S.blockAt(b + 1);
    if (before) out.push('Paragraph before: ' + before.textContent.trim());
    if (after) out.push('Paragraph after: ' + after.textContent.trim());
    return out.join('\n\n');
  }

  /* ---------- a deletion in another window reaches this one ----------

     🔴 THE BOUND THIS CLOSES, filed by the coder that shipped the two-window
     fix and deliberately left out of it: `ba7f499` stopped two windows deleting
     each other's marks, and it did NOT tell an open window that a deletion
     happened elsewhere. The deletion was never lost, it was on disk instantly,
     but the other window only learned of it at its next LOAD. That is the same
     shape as the documented "UNKNOWN lasts one visit" bound: a staleness that
     resolves on reload and costs nothing but confusion.

     🟢 THE SIGNAL ALREADY EXISTED AND NOBODY WAS LISTENING. `setAgreed()` writes
     `SYNC_KEY` to `localStorage` after every push the server accepts, and the
     `storage` event fires in OTHER windows of the same origin, never in the one
     that wrote. So the notification is free, it is per course AND per document
     (`kcl-study-synced-<course><doc>`), and it cannot be heard by a window
     reading a different lesson.

     🔴 IT RE-RUNS THE LOAD PATH RATHER THAN DOING ANYTHING CLEVER, and that is
     the whole safety argument. `restoreFromDisk(false)` is the code that already
     knows when the local copy wins, when the disk wins, when the agreement is
     UNKNOWN and must touch neither side, and when a deletion may be pruned. A
     second, faster path here would be a second set of rules for the same
     question, and the first one cost this project a unit to get right.

     ⚠️ WHY IT CANNOT LOOP, and the entry asks for it in as many words. The
     writer never hears its own event. A window that DOES hear one either drops
     nothing (no push, no new event, and the chain stops) or prunes and pushes
     once, which is a genuine change and produces exactly one more round in the
     other windows, where it then drops nothing. **The terminating condition is
     that a prune with nothing to prune writes nothing.**

     🔴 `force` is FALSE, deliberately. The forced path replaces the collection
     wholesale, which is the reader's own "Restore from disk" button and is not
     something another window may trigger on their behalf. A window holding
     unsaved local state is protected by the same branches that protect it at
     load: with an UNKNOWN agreement it declines to touch either side. */
  try {
    window.addEventListener('storage', function (e) {
      if (!e || e.key !== SYNC_KEY) return;
      /* A cleared store fires with a NULL value and there is no push behind
         it, so re-reading would be answering a question nobody asked. ⚠️
         `undefined` is checked as well as `null`, and that is not belt and
         braces: a real browser event always carries the property, so an event
         WITHOUT it is something else entirely, and "something else" must not be
         read as "a push happened". A test fires exactly that shape. */
      if (e.newValue === null || typeof e.newValue === 'undefined') return;
      try {
        restoreFromDisk(false).then(function (r) {
          /* 🔴 SILENT UNLESS SOMETHING ACTUALLY WENT. The reader did not ask for
             this and most events change nothing on this page. A toast on every
             sibling push would be noise about our own plumbing, which is the
             same rule the update notice follows. */
          if (r && r.why === 'pruned') {
            S.toast('A highlight deleted in another window has been removed here too.');
          }
        });
      } catch (x) {}
    });
  } catch (e) {}

  /* Restore before anything else can overwrite the file: if this browser has
     nothing and disk does, disk wins. Otherwise mirror what is here. */
  restoreFromDisk(false).then(function (r) {
    /* 🔴 `r.mirror`, never `!r.restored`. This line is where the deletion
       happened: "not restored" was read as "the disk has nothing we need", and
       four different situations answer to it. Only the two that cannot lose
       anything set `mirror`. */
    if (r.mirror) {

  /* ---------- R41: Clear all, behind a word ----------

     Asked 2026-08-16: "it needs to be behind some kind of guard. There has to
     be a pop-up that asks for confirmation, and maybe I have to type something
     that says 'Type Clear to confirm' so it's not done by mistake."

     🔴 This is the one control R40 does NOT move, and the reason is that its
     guard cannot be added from outside. `window.confirm` takes no input, so the
     lesson's own handler can only ever ask a yes/no question; and wrapping that
     handler would have produced two dialogs in a row, this one and then its
     own. So the lesson's button is hidden the way the copy-for-the-vault one
     is, and this replaces it.

     The clearing itself still goes through the lesson: `S.replaceMarks` is the
     surface it exposes for exactly this, the same one Import and Restore use,
     and it re-renders the panel and the text and calls save(), so the push to
     disk and the push to the vault both follow from it as usual. Nothing here
     reimplements what a wipe means. */

  function makeWipeButton() {
    var WORD = 'Clear';

    var scrim = document.createElement('div');
    scrim.className = 'sv-scrim sv-wipescrim';
    scrim.hidden = true;
    document.body.appendChild(scrim);

    var box = document.createElement('div');
    box.className = 'sv-wipe';
    box.hidden = true;
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-modal', 'true');
    box.setAttribute('aria-labelledby', 'svWipeTitle');
    box.innerHTML =
      '<strong id="svWipeTitle">Clear every highlight in this lesson?</strong>' +
      '<p data-what></p>' +
      '<p class="keep">The copy this replaces is kept on disk beside the lesson, so it is ' +
        'recoverable, but not from in here.</p>' +
      '<label class="lab" for="svWipeWord">Type <b>' + WORD + '</b> to confirm</label>' +
      '<input type="text" id="svWipeWord" autocomplete="off" autocapitalize="off" ' +
        'autocorrect="off" spellcheck="false" placeholder="' + WORD + '">' +
      '<footer>' +
        '<button type="button" class="act" data-cancel>Cancel</button>' +
        '<button type="button" class="act go" data-go disabled>Clear all</button>' +
      '</footer>';
    document.body.appendChild(box);

    var what   = box.querySelector('[data-what]');
    var word   = box.querySelector('#svWipeWord');
    var go     = box.querySelector('[data-go]');
    var cancel = box.querySelector('[data-cancel]');
    var returnTo = null;

    function count(m) {
      /* Groups, not items: a dialog that says 12 where the notebook says 10 is
         a dialog nobody can check before agreeing to it. */
      var i = svGroups(m.items).length, n = m.notes.length;
      var s = i + ' highlight' + (i === 1 ? '' : 's');
      if (n) s += ' and ' + n + ' note' + (n === 1 ? '' : 's');
      return s;
    }

    function shut() {
      box.hidden = true;
      scrim.hidden = true;
      word.value = '';
      go.disabled = true;
      document.removeEventListener('keydown', onKey, true);
      if (returnTo && returnTo.focus) { try { returnTo.focus(); } catch (e) {} }
      returnTo = null;
    }

    /* Capturing, so Escape closes this rather than the sheet behind it. */
    function onKey(e) {
      if (e.key === 'Escape') { e.stopPropagation(); shut(); }
    }

    /* Case-insensitive after trimming: typing it in lower case is every bit as
       deliberate as typing it capitalised, and a gate that rejects "clear" is
       teaching a lesson about capital letters rather than about wiping data. */
    word.addEventListener('input', function () {
      go.disabled = word.value.trim().toLowerCase() !== WORD.toLowerCase();
    });
    word.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !go.disabled) { e.preventDefault(); go.click(); }
    });
    cancel.addEventListener('click', shut);
    scrim.addEventListener('click', shut);

    go.addEventListener('click', function () {
      if (go.disabled) return;
      var was = count(S.marks());
      S.replaceMarks([], []);
      /* 🔴 The survivor list is passed EXPLICITLY, and that is the whole fix.
         `pruneOrphanCards` refuses an empty list it merely read, because a
         transient re-render looks the same from in there and pruning on one
         would wipe every definition on the lesson. A wipe is the one caller
         that KNOWS the emptiness is real, so it says so. Without this the
         guard fired once with every card still on disk and left all of them,
         permanently: every later load also starts empty, so the prune could
         never run again. Found by study-hub-qa on a rig, 2026-08-30. */
      if (pruneOrphanCards([])) saveCards();
      shut();
      S.toast('Cleared ' + was + '.');
    });

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'sv-danger';
    btn.textContent = 'Clear all';
    btn.addEventListener('click', function () {
      var m = S.marks();
      /* Nothing to lose, so no gate: a dialog that guards an empty lesson is
         only teaching him to click through it. */
      if (!m.items.length && !m.notes.length) {
        return S.toast('Nothing to clear in this lesson.');
      }
      what.textContent = count(m) + ' will be removed from this lesson, and from the ' +
                         'copy saved on disk.';
      returnTo = document.activeElement;
      scrim.hidden = false;
      box.hidden = false;
      document.addEventListener('keydown', onKey, true);
      window.setTimeout(function () { word.focus(); }, 0);
    });
    return btn;
  }

  (function emptyTheNotesFooter() {
    var footer = document.querySelector('.hl-panel footer');
    var slot = document.querySelector('.sv-set [data-marksslot]');

    /* No Settings sheet reachable for some reason: put the button back where it
       used to live rather than losing the only manual pull from disk. */
    if (!slot) {
      if (footer) footer.insertBefore(restoreBtn, footer.firstChild);
      return;
    }

    /* Two rows of two, then the destructive one alone. The pairs are the two
       directions rather than an arbitrary order: Export and Copy take the
       marks out, Restore and Import bring marks in. Five in a two-column grid
       would leave a hole beside whichever one came last, which is how this was
       first built and it read as a mistake. */
    ['hlExport', 'hlCopy'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) slot.appendChild(el);
    });

    slot.appendChild(restoreBtn);

    /* Import is a <label> wrapping a hidden <input type=file>, so the label is
       the node to move; taking the input alone would leave the click target
       behind in a hidden footer. */
    var imp = document.getElementById('hlImport');

        chat:  !panel.hidden,
        notes: !!(hlPanel && !hlPanel.hidden),
        set:   !setBox.hidden
      };
      Array.prototype.forEach.call(
        document.querySelectorAll('.sv-headnav [data-head], .sv-menu [data-head]'),
        function (b) {
          b.setAttribute('aria-expanded', st[b.getAttribute('data-head')] ? 'true' : 'false');
        }
      );
      /* The row can come back without anything being clicked, because the
         container query answers to the header's width and an open panel takes
         440px of it. Closing the panel widens the header, the row reappears,
         and a menu left open would then be a second copy of it hanging below. */
      if (menu.hidden) return;
      if (getComputedStyle(burger).display === 'none') closeMenu();
    }
    window.addEventListener('resize', paintHead);

    if (window.MutationObserver) {
      var watch = new MutationObserver(paintHead);
      [matPanel, panel, setBox].forEach(function (p) {
        watch.observe(p, { attributes: true, attributeFilter: ['hidden'] });
      });
      if (hlPanel) watch.observe(hlPanel, { attributes: true, attributeFilter: ['hidden'] });
      /* #hlFabN was watched here to keep the button's number fresh. R22
         removed the number; what is left reflects only which panel is open. */
    }
    paintHead();

    /* Only now are the pills hidden, so a throw anywhere above leaves the
       reader exactly as it was rather than with no controls at all. */
    document.documentElement.classList.add('sv-head-on');

    /* ---------- R18 item 4: getting back out of a full-screen panel ----------

       Below 900px a panel covers the whole screen, so the usual way out of an
       overlay (click the page behind it) does not exist. The lesson already
       closes its own notes panel on Escape; the two panels this layer owns did
       not, and that gap only became visible once they filled the screen.

       Guarded on the active element rather than on the event target, because
       the chat and ask boxes deliberately swallow the first Escape to blur
       themselves: a second one then closes the panel. */
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      var a = document.activeElement;
      if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
      if (!menu.hidden) { closeMenu(); return; }
      if (!matPanel.hidden) { closeMaterials(); return; }
      if (!panel.hidden) { closePanel(); paintTabs(); }
    });
  }());

  /* ---------- the selection toolbar must not land under the header ----------

     The lesson positions its own toolbar above the selection, and flips it below
     when there is no room. "No room" is measured against the top of the SCROLL,
     which was right when it was written and stopped being right the day R18 put
     a 52px header over the top of the page. A selection whose top edge sits
     roughly 55 to 95px down the viewport puts the toolbar underneath it.

     🔴 This has always been true on the desktop, in a band about 40px wide, and
     it was hidden on a phone only because R29 moved the toolbar to the bottom of
     the screen. Splitting that at 640px on 2026-08-15 gave the band back to
     tablets, which is what made it worth fixing properly rather than papering
     over.

     Corrected after the fact rather than by replacing the lesson's arithmetic:
     this listener is added later than the lesson's own, so it runs second on the
     same event, reads where the bar ended up and pushes it down if it is under
     the header. Nothing here knows how the position was chosen, which is what
     keeps it working if that ever changes. */
  (function () {
    var bar = document.querySelector('.hl-bar');
    if (!bar) return;

    function nudge() {
      if (bar.hidden) return;
      /* The sheet form is fixed to the bottom and owns its own position. */
      if (window.getComputedStyle(bar).position !== 'absolute') return;
      var head = document.querySelector('.sv-head');
      var floor = (head && !head.hidden ? head.getBoundingClientRect().bottom : 0) + 6;
      if (floor <= 6) return;
      var box = bar.getBoundingClientRect();
      if (box.top >= floor) return;
      /* Inline top is in page coordinates, so the correction is too. */
      var top = parseFloat(bar.style.top || '0') + (floor - box.top);
      bar.style.top = top + 'px';
    }

    document.addEventListener('mouseup', function () { window.setTimeout(nudge, 0); });
    document.addEventListener('selectionchange', function () { window.setTimeout(nudge, 0); });
  }());

  /* ---------- R29: prompts that stop describing a keyboard nobody has -------

     Three boxes carry a placeholder that explains the keys: "Ask about this.
     Enter sends, Shift+Enter for a new line." On a desktop that is the one
     place the shortcut can be learned. On a phone it is worse than useless: the
     advice does not apply, there is no Shift, and the sentence is long enough
     that a one-row box clips it mid-word, which reads as a broken control
     rather than as a hint that ran on.

     Driven by a media query listener rather than read once, so rotating the
     phone or opening the reader on a resized desktop window puts the right one
     back. The long form is kept as the source of truth on the element, so this
     never has to know what the wording is. */
  (function () {
    /* 🔴 The two ask-box entries were removed on 2026-08-29 and that is not
       tidying: their keys can no longer occur. The placeholders no longer carry
       the keyboard sentence at any width, because it moved to `.sv-askhint`
       under the box, so this map would have matched nothing and quietly done
       nothing on a phone. A lookup table whose keys cannot occur is worse than
       an empty one: it reads as working. */
    var SHORT = {
      'too vague about the mechanism, and it mentions a lecturer':
        'what to change'
    };
    var boxes = [];
    Array.prototype.forEach.call(
      document.querySelectorAll('.sv-pop textarea, .sv-panel textarea, #svEdAsk'),
      function (el) {
        var full = el.getAttribute('placeholder') || '';
        if (SHORT[full]) boxes.push({ el: el, full: full, short: SHORT[full] });
      });
    if (!boxes.length || !window.matchMedia) return;

    var mq = window.matchMedia('(max-width: 899px)');
    function paint() {
      boxes.forEach(function (b) {
        b.el.setAttribute('placeholder', mq.matches ? b.short : b.full);
      });
    }
    if (mq.addEventListener) mq.addEventListener('change', paint);
    else if (mq.addListener) mq.addListener(paint);
    paint();
  }());

  /* 🔴 The last statement in the layer, and it must stay last. The watchdog the
     server composes into the page waits for this and shows a visible bar if it
     never arrives, so it has to mean "everything above ran". Setting it earlier
     would make it mean "the file started", which is the case the watchdog exists
     to catch: a page truncated mid-stream renders fully, keeps the old engine,
     and loses the layer with no error anywhere.

     The watchdog lives in the composed page and NOT in this file, deliberately:
     inside a published artifact copy the layer is meant to be invisible, and a
     watchdog shipped in here would fire there and tell a reader their page is
     broken when it is working exactly as intended. */
  window.SV_LAYER_READY = true;
})();
</script>
<!-- study-local-layer:end -->
