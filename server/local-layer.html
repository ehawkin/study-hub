    /* Closes whichever is showing, so one control serves all three tabs. */
    strip.querySelector('.sv-tabclose').addEventListener('click', function () {
      closeSidebar();
      paintTabs();
    });
    /* Drives the same gear the header does, so there is still one settings
       sheet and one handler behind it. */
    strip.querySelector('[data-tabset]').addEventListener('click', function () {
      gear.click();
      paintTabs();
    });
    return strip;
  }

  (function installTabs() {
    if (!hlPanel || !hlFab) return;        /* nothing to toggle between */
    panel.insertBefore(buildTabs(), panel.firstChild);
    hlPanel.insertBefore(buildTabs(), hlPanel.firstChild);
    matPanel.insertBefore(buildTabs(), matPanel.firstChild);
    paintTabs();

    /* Any of the three can also be opened or closed by the header, by its own
       button or by Escape, so the strip follows the panels rather than assuming
       it caused the change. Same observer idea as setPanelSpace, same reason. */
    if (window.MutationObserver) {
      var watch = new MutationObserver(paintTabs);
      watch.observe(panel,    { attributes: true, attributeFilter: ['hidden'] });
      watch.observe(matPanel, { attributes: true, attributeFilter: ['hidden'] });
      watch.observe(hlPanel,  { attributes: true, attributeFilter: ['hidden'] });
      /* #hlCount was watched here too, to keep the tab's number fresh. R22
         removed the number, so the only thing left for this strip to reflect is
         which panel is showing. */
    }
  }());


  /* ---------- R19: the right-hand pane can be dragged wider ----------

     Asked 2026-08-13: "Now that we have the materials section on the left-hand
     side, it would be great if we could resize that right-hand pane."

     🔴 It moves --sv-panel-set, and the CSS computes --sv-panel-w from
     it. See the :root rule for why that indirection is not optional: an inline
     style on :root beats a media query, so dragging --sv-panel-w directly would
     have permanently disabled R18 item 4's full-screen pane, on every device,
     from the first drag onwards.

     🔴 setPanelSpace() has to be called by hand on every frame of the
     drag. It runs on the panels' hidden attribute and on window resize, and a
     panel changing WIDTH is neither, so without this the lesson would keep the
     old inset and the text would slide under the pane, which is the R4 defect
     arriving by yet another route. It also redraws the focus rectangles and
     recomputes which tables overflow, both of which the drag changes. */

  var PANEL_W_MIN = 320, PANEL_W_MAX = 900, panelWidth = 440;

  function clampW(w) {
    /* The server clamps too, but only against fixed bounds: it cannot see which
       machine this is. Leaving 240px of lesson is what stops a width that suits
       the Mini from swallowing the MacBook. */
    var room = Math.max(PANEL_W_MIN, window.innerWidth - 240);
    return Math.max(PANEL_W_MIN, Math.min(Math.min(PANEL_W_MAX, room), Math.round(w)));
  }

  function applyPanelWidth(w, quiet) {
    panelWidth = clampW(w);
    document.documentElement.style.setProperty('--sv-panel-set', panelWidth + 'px');
    Array.prototype.forEach.call(document.querySelectorAll('.sv-grip'), function (g) {
      g.setAttribute('aria-valuenow', String(panelWidth));
    });
    if (!quiet) setPanelSpace();
  }

  function savePanelWidth() {
    /* Only this key: write_settings defaults every other field from what is on
       disk, so a width save cannot clobber the palette. */
    return api('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ panelWidth: panelWidth })
    }).catch(function () { S.toast('The pane width was not saved.'); });
  }

  function buildGrip() {
    var g = document.createElement('div');
    g.className = 'sv-grip';
    g.setAttribute('role', 'separator');
    g.setAttribute('tabindex', '0');
    g.setAttribute('aria-orientation', 'vertical');
    g.setAttribute('aria-label', 'Width of this pane');
    g.setAttribute('aria-valuemin', String(PANEL_W_MIN));
    g.setAttribute('aria-valuemax', String(PANEL_W_MAX));
    g.setAttribute('aria-valuenow', String(panelWidth));
    g.title = 'Drag to resize. Arrow keys also work.';

    g.addEventListener('pointerdown', function (e) {
      if (e.button) return;                 /* left button and touch only */
      e.preventDefault();
      try { g.setPointerCapture(e.pointerId); } catch (err) {}
      document.documentElement.classList.add('sv-dragging');
    });
    g.addEventListener('pointermove', function (e) {
      if (!document.documentElement.classList.contains('sv-dragging')) return;
      /* The pane is docked to the right edge, so its width is whatever is to the
         right of the pointer. */
      applyPanelWidth(window.innerWidth - e.clientX);
    });
    function end(e) {
      if (!document.documentElement.classList.contains('sv-dragging')) return;
      document.documentElement.classList.remove('sv-dragging');
      try { g.releasePointerCapture(e.pointerId); } catch (err) {}
      savePanelWidth();
    }
    g.addEventListener('pointerup', end);
    g.addEventListener('pointercancel', end);

    /* The pane grows leftwards, so Left makes it bigger. */
    g.addEventListener('keydown', function (e) {
      var step = e.shiftKey ? 96 : 24, w = null;
      if (e.key === 'ArrowLeft')  w = panelWidth + step;
      else if (e.key === 'ArrowRight') w = panelWidth - step;
      else if (e.key === 'Home')  w = PANEL_W_MIN;
      else if (e.key === 'End')   w = PANEL_W_MAX;
      if (w === null) return;
      e.preventDefault();
      applyPanelWidth(w);
      savePanelWidth();
    });
    return g;
  }

  (function installGrips() {
    [panel, matPanel, hlPanel].forEach(function (pn) {
      if (pn && !pn.querySelector('.sv-grip')) pn.appendChild(buildGrip());
    });
    /* A width that fitted the other Mac may not fit this one, and the window can
       be resized after the fact, so re-clamp rather than trusting what was
       stored. Quiet, because setPanelSpace already runs on resize. */
    window.addEventListener('resize', function () { applyPanelWidth(panelWidth, true); });
  }());
  panel.querySelector('[data-bmchat]').addEventListener('click', toggleChatBookmark);
  panel.querySelector('[data-close]').addEventListener('click', closePanel);
  panel.querySelector('[data-new]').addEventListener('click', function () {
    openChat = null;
    pHist.hidden = true;
    pHistBtn.setAttribute('aria-pressed', 'false');
    renderThread();
    pBox.focus();
  });
  pHistBtn.addEventListener('click', function () {
    var show = pHist.hidden;
    pHist.hidden = !show;
    pHistBtn.setAttribute('aria-pressed', String(show));
    if (show) renderHistory();
  });

  function panelBusy(on) { pSend.disabled = on; pBox.disabled = on; }

  function panelAsk() {
    var q = pBox.value.trim();
    if (!q) { pBox.focus(); return; }
    if (!caps.explain) {
      if (!openChat) { openChat = newChat(null, null, null); chats.push(openChat); }
      openChat.pending = null;
      openChat.turns.push({ role: 'claude', text: '(the Claude Code CLI was not found, so nothing can be asked)' });
      return renderThread();
    }
    pBox.value = '';
    pBox.style.height = 'auto';

    if (!openChat) {
      openChat = newChat(null, null, null);
      chats.push(openChat);
    }
    openChat.turns.push({ role: 'user', text: q });
    openChat.ts = Date.now();
    panelBusy(true);
    openChat.pending = 'Thinking.';
    renderThread();

    var mine = openChat;
    api('/api/followup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        doc: S.docId, term: mine.term || '', context: mine.context || '',
        title: S.title, question: q, level: level,
        scope: mine.scope || 'lesson',
        history: mine.turns.slice(0, -1)
      })
    }).then(function (r) {
      var answer = (r.body && r.body.ok) ? r.body.text
                 : '(' + ((r.body && r.body.error) || 'no answer') + ')';
      if (r.body && r.body.model) caps.model = r.body.model;
      landInPanel(mine, answer);
    }).catch(function () {
      landInPanel(mine, '(could not reach the server)');
    });
  }

  /* The answer belongs to the conversation it was asked in, not to whatever is
     on screen when it arrives. Switching chats or closing the panel mid-answer
     therefore loses nothing. */
  function landInPanel(c, answer) {
    c.pending = null;
    c.turns.push({ role: 'claude', text: answer });
    c.ts = Date.now();
    if (openChat === c) {
      panelBusy(false);
      if (!panel.hidden) { renderThread(); pBox.focus(); }
    }
    saveChats().then(function () { chatFab.textContent = 'Chat ' + chats.length; });
  }

  function newChat(term, context, b) {
    var id = 1;
    chats.forEach(function (c) { if (c.id >= id) id = c.id + 1; });
    return { id: id, ts: Date.now(), term: term || '', context: context || '',
             scope: panelScope || 'lesson',
             b: (b === 0 || b) ? b : null, turns: [] };
  }

  /* EH's design (2026-08-22): a question can be asked in the context of
     this lesson, this topic, or the whole course. The choice belongs to the
     CHAT, not the page: each thread remembers what it was asked across, and
     reopening it restores the buttons. */
  var panelScope = 'lesson';
  var SCOPE_HINT = {
    lesson: 'Ask anything about this lesson. Enter sends, Shift+Enter for a new line.',
    topic:  'Ask across every part of this topic. Enter sends, Shift+Enter for a new line.',
    course: 'Ask across the whole course. Enter sends, Shift+Enter for a new line.'
  };
  function paintScope() {
    var cur = (openChat && openChat.scope) || panelScope;
    Array.prototype.forEach.call(panel.querySelectorAll('[data-scope]'), function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-scope') === cur));
    });
    pBox.placeholder = SCOPE_HINT[cur] || SCOPE_HINT.lesson;
  }
  Array.prototype.forEach.call(panel.querySelectorAll('[data-scope]'), function (b) {
    b.addEventListener('click', function () {
      panelScope = b.getAttribute('data-scope');
      if (openChat) { openChat.scope = panelScope; saveChats(); }
      paintScope();
      pBox.focus();
    });
  });
  paintScope();

  pSend.addEventListener('click', panelAsk);
  pBox.addEventListener('input', function () {
    pBox.style.height = 'auto';
    pBox.style.height = Math.min(120, pBox.scrollHeight) + 'px';
  });
  pBox.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); panelAsk(); }
    if (e.key === 'Escape') { e.stopPropagation(); pBox.blur(); }
  });

  /* ---------- settings ----------

     In notes/settings.json, not the machine config, so both Macs get the same
     preferences through Dropbox and nothing in there is a secret. The model name
     reaches a subprocess argv, so the server keeps an allowlist; this is only
     the picker for it. */

  var gear = document.createElement('button');
  gear.type = 'button';
  gear.className = 'sv-gear';
  gear.textContent = 'Settings';
  document.body.appendChild(gear);

  var setBox = document.createElement('div');
  setBox.className = 'sv-set';
  setBox.hidden = true;
  setBox.innerHTML =
    '<h3>Settings</h3>' +
    '<div><label class="lab" for="svModel">Model</label>' +
      '<select id="svModel"></select>' +
      '<div class="hint" data-model-note></div></div>' +
    '<div><label class="lab" for="svLevel2">How answers are pitched</label>' +
      '<select id="svLevel2">' +
        '<option value="plain">Plain: no background assumed</option>' +
        '<option value="explained">Technical, every term explained as it goes</option>' +
        '<option value="technical">Technical: assumes the vocabulary</option>' +
      '</select></div>' +
    '<div><label class="lab" for="svPSize">Text size in the right-hand panel</label>' +
      '<select id="svPSize"></select>' +
      '<div class="hint">Applies to both the chat panel and the notes panel.</div></div>' +
    /* R40. The notes panel's footer carried six controls under the highlight
       list: Restore from disk, Export .md, For The Box, Copy, Import, Clear
       all. None of them is used while reading, and one of them wipes every
       highlight in the lesson, which is the worst thing to leave a mis-tap
       away from a note. They move in here as a group; the footer goes.

       Moved, not rebuilt. The lesson's own handlers are bound to those exact
       elements, so re-creating the buttons here would mean re-implementing
       export, import and the clear confirmation, and the two copies would
       drift the first time one was changed. */
    '<div><label class="lab">This lesson\'s highlights and notes</label>' +
      '<div class="sv-marks" data-marksslot></div>' +
      '<div class="hint">Saved to disk as you make them, next to the lesson: ' +
        '<code>&lt;lesson&gt;-marks.json</code> holds highlights and notes, ' +
        'with <code>-cards</code>, <code>-bookmarks</code> and <code>-chats</code> beside it. ' +
        'Point any tool, or your own Claude, at that folder to sync them anywhere. ' +
        'None of these buttons is needed for ordinary reading.</div></div>' +
    /* R39: the floating "The Box: ready" pill lived here instead. It was the
       last free-floating affordance on the page, and he asked for it to go into
       the menu, on the desktop as well as the phone. The button itself moves in
       below, rather than being copied, so there is still one of it. */
    /* Named from the config like the badge is, so a recipient's Settings says
       their own vault's name. setVaultName() fills it when /api/status lands. */
    '<div><label class="lab" id="svVaultLabel">Vault</label>' +
      '<label class="sv-vopt"><input type="checkbox" id="svVault"> ' +
        '<span>Publish highlights and notes to the vault</span></label>' +
      '<div data-vaultslot></div>' +
      '<div class="hint" id="svVaultHint"></div></div>' +
    '<div><label class="lab">All your courses</label>' +
      '<a class="sv-homelink" href="/home">The modules on this machine</a>' +
      '<div class="hint">One card per module, with where you left off in each. ' +
        'Also <a href="notebook">everything you have marked on this course</a>.</div></div>' +
    '<div><label class="lab">The server</label>' +
      '<button type="button" id="svRestart">Relaunch the server</button>' +
      '<div class="hint" id="svRestartNote">Loads any change made to the server itself. ' +
        'Your highlights and notes are already on disk and are not affected.</div></div>' +
    '<div class="where"></div>';
  document.body.appendChild(setBox);

  /* Moved, not mirrored: everything that writes to this element already exists
     and a second copy would drift the first time one of them was missed. */
  (function () {
    var slot = setBox.querySelector('[data-vaultslot]');
    var pill = document.querySelector('.sv-badge');
    if (slot && pill) { pill.classList.add('sv-inset'); slot.appendChild(pill); }
  }());

  var vaultBox  = setBox.querySelector('#svVault');
  var vaultHint = setBox.querySelector('#svVaultHint');
  var modelSel  = setBox.querySelector('#svModel');
  var level2    = setBox.querySelector('#svLevel2');
  var sizeSel   = setBox.querySelector('#svPSize');
  var modelNote = setBox.querySelector('[data-model-note]');
  var settings  = null;

  /* Applied to the document root, so it reaches the notes panel too, which is
     the lesson's element and not one this file created. */
  function applyPanelSize(scale) {
    document.documentElement.style.setProperty('--sv-pzoom', String(scale || 1));
  }

  function scaleFor(id) {
    var list = (settings && settings.panelSizes) || [];
    for (var i = 0; i < list.length; i++) { if (list[i].id === id) return list[i].scale; }
    return 1;
  }

  function paintModelNote() {
    var found = ((settings && settings.models) || []).filter(function (m) {
      return m.id === modelSel.value;
    })[0];
    modelNote.textContent = found ? found.note : '';
  }

  function loadSettings() {
    return api('/api/settings').then(function (r) {
      settings = r.body || {};
      modelSel.innerHTML = '';
      (settings.models || []).forEach(function (m) {
        var o = document.createElement('option');
        o.value = m.id; o.textContent = m.label;
        modelSel.appendChild(o);
      });
      if (settings.model) { modelSel.value = settings.model; caps.model = settings.model; }
      if (settings.level) {
        level = settings.level;
        level2.value = level;
        if (levelSel) levelSel.value = level;
      }
      paintModelNote();
      sizeSel.innerHTML = '';
      (settings.panelSizes || []).forEach(function (s) {
        var o = document.createElement('option');
        o.value = s.id; o.textContent = s.label;
        sizeSel.appendChild(o);
      });
      if (settings.panelSize) {
        sizeSel.value = settings.panelSize;
        applyPanelSize(scaleFor(settings.panelSize));
      }
      setBox.querySelector('.where').textContent =
        'Saved in ' + (settings.path || 'notes/settings.json');
      if (settings.panelWidth) {
        if (settings.panelWidthMin) PANEL_W_MIN = settings.panelWidthMin;
        if (settings.panelWidthMax) PANEL_W_MAX = settings.panelWidthMax;
        applyPanelWidth(settings.panelWidth);
      }
      if (settings.palette && settings.palette.length) {
        palette = settings.palette;
        /* The shell's vault builder buckets by this. Without it, custom
           colours fell through to a literal list of two (see buildVaultMd). */
        S.palette = palette;
        lastColour = settings.lastColour || 'k';
        paintPaletteCss();
        installPalette();
        tagMarks();
      }
    }).catch(function () {});
  }

  function saveSettings(what) {
    return api('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: modelSel.value, level: level2.value,
                             panelSize: sizeSel.value })
    }).then(function (r) {
      if (r.body && r.body.ok) {
        level = r.body.level;
        if (levelSel) levelSel.value = level;
        caps.model = r.body.model;
        /* Say back what was actually changed. Reporting the model after a text
           size change reads as though the wrong control was hit. */
        S.toast(what === 'size'
          ? 'Saved. Panel text is now ' +
            sizeSel.options[sizeSel.selectedIndex].text.toLowerCase() + '.'
          : 'Saved. Answers now use ' +
            modelSel.options[modelSel.selectedIndex].text + '.');
      }
    }).catch(function () {});
  }

  /* R50: publishing is a preference now, so the row stays and the switch moves.
     Applying it here rather than waiting for a reload is the point: turning it
     off should stop the badge and the pushing immediately, and turning it back
     on should start them, because a setting that needs a restart is not a
     setting. */
  function applyVault(on) {
    caps.vault = !!on;
    if (badge) badge.hidden = !on;
    if (vaultHint) {
      vaultHint.textContent = on
        ? 'Your highlights and notes are published to the vault as you make them. '
          + 'Press the badge to save now.'
        : 'Off. Nothing is written to the vault. Your highlights and notes are still '
          + 'saved to disk beside the lesson, and Export still carries everything.';
    }
  }

  if (vaultBox) {
    vaultBox.addEventListener('change', function () {
      var on = vaultBox.checked;
      applyVault(on);
      /* Turning it ON publishes what is already on the page, because otherwise
         nothing reaches the vault until the next highlight and the switch looks
         like it did nothing. Turning it off schedules nothing. */
      if (on) schedule();
      api('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: modelSel.value, level: level2.value,
                               panelSize: sizeSel.value, vaultEnabled: on })
      }).then(function (r) {
        if (!r.body || !r.body.ok) throw new Error('refused');
        S.toast(on ? 'Publishing to the vault is on.' : 'Publishing to the vault is off.');
      }).catch(function () {
        /* Put the switch back where the server still has it. */
        vaultBox.checked = !on;
        applyVault(!on);
        S.toast('That could not be saved.');
      });
    });
  }

  modelSel.addEventListener('change', function () { paintModelNote(); saveSettings(); });
  level2.addEventListener('change', function () { saveSettings(); });
  /* Applied before the round trip, so the panel resizes as the choice is made
     rather than when the server answers. */
  sizeSel.addEventListener('change', function () {
    applyPanelSize(scaleFor(sizeSel.value));
    saveSettings('size');
  });

  /* ---------- relaunch the server ----------

     R16, asked 2026-08-13: "let's add something into settings where I can
     relaunch the server."

     He asked a second question the same evening, "is it okay for me to restart
     the server if things haven't been saved into the Obsidian Vault?", and the
     note under the button is the answer to it: marks and notes are written to
     disk as they are made, so a restart never costs him anything. Only the
     vault publication is deferred, and reopening the lesson republishes it.

     The server refuses to restart into a file that will not parse, so the
     interesting failure is a refusal rather than a silence. It is reported
     here rather than swallowed. */

  var restartBtn  = setBox.querySelector('#svRestart');
  var restartNote = setBox.querySelector('#svRestartNote');
  var restartWas  = restartNote.textContent;

  function waitForServer(tries) {
    /* The old process answers until the moment it execs, so a single probe can
       succeed against a server that is about to disappear. Two consecutive
       successes after a pause is the cheap way to mean "the new one is up". */
    return new Promise(function (done) {
      var seen = 0;
      var tick = function (left) {
        if (left <= 0) { done(false); return; }
        api('/api/status').then(function (r) {
          seen = (r && r.body) ? seen + 1 : 0;
          if (seen >= 2) { done(true); return; }
          window.setTimeout(function () { tick(left - 1); }, 500);
        }).catch(function () {
          seen = 0;
          window.setTimeout(function () { tick(left - 1); }, 500);
        });
      };
      window.setTimeout(function () { tick(tries); }, 900);
    });
  }

  restartBtn.addEventListener('click', function () {
    if (restartBtn.disabled) return;
    restartBtn.disabled = true;
    restartNote.textContent = 'Relaunching…';
    api('/api/restart', { method: 'POST',
                          headers: { 'Content-Type': 'application/json' },
                          body: '{}' })
      .then(function (r) {
        if (!r.body || r.body.ok !== true) {
          restartNote.textContent = (r.body && r.body.error) ||
            'The server would not relaunch.';
          restartBtn.disabled = false;
          return;
        }
        return waitForServer(20).then(function (up) {
          restartNote.textContent = up
            ? 'Relaunched, and answering again. Reload the page to pick up any change.'
            : 'It did not answer again. It may need starting by hand on the Mini.';
          restartBtn.disabled = false;
        });
      })
      .catch(function () {
        /* The connection dying is the expected shape of success here, because
           the process replaces itself mid-request on some paths. */
        waitForServer(20).then(function (up) {
          restartNote.textContent = up
            ? 'Relaunched, and answering again. Reload the page to pick up any change.'
            : 'It did not answer again. It may need starting by hand on the Mini.';
          restartBtn.disabled = false;
        });
      });
  });

  /* Put the explanation back when the panel is reopened, so a stale outcome
     from twenty minutes ago is not still being reported as news. */
  gear.addEventListener('click', function () {
    if (!restartBtn.disabled) { restartNote.textContent = restartWas; }
  });

  /* ---------- the highlight palette, and the key ----------

     Asked 2026-08-13: "Different color highlights with the ability to set a key
     as to what each color denotes", then sharpened to "next to the highlight
     button... a little color palette icon. If you click, it opens up a set of
     colors you can choose from and add to. And the next time you go to
     highlight, it should use the last color you used."

     The label on each swatch IS the key. That is why the palette is stored on
     the server rather than hard-coded: a colour without a stated meaning is the
     thing he could not read off the screen in the first place.

     🔴 Card is not in the picker and never becomes the sticky default, on his
     instruction, because it writes flashcard syntax into the vault and a sticky
     Card would keep doing that without being asked.

     Everything here drives the lesson's OWN bar and paint path from outside.
     The bar markup, the click handlers and paint() all live in each of the 29
     lesson files; re-implementing them here would mean two sources of truth,
     and editing them there would mean 29 files. So instead this retargets the
     existing Highlight button by rewriting its data-c, and lets the lesson's
     own handler read it at click time. */

  var palette = null, lastColour = 'k';
  var palStyle = document.createElement('style');
  document.head.appendChild(palStyle);

  function colourById(id) {
    for (var i = 0; i < (palette || []).length; i++) {
      if (palette[i].id === id) return palette[i];
    }
    return null;
  }

  function paintPaletteCss() {
    if (!palette) return;
    var css = [];
    palette.forEach(function (c) {
      /* Ties with the lesson's own mark.hl.q / mark.hl.d on specificity, and
         this stylesheet is appended last, so it wins. */
      css.push('mark.hl[data-c="' + c.id + '"]{background:' + c.color + ';}');
      /* The rule down the left of a highlight in the Notes tab, from the same
         source as the highlight itself.

         🔴 Reported 2026-08-16, and the mismatch was not a shade. The lesson
         paints that rule from three hard-coded variables and the panel only
         ever tags an item `q` or `d`, so **every colour beyond the built-in
         three fell through to the green default**: both of the colours he added
         himself, including the one he is currently highlighting with. Card was
         wrong too, in a quieter way, drawing its outline colour rather than its
         fill. `:not(.orphan)` so a lost highlight still reads as broken. */
      css.push('.hl-item[data-c="' + c.id + '"]:not(.orphan) blockquote' +
               '{border-left-color:' + c.color + ';}');
      if (c.dark) {
        css.push('@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) ' +
                 'mark.hl[data-c="' + c.id + '"]{background:' + c.dark + ';}}');
        css.push(':root[data-theme="dark"] mark.hl[data-c="' + c.id + '"]{background:' + c.dark + ';}');
        css.push('@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) ' +
                 '.hl-item[data-c="' + c.id + '"]:not(.orphan) blockquote' +
                 '{border-left-color:' + c.dark + ';}}');
        css.push(':root[data-theme="dark"] .hl-item[data-c="' + c.id + '"]:not(.orphan) ' +
                 'blockquote{border-left-color:' + c.dark + ';}');
      }
    });
    /* R15: a term you hold a card for should read differently from a highlight. */
    css.push('mark.hl[data-c="d"]{outline:1.5px solid var(--hl-d-line);outline-offset:1px;border-radius:2px;}');
    palStyle.textContent = css.join('\n');
  }

  /* The lesson paints a mark with one of three hard-coded classes and stamps
     only its id. Adding data-c from the stored item is what lets an arbitrary
     colour show up at all. renderMarks() rebuilds the block's innerHTML, so
     this has to run again after every change, not once. */
  function tagMarks() {
    if (!palette) return;
    var byId = {};
    S.marks().items.forEach(function (it) { byId[String(it.id)] = it.c || 'k'; });
    var nodes = document.querySelectorAll('.wrap mark.hl[data-id]');
    Array.prototype.forEach.call(nodes, function (n) {
      var c = byId[n.dataset.id];
      if (c) n.setAttribute('data-c', c);
    });
  }

  var pal = document.createElement('div');
  pal.className = 'sv-pal';
  pal.hidden = true;
  document.body.appendChild(pal);

  /* R45. One row, three explicit verbs: the wide button PICKS (and
     highlights, because a selection is live whenever this is open), the pencil
     RENAMES, the cross REMOVES. The old row hid rename inside a click on the
     name, which read as a mis-tap, and had no remove at all. */
  var palEdit = null, palDel = null, palDelUses = null;

  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

  function renderPalette() {
    var rows = palette.filter(function (c) { return c.id !== 'd' && !c.retired; }).map(function (c) {
      if (palEdit === c.id) {
        return '<div class="sv-swatch editing" data-row="' + c.id + '">' +
               '<span class="chip" style="background:' + c.color + '"></span>' +
               '<input data-newname value="' + esc(c.label) + '" maxlength="40"' +
               ' aria-label="Rename this colour">' +
               '<button type="button" data-rename="' + c.id + '">Save</button>' +
               '<button type="button" data-back>Cancel</button>' +
               '</div>';
      }
      if (palDel === c.id) {
        var extra = (palDelUses && palDelUses.count)
          ? 'Also delete its ' + palDelUses.count + ' highlight' +
            (palDelUses.count === 1 ? '' : 's') +
            (palDelUses.lessons > 1 ? ' across ' + palDelUses.lessons + ' lessons' : '')
          : 'Also delete its highlights';
        return '<div class="sv-swatch deleting" data-row="' + c.id + '">' +
               '<div class="dq">Remove \u201C' + esc(c.label) + '\u201D from your colours?</div>' +
               '<label class="dopt"><input type="checkbox" data-purgetoo> <span>' + extra + '</span></label>' +
               '<div class="dact">' +
                 '<button type="button" data-confirmdel="' + c.id + '">Remove</button>' +
                 '<button type="button" data-back>Cancel</button>' +
               '</div></div>';
      }
      return '<div class="sv-swatch" data-row="' + c.id + '"' +
             (c.id === lastColour ? ' aria-current="true"' : '') + '>' +
             '<button type="button" class="pick" data-pick="' + c.id + '">' +
               '<span class="chip" style="background:' + c.color + '"></span>' +
               '<span class="plab">' + esc(c.label) + '</span></button>' +
             '<button type="button" class="pedit" data-edit="' + c.id + '" title="Rename"' +
               ' aria-label="Rename ' + esc(c.label) + '">\u270E</button>' +
             /* k is the fallback every unmarked colour renders as, so it stays. */
             (c.id === 'k' ? '' :
               '<button type="button" class="pdel" data-del="' + c.id + '" title="Remove this colour"' +
               ' aria-label="Remove ' + esc(c.label) + '">\u00D7</button>') +
             '</div>';
    }).join('');
    pal.innerHTML =
      '<div class="sv-palhead">Highlight colours <span>the label is the key</span></div>' +
      '<div class="sv-palrows">' + rows + '</div>' +
      '<div class="sv-paladd">' +
        '<input type="color" data-newcolour value="#F6C6C6" aria-label="New colour">' +
        '<input type="text" data-newlabel placeholder="What it means" maxlength="40">' +
        '<button type="button" data-addcolour>Add</button>' +
      '</div>';
    if (palEdit) {
      var inp = pal.querySelector('[data-newname]');
      if (inp) { inp.focus(); inp.select(); }
    }
  }

  /* R23. A chisel-tip marker held at an angle, with a stroke lying under it.
     Two parts carry the colour and both are class="ink": the nib, and the
     stroke, which is the part that reads at 15px. The barrel stays currentColor
     so the icon still has an outline when the chosen colour is very pale, which
     several of them are: an all-colour icon in #F6C6C6 on white is a smudge.

     Hand-authored rather than fetched: the layer must stay self-contained, and
     the whole thing is four shapes. */
  var PAL_ICON =
    '<svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true" focusable="false">' +
      '<g transform="rotate(-35 10 7.4)">' +
        '<path class="ink" d="M9 1.4 h2 a1.2 1.2 0 0 1 1.2 1.2 v7.9 h-4.4 v-7.9 ' +
              'a1.2 1.2 0 0 1 1.2-1.2 Z" ' +
              'stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/>' +
        '<path class="ink" d="M7.8 10.5 h4.4 l-0.9 2.9 h-2.6 Z" ' +
              'stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/>' +
      '</g>' +
      '<rect class="ink" x="2.2" y="16.4" width="15.6" height="3" rx="1.5"/>' +
    '</svg>';

  /* The colour goes on as two variables, not a fill: see the .sv-palbtn .ink
     rules for why. Tolerates the button not existing yet, because the settings
     fetch that fills the palette and the selection that builds the bar do not
     arrive in a fixed order. */
  function paintPalIcon() {
    var c = colourById(lastColour) || colourById('k');
    if (!c) return;
    Array.prototype.forEach.call(document.querySelectorAll('.sv-palbtn'), function (b) {
      b.style.setProperty('--sv-icol', c.color);
      if (c.dark) b.style.setProperty('--sv-icold', c.dark);
      else b.style.removeProperty('--sv-icold');
      b.title = 'Highlighting in "' + c.label + '". Click to change colour, or say what one means.';
    });
  }

  function syncHighlightButton() {
    paintPalIcon();
    var b = S.bar && S.bar.querySelector('button[data-c]:not([data-c="d"])');
    if (!b || !palette) return;
    var c = colourById(lastColour) || colourById('k');
    b.setAttribute('data-c', c.id);
    b.textContent = c.label;
    b.style.background = c.color;
    b.title = 'Highlight as "' + c.label + '". The palette beside this changes it.';
  }

  function savePalette() {
    return api('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: modelSel.value, level: level2.value,
        palette: palette, lastColour: lastColour
      })
    }).then(function (r) {
      if (r.body && r.body.ok && r.body.palette) {
        palette = r.body.palette;
        lastColour = r.body.lastColour;
        paintPaletteCss(); syncHighlightButton(); tagMarks();
      } else if (r.body && r.body.error) {
        S.toast(r.body.error);
      }
    }).catch(function () { S.toast('The palette was not saved.'); });
  }

  function installPalette() {
    if (!S.bar || !palette) return;
    if (S.bar.querySelector('.sv-palbtn')) return;
    var hi = S.bar.querySelector('button[data-c="k"]');
    var flag = S.bar.querySelector('button[data-c="q"]');
    if (!hi) return;
    /* Flag stops being a peer button and becomes a swatch like any other. */
    if (flag) flag.hidden = true;

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'sv-palbtn';
    btn.title = 'Choose a highlight colour, and say what it means';
    btn.setAttribute('aria-label', 'Highlight colours');
    btn.innerHTML = PAL_ICON + '<span class="pcaret" aria-hidden="true">\u25BE</span>';
    hi.insertAdjacentElement('afterend', btn);
    paintPalIcon();   /* the button is new, so it starts with no colour on it */

    /* Same trick the lesson's own buttons use: without this the selection is
       gone before the click lands, and there is nothing left to highlight. */
    btn.addEventListener('mousedown', function (e) { e.preventDefault(); });
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (pal.hidden) {
        renderPalette();
        var r = btn.getBoundingClientRect();
        pal.hidden = false;
        var w = pal.offsetWidth;
        pal.style.left = Math.max(8, Math.min(r.left + window.scrollX,
          document.documentElement.clientWidth - w - 8)) + 'px';
        pal.style.top = (r.bottom + window.scrollY + 6) + 'px';
      } else {
        pal.hidden = true;
      }
    });
    syncHighlightButton();
  }

  pal.addEventListener('mousedown', function (e) {
    /* Keep the selection alive, except in the text fields, which need focus. */
    if (!/^(INPUT)$/.test(e.target.tagName)) e.preventDefault();
  });

  function commitRename(id) {
    var inp = pal.querySelector('[data-newname]');
    var c = colourById(id);
    var v = inp ? (inp.value || '').trim() : '';
    palEdit = null;
    if (c && v) { c.label = v; syncHighlightButton(); savePalette(); }
    renderPalette();
  }

  pal.addEventListener('click', function (e) {
    var t = e.target;
    var hit = function (attr) {
      var el = t.closest && t.closest('[' + attr + ']');
      return el ? (el.getAttribute(attr) || true) : null;
    };

    var pick = hit('data-pick');
    if (pick) {
      lastColour = pick;
      pal.hidden = true;
      palEdit = palDel = null;
      syncHighlightButton();
      savePalette();
      /* A selection is live whenever this bar is showing, so picking a colour
         means "use it now", not merely "use it next time". Clicking the
         lesson's own button reuses its handler rather than duplicating it. */
      var hi = S.bar && S.bar.querySelector('button[data-c]:not([data-c="d"])');
      if (hi && !S.bar.hidden) hi.click();
      return;
    }

    var ed = hit('data-edit');
    if (ed) { palEdit = ed; palDel = null; renderPalette(); return; }

    var del = hit('data-del');
    if (del) {
      palDel = del; palEdit = null; palDelUses = null;
      renderPalette();
      /* The confirm names the real number, fetched while it is on screen. */
      api('/api/colour-uses?c=' + encodeURIComponent(del)).then(function (r) {
        if (r.body && r.body.ok && palDel === del) {
          palDelUses = r.body;
          renderPalette();
        }
      }).catch(function () {});
      return;
    }

    if (hit('data-back')) { palEdit = palDel = null; renderPalette(); return; }

    var ren = hit('data-rename');
    if (ren) { commitRename(ren); return; }

    var kill = hit('data-confirmdel');
    if (kill) {
      var purge = !!(pal.querySelector('[data-purgetoo]') || {}).checked;
      var uses = palDelUses;
      var c = colourById(kill);
      /* 🔴 Retired, never removed: marks keeping the colour still need its hex
         to render, so the entry stays in settings.json and the picker hides
         it. Deleting the entry outright would repaint kept highlights green,
         which is exactly the bug R1's palette was built to end. */
      if (c) c.retired = true;
      if (lastColour === kill) lastColour = 'k';
      palDel = null; palDelUses = null;
      renderPalette(); syncHighlightButton();
      savePalette();
      if (purge) {
        /* The open lesson first, so its own 900ms push cannot re-add what the
           sweep just removed; then the sweep covers every other lesson. */
        var m = S.marks();
        var keep = m.items.filter(function (it) { return it.c !== kill; });
        if (keep.length !== m.items.length) S.replaceMarks(keep, m.notes);
        api('/api/colour-purge', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ c: kill })
        }).then(function (r) {
          if (r.body && r.body.ok) {
            S.toast('Colour removed, and ' + r.body.removed +
                    (r.body.removed === 1 ? ' highlight' : ' highlights') + ' with it.');
          } else {
            S.toast((r.body && r.body.error) || 'The colour is gone but the sweep failed.');
          }
        }).catch(function () { S.toast('The colour is gone but the sweep failed.'); });
      } else {
        S.toast('Colour removed. Its highlights keep their colour.');
      }
      return;
    }

    if (t.hasAttribute && t.hasAttribute('data-addcolour')) {
      var col = pal.querySelector('[data-newcolour]').value;
      var lab = (pal.querySelector('[data-newlabel]').value || '').trim();
      if (!lab) { S.toast('Give the colour a meaning first. That is the point of it.'); return; }
      var n = 1, id;
      do { id = 'u' + n++; } while (colourById(id));
      palette = palette.concat([{ id: id, label: lab, color: col }]);
      lastColour = id;
      palEdit = palDel = null;
      renderPalette(); syncHighlightButton();
      savePalette();
    }
  });

  pal.addEventListener('keydown', function (e) {
    if (!e.target.hasAttribute || !e.target.hasAttribute('data-newname')) return;
    if (e.key === 'Enter') { e.preventDefault(); commitRename(palEdit); }
    if (e.key === 'Escape') { e.stopPropagation(); palEdit = null; renderPalette(); }
  });

  /* 🔴 R45's actual defect, and the fix is one property of events. The lesson
     hides the bar and FORGETS THE RECORDED SELECTION on any document mouseup
     or keyup that lands with the selection collapsed, and focusing the rename
     input collapses it. So editing a name destroyed `pending`, after which
     every colour button silently did nothing. These two stoppers keep the
     lesson's document-level listeners from ever seeing events that belong to
     the palette; the bar stays up, the recorded selection stays alive, and a
     colour picked after a rename still highlights. Capture phase, so the stop
     lands before the lesson's bubble-phase listener on the same document. */
  ['mouseup', 'keyup'].forEach(function (type) {
    document.addEventListener(type, function (e) {
      if (e.target && e.target.closest && e.target.closest('.sv-pal')) e.stopPropagation();
    }, true);
  });

  document.addEventListener('mousedown', function (e) {
    if (pal.hidden) return;
    if (e.target.closest && (e.target.closest('.sv-pal') || e.target.closest('.sv-palbtn'))) return;
    pal.hidden = true;
  });

  /* renderMarks() rewrites the block's innerHTML on every change, which throws
     away the data-c stamps. The timeout puts this after that render rather than
     racing it. */
  S.onChange(function () { window.setTimeout(tagMarks, 0); });

  gear.addEventListener('click', function () {
    setBox.hidden = !setBox.hidden;
    if (!setBox.hidden) loadSettings();
  });
  /* 🔴 .sv-setbtn is R18's header and menu Settings buttons, and leaving it out
     made Settings impossible to CLOSE from the header while opening fine, which
     is a confusing way to fail. This fires on mousedown and the toggle fires on
     click: pressing the header button while the sheet was open closed it here
     and then the toggle immediately reopened it. Opening was unaffected,
     because this handler returns early when the sheet is already hidden. */
  document.addEventListener('mousedown', function (e) {
    if (setBox.hidden) return;
    /* 🔴 R41's confirm dialog is exempt because it OPENS from this sheet. It is
       appended to body rather than into the sheet (it has to paint over it), so
       without this, typing the confirmation word closed Settings underneath and
       cancelling then returned to a bare page instead of to where he was. */
    if (e.target.closest && (e.target.closest('.sv-set') ||
                             e.target.closest('.sv-gear') ||
                             e.target.closest('.sv-setbtn') ||
                             e.target.closest('.sv-wipe') ||
                             e.target.closest('.sv-wipescrim'))) return;
    setBox.hidden = true;
  });

  /* ---------- selecting inside an answer ----------

     The two directions differ on purpose. Ask CONTINUES the conversation you are
     already in, phrased so the thread records what you asked about. Look up opens
     a small definition beside it and changes nothing, because wanting a word
     defined is not the same as wanting to change the subject. */

  var mini = document.createElement('div');
  mini.className = 'sv-mini';
  mini.hidden = true;
  /* R5, asked 2026-08-13: "I'd like to add the ability to highlight things and
     add definition terms and all that from inside the chat. Currently, I can
     only ask about this and look up inside the chat." Card is the addition:
     Look up shows a definition and forgets it, Card keeps it, in the same list
     as the cards made on the page. */
  mini.innerHTML =
    '<div class="row">' +
      '<button type="button" data-mini-ask>Ask about this</button>' +
      '<button type="button" data-mini-look>Look up</button>' +
      '<button type="button" data-mini-card>Card</button>' +
      '<button type="button" data-mini-hl hidden>Highlight</button>' +
    '</div>' +
    '<div class="out" hidden></div>';
  document.body.appendChild(mini);

  var miniOut = mini.querySelector('.out');
  var miniText = '';
  var miniWhere = null;   /* 'pop' or 'panel' */

  function hideMini() { mini.hidden = true; miniOut.hidden = true; miniText = ''; }

  function showMini(text, where, rect) {
    miniText = text;
    miniWhere = where;
    miniOut.hidden = true;
    miniOut.innerHTML = '';
    /* Highlight only offers itself where it can actually anchor: inside a turn
       of an open conversation. In the popover there is no conversation and no
       turn index, so the button would have nowhere to put the mark. */
    var sel = window.getSelection();
    var node = (sel && sel.rangeCount) ? sel.getRangeAt(0).startContainer : null;
    var host = node ? (node.nodeType === 1 ? node : node.parentNode) : null;
    mini.querySelector('[data-mini-hl]').hidden =
      !(where === 'panel' && openChat && host && host.closest && host.closest('.sv-turn .txt'));

    mini.hidden = false;
    var w = mini.offsetWidth, h = mini.offsetHeight;
    var top = rect.bottom + 8;
    if (top + h > window.innerHeight - 6) top = Math.max(6, rect.top - h - 8);
    mini.style.top = top + 'px';
    mini.style.left = Math.min(Math.max(6, rect.left), window.innerWidth - w - 6) + 'px';
  }

  document.addEventListener('mouseup', function (e) {
    if (e.target.closest && e.target.closest('.sv-mini')) return;
    window.setTimeout(function () {
      var sel = window.getSelection();
      if (!sel || sel.isCollapsed || !sel.rangeCount) return hideMini();
      var node = sel.anchorNode;
      var el = node && (node.nodeType === 1 ? node : node.parentElement);
      if (!el) return hideMini();
      var inPop = el.closest('.sv-pop');
      var inPanel = el.closest('.sv-panel');
      if (!inPop && !inPanel) return hideMini();
      var text = sel.toString().replace(/\s+/g, ' ').trim();
      if (text.length < 3 || text.length > 600) return hideMini();
      var rect;
      try { rect = sel.getRangeAt(0).getBoundingClientRect(); } catch (err) { return hideMini(); }
      showMini(text, inPanel ? 'panel' : 'pop', rect);
    }, 0);
  });

  mini.querySelector('[data-mini-ask]').addEventListener('click', function () {
    var text = miniText, where = miniWhere;
    hideMini();
    if (!text) return;
    var phrased = 'Please explain: “' + text + '”';
    if (where === 'panel') {
      pBox.value = phrased;
      panelAsk();
    } else {
      sendAsk(phrased, phrased);
    }
  });

  mini.querySelector('[data-mini-hl]').addEventListener('click', function () {
    /* Reads the live selection rather than miniText, because a highlight needs
       WHERE the words are and not only what they say. */
    if (addChatHighlight()) hideMini();
  });

  mini.querySelector('[data-mini-card]').addEventListener('click', function () {
    if (!miniText) return;
    var want = miniText;
    hideMini();
    cardFromChat(want);
  });

  mini.querySelector('[data-mini-look]').addEventListener('click', function () {
    if (!miniText) return;
    miniOut.hidden = false;
    miniOut.textContent = 'Looking up…';
    var want = miniText;
    api('/api/lookup?q=' + encodeURIComponent(want)).then(function (r) {
      if (want !== miniText) return;
      var sources = (r.body && r.body.sources) || [];
      miniOut.innerHTML = '';
      if (!sources.length) {
        miniOut.textContent = 'Nothing found. Try a shorter selection.';
        return;
      }
      sources.slice(0, 2).forEach(function (s) {
        var lab = document.createElement('span');
        lab.className = 'lab';
        lab.textContent = s.source + (s.title ? ' · ' + s.title : '');
        var txt = document.createElement('div');
        txt.textContent = s.text;
        miniOut.appendChild(lab);
        miniOut.appendChild(txt);
      });
    }).catch(function () { miniOut.textContent = 'Could not reach the server.'; });
  });

  document.addEventListener('mousedown', function (e) {
    if (mini.hidden) return;
    if (e.target.closest && e.target.closest('.sv-mini')) return;
    hideMini();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hideMini(); });

  /* ---------- additions: filed beside the note, never inside it ---------- */

  var adds = { doc: S.docId, items: [] };

  function saveAdds() {
    return api('/api/annotations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ doc: S.docId, items: adds.items })
    });
  }

  function renderAdds() {
    Array.prototype.forEach.call(document.querySelectorAll('.sv-add'), function (n) { n.remove(); });
    adds.items.forEach(function (it) {
      var block = S.blockAt(it.b);
      if (!block || !block.parentNode) return;

      var card = document.createElement('div');
      card.className = 'sv-add';

      var hd = document.createElement('div');
      hd.className = 'hd';
      var src = document.createElement('span');
      src.textContent = it.source || 'Note';
      var term = document.createElement('span');
      term.className = 'term';
      term.textContent = it.term;
      var del = document.createElement('button');
      del.type = 'button';
      del.textContent = 'Remove';
      del.addEventListener('click', function () {
        adds.items = adds.items.filter(function (x) { return x.id !== it.id; });
        saveAdds().then(renderAdds);
      });
      hd.appendChild(src); hd.appendChild(term); hd.appendChild(del);

      var bd = document.createElement('div');
      bd.className = 'bd';
      bd.textContent = it.text;

      card.appendChild(hd); card.appendChild(bd);
      block.parentNode.insertBefore(card, block.nextSibling);
    });
  }

  keepBtn.addEventListener('click', function () {
    if (!keepable || !current) return;
    var id = 1;
    adds.items.forEach(function (x) { if (x.id >= id) id = x.id + 1; });
    adds.items.push({
      id: id, b: current.b, term: keepable.term,
      text: keepable.text, source: keepable.source,
      ts: Date.now()
    });
    keepBtn.disabled = true;
    saveAdds().then(function () {
      renderAdds();
      S.toast('Kept. It stays in this lesson and survives a rewrite.');
      closePop();
    }).catch(function () { S.toast('Could not save that.'); });
  });

  /* ---------- marks on disk ----------

     localStorage is a cache from here on. The file in notes/ is the copy that
     is in Dropbox, is backed up, and carries the anchors, so a wiped browser
     profile costs nothing. The vault note cannot do this job: it is a readable
     publication with the offsets thrown away. */

  var marksTimer = null;

  /* ---- when this browser and the disk last agreed ----

     🔴 This exists because the rule below used to be wrong in a way that
     destroyed data, twice. The lesson caches its marks in localStorage and
     stores NO timestamp with them, so the page could not tell a cache written a
     minute ago from one written last week, and restoreFromDisk's test was
     therefore "does this browser have any bytes at all". Any second browser, or
     any profile that once opened a lesson and went stale, silently overwrote the
     good copy on its next visit. It took 13 highlights and 2 free notes on
     W2-T3-P4 on 13 Aug, and 2 more on W3-T3-P4 the same evening.

     The stamp is the layer's own, in its own key, so no lesson file is edited
     and the lesson's cache format is untouched. It records the `updated` value
     of the last state this browser and the disk are known to have shared,
     whether that came from a push or from a restore. */

  var SYNC_KEY = 'kcl-study-synced-' + S.docId;

  function lastAgreed() {
    try { return parseInt(window.localStorage.getItem(SYNC_KEY), 10) || 0; }
    catch (e) { return 0; }
  }
  function setAgreed(ms) {
    try { window.localStorage.setItem(SYNC_KEY, String(ms)); } catch (e) {}
  }

  function pushMarks() {
    var m = S.marks();
    var stamp = Date.now();
    return api('/api/marks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        doc: S.docId, updated: stamp, items: m.items, notes: m.notes
      })
    }).then(function (r) {
      /* Only once the server has taken it. A stamp written on a push that
         failed would claim agreement that never happened, and the next load
         would keep a local copy the disk has never seen. */
      if (r && r.body && r.body.ok !== false) setAgreed(stamp);
      return r;
    });
  }

  S.onChange(function () {
    window.clearTimeout(marksTimer);
    marksTimer = window.setTimeout(function () { pushMarks(); }, 900);
  });

  function restoreFromDisk(force) {
    return api('/api/marks?doc=' + encodeURIComponent(S.docId)).then(function (r) {
      var d = r.body || {};
      var onDisk = (d.items || []).length + (d.notes || []).length;
      if (!onDisk) return false;
      var here = S.marks();

      /* 🔴 The rule the old comment always claimed, now actually implemented.
         "What he was just working on wins" means changed SINCE this browser and
         the disk last agreed, not "this browser holds bytes".

         The disk wins when it has moved on without us. Both numbers are
         milliseconds from the same source, Date.now() on whichever browser
         pushed, and the server stores the value it was sent rather than its own
         clock, so two Macs are compared against each other and not against the
         Mini's idea of the time.

         A browser that has never agreed with the disk scores 0, so the disk
         wins, which is exactly the stale-profile case that caused the losses:
         an old cache is precisely a cache that predates every sync. */
      var diskAt = parseInt(d.updated, 10) || 0;
      var mineAt = lastAgreed();
      var diskIsNewer = diskAt > mineAt;

      if (!force && (here.items.length || here.notes.length) && !diskIsNewer) return false;

      S.replaceMarks(d.items || [], d.notes || []);
      /* We now hold exactly what the disk holds, so that is the new agreement.
         Without this the next load would restore all over again. */
      if (diskAt) setAgreed(diskAt);
      S.toast('Restored ' + (d.items || []).length + ' highlights and ' +
              (d.notes || []).length + ' notes from disk.');
      return true;
    }).catch(function () { return false; });
  }

  /* ---------- rewriting a paragraph ---------- */

  var scrim = document.createElement('div');
  scrim.className = 'sv-scrim';
  scrim.hidden = true;
  document.body.appendChild(scrim);

  var ed = document.createElement('div');
  ed.className = 'sv-edit';
  ed.hidden = true;
  ed.setAttribute('role', 'dialog');
  ed.setAttribute('aria-label', 'Rewrite this paragraph');
  ed.innerHTML =
    '<header><strong data-title>Rewrite this paragraph</strong><span class="sub"></span>' +
      '<span class="pick" hidden>' +
        '<button type="button" data-prev>&lsaquo;</button>' +
        '<span data-count></span>' +
        '<button type="button" data-next>&rsaquo;</button>' +
        '<button type="button" data-all>Rewrite them as one</button>' +
      '</span>' +
      '<button type="button" data-x>Close</button></header>' +
    '<div class="body">' +
      '<div>' +
        '<label class="lab" for="svEdText" data-textlab>The text, yours to change</label>' +
        '<textarea class="main" id="svEdText" spellcheck="true"></textarea>' +
        '<div class="hint" data-syntax>Plain text. <code>**bold**</code>, <code>*italic*</code> and ' +
          '<code>[label](https://…)</code> are kept. Everything else is written as you type it.</div>' +
      '</div>' +
      '<div class="ask">' +
        '<div>' +
          '<label class="lab" for="svEdAsk">Or say what is wrong with it</label>' +
          '<input type="text" id="svEdAsk" placeholder="too vague about the mechanism, and it mentions a lecturer">' +
        '</div>' +
        '<button type="button" class="act" data-ask>Ask Claude</button>' +
      '</div>' +
      '<div class="hint" data-status></div>' +
    '</div>' +
    '<footer>' +
      '<button type="button" class="act" data-revert disabled>Back to the original</button>' +
      '<span class="right">' +
        '<button type="button" class="act" data-cancel>Cancel</button>' +
        '<button type="button" class="act go" data-save>Save to the lesson</button>' +
      '</span>' +
    '</footer>';
  document.body.appendChild(ed);

  var edText   = ed.querySelector('#svEdText');
  var edAsk    = ed.querySelector('#svEdAsk');
  var edStatus = ed.querySelector('[data-status]');
  var edSub    = ed.querySelector('.sub');
  var edAskBtn = ed.querySelector('[data-ask]');
  var edSave   = ed.querySelector('[data-save]');
  var edRevert = ed.querySelector('[data-revert]');
  var edTitle  = ed.querySelector('[data-title]');
  var edTextLab = ed.querySelector('[data-textlab]');
  var edSyntax = ed.querySelector('[data-syntax]');
  var edPick   = ed.querySelector('.pick');
  var edCount  = ed.querySelector('[data-count]');

  var editing = null;   /* {kind, b|t, expect, originalMd} */
  var edChoice = null;  /* {blocks: [n], at: i} when a selection covered several */

  var SYNTAX_BLOCK =
    'Plain text. <code>**bold**</code>, <code>*italic*</code> and ' +
    '<code>[label](https://…)</code> are kept. Everything else is written as you type it.';
  var SYNTAX_RANGE =
    'Paragraphs separated by blank lines; how many is yours to change. ' +
    '<code>**bold**</code>, <code>*italic*</code> and <code>[label](https://…)</code> are kept. ' +
    'A line starting <code>## </code> to <code>#### </code> is a heading; lines starting ' +
    '<code>- </code> make a list.';
  var SYNTAX_TABLE =
    'One row per line, cells between <code>|</code>. The first row is the header. ' +
    'A cell of <code>^</code> on its own means <b>the cell above continues down here</b>, and a cell of ' +
    '<code>&lt;</code> means <b>the cell to the left continues across</b>: that is how a cell that spans ' +
    'rows or columns is written. Cells take <code>**bold**</code>, <code>*italic*</code>, ' +
    '<code>[label](https://…)</code> and a literal <code>&lt;br&gt;</code>. Write a real ' +
    '<code>|</code> as <code>\\|</code>. Rows and columns may be added or removed.';

  /* ---------- tables are not blocks, and that is the whole bug ----------
     The page numbers `td` and `th` individually, so a table has no index of its
     own and a selection across one produces a segment per cell. Rewrite took
     the first, which is how asking for a table to be fixed rewrote its first
     header cell (reported 2026-08-15). A table is now addressed as a table. */

  function tableOf(b) {
    var el = S.blockAt(b);
    var t = el && el.closest ? el.closest('table') : null;
    return (t && t.closest('.wrap')) ? t : null;
  }

  function tableIndex(t) {
    var all = document.querySelectorAll('.wrap table');
    return Array.prototype.indexOf.call(all, t);
  }

  /* Kept literal on the way out, because markdown cannot say either and the
     notes' tables use both. Everything else in a cell becomes markdown. */
  var CELL_KEEP = /<br\s*\/?>|<\/?(?:span|sub|sup|abbr)\b[^>]*>/gi;

  function decodeEntities(s) {
    var d = document.createElement('textarea');
    d.innerHTML = s;
    return d.value;
  }

  function cellToMd(el) {
    var s = el.innerHTML;
    s = s.replace(/<a\s[^>]*href="([^"]+)"[^>]*>([\s\S]*?)<\/a>/gi, '[$2]($1)');
    s = s.replace(/<code[^>]*>([\s\S]*?)<\/code>/gi, '`$1`');
    s = s.replace(/<\/?(?:strong|b)\s*>/gi, '**');
    s = s.replace(/<\/?(?:em|i)\s*>/gi, '*');
    /* The entities have to be decoded so `p&lt;0.001` reaches the server as the
       text it is, but decoding the whole string would eat the tags above that
       are meant to stay tags. So they step aside first. */
    /* Private-use characters, and written as escapes rather than typed: a NUL
       would be the obvious placeholder and is wrong twice over, because the
       HTML parser inside decodeEntities turns U+0000 into a replacement
       character, and a NUL in this file makes every grep call it binary. */
    var holes = [];
    s = s.replace(CELL_KEEP, function (m) {
      holes.push(m);
      return '\uE000' + (holes.length - 1) + '\uE001';
    });
    s = decodeEntities(s).replace(/\s+/g, ' ').trim().replace(/\|/g, '\\|');
    return s.replace(/\uE000(\d+)\uE001/g, function (m, i) { return holes[+i]; });
  }

  function tableToMd(t) {
    var out = [], pending = {};
    var trs = t.querySelectorAll('tr');
    for (var r = 0; r < trs.length; r++) {
      var cells = trs[r].querySelectorAll('td, th');
      var row = [], col = 0, ci = 0;
      while (ci < cells.length || pending[col]) {
        if (pending[col]) {
          row.push('^');
          if (--pending[col] === 0) delete pending[col];
          col++;
          continue;
        }
        var cell = cells[ci++];
        var rs = parseInt(cell.getAttribute('rowspan') || '1', 10) || 1;
        var cs = parseInt(cell.getAttribute('colspan') || '1', 10) || 1;
        row.push(cellToMd(cell));
        if (rs > 1) pending[col] = rs - 1;
        col++;
        for (var k = 1; k < cs; k++) { row.push('<'); col++; }
      }
      out.push(row);
    }
    /* Pad the columns so the pipes line up, which is most of what makes a pipe
       table readable rather than a wall of bars. */
    var width = 0, i, j;
    for (i = 0; i < out.length; i++) width = Math.max(width, out[i].length);
    var wide = [];
    for (j = 0; j < width; j++) {
      var w = 0;
      for (i = 0; i < out.length; i++) w = Math.max(w, (out[i][j] || '').length);
      wide.push(Math.min(w, 60));
    }
    return out.map(function (row) {
      var cells = [];
      for (j = 0; j < width; j++) {
        var v = row[j] || '';
        cells.push(j === width - 1 ? v : v + Array(Math.max(1, wide[j] - v.length + 1)).join(' '));
      }
      return '| ' + cells.join(' | ') + ' |';
    }).join('\n');
  }

  /* Round-trips the note's own inline markup so an edit cannot silently flatten
     a DOI link or a bolded claim. */
  function htmlToMd(h) {
    var s = String(h);
    s = s.replace(/<a\s[^>]*href="([^"]+)"[^>]*>([\s\S]*?)<\/a>/gi, '[$2]($1)');
    /* Monospace runs, however the note happens to express them, become
       backticks so an edit does not silently flatten a DOI to body text. */
    s = s.replace(/<code[^>]*>([\s\S]*?)<\/code>/gi, '`$1`');
    s = s.replace(/<span[^>]*var\(--mono\)[^>]*>([\s\S]*?)<\/span>/gi, '`$1`');
    s = s.replace(/<\/?(?:strong|b)\s*>/gi, '**');
    s = s.replace(/<\/?(?:em|i)\s*>/gi, '*');
    s = s.replace(/<br\s*\/?>/gi, '\n');
    s = s.replace(/<[^>]+>/g, '');
    var d = document.createElement('textarea');
    d.innerHTML = s;
    return d.value.replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
  }

  function setStatus(text, isErr) {
    edStatus.textContent = text || '';
    edStatus.classList.toggle('err', !!isErr);
  }

  function openTable(t) {
    editing = {
      kind: 'table',
      t: tableIndex(t),
      el: t,
      expect: t.textContent.replace(/\s+/g, ' ').trim(),
      originalMd: tableToMd(t)
    };
    var rows = t.querySelectorAll('tr').length;
    edTitle.textContent = 'Rewrite this table';
    ed.setAttribute('aria-label', 'Rewrite this table');
    edTextLab.textContent = 'The table, yours to change';
    edSyntax.innerHTML = SYNTAX_TABLE;
    edSub.textContent = 'table ' + (editing.t + 1) + ', ' + rows + ' rows';
    edAsk.placeholder = 'I cannot tell which rows go with which heading';
    ed.classList.add('sv-tbl');
    return editing;
  }

  /* A range is rewritten as ONE unit and may change the paragraph count
     (EH's queued design). Only plain prose runs qualify: a list item or a
     table cell in the middle would make the splice structurally unsafe, and
     the server refuses those too. */
  var RANGE_TAGS = { P: 1, H2: 1, H3: 1, H4: 1, BLOCKQUOTE: 1 };
  function rangeEligible(blocks) {
    if (!blocks || blocks.length < 2) return false;
    for (var i = 0; i < blocks.length; i++) {
      var el = S.blockAt(blocks[i]);
      if (!el || !RANGE_TAGS[el.tagName]) return false;
      if (el.closest && el.closest('td, th')) return false;
      if (i && blocks[i] !== blocks[i - 1] + 1) return false;
    }
    return true;
  }

  function mdOfBlock(b) {
    var el = S.blockAt(b);
    var md = htmlToMd(S.blockHtml(b));
    if (!el) return md;
    if (el.tagName === 'H2') return '## ' + md;
    if (el.tagName === 'H3') return '### ' + md;
    if (el.tagName === 'H4') return '#### ' + md;
    return md;
  }

  function openRange(blocks) {
    editing = {
      kind: 'range',
      blocks: blocks.slice(),
      expects: blocks.map(function (b) {
        return S.blockText(b).replace(/\s+/g, ' ').trim();
      }),
      originalMd: blocks.map(mdOfBlock).join('\n\n')
    };
    edTitle.textContent = 'Rewrite these ' + blocks.length + ' paragraphs as one unit';
    ed.setAttribute('aria-label', edTitle.textContent);
    edTextLab.textContent = 'The run, yours to change';
    edSyntax.innerHTML = SYNTAX_RANGE;
    edSub.textContent = 'paragraphs ' + blocks[0] + ' to ' + blocks[blocks.length - 1];
    edAsk.placeholder = 'these three repeat each other; merge them into one tight paragraph';
    ed.classList.remove('sv-tbl');
    return editing;
  }

  function openBlock(b) {
    editing = {
      kind: 'block',
      b: b,
      expect: S.blockText(b).replace(/\s+/g, ' ').trim(),
      originalMd: htmlToMd(S.blockHtml(b))
    };
    var el = S.blockAt(b);
    var inCell = el && el.closest && el.closest('td, th');
    edTitle.textContent = inCell ? 'Rewrite this cell' : 'Rewrite this paragraph';
    ed.setAttribute('aria-label', edTitle.textContent);
    edTextLab.textContent = 'The text, yours to change';
    edSyntax.innerHTML = SYNTAX_BLOCK;
    edSub.textContent = (inCell ? 'cell ' : 'paragraph ') + b;
    edAsk.placeholder = 'too vague about the mechanism, and it mentions a lecturer';
    ed.classList.remove('sv-tbl');
    return editing;
  }

  /* The picker only appears when a selection covered more than one block and
     they are not one table. Before this, Rewrite silently took the first and
     said nothing, which is how a table selection rewrote a header cell. */
  function renderPick() {
    if (!edChoice) { edPick.hidden = true; return; }
    edPick.hidden = false;
    edCount.textContent = (edChoice.at + 1) + ' of ' + edChoice.blocks.length;
    edPick.querySelector('[data-prev]').disabled = edChoice.at === 0;
    edPick.querySelector('[data-next]').disabled = edChoice.at === edChoice.blocks.length - 1;
    edPick.querySelector('[data-all]').hidden = !rangeEligible(edChoice.blocks);
  }

  function fillEditor() {
    edText.value = editing.originalMd;
    edAsk.value = '';
    setStatus('');
    edRevert.disabled = true;
    renderPick();
  }

  /* A target is a table, or one block, or a choice of several blocks. */
  function openEditor(sel) {
    var first = sel.segments && sel.segments.length ? sel.segments[0].b : sel.b;
    var table = tableOf(first);

    if (table && tableIndex(table) >= 0) {
      /* Anywhere inside a table means the table. Selecting one whole is close
         to impossible with a pointer, which is what he ran into, and a cell on
         its own is almost never what somebody means by "fix this table". */
      edChoice = null;
      openTable(table);
    } else {
      var seen = [], i;
      for (i = 0; i < (sel.segments || []).length; i++) {
        if (seen.indexOf(sel.segments[i].b) < 0) seen.push(sel.segments[i].b);
      }
      if (seen.length < 2) seen = [first];
      edChoice = seen.length > 1 ? { blocks: seen, at: 0 } : null;
      openBlock(first);
    }

    fillEditor();
    if (edChoice) {
      setStatus('That selection covered ' + edChoice.blocks.length +
                ' paragraphs. Use the arrows to rewrite one at a time' +
                (rangeEligible(edChoice.blocks)
                  ? ', or rewrite them as one unit.' : '.'));
    }
    scrim.hidden = false;
    ed.hidden = false;
    if (!window.matchMedia || !window.matchMedia('(max-width: 899px)').matches) edText.focus();
  }

  edPick.querySelector('[data-prev]').addEventListener('click', function () {
    if (!edChoice || edChoice.at === 0) return;
    edChoice.at--;
    openBlock(edChoice.blocks[edChoice.at]);
    fillEditor();
    showFocus([{ b: edChoice.blocks[edChoice.at], s: 0, e: S.blockText(edChoice.blocks[edChoice.at]).length }]);
  });

  edPick.querySelector('[data-all]').addEventListener('click', function () {
    if (!edChoice || !rangeEligible(edChoice.blocks)) return;
    var blocks = edChoice.blocks.slice();
    edChoice = null;
    openRange(blocks);
    fillEditor();
    showFocus(blocks.map(function (b) {
      return { b: b, s: 0, e: S.blockText(b).length };
    }));
    setStatus('The whole run is in the box. Merging, splitting and reordering are all allowed.');
  });

  edPick.querySelector('[data-next]').addEventListener('click', function () {
    if (!edChoice || edChoice.at >= edChoice.blocks.length - 1) return;
    edChoice.at++;
    openBlock(edChoice.blocks[edChoice.at]);
    fillEditor();
    showFocus([{ b: edChoice.blocks[edChoice.at], s: 0, e: S.blockText(edChoice.blocks[edChoice.at]).length }]);
  });

  function closeEditor() {
    ed.hidden = true;
    scrim.hidden = true;
    editing = null;
    edChoice = null;
    edPick.hidden = true;
    ed.classList.remove('sv-tbl');
    clearFocus();
  }

  ed.querySelector('[data-x]').addEventListener('click', closeEditor);
  ed.querySelector('[data-cancel]').addEventListener('click', closeEditor);
  scrim.addEventListener('click', closeEditor);

  edRevert.addEventListener('click', function () {
    if (!editing) return;
    edText.value = editing.originalMd;
    edRevert.disabled = true;
    setStatus('Back to what the lesson says now.');
  });

  edAskBtn.addEventListener('click', function () {
    if (!editing) return;
    var instruction = edAsk.value.trim();
    if (!instruction) { edAsk.focus(); return setStatus('Say what is wrong with it first.', true); }
    if (!caps.explain) return setStatus('The Claude Code CLI was not found.', true);

    edAskBtn.disabled = true;
    setStatus('Rewriting. This takes a few seconds.');
    var isRange = editing.kind === 'range';
    api('/api/rewrite', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        doc: S.docId, b: isRange ? editing.blocks[0] : editing.b,
        target: editing.kind === 'table' ? 'table' : (isRange ? 'range' : 'block'),
        current: edText.value,
        instruction: instruction,
        context: isRange ? contextAroundRange() : contextAround(editing.b)
      })
    }).then(function (r) {
      edAskBtn.disabled = false;
      if (!r.body || !r.body.ok) return setStatus(r.body && r.body.error || 'No answer came back.', true);
      edText.value = r.body.text;
      edRevert.disabled = false;
      setStatus('Claude’s version, yours to edit. Nothing is written until you save.');
    }).catch(function () {
      edAskBtn.disabled = false;
      setStatus('Could not reach the server.', true);
    });
  });

  /* A table's own previousElementSibling is nothing useful: it sits inside a
     .tblwrap inside a column, so the heading above it is several levels up and
     back. Climbing is the only way to find what the table is under. */
  function headingBefore(el) {
    var node = el, hops = 0;
    while (node && node !== document.body && hops < 40) {
      var sib = node.previousElementSibling;
      while (sib && hops < 40) {
        hops++;
        if (/^H[1-4]$/.test(sib.tagName)) return sib.textContent.trim();
        var inner = sib.querySelectorAll ? sib.querySelectorAll('h1,h2,h3,h4') : null;
        if (inner && inner.length) return inner[inner.length - 1].textContent.trim();
        sib = sib.previousElementSibling;
      }
      node = node.parentElement;
    }
    return '';
  }

  function textNear(el, forward) {
    var node = el, hops = 0;
    while (node && node !== document.body && hops < 40) {
      var sib = forward ? node.nextElementSibling : node.previousElementSibling;
      while (sib && hops < 40) {
        hops++;
        var t = (sib.textContent || '').trim();
        if (t && !sib.querySelector('table')) return t.slice(0, 700);
        sib = forward ? sib.nextElementSibling : sib.previousElementSibling;
      }
      node = node.parentElement;
    }
    return '';
  }

  function contextAroundRange() {
    if (!editing || editing.kind !== 'range') return '';
    var out = [];
    var first = editing.blocks[0], last = editing.blocks[editing.blocks.length - 1];
    var el = S.blockAt(first);
    var h = el && el.previousElementSibling, hops = 0;
    while (h && hops < 14) {
      if (/^H[1-4]$/.test(h.tagName)) { out.push('Section: ' + h.textContent.trim()); break; }
      h = h.previousElementSibling; hops++;
    }
    var before = S.blockAt(first - 1), after = S.blockAt(last + 1);
    if (before) out.push('Paragraph before the run: ' + before.textContent.trim());
    if (after) out.push('Paragraph after the run: ' + after.textContent.trim());
    return out.join('\n\n');
  }

  function contextAround(b) {
    var out = [];
    if (editing && editing.kind === 'table') {
      var head = headingBefore(editing.el);
      if (head) out.push('Section: ' + head);
      var pre = textNear(editing.el, false), post = textNear(editing.el, true);
      if (pre) out.push('The text that introduces the table: ' + pre);
      if (post) out.push('The text after it: ' + post);
      return out.join('\n\n');
    }
    var el = S.blockAt(b);
    if (!el) return '';
    var h = el.previousElementSibling, hops = 0;
    while (h && hops < 14) {
      if (/^H[1-4]$/.test(h.tagName)) { out.push('Section: ' + h.textContent.trim()); break; }
      h = h.previousElementSibling; hops++;
    }
    var before = S.blockAt(b - 1), after = S.blockAt(b + 1);
    if (before) out.push('Paragraph before: ' + before.textContent.trim());
    if (after) out.push('Paragraph after: ' + after.textContent.trim());
    return out.join('\n\n');
  }

  edSave.addEventListener('click', function () {
    if (!editing) return;
    var isTable = editing.kind === 'table';
    var isRange = editing.kind === 'range';
    var text = edText.value.trim();
    if (!text) return setStatus(isTable ? 'A table cannot be emptied this way.'
                                        : isRange ? 'A run of paragraphs cannot be emptied this way.'
                                        : 'A paragraph cannot be emptied this way.', true);
    if (text === editing.originalMd.trim()) { closeEditor(); return S.toast('Nothing changed.'); }

    edSave.disabled = true;
    setStatus('Saving to the lesson file.');
    var how = edRevert.disabled ? 'manual' : 'claude';
    var body = isTable
      ? { doc: S.docId, target: 'table', t: editing.t, expect: editing.expect,
          text: text, how: how, instruction: edAsk.value.trim() }
      : isRange
      ? { doc: S.docId, target: 'range',
          b0: editing.blocks[0], b1: editing.blocks[editing.blocks.length - 1],
          expects: editing.expects,
          text: text, how: how, instruction: edAsk.value.trim() }
      : { doc: S.docId, b: editing.b, expect: editing.expect,
          text: text, how: how, instruction: edAsk.value.trim() };
    api('/api/edit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) {
      edSave.disabled = false;
      if (!r.ok || !r.body.ok) {
        return setStatus(r.body && r.body.error || 'The lesson was not changed.', true);
      }
      if (r.body.reload) {
        /* 🔴 A table rewrite can change how many cells the document has, and a
           mark is addressed by block index. Reloading renumbers and lets
           reanchor() find every mark by its own text, which is the mechanism
           that already exists for exactly this. Repainting in place would leave
           every mark after the table pointing one cell out. */
        try { window.sessionStorage.setItem('svScroll', String(window.scrollY || 0)); } catch (e) {}
        setStatus('Saved. Reloading so the marks renumber.');
        window.setTimeout(function () { window.location.reload(); }, 350);
        return;
      }
      /* Repaint from the same conversion the server just wrote, so the page and
         the file agree without a reload. */
      S.setBlockHtml(editing.b, r.body.html || '');
      S.toast('Saved. Backup: ' + r.body.backup);
      closeEditor();
    }).catch(function () {
      edSave.disabled = false;
      setStatus('Could not reach the server.', true);
    });
  });

  /* Put him back where he was after the reload above. */
  try {
    var back = window.sessionStorage.getItem('svScroll');
    if (back !== null) {
      window.sessionStorage.removeItem('svScroll');
      window.setTimeout(function () { window.scrollTo(0, parseInt(back, 10) || 0); }, 60);
    }
  } catch (e) {}

  document.addEventListener('keydown', function (e) {
    if (ed.hidden) return;
    if (e.key === 'Escape') closeEditor();
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) edSave.click();
  });

  /* ---------- toolbar buttons ---------- */

  var sep = document.createElement('span');
  sep.className = 'sv-sep';
  S.bar.appendChild(sep);

  function addBarButton(label, tab) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'sv-act';
    b.textContent = label;
    b.addEventListener('mousedown', function (e) { e.preventDefault(); });
    b.addEventListener('click', function () {
      var sel = S.selection();
      if (!sel) return;
      var rect = sel.rect;
      S.hideBar();
      open(sel.text, sel.context, sel.b, rect, tab, sel.segments);
    });
    S.bar.appendChild(b);
    return b;
  }

  var lookBtn = addBarButton('Look up', 'lookup');
  var explBtn = addBarButton('Ask', 'explain');

  var rewriteBtn = document.createElement('button');
  rewriteBtn.type = 'button';
  rewriteBtn.className = 'sv-act';
  rewriteBtn.textContent = 'Rewrite';
  rewriteBtn.title = 'Edit this paragraph or table, or ask Claude to';
  rewriteBtn.addEventListener('mousedown', function (e) { e.preventDefault(); });
  rewriteBtn.addEventListener('click', function () {
    var sel = S.selection();
    if (!sel) return;
    S.hideBar();
