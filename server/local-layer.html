              frame.parentNode.querySelector('.sv-pkgbar');
    var sel = bar && bar.querySelector('.sv-pkgbar-lec');
    if (!sel) return false;
    /* 🟢 NOTHING TO LOCK ON A LIVE LECTURE (plans/11): the change lands in
       place, so the reason for the lock, "changing it starts the lecture
       again", is not true of this frame. The lock stays for frames that
       reload, which is what the attribute says about this one. */
    if (lectureIsLive(frame)) {
      sel.disabled = false;
      sel.title = LECTURE_TITLE_LIVE;
      return true;
    }
    sel.disabled = !!playing;
    sel.title = playing ? LECTURE_TITLE_LOCKED : LECTURE_TITLE;
    return true;
  }

  /* Whether THIS frame's lecture can change speed in place: the switch is on
     AND the document announced that it holds the clock. Read from the
     element, written by `readyPackageBar`, because the answer belongs to the
     document in the frame and not to the page around it: a reload replaces
     the document and its announcement writes the attribute afresh. Anything
     but the word `true` from the sandbox reads as "no", which is the safe
     direction: it leaves the reader the reload, which works. */
  function lectureIsLive(frame) {
    if (!LECTURE_SPEED_BY_CLOCK) return false;
    try { return !!frame && frame.getAttribute('data-sv-lecture-live') === '1'; }
    catch (e) { return false; }
  }

  function tellPackage(frame, msg) {
    try { frame.contentWindow.postMessage(msg, '*'); return true; }
    catch (e) { return false; }
  }

  function buildPackageBar(frame) {
    if (!frame || !frame.parentNode) return null;
    if (frame.parentNode.querySelector('.sv-pkgbar')) return null;
    /* 🔴 THE PLAYER IS UNREACHABLE EXCEPT BY MESSAGE, which is the whole of the
       difference between this driver and the recording's three lines. A mirrored
       package is served `sandbox allow-scripts` with no `allow-same-origin`, so
       nothing here can call into it: not a click, not a function, not a property
       read. The channel that already carried the chosen rate OUT is the only
       door, and these controls knock on it.

       `waiting` is the other half: until the lecture answers we do not know
       whether it even allows seeking, and a button that looks live and does
       nothing is the complaint this whole unit started from. */
    var bar = playerRow({
      skip: function (delta) {
        tellPackage(frame, { kind: 'sv-player-cmd', what: 'skip', delta: delta });
      },
      /* ⚠️ NO `rate` HERE, SINCE 2026-09-05. The driver used to send
         `{what: 'rate'}` down the channel for the voice-only picker, and the
         picker is gone (ONE SPEED PER PLAYER, above). The strip still answers
         the command; a package row simply has no control that sends it.

         🔴 THE LECTURE SPEED, and it has two routes: in place through the
         channel (`{what: 'lecture'}`) when the frame has announced its clock
         (plans/11), and otherwise the backup, a fresh fetch of the package with
         the rate in the URL, because the package's TIMING BLOB is read once by
         `PresentationPlayer.start()` at boot and no message can change it
         after that. `setLectureRate` chooses. */
      lecture: LECTURE_RATE_OK ? {
        value: LECTURE_RATE,
        pick: function (v) { setLectureRate(frame, v); }
      } : null,
      waiting: PKG_WAITING
    });
    frame.parentNode.appendChild(bar);
    if (CAPTIONS_ON) mountCaptions(frame);
    /* ⚠️ THE RACE: the lecture may have announced itself before this bar
       existed, and that message is gone. Asking again costs one post. */
    tellPackage(frame, { kind: 'sv-player-cmd', what: 'hello' });
    /* And the same race for captions, from the other side: this frame was built
       after the reader's saved preference was applied, so it has never been told.
       A lecture opened with captions already on would otherwise time nothing
       until the reader toggled the button twice. */
    tellPackage(frame, { kind: 'sv-player-cmd', what: 'captions', on: CAPTIONS_ON });
    return bar;
  }

  function readyPackageBar(frame, info) {
    /* 🔴 WHAT THE DOCUMENT SAYS IT IS, WRITTEN ON THE FRAME FIRST (plans/11),
       before the bar is even looked for, because it is a fact about the frame
       and not about its controls. A BOOLEAN checked as one: only the word
       `true` makes a lecture live, and an announcement without the field (an
       older strip) reads as not live, which leaves the reader the reload. */
    try {
      if (frame) frame.setAttribute('data-sv-lecture-live', info && info.lectureLive === true ? '1' : '0');
    } catch (e) {}
    var bar = frame && frame.parentNode && frame.parentNode.querySelector('.sv-pkgbar');
    if (!bar) return false;
    var can = info && info.seeking !== false;
    /* 🟢 `.sv-pkgseek-b` IS NOW A CLASS ONLY THE SEEK SEGMENTS CARRY, which
       retires a trap rather than restating it. This selector used to be
       `.sv-pkgbar-b:not(.sv-pkgbar-cc)` because the captions toggle shared the
       button class, and a lecture published with seeking switched off would
       otherwise have disabled CAPTIONS too -- captions refused for a reason that
       has nothing to do with captions. That was caught by a test before it
       shipped; the design's three zones mean the two controls no longer share a
       class at all, so the `:not()` is gone and cannot be dropped by accident. */
    var buttons = bar.querySelectorAll('.sv-pkgseek-b');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].disabled = !can;
      buttons[i].title = can ? buttons[i].getAttribute('aria-label') : PKG_NO_SEEK;
    }

       was asked for: it is the rate this document is PLAYING at, and a picker
       that shows the one that was asked for is the control that lies. (The
       announcement's `rate`, the voice's, is no longer read here: nothing in a
       lecture row shows the voice on its own since 2026-09-05.) */
    var lec = bar.querySelector('.sv-pkgbar-lec');
    if (lec && info && PLAYBACK_RATES.indexOf(info.lectureRate) >= 0) {
      lec.value = String(info.lectureRate);
    }
    /* The title says what a pick DOES to this frame, and the announcement is
       the moment that becomes known: live, it lands in place; not live, it
       reloads. `lockLectureRate` keeps the same rule while the lecture plays. */
    if (lec) lec.title = lectureIsLive(frame) ? LECTURE_TITLE_LIVE : LECTURE_TITLE;
    return true;
  }

  /* 🔴 THE CONVERSATION'S OWN ID, and the one field of it that never changes.
     `id` below is a per-device ORDINAL and always was: two Macs each starting
     their first conversation both call it 1, which is the bug that made a
     bookmarked conversation from the other Mac open the wrong one here. `ts` is
     no better, and that is the less obvious half: it looks like a creation
     instant but the client rewrites it on every turn and every answer, because
     the History list sorts on it. So neither can name a conversation across two
     devices, and this is minted to.

     Time plus randomness rather than a counter, deliberately: both id traps this
     project has paid for were ordinals, and a value nobody counts up to cannot
     be minted the same way twice on two machines. */
  function newChatId() {
    return (Date.now().toString(36) +
            Math.random().toString(36).slice(2, 8)).replace(/[^a-z0-9]/g, '');
  }

    var id = 1;
    chats.forEach(function (c) { if (c.id >= id) id = c.id + 1; });

  function paintModelNote() {
    var found = ((settings && settings.models) || []).filter(function (m) {
      return m.id === modelSel.value;
    })[0];
    modelNote.textContent = found ? found.note : '';
  }

  function loadSettings() {
    return api('/api/settings').then(function (r) {
      settings = r.body || {};
      /* The lesson's own size, applied whether or not the settings panel is
         ever opened: this is the boot path for the header control. */
      applyLessonSize(settings.lessonSize);
      if (buildTextMenu) buildTextMenu();
      modelSel.innerHTML = '';
      (settings.models || []).forEach(function (m) {
        var o = document.createElement('option');
        o.value = m.id; o.textContent = m.label;
        modelSel.appendChild(o);
      });
      if (settings.model) { modelSel.value = settings.model; caps.model = settings.model; }
      if (settings.level) {
        level = settings.level;
        level2.value = level;
        if (levelSel) levelSel.value = level;
      }
      paintModelNote();
      sizeSel.innerHTML = '';
      (settings.panelSizes || []).forEach(function (s) {
        var o = document.createElement('option');
        o.value = s.id; o.textContent = s.label;
        sizeSel.appendChild(o);
      });
      if (settings.panelSize) {
        sizeSel.value = settings.panelSize;
        applyPanelSize(scaleFor(settings.panelSize));
      }
      setBox.querySelector('.where').textContent =
        'Saved in ' + (settings.path || 'notes/settings.json');
      adoptPanelWidth(settings);
      /* 🔴 `=== true`, not truthiness, and not `||`. The settings response
         carries this key ALWAYS, and an absent or malformed one must read as
         OFF rather than as "leave whatever is in the variable": a reader who
         turned captions off and reloaded into a stale `true` would be told the
         reader had ignored them. The button repaints from here, so a bar built
         before the settings arrived still ends up correct. */
      setCaptionsOn(settings.captionsOn === true, false);
      /* 🟢 The recording's speed, from the same response and by the same rule as
         the captions above: off the LIST or ignored, never parsed and trusted.
         A bar built before this arrived is repainted by `applySavedRate`. */
      applySavedRate(settings.playbackRate);
      /* 🟢 And the LECTURE speed, off the same list by the same rule. It is
         applied when a package is next built rather than to anything on screen:
         a lecture already loaded keeps the speed it was served at, because
         changing it under a reader who is watching is precisely what the lock
         exists to prevent. */
      applyLectureRate(settings.lectureRate);
      if (settings.palette && settings.palette.length) {
        palette = settings.palette;
        /* The shell's vault builder buckets by this. Without it, custom
           colours fell through to a literal list of two (see buildVaultMd). */
        S.palette = palette;
        lastColour = settings.lastColour || 'k';
        paintPaletteCss();
        installPalette();
        tagMarks();
      }
    }).catch(function () {});
  }

  function saveSettings(what) {
    return api('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: modelSel.value, level: level2.value,
                             panelSize: sizeSel.value })
    }).then(function (r) {
      if (r.body && r.body.ok) {
        level = r.body.level;
        if (levelSel) levelSel.value = level;
        caps.model = r.body.model;
        /* Say back what was actually changed. Reporting the model after a text
           size change reads as though the wrong control was hit. */
        S.toast(what === 'size'
          ? 'Saved. Panel text is now ' +
            sizeSel.options[sizeSel.selectedIndex].text.toLowerCase() + '.'
          : 'Saved. Answers now use ' +
            modelSel.options[modelSel.selectedIndex].text + '.');
      }
    }).catch(function () {});
  }

  /* R50: publishing is a preference now, so the row stays and the switch moves.
     Applying it here rather than waiting for a reload is the point: turning it
     off should stop the badge and the pushing immediately, and turning it back
     on should start them, because a setting that needs a restart is not a
     setting. */
  function applyVault(on) {
    caps.vault = !!on;
    if (badge) badge.hidden = !on;
    if (vaultHint) {
      vaultHint.textContent = on
        ? 'Your highlights and notes are published to the vault as you make them. '
          + 'Press the badge to save now.'
        : 'Off. Nothing is written to the vault. Your highlights and notes are still '
          + 'saved to disk beside the lesson, and Export still carries everything.';
    }
  }

  if (vaultBox) {
    vaultBox.addEventListener('change', function () {
      var on = vaultBox.checked;
      applyVault(on);
      /* Turning it ON publishes what is already on the page, because otherwise
         nothing reaches the vault until the next highlight and the switch looks
         like it did nothing. Turning it off schedules nothing. */
      if (on) schedule();
      api('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: modelSel.value, level: level2.value,
                               panelSize: sizeSel.value, vaultEnabled: on })
      }).then(function (r) {
        if (!r.body || !r.body.ok) throw new Error('refused');
        S.toast(on ? 'Publishing to the vault is on.' : 'Publishing to the vault is off.');
      }).catch(function () {
        /* Put the switch back where the server still has it. */
        vaultBox.checked = !on;
        applyVault(!on);
        S.toast('That could not be saved.');
      });
    });
  }

  modelSel.addEventListener('change', function () { paintModelNote(); saveSettings(); });
  level2.addEventListener('change', function () { saveSettings(); });
  /* Applied before the round trip, so the panel resizes as the choice is made
     rather than when the server answers. */
  sizeSel.addEventListener('change', function () {
    applyPanelSize(scaleFor(sizeSel.value));
    saveSettings('size');
  });

  /* ---------- relaunch the server ----------

     R16, asked 2026-08-13: "let's add something into settings where I can
     relaunch the server."

     He asked a second question the same evening, "is it okay for me to restart
     the server if things haven't been saved into the Obsidian Vault?", and the
     note under the button is the answer to it: marks and notes are written to
     disk as they are made, so a restart never costs him anything. Only the
     vault publication is deferred, and reopening the lesson republishes it.

     The server refuses to restart into a file that will not parse, so the
     interesting failure is a refusal rather than a silence. It is reported
     here rather than swallowed. */

  var restartBtn  = setBox.querySelector('#svRestart');
  var restartNote = setBox.querySelector('#svRestartNote');
  var restartWas  = restartNote.textContent;

  function waitForServer(tries) {
    /* The old process answers until the moment it execs, so a single probe can
       succeed against a server that is about to disappear. Two consecutive
       successes after a pause is the cheap way to mean "the new one is up". */
    return new Promise(function (done) {
      var seen = 0;
      var tick = function (left) {
        if (left <= 0) { done(false); return; }
        api('/api/status').then(function (r) {
          seen = (r && r.body) ? seen + 1 : 0;
          if (seen >= 2) { done(true); return; }
          window.setTimeout(function () { tick(left - 1); }, 500);
        }).catch(function () {
          seen = 0;
          window.setTimeout(function () { tick(left - 1); }, 500);
        });
      };
      window.setTimeout(function () { tick(tries); }, 900);
    });
  }

  /* ---------- ONE restart, called from two places ----------------------

     🔴 EXTRACTED 2026-09-09, when the relaunch banner gained a button that
     actually relaunches. Before that the banner opened Settings and focused
     this button, on a comment reading "the one Relaunch button, reached rather
     than copied" — and that instinct was RIGHT: two copies of a restart drift
     the first time either is touched. **So the routine moved and the copy never
     happened.** The settings panel and the banner now call the same function
     and differ only in what they SAY and what they do afterwards.

     `say(state, why)` is called with one of four states, and the caller owns
     every word the reader sees:

       'going'    the POST is away
       'refused'  the server answered and declined; `why` carries its reason
       'up'       it went and came back, proven by two consecutive answers
       'gone'     it did not answer again

     ⚠️ The `catch` is not an error path. The process replaces itself mid-request
     on some routes, so the connection dying IS the expected shape of success,
     and both branches therefore ask `waitForServer` rather than concluding
     anything from the request itself. */
  function relaunchServer(say) {
    var settle = function (up) { say(up ? 'up' : 'gone'); return up; };
    say('going');
    return api('/api/restart', { method: 'POST',
                                 headers: { 'Content-Type': 'application/json' },
                                 body: '{}' })
      .then(function (r) {
        if (!r.body || r.body.ok !== true) {
          say('refused', (r.body && r.body.error) ||
                         'The server would not relaunch.');
          return false;
        }
        return waitForServer(20).then(settle);
      })
      ['catch'](function () { return waitForServer(20).then(settle); });
  }

  restartBtn.addEventListener('click', function () {
    if (restartBtn.disabled) return;
    restartBtn.disabled = true;
    relaunchServer(function (state, why) {
      /* ⚠️ This one does NOT reload the page, and the banner's does. The
         difference is deliberate: the banner exists only to say the code is
         stale, so reloading completes it, whereas this panel is full of other
         controls somebody may be part-way through. It says what to do instead. */
      restartNote.textContent =
        state === 'going'   ? 'Relaunching…' :
        state === 'refused' ? why :
        state === 'up'      ? 'Relaunched, and answering again. Reload the page '
                              + 'to pick up any change.'
                            : 'It did not answer again. '
                              + 'It may need starting by hand on ' + hostWord() + '.';
      if (state !== 'going') { restartBtn.disabled = false; }
    });
  });

  /* Put the explanation back when the panel is reopened, so a stale outcome
     from twenty minutes ago is not still being reported as news. */
  gear.addEventListener('click', function () {
    if (!restartBtn.disabled) { restartNote.textContent = restartWas; }
  });

  /* ---------- the highlight palette, and the key ----------

     Asked 2026-08-13: "Different color highlights with the ability to set a key
     as to what each color denotes", then sharpened to "next to the highlight
     button... a little color palette icon. If you click, it opens up a set of
     colors you can choose from and add to. And the next time you go to
     highlight, it should use the last color you used."

     The label on each swatch IS the key. That is why the palette is stored on
     the server rather than hard-coded: a colour without a stated meaning is the
     thing he could not read off the screen in the first place.

     🔴 Card is not in the picker and never becomes the sticky default, on his
     instruction, because it writes flashcard syntax into the vault and a sticky
     Card would keep doing that without being asked.

     Everything here drives the lesson's OWN bar and paint path from outside.
     The bar markup, the click handlers and paint() all live in each of the 29
     lesson files; re-implementing them here would mean two sources of truth,
     and editing them there would mean 29 files. So instead this retargets the
     existing Highlight button by rewriting its data-c, and lets the lesson's
     own handler read it at click time. */

  var palette = null, lastColour = 'k';
  var palStyle = document.createElement('style');
  document.head.appendChild(palStyle);

  function colourById(id) {
    for (var i = 0; i < (palette || []).length; i++) {
      if (palette[i].id === id) return palette[i];
    }
    return null;
  }

  function paintPaletteCss() {
    if (!palette) return;
    var css = [];
    palette.forEach(function (c) {
      /* Ties with the lesson's own mark.hl.q / mark.hl.d on specificity, and
         this stylesheet is appended last, so it wins. */
      css.push('mark.hl[data-c="' + c.id + '"]{background:' + c.color + ';}');
      /* The rule down the left of a highlight in the Notes tab, from the same
         source as the highlight itself.

         🔴 Reported 2026-08-16, and the mismatch was not a shade. The lesson
         paints that rule from three hard-coded variables and the panel only
         ever tags an item `q` or `d`, so **every colour beyond the built-in
         three fell through to the green default**: both of the colours he added
         himself, including the one he is currently highlighting with. Card was
         wrong too, in a quieter way, drawing its outline colour rather than its
         fill. `:not(.orphan)` so a lost highlight still reads as broken. */
      css.push('.hl-item[data-c="' + c.id + '"]:not(.orphan) blockquote' +
               '{border-left-color:' + c.color + ';}');
      if (c.dark) {
        css.push('@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) ' +
                 'mark.hl[data-c="' + c.id + '"]{background:' + c.dark + ';}}');
        css.push(':root[data-theme="dark"] mark.hl[data-c="' + c.id + '"]{background:' + c.dark + ';}');
        css.push('@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) ' +
                 '.hl-item[data-c="' + c.id + '"]:not(.orphan) blockquote' +
                 '{border-left-color:' + c.dark + ';}}');
        css.push(':root[data-theme="dark"] .hl-item[data-c="' + c.id + '"]:not(.orphan) ' +
                 'blockquote{border-left-color:' + c.dark + ';}');
      }
    });
    /* R15: a term you hold a card for should read differently from a highlight. */
    css.push('mark.hl[data-c="d"]{outline:1.5px solid var(--hl-d-line);outline-offset:1px;border-radius:2px;}');
    palStyle.textContent = css.join('\n');
  }

  /* The lesson paints a mark with one of three hard-coded classes and stamps
     only its id. Adding data-c from the stored item is what lets an arbitrary
     colour show up at all. renderMarks() rebuilds the block's innerHTML, so
     this has to run again after every change, not once. */
  function tagMarks() {
    if (!palette) return;
    var byId = {};
    S.marks().items.forEach(function (it) { byId[String(it.id)] = it.c || 'k'; });
    var nodes = document.querySelectorAll('.wrap mark.hl[data-id]');
    Array.prototype.forEach.call(nodes, function (n) {
      var c = byId[n.dataset.id];
      if (c) n.setAttribute('data-c', c);
    });
  }

  var pal = document.createElement('div');
  pal.className = 'sv-pal';
  pal.hidden = true;
  document.body.appendChild(pal);

  /* R45. One row, three explicit verbs: the wide button PICKS (and
     highlights, because a selection is live whenever this is open), the pencil
     RENAMES, the cross REMOVES. The old row hid rename inside a click on the
     name, which read as a mis-tap, and had no remove at all. */
  var palEdit = null, palDel = null, palDelUses = null;

  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

  function renderPalette() {
    var rows = palette.filter(function (c) { return c.id !== 'd' && !c.retired; }).map(function (c) {
      if (palEdit === c.id) {
        return '<div class="sv-swatch editing" data-row="' + c.id + '">' +
               '<span class="chip" style="background:' + c.color + '"></span>' +
               '<input data-newname value="' + esc(c.label) + '" maxlength="40"' +
               ' aria-label="Rename this colour">' +
               '<button type="button" data-rename="' + c.id + '">Save</button>' +
               '<button type="button" data-back>Cancel</button>' +
               '</div>';
      }
      if (palDel === c.id) {
        var extra = (palDelUses && palDelUses.count)
          ? 'Also delete its ' + palDelUses.count + ' highlight' +
            (palDelUses.count === 1 ? '' : 's') +
            (palDelUses.lessons > 1 ? ' across ' + palDelUses.lessons + ' lessons' : '')
          : 'Also delete its highlights';
        return '<div class="sv-swatch deleting" data-row="' + c.id + '">' +
               '<div class="dq">Remove \u201C' + esc(c.label) + '\u201D from your colours?</div>' +
               '<label class="dopt"><input type="checkbox" data-purgetoo> <span>' + extra + '</span></label>' +
               '<div class="dact">' +
                 '<button type="button" data-confirmdel="' + c.id + '">Remove</button>' +
                 '<button type="button" data-back>Cancel</button>' +
               '</div></div>';
      }
      return '<div class="sv-swatch" data-row="' + c.id + '"' +
             (c.id === lastColour ? ' aria-current="true"' : '') + '>' +
             '<button type="button" class="pick" data-pick="' + c.id + '">' +
               '<span class="chip" style="background:' + c.color + '"></span>' +
               '<span class="plab">' + esc(c.label) + '</span></button>' +
             '<button type="button" class="pedit" data-edit="' + c.id + '" title="Rename"' +
               ' aria-label="Rename ' + esc(c.label) + '">\u270E</button>' +
             /* k is the fallback every unmarked colour renders as, so it stays. */
             (c.id === 'k' ? '' :
               '<button type="button" class="pdel" data-del="' + c.id + '" title="Remove this colour"' +
               ' aria-label="Remove ' + esc(c.label) + '">\u00D7</button>') +
             '</div>';
    }).join('');
    pal.innerHTML =
      '<div class="sv-palhead">Highlight colours <span>the label is the key</span></div>' +
      '<div class="sv-palrows">' + rows + '</div>' +
      '<div class="sv-paladd">' +
        '<input type="color" data-newcolour value="#F6C6C6" aria-label="New colour">' +
        '<input type="text" data-newlabel placeholder="What it means" maxlength="40">' +
        '<button type="button" data-addcolour>Add</button>' +
      '</div>';
    if (palEdit) {
      var inp = pal.querySelector('[data-newname]');
      if (inp) { inp.focus(); inp.select(); }
    }
  }

  /* R23. A chisel-tip marker held at an angle, with a stroke lying under it.
     Two parts carry the colour and both are class="ink": the nib, and the
     stroke, which is the part that reads at 15px. The barrel stays currentColor
     so the icon still has an outline when the chosen colour is very pale, which
     several of them are: an all-colour icon in #F6C6C6 on white is a smudge.

     Hand-authored rather than fetched: the layer must stay self-contained, and
     the whole thing is four shapes. */
  var PAL_ICON =
    '<svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true" focusable="false">' +
      '<g transform="rotate(-35 10 7.4)">' +
        '<path class="ink" d="M9 1.4 h2 a1.2 1.2 0 0 1 1.2 1.2 v7.9 h-4.4 v-7.9 ' +
              'a1.2 1.2 0 0 1 1.2-1.2 Z" ' +
              'stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/>' +
        '<path class="ink" d="M7.8 10.5 h4.4 l-0.9 2.9 h-2.6 Z" ' +
              'stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/>' +
      '</g>' +
      '<rect class="ink" x="2.2" y="16.4" width="15.6" height="3" rx="1.5"/>' +
    '</svg>';

  /* The colour goes on as two variables, not a fill: see the .sv-palbtn .ink
     rules for why. Tolerates the button not existing yet, because the settings
     fetch that fills the palette and the selection that builds the bar do not
     arrive in a fixed order. */
  /* Which ink reads on this swatch. 🔴 Not a nicety: two of the palette entries
     on this machine are colours EH added himself and carry NO dark value, so in
     dark mode they keep their LIGHT background while the label follows the dark
     theme. Measured, that is 1.21:1 for "Flag" and 2.22:1 for "Very
     Interesting" - the same invisible-label bug QA reported at 1.05:1, just on
     a different entry. Choosing the ink from the background instead fixes every
     colour, including any the user adds next.

     Threshold 0.25 on relative luminance: every swatch in the palette, light
     and dark, then lands at 5.96:1 or better against its own label. */
  function inkOn(hex) {
    var h = String(hex || '').replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    if (h.length !== 6) return '';
    var f = function (v) {
      v = parseInt(v, 16) / 255;
      return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    };
    var L = 0.2126 * f(h.slice(0, 2)) + 0.7152 * f(h.slice(2, 4)) + 0.0722 * f(h.slice(4, 6));
    return L > 0.25 ? '#1b1f1f' : '#f2f6f6';
  }

  function paintPalIcon() {
    var c = colourById(lastColour) || colourById('k');
    if (!c) return;
    Array.prototype.forEach.call(document.querySelectorAll('.sv-palbtn'), function (b) {
      b.style.setProperty('--sv-icol', c.color);
      if (c.dark) b.style.setProperty('--sv-icold', c.dark);
      else b.style.removeProperty('--sv-icold');
      b.title = 'Highlighting in "' + c.label + '". Click to change colour, or say what one means.';
    });
  }

  function syncHighlightButton() {
    paintPalIcon();
    var b = S.bar && S.bar.querySelector('button[data-c]:not([data-c="d"])');
    if (!b || !palette) return;
    var c = colourById(lastColour) || colourById('k');
    b.setAttribute('data-c', c.id);
    b.textContent = c.label;
    /* Custom properties, not an inline background, so the dark swatch in the
       palette can win in dark mode. removeProperty clears the inline value a
       page composed before this change may still be carrying. */
    b.classList.add('sv-hlbtn');
    b.style.removeProperty('background');
    b.style.setProperty('--sv-hlbg', c.color);
    b.style.setProperty('--sv-hlink', inkOn(c.color));
    if (c.dark) {
      b.style.setProperty('--sv-hlbgd', c.dark);
      b.style.setProperty('--sv-hlinkd', inkOn(c.dark));
    } else {
      b.style.removeProperty('--sv-hlbgd');
      b.style.removeProperty('--sv-hlinkd');
    }
    b.title = 'Highlight as "' + c.label + '". The palette beside this changes it.';
  }

  function savePalette() {
    return api('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: modelSel.value, level: level2.value,
        palette: palette, lastColour: lastColour
      })
    }).then(function (r) {
      if (r.body && r.body.ok && r.body.palette) {
        palette = r.body.palette;
        lastColour = r.body.lastColour;
        paintPaletteCss(); syncHighlightButton(); tagMarks();
      } else if (r.body && r.body.error) {
        S.toast(r.body.error);
      }
    }).catch(function () { S.toast('The palette was not saved.'); });
  }

  function installPalette() {
    if (!S.bar || !palette) return;
    if (S.bar.querySelector('.sv-palbtn')) return;
    var hi = S.bar.querySelector('button[data-c="k"]');
    var flag = S.bar.querySelector('button[data-c="q"]');
    if (!hi) return;
    /* Flag stops being a peer button and becomes a swatch like any other. */
    if (flag) flag.hidden = true;

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'sv-palbtn';
    btn.title = 'Choose a highlight colour, and say what it means';
    btn.setAttribute('aria-label', 'Highlight colours');
    btn.innerHTML = PAL_ICON + '<span class="pcaret" aria-hidden="true">\u25BE</span>';
    hi.insertAdjacentElement('afterend', btn);
    paintPalIcon();   /* the button is new, so it starts with no colour on it */

    /* Same trick the lesson's own buttons use: without this the selection is
       gone before the click lands, and there is nothing left to highlight. */
    btn.addEventListener('mousedown', function (e) { e.preventDefault(); });
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (pal.hidden) {
        renderPalette();
        var r = btn.getBoundingClientRect();
        pal.hidden = false;
        var w = pal.offsetWidth;
        pal.style.left = Math.max(8, Math.min(r.left + window.scrollX,
          document.documentElement.clientWidth - w - 8)) + 'px';
        pal.style.top = (r.bottom + window.scrollY + 6) + 'px';
      } else {
        pal.hidden = true;
      }
    });
    syncHighlightButton();
  }

  pal.addEventListener('mousedown', function (e) {
    /* Keep the selection alive, except in the text fields, which need focus. */
    if (!/^(INPUT)$/.test(e.target.tagName)) e.preventDefault();
  });

  function commitRename(id) {
    var inp = pal.querySelector('[data-newname]');
    var c = colourById(id);
    var v = inp ? (inp.value || '').trim() : '';
    palEdit = null;
    if (c && v) { c.label = v; syncHighlightButton(); savePalette(); }
    renderPalette();
  }

  pal.addEventListener('click', function (e) {
    var t = e.target;
    var hit = function (attr) {
      var el = t.closest && t.closest('[' + attr + ']');
      return el ? (el.getAttribute(attr) || true) : null;
    };

    var pick = hit('data-pick');
    if (pick) {
      lastColour = pick;
      pal.hidden = true;
      palEdit = palDel = null;
      syncHighlightButton();
      savePalette();
      /* A selection is live whenever this bar is showing, so picking a colour
         means "use it now", not merely "use it next time". Clicking the
         lesson's own button reuses its handler rather than duplicating it. */
      var hi = S.bar && S.bar.querySelector('button[data-c]:not([data-c="d"])');
      if (hi && !S.bar.hidden) hi.click();
      return;
    }

    var ed = hit('data-edit');
    if (ed) { palEdit = ed; palDel = null; renderPalette(); return; }

    var del = hit('data-del');
    if (del) {
      palDel = del; palEdit = null; palDelUses = null;
      renderPalette();
      /* The confirm names the real number, fetched while it is on screen. */
      api('/api/colour-uses?c=' + encodeURIComponent(del)).then(function (r) {
        if (r.body && r.body.ok && palDel === del) {
          palDelUses = r.body;
          renderPalette();
        }
      }).catch(function () {});
      return;
    }

    if (hit('data-back')) { palEdit = palDel = null; renderPalette(); return; }

    var ren = hit('data-rename');
    if (ren) { commitRename(ren); return; }

    var kill = hit('data-confirmdel');
    if (kill) {
      var purge = !!(pal.querySelector('[data-purgetoo]') || {}).checked;
      var uses = palDelUses;
      var c = colourById(kill);
      /* 🔴 Retired, never removed: marks keeping the colour still need its hex
         to render, so the entry stays in settings.json and the picker hides
         it. Deleting the entry outright would repaint kept highlights green,
         which is exactly the bug R1's palette was built to end. */
      if (c) c.retired = true;
      if (lastColour === kill) lastColour = 'k';
      palDel = null; palDelUses = null;
      renderPalette(); syncHighlightButton();
      savePalette();
      if (purge) {
        /* The open lesson first, so its own 900ms push cannot re-add what the
           sweep just removed; then the sweep covers every other lesson. */
        var m = S.marks();
        var keep = m.items.filter(function (it) { return it.c !== kill; });
        if (keep.length !== m.items.length) S.replaceMarks(keep, m.notes);
        api('/api/colour-purge', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ c: kill })
        }).then(function (r) {
          if (r.body && r.body.ok) {
            S.toast('Colour removed, and ' + r.body.removed +
                    (r.body.removed === 1 ? ' highlight' : ' highlights') + ' with it.');
          } else {
            S.toast((r.body && r.body.error) || 'The colour is gone but the sweep failed.');
          }
        }).catch(function () { S.toast('The colour is gone but the sweep failed.'); });
      } else {
        S.toast('Colour removed. Its highlights keep their colour.');
      }
      return;
    }

    if (t.hasAttribute && t.hasAttribute('data-addcolour')) {
      var col = pal.querySelector('[data-newcolour]').value;
      var lab = (pal.querySelector('[data-newlabel]').value || '').trim();
      if (!lab) { S.toast('Give the colour a meaning first. That is the point of it.'); return; }
      var n = 1, id;
      do { id = 'u' + n++; } while (colourById(id));
      palette = palette.concat([{ id: id, label: lab, color: col }]);
      lastColour = id;
      palEdit = palDel = null;
      renderPalette(); syncHighlightButton();
      savePalette();
    }
  });

  pal.addEventListener('keydown', function (e) {
    if (!e.target.hasAttribute || !e.target.hasAttribute('data-newname')) return;
    if (e.key === 'Enter') { e.preventDefault(); commitRename(palEdit); }
    if (e.key === 'Escape') { e.stopPropagation(); palEdit = null; renderPalette(); }
  });

  /* 🔴 R45's actual defect, and the fix is one property of events. The lesson
     hides the bar and FORGETS THE RECORDED SELECTION on any document mouseup
     or keyup that lands with the selection collapsed, and focusing the rename
     input collapses it. So editing a name destroyed `pending`, after which
     every colour button silently did nothing. These two stoppers keep the
     lesson's document-level listeners from ever seeing events that belong to
     the palette; the bar stays up, the recorded selection stays alive, and a
     colour picked after a rename still highlights. Capture phase, so the stop
     lands before the lesson's bubble-phase listener on the same document. */
  ['mouseup', 'keyup'].forEach(function (type) {
    document.addEventListener(type, function (e) {
      if (e.target && e.target.closest && e.target.closest('.sv-pal')) e.stopPropagation();
    }, true);
  });

  document.addEventListener('mousedown', function (e) {
    if (pal.hidden) return;
    if (e.target.closest && (e.target.closest('.sv-pal') || e.target.closest('.sv-palbtn'))) return;
    pal.hidden = true;
  });

  /* renderMarks() rewrites the block's innerHTML on every change, which throws
     away the data-c stamps. The timeout puts this after that render rather than
     racing it. */
  S.onChange(function () { window.setTimeout(tagMarks, 0); });

  gear.addEventListener('click', function () {
    setBox.hidden = !setBox.hidden;
    if (!setBox.hidden) loadSettings();
  });
  /* 🔴 .sv-setbtn is R18's header and menu Settings buttons, and leaving it out
     made Settings impossible to CLOSE from the header while opening fine, which
     is a confusing way to fail. This fires on mousedown and the toggle fires on
     click: pressing the header button while the sheet was open closed it here
     and then the toggle immediately reopened it. Opening was unaffected,
     because this handler returns early when the sheet is already hidden. */
  document.addEventListener('mousedown', function (e) {
    if (setBox.hidden) return;
    /* 🔴 R41's confirm dialog is exempt because it OPENS from this sheet. It is
       appended to body rather than into the sheet (it has to paint over it), so
       without this, typing the confirmation word closed Settings underneath and
       cancelling then returned to a bare page instead of to where he was. */
    if (e.target.closest && (e.target.closest('.sv-set') ||
                             e.target.closest('.sv-gear') ||
                             e.target.closest('.sv-setbtn') ||
                             e.target.closest('.sv-wipe') ||
                             e.target.closest('.sv-wipescrim'))) return;
    setBox.hidden = true;
  });

  /* ---------- selecting inside an answer ----------

     The two directions differ on purpose. Ask CONTINUES the conversation you are
     already in, phrased so the thread records what you asked about. Look up opens
     a small definition beside it and changes nothing, because wanting a word
     defined is not the same as wanting to change the subject. */

  var mini = document.createElement('div');
  mini.className = 'sv-mini';
  mini.hidden = true;
  /* R5, asked 2026-08-13: "I'd like to add the ability to highlight things and
     add definition terms and all that from inside the chat. Currently, I can
     only ask about this and look up inside the chat." Card is the addition:
     Look up shows a definition and forgets it, Card keeps it, in the same list
     as the cards made on the page. */
  mini.innerHTML =
    '<div class="row">' +
      '<button type="button" data-mini-ask>Ask about this</button>' +
      '<button type="button" data-mini-look>Look up</button>' +
      '<button type="button" data-mini-card>Card</button>' +
      '<button type="button" data-mini-hl hidden>Highlight</button>' +
    '</div>' +
    '<div class="out" hidden></div>';
  document.body.appendChild(mini);

  var miniOut = mini.querySelector('.out');
  var miniText = '';
  var miniWhere = null;   /* 'pop' or 'panel' */

  function hideMini() { mini.hidden = true; miniOut.hidden = true; miniText = ''; }

  function showMini(text, where, rect) {
    miniText = text;
    miniWhere = where;
    miniOut.hidden = true;
    miniOut.innerHTML = '';
    /* Highlight only offers itself where it can actually anchor: inside a turn
       of an open conversation. In the popover there is no conversation and no
       turn index, so the button would have nowhere to put the mark. */
    var sel = window.getSelection();
    var node = (sel && sel.rangeCount) ? sel.getRangeAt(0).startContainer : null;
    var host = node ? (node.nodeType === 1 ? node : node.parentNode) : null;
    /* 🔴 `CHAT_TXT` here too, and this is the site that makes the fix VISIBLE
       rather than merely correct. Excluding the pending box from the two walks
       above stops the wrong mark being stored, but the button would still be
       offered and pressing it would do nothing at all. This rule is the one
       that means it is never offered, which is what this comment already
       claimed: Highlight only offers itself where it can actually anchor, and
       a line that will be replaced by another turn is not somewhere to anchor. */
    mini.querySelector('[data-mini-hl]').hidden =
      !(where === 'panel' && openChat && host && host.closest && host.closest(CHAT_TXT));

    mini.hidden = false;
    var w = mini.offsetWidth, h = mini.offsetHeight;
    var top = rect.bottom + 8;
    if (top + h > window.innerHeight - 6) top = Math.max(6, rect.top - h - 8);
    mini.style.top = top + 'px';
    mini.style.left = Math.min(Math.max(6, rect.left), window.innerWidth - w - 6) + 'px';
  }

  document.addEventListener('mouseup', function (e) {
    if (e.target.closest && e.target.closest('.sv-mini')) return;
    window.setTimeout(function () {
      var sel = window.getSelection();
      if (!sel || sel.isCollapsed || !sel.rangeCount) return hideMini();
      var node = sel.anchorNode;
      var el = node && (node.nodeType === 1 ? node : node.parentElement);
      if (!el) return hideMini();
      var inPop = el.closest('.sv-pop');
      var inPanel = el.closest('.sv-panel');
      if (!inPop && !inPanel) return hideMini();
      var text = sel.toString().replace(/\s+/g, ' ').trim();
      if (text.length < 3 || text.length > 600) return hideMini();
      var rect;
      try { rect = sel.getRangeAt(0).getBoundingClientRect(); } catch (err) { return hideMini(); }
      showMini(text, inPanel ? 'panel' : 'pop', rect);
    }, 0);
  });

  mini.querySelector('[data-mini-ask]').addEventListener('click', function () {
    var text = miniText, where = miniWhere;
    hideMini();
    if (!text) return;
    var phrased = 'Please explain: “' + text + '”';
    if (where === 'panel') {
      pBox.value = phrased;
      panelAsk();
    } else {
      sendAsk(phrased, phrased);
    }
  });

  mini.querySelector('[data-mini-hl]').addEventListener('click', function () {
    /* Reads the live selection rather than miniText, because a highlight needs
       WHERE the words are and not only what they say. */
    if (addChatHighlight()) hideMini();
  });

  mini.querySelector('[data-mini-card]').addEventListener('click', function () {
    if (!miniText) return;
    var want = miniText;
    hideMini();
    cardFromChat(want);
  });

  mini.querySelector('[data-mini-look]').addEventListener('click', function () {
    if (!miniText) return;
    miniOut.hidden = false;
    miniOut.textContent = 'Looking up…';
    var want = miniText;
    api('/api/lookup?q=' + encodeURIComponent(want)).then(function (r) {
      if (want !== miniText) return;
      /* 🔴 Same order as the popover. This surface shows "the top two", so
         ranking them here and not there would let one term put its sources in
         one order in the popover and another in the mini bar. */
      var sources = orderSources((r.body && r.body.sources) || []);
      var failed = (r.body && r.body.failed) || [];
      miniOut.innerHTML = '';
      if (!sources.length) {
        miniOut.textContent = failed.length
          ? (failed.join(' and ') + ' did not answer. That is not "no entry": try again.')
          : 'Nothing found. Try a shorter selection.';
        return;
      }
      sources.slice(0, 2).forEach(function (s) {
        var lab = document.createElement('span');
        lab.className = 'lab';
        lab.textContent = s.source + (s.title ? ' · ' + s.title : '');
        var txt = document.createElement('div');
        txt.textContent = s.text;
        miniOut.appendChild(lab);
        miniOut.appendChild(txt);
      });
    }).catch(function () { miniOut.textContent = 'Could not reach the server.'; });
  });

  document.addEventListener('mousedown', function (e) {
    if (mini.hidden) return;
    if (e.target.closest && e.target.closest('.sv-mini')) return;
    hideMini();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hideMini(); });

  /* ---------- additions: filed beside the note, never inside it ---------- */

  var adds = { doc: S.docId, items: [] };

  /* 🔴 THE KEYS THIS PAGE LAST AGREED THE FILE HELD, which is the whole of what
     lets the server tell a REMOVAL from a kept note this page has simply never
     seen. Without it every save says "here is the entire truth", and on two
     devices that is a deletion of the one collection the reader cannot
     regenerate.

     🔴 SEEDED FROM THE LOAD AND MOVED ONLY BY THIS PAGE'S OWN SAVES. `null`
     means "has agreed to nothing", which the server reads as a client too old
     to say and answers by adopting everything and deleting nothing. That is the
     correct answer while this page has never managed to read the file. */
  var ADD_BASE = null;

  /* 🔴 IT MUST AGREE WITH `addition_key` IN THE SERVER, CHARACTER FOR
     CHARACTER, and the two integers are the reason this one is easy to keep
     that way: every other key in this file carries truncated TEXT, and a
     JavaScript `slice` counts UTF-16 code units where a Python slice counts
     code points, so one emoji before the cut makes the two sides disagree.
     Pinned by a test that runs the same row through both. */
  function addKey(x) {
    if (typeof x.b !== 'number' || !isFinite(x.b) || Math.trunc(x.b) !== x.b) {
      return null;
    }
    if (typeof x.ts !== 'number' || !isFinite(x.ts) || Math.trunc(x.ts) !== x.ts) {
      return null;
    }
    return 'a:' + x.b + ':' + x.ts;
  }

  function addKeys(rows) {
    return (rows || []).map(addKey).filter(function (k) { return k !== null; });
  }

  function saveAdds() {
    /* 🔴 READ BEFORE THE POST, never after: the reader may press Keep again
       while this one is in flight, and a base computed in the callback would
       claim agreement to a row the server has not been told about. */
    var mine = addKeys(adds.items);
    /* quiet: the Keep button's own handler reads this result and tells the
       reader, with the reason carried in the body. */
    if (!maySaveSidecar('additions', 'notes kept in this lesson', true)) {
      return sidecarRefused('notes kept in this lesson');
    }
    return api('/api/annotations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ doc: S.docId, items: adds.items, base: ADD_BASE })
    }).then(function (r) {
      /* 🔴 MOVED ONLY ON A LANDED SAVE, and to what was SENT rather than to
         what came back. A base advanced after a refused save would claim
         agreement to a file this page never wrote, and the next save would
         delete whatever the other device had added in between.

         🔴 AND TO WHAT WAS SENT rather than to the file's own keys, which is
         the opposite of the marks path and is right for the opposite reason:
         this page does not adopt the merged result into `adds.items`. A base
         naming a row this page never drew would license deleting it on the
         next save, and the reader would never have seen it. */
      if (saveLanded(r)) { ADD_BASE = mine; }
      return r;
    });
    /* 🔴 NO `noticeSave` here, and this is the one writer without it. Its two
       callers differ: the Keep button inspects the result and speaks for itself,
       so a reporter inside the writer would land a second toast on top of a
       better one. Remove does not, and reports at its own call site below.
       Putting it here would be tidier and would produce the double toast this
       file has already been bitten by twice. */
  }

  function renderAdds() {
    Array.prototype.forEach.call(document.querySelectorAll('.sv-add'), function (n) { n.remove(); });
    adds.items.forEach(function (it) {
      var block = S.blockAt(it.b);
      if (!block || !block.parentNode) return;

      var card = document.createElement('div');
      card.className = 'sv-add';

      var hd = document.createElement('div');
      hd.className = 'hd';
      var src = document.createElement('span');
      src.textContent = it.source || 'Note';
      var term = document.createElement('span');
      term.className = 'term';
      term.textContent = it.term;
      var del = document.createElement('button');
      del.type = 'button';
      del.textContent = 'Remove';
      del.addEventListener('click', function () {
        adds.items = adds.items.filter(function (x) { return x.id !== it.id; });
        saveAdds().then(function (r) {
          renderAdds();
          /* ⚠️ The row is NOT put back, deliberately, and it is the one thing
             here a person should overrule if they disagree. Rolling the page
             back to disk state is a design call about every optimistic write in
             this layer, not a fix belonging to one Remove button, and it is
             filed for the manager. What is not a design call is that the reader
             must be told, which is this. */
          if (!saveLanded(r) && !(r && r.status === 0)) {
            S.toast('Not removed. The server did not take that change, so it is '
                    + 'still in this lesson when you next open it.');
          }
        });
      });
      hd.appendChild(src); hd.appendChild(term); hd.appendChild(del);

      var bd = document.createElement('div');
      bd.className = 'bd';
      bd.textContent = it.text;

      card.appendChild(hd); card.appendChild(bd);
      block.parentNode.insertBefore(card, block.nextSibling);
    });
  }

  keepBtn.addEventListener('click', function () {
    if (!keepable || !current) return;
    var id = 1;
    adds.items.forEach(function (x) { if (x.id >= id) id = x.id + 1; });
    adds.items.push({
      id: id, b: current.b, term: keepable.term,
      text: keepable.text, source: keepable.source,
      ts: Date.now()
    });
    keepBtn.disabled = true;
    /* 🔴 BRANCH ON `r.ok`, NOT ON THE PROMISE. `api()` deliberately does
       NOT reject on a 401: it resolves with `{ok:false, status:401}` so the
       token bar can explain the credential instead of every call site
       inventing its own error. The cost is that `.then` means "the server
       answered", never "the server agreed", and this handler read it as the
       second. On an unpaired device the POST was refused, nothing was written,
       and the reader was told **"Kept. It stays in this lesson and survives a
       rewrite."**

       🔴 Nothing on disk is destroyed by that — the refused write never
       reaches the writer. What is lost is the item plus the reader's belief
       that it is safe, and the belief is the worse half: he has no reason to
       do it again. (Audit §4, 2026-09-01.)

       ⚠️ The button is re-enabled on failure, which is beyond the
       one-line shape the entry described and is filed in the review lane: a
       control that told you it failed and then refuses to be pressed again is
       a second defect. The item stays in `adds.items` deliberately, so that
       pairing and keeping something else carries it along rather than
       discarding work the reader already did. */
    saveAdds().then(function (r) {
      if (!r || !r.ok) {
        keepBtn.disabled = false;
        /* 🔴 `status: 0` is a refusal made in this page, not an answer from the
           server, and its body carries the reason. Saying "could not save" there
           would be true and useless: nothing was wrong with this press, the
           sidecar was never read and a save would have replaced it. */
        S.toast(r && r.status === 0 && r.body && r.body.error ? r.body.error
                : r && r.status === 401
                ? 'Not kept: this device is not paired with the study server.'
                : 'Could not save that. Nothing was kept.');
        return;
      }
      renderAdds();
      S.toast('Kept. It stays in this lesson and survives a rewrite.');
      closePop();
    }).catch(function () {
      keepBtn.disabled = false;
      S.toast('Could not save that. Nothing was kept.');
    });
  });

  /* ---------- marks on disk ----------

     localStorage is a cache from here on. The file in notes/ is the copy that
     lives on disk, is backed up, and carries the anchors, so a wiped browser
     profile costs nothing. The vault note cannot do this job: it is a readable
     publication with the offsets thrown away. */

  var marksTimer = null;

  /* ---- when this browser and the disk last agreed ----

     🔴 This exists because the rule below used to be wrong in a way that
     destroyed data, twice. The lesson caches its marks in localStorage and
     stores NO timestamp with them, so the page could not tell a cache written a
     minute ago from one written last week, and restoreFromDisk's test was
     therefore "does this browser have any bytes at all". Any second browser, or
     any profile that once opened a lesson and went stale, silently overwrote the
     good copy on its next visit. It took 13 highlights and 2 free notes on
     W2-T3-P4 on 13 Aug, and 2 more on W3-T3-P4 the same evening.

     The stamp is the layer's own, in its own key, so no lesson file is edited
     and the lesson's cache format is untouched. It records the `updated` value
     of the last state this browser and the disk are known to have shared,
     whether that came from a push or from a restore. */

  /* 🔴 THE COURSE IS IN THE KEY, and its absence deleted marks from disk.
     Measured 2026-09-01: **25 of 51 lesson ids exist in BOTH of EH's courses**,
     so `kcl-study-synced-W4-T1-P1` named two different lessons and a highlight
     in one course moved the other course's agreement. Reproduced with a control
     on a two-course rig, identical disk and identical browser store, only the
     stamp differing:

       collision   disk [0,1,2,99] -> on screen 3 -> disk [0,1,2]   99 DELETED
       control     disk [0,1,2,99] -> on screen 4 -> disk [0,1,2,99]

     🔴 AND THE REFUSAL IS NOT THE DAMAGE; THE REPAIR AFTER IT IS. A wrong stamp
     makes `restoreFromDisk` score the disk as older and return "not restored",
     and the caller reads that as "the disk has nothing we need" and mirrors this
     browser OVER the file. ⚠️ It is silent by construction: the "N marks held
     only on this device were discarded" sentence lives on the RESTORE path,
     which is exactly the path that did not run. Zero toasts, measured. */
  var SYNC_KEY = 'kcl-study-synced-' + svCoursePart() + S.docId;

  /* ⚠️ The key this browser's existing stamps are under. On a single-course
     install `svCoursePart()` is `''`, so the two names are IDENTICAL and every
     branch below that mentions the old key is unreachable. That is correct
     rather than a special case: nothing can collide where there is one course,
     so there is nothing to migrate. */
  var SYNC_KEY_OLD = 'kcl-study-synced-' + S.docId;


  /* 🔴 THE KEYS THIS BROWSER LAST AGREED THE FILE HELD, stored beside the stamp
     and never apart from it. The stamp answers "when did we last agree"; this
     answers "to WHAT", and the server needs the second one to tell a mark this
     browser deleted from a mark this browser has never seen. Those two look
     identical from a payload alone, and telling them apart is the whole of the
     write-side fix.

     ⚠️ MEASURED on EH's real data rather than guessed, because the key carries
     the anchor text and that is not free: 78 marks across 14 lessons key to
     12,273 bytes of base against 26,798 bytes of marks files, so the base is
     roughly HALF the size of the marks it describes, and the largest single
     lesson's base is 2,301 bytes. It rides in the same store as the marks
     themselves, so it is a fraction more of something already there rather than
     a new class of storage risk. An earlier draft of this comment said "about a
     tenth", which was true of the offsets key it was written for. */
  var SYNC_BASE_KEY = 'kcl-study-base-' + svCoursePart() + S.docId;

  /* The identity of a mark that survives two devices, in exactly the shape the
     server's `mark_key` and `note_key` build.

     🔴 `id` is not it: two devices both assign ids from zero, so disk item 1 and
     local item 1 are routinely different highlights. Measured on the rig, one
     lesson, twenty-four seconds apart.

     🔴 AND NEITHER ARE THE OFFSETS. This was `b`, `s` and `e` until `study-hub-qa`
     filed the reason it should not be: the shell's `reanchor()` rewrites `it.b`,
     `it.s` and `it.e` from `indexOf(it.t)` whenever the lesson prose shifts, so
     an identity on the offsets breaks exactly where the reader's own anchoring is
     built to cope. Their measurement (72 real highlights, 11 lessons) shows both
     candidates colliding zero times, **and picking on that number would have been
     the mistake**. `t` is what the others are recomputed FROM and the one field
     nothing rewrites.

     🔴 THESE TWO IMPLEMENTATIONS ARE JOINED BY A TEST that runs this function
     under node against the same fixtures the Python is given. A key that
     disagreed by one character would leave both halves individually correct and
     the merge quietly adopting duplicates for ever, which is the failure this
     project keeps finding at exactly this kind of seam. */
  function svWhole(v) {
    return typeof v === 'number' && isFinite(v) && Math.floor(v) === v;
  }

  function svSyncKey(it) {
    return (svWhole(it.b) && typeof it.t === 'string' && it.t)
      ? 'h:' + it.b + ':' + it.t
      : null;
  }

  function svSyncNoteKey(n) {
    return svWhole(n.ts) ? 'n:' + n.ts : null;
  }

  /* Every key in a collection, skipping the marks that have none. A mark with
     no key is not rescued by the merge and not deleted by it either: it gets
     exactly the behaviour it had before this existed. */
  function svSyncKeys(m) {
    var out = [];
    (m.items || []).forEach(function (it) {
      var k = svSyncKey(it);
