    font: 600 12px var(--body); color: var(--ink); background: var(--paper);
    border: 1px solid var(--rule); border-radius: 5px; padding: 6px 11px; cursor: pointer;
  }
  .sv-cardadd button:hover { border-color: var(--hl-d-line); color: var(--hl-d-line); }

  /* ---- R7: bookmarks, which point at a whole block ----

     🔴 The marker is drawn with a ::before on the block itself, NOT by inserting
     an element. Marks anchor to the index of a block inside .wrap and a new
     block-level tag would renumber every one after it. A pseudo-element adds no
     node, so nothing moves. Same constraint the navigation bar was built under. */
  .wrap [data-hb].sv-bm { position: relative; }
  .wrap [data-hb].sv-bm::before {
    content: ''; position: absolute; left: -18px; top: 2px; bottom: 2px;
    width: 3px; border-radius: 2px; background: var(--hl-d-line);
  }
  .sv-bmark { border-bottom: 1px solid var(--rule-soft); padding: 11px 0; }
  .sv-bmark button.go {
    display: block; width: 100%; text-align: left; background: none; border: 0;
    padding: 0; cursor: pointer; color: var(--ink);
    font: 14px var(--body); line-height: 1.5;
  }
  .sv-bmark button.go:hover { color: var(--hl-d-line); }
  .sv-bmark .row { display: flex; gap: 4px; align-items: baseline; margin-top: 5px; }
  .sv-bmark .where { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-right: auto; }
  .sv-bmark .mini {
    font: 500 12px var(--body); background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 3px 7px; border-radius: 3px;
  }
  .sv-bmark .mini:hover { color: var(--ink); background: var(--paper); }
  .sv-bmarks .empty { color: var(--muted); font-size: 13.5px; padding: 10px 0 2px; }

  /* ---- marks that live in a conversation rather than on the page ---- */
  mark.sv-chl { background: var(--hl-key); color: inherit; border-radius: 2px; padding: 0 1px; }
  .sv-bmchat .term { border-left-color: var(--hl-q); }
  .sv-bmark.sv-bmchat button.go { font-style: normal; }
  .sv-panel header [data-bmchat][aria-pressed="true"] {
    background: var(--hl-q); border-color: var(--hl-q);
  }
  .sv-bmflash { animation: sv-bmflash 1.4s ease-out 1; }
  @keyframes sv-bmflash {
    0%   { background: var(--hl-d); }
    100% { background: transparent; }
  }
  @media (prefers-reduced-motion: reduce) { .sv-bmflash { animation: none; } }
  /* ---- The pane in its own WINDOW (EH's design handoff, §1) -------------

     🔴 THE POPPED WINDOW IS THIS SAME PAGE, opened with `?svpane=<id>`, with the
     lesson hidden and the pane filling the frame. It is not a second route and
     not a second renderer.

     🟢 WHY THAT AND NOT A NEW SERVER ROUTE. Everything in the pane -- the
     materials list, the lecture, the chat, the notebook -- is built by this
     layer out of the lesson page it is injected into. A standalone route would
     have to reproduce the page's data and would be a second thing to keep in
     step. Reusing the page costs one CSS block and needs no restart.

     ⚠️ The lesson is HIDDEN, not absent: the notes panel is the lesson's own
     element and its handlers are bound to nodes in that document, so removing
     it would take the Notebook tab with it. */
  html.sv-panewin, html.sv-panewin body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--surface);
  }
  /* Everything that is not one of the two panes. `:not()` on the two panel
     classes rather than a list of what to hide, so an element added to the page
     later cannot appear in this window by having been forgotten here. */
  html.sv-panewin body > *:not(.sv-panel):not(.hl-panel) { display: none !important; }
  /* 🔴 `width` IS `!important` HERE BECAUSE `.hl-panel`'S DOCKED WIDTH IS, and
     an `!important` beats a plain rule however specific that rule is. Without
     it the Notebook in a popped window obeys `--sv-panel-w`, which at 900px and
     above is the DOCKED pane's width: **measured 2026-09-04 at 1280px, Materials
     and Chat were 1280 and the Notebook was 320.** EH reported exactly that
     inversion -- *"especially if the window is wide... the whole notebook section
     collapses into a really short column"* -- and it was only the Notebook
     because `.sv-panel` carries no `!important` and `.hl-panel` does.

     ⚠️ DELETING THE OTHER `!important` IS NOT THE FIX. It is there so the docked
     width beats the notes panel's own stylesheet, which lives inside each of the
     29 lesson files. **Both important, so specificity decides, and this selector
     is the more specific.**

     🟢 Under 900px it looked right by accident: the media query sets
     `--sv-panel-w: 100%` there, so the bug was invisible at the pop-out's own
     opening size of 560 and appeared only when the reader widened the window. */
  html.sv-panewin .sv-panel,
  html.sv-panewin .hl-panel {
    position: fixed; inset: 0;
    width: 100% !important; max-width: none;
    border-left: 0; box-shadow: none;
  }
  /* The reserved gutter is a DOCKED pane's business: here the pane is the whole
     window and there is nothing beside it to make room for. */
  html.sv-panewin body { padding-right: 0 !important; }

  /* The blocked-pop-up notice. Fixed and above the pane, because the pane is
     what it is about and the reader has just clicked something in it. */
  .sv-popblocked {
    position: fixed; right: 16px; top: 16px; z-index: 90; max-width: 320px;
    padding: 10px 13px; border-radius: 6px;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--hl-d-line);
    box-shadow: 0 6px 22px rgba(0,0,0,.18);
    font-family: var(--body); font-size: 13px; line-height: 1.5;
  }
  .sv-popblocked[hidden] { display: none; }

  @media print { .sv-panetabs { display: none !important; } }

  .sv-matbody { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  /* The player's permanent home. `flex: none` so it takes the height its own
     aspect ratio asks for, and the swap area below gets what is left. */
  .sv-matkeep { flex: none; display: flex; flex-direction: column; }
  .sv-matkeep[hidden] { display: none; }
  .sv-matswap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  /* The deck is the point of the panel, so it takes all the height there is. */
  .sv-matframe { flex: 1; width: 100%; border: 0; min-height: 0; background: var(--paper); }

  /* ---------- the deck, rendered here instead of framed ----------

     🔴 This exists because of ONE fact about the platform, not because a frame
     was ugly. EH, iPad, 2026-08-29: "you can't scroll the slides... It scrolls
     the main lesson page instead. So all I see is the first page." iOS WebKit
     renders an EMBEDDED PDF as page one with no internal scroll viewport, and
     the touch falls through to the parent. No header, no CSS and no `height`
     changes it; a native PDF frame on iOS is simply not a document viewer.

     So the pages become canvases in a box that owns its own scrolling, which
     every device including iOS handles perfectly. */
  .sv-pdf {
    flex: 1; min-height: 0; width: 100%;
    /* 🔴 `scroll`, not `auto`, and it is load-bearing rather than tidy. With
       `auto` the scrollbar appears the moment the first page renders, which
       narrows the box by ~15px, which the resize watcher below reads as "the
       reader dragged the pane" and re-renders, which empties the box, which
       takes the scrollbar away again. The deck rendered page one forever. */
    overflow-y: scroll; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    /* The scroll must stop here rather than carrying on into the lesson behind,
       which is half of what the iPad was complaining about. */
    overscroll-behavior: contain;
    background: var(--paper);
    padding: 6px 0 10px;
  }

  /* ---- the deck gets a scrollbar you can actually see ----

     🔴 THE DEFECT, and it is measured rather than argued. QA drove a real
     two-page transcript at a 723px viewport: 1920px of content in a 539px pane,
     1381px hidden, `overflow-y: scroll`, and the scrollbar's LAYOUT WIDTH was
     0px. Reproduced here 2026-09-04 on a rendered ten-page deck in the first
     lesson of a course on this machine: 849px of content in a 495px pane, 354px
     hidden, same 0px. macOS and iOS draw
     an OVERLAY scrollbar, which takes no layout width and is invisible at rest,
     so `overflow-y: scroll` promises an affordance it does not deliver. The pane
     had no signal of any kind that a document continued below.

     🔴 WHY NOT THE BAND THE OTHER EIGHT PANES USE, which is the fix that looks
     obvious from the queue. The band's cover paints as the container's own
     background and this container's children are opaque full-width canvases, so
     QA measured it hidden at 1309 of 1381 offsets, 94.8 per cent, showing only
     in the 28px page gaps. A band that reads "nothing below" almost always,
     while 1381px sits below, is the false signal that family's own rule forbids.

     🟢 A REAL SCROLLBAR IS TRUTHFUL BY CONSTRUCTION, which is the same virtue
     the band was built for. Styling `::-webkit-scrollbar` opts this element out
     of overlay scrollbars, so the gutter is reserved and the thumb is painted at
     rest. Measured on two probe boxes with identical markup: the one whose
     content OVERFLOWS shows a thumb, the one whose content FITS shows an empty
     transparent gutter and no thumb at all. So there is nothing to toggle, no
     scroll listener, no state, and no false positive to guard against. It also
     gives the reader two things a fade cannot: somewhere to drag, and a sense of
     how much deck is left.

     🔴 IT COSTS 12px OF WIDTH PERMANENTLY, AND THAT IS PRECISELY WHY IT IS SAFE
     HERE. `overflow-y: scroll` above reserves the gutter from the first paint,
     so the box never changes width and the re-render loop documented on that
     declaration cannot start. Measured: applying these rules to a live deck
     moved the box by 12px once and the resize watcher, whose threshold is 24px,
     did not fire.

     🔴🔴 DO NOT ADD `scrollbar-width` OR `scrollbar-color` TO THIS ELEMENT.
     They are the better spelling and they DELETE THIS FIX, silently. Measured in
     Chrome on this page, 2026-09-04, two probe boxes styled one way each: the
     `::-webkit-scrollbar` box reserved a 12px gutter and painted a thumb, and
     the box carrying `scrollbar-width: thin; scrollbar-color: ...` as well went
     back to a 0px invisible overlay. Blink drops these rules the moment a
     standard scrollbar property is specified. A global rule reaching this
     element would take the affordance away with no error anywhere.

     🟢 SO IF YOU WANT A DIFFERENT SCROLLBAR HERE, CHANGE THE FOUR RULES BELOW.
     That sentence is here because `study-hub-qa` pointed out that a prohibition
     on its own pushes an author toward whatever route the guard cannot see, and
     they proved the point by finding one: `pane.style.scrollbarWidth = 'thin'`
     is the same property with no hyphen and an `=`, and the test that forbade
     the CSS declaration could not see it. **The test now refuses the SUBJECT
     rather than the spelling**: outside comments, the word `scrollbar` may not
     appear anywhere in this file except inside `::-webkit-scrollbar`.

     ⚠️ WHAT THIS DOES NOT FIX, said rather than left to be discovered: iOS
     ignores `::-webkit-scrollbar`, so an iPad keeps the transient overlay it has
     today. Not tested here and not claimed. A touch reader has the swipe; the
     trackpad reader is the one who had nothing at all. */
  .sv-pdf::-webkit-scrollbar { width: 12px; }
  .sv-pdf::-webkit-scrollbar-track { background: transparent; }
  /* The 3px transparent border plus `content-box` clipping is what makes a 12px
     track carry a 6px thumb with its own breathing room. `--muted` is 4.61:1 on
     `--paper` in light and 5.85:1 in dark, both past the 3:1 a non-text control
     needs, and it is a token so the dark path needs no second rule. Those two
     numbers are computed from the tokens by `test_pdf_scrollbar`, not typed in
     here: the test asserts the RATIO, so a future palette cannot quietly take
     the thumb under the line. */
  .sv-pdf::-webkit-scrollbar-thumb {
    background-color: var(--muted); background-clip: content-box;
    border: 3px solid transparent; border-radius: 6px;
  }
  .sv-pdf::-webkit-scrollbar-thumb:hover { background-color: var(--ink-soft); }

  .sv-pdfpage {
    position: relative; margin: 0 auto 10px; width: 100%;
    background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.18);
  }
  /* A slide is a picture of a white page. Inverting it in dark mode would make
     every chart wrong, so the page stays white and the surround goes dark, which
     is what every PDF reader does. */
  .sv-pdfpage canvas { display: block; width: 100%; height: auto; }
  .sv-pdfnum {
    font: 500 10.5px var(--body); color: var(--muted);
    text-align: center; padding: 1px 0 5px; user-select: none;
  }
  .sv-pdfmsg { font: 500 12px var(--body); color: var(--muted); padding: 10px 12px; }

  /* The selectable text sitting invisibly over the picture. Kept minimal on
     purpose: pdf.js ships 163KB of viewer CSS for a viewer we are not using, and
     these are the rules its text layer actually needs to line up. The custom
     property is set by the library through setLayerDimensions. */
  .sv-pdfpage .textLayer {
    position: absolute; inset: 0; overflow: clip; opacity: 1; line-height: 1;
    text-align: initial; text-size-adjust: none; -webkit-text-size-adjust: none;
    forced-color-adjust: none; transform-origin: 0 0; z-index: 1;
    color-scheme: only light; caret-color: CanvasText;
  }
  .sv-pdfpage .textLayer span,
  .sv-pdfpage .textLayer br {
    color: transparent; position: absolute; white-space: pre; cursor: text;
    transform-origin: 0% 0%; user-select: text; -webkit-user-select: text;
  }
  .sv-pdfpage .textLayer > :not(.markedContent),
  .sv-pdfpage .textLayer .markedContent span:not(.markedContent) {
    z-index: 1; --font-height: 0; --scale-x: 1; --rotate: 0deg;
    font-size: calc(var(--total-scale-factor) * var(--font-height));
    transform: rotate(var(--rotate)) scaleX(var(--scale-x));
  }
  .sv-pdfpage .textLayer .markedContent { display: contents; }
  .sv-pdfpage .textLayer ::selection { background: rgba(90, 150, 255, .35); }
  /* R49: the two ways out of a frame that will not load, under the frame where
     the explanation is, rather than only as the glyph in the bar above. */
  .sv-secall {
    display: block; margin: 6px 0 0; font: 500 11.5px var(--body); color: var(--muted);
    text-align: center; text-decoration: none; padding: 3px 0;
  }
  .sv-secall:hover { color: var(--regulated); text-decoration: underline; }

  .sv-homelink {
    display: inline-block; font: 600 12.5px var(--body); color: var(--ink);
    background: var(--hl-d); border: 1px solid var(--hl-d-line); border-radius: 6px;
    padding: 7px 12px; text-decoration: none; margin: 0 0 6px;
  }
  .sv-homelink:hover { border-color: var(--regulated); }

  .sv-vopt { display: flex; align-items: center; gap: 8px; font: 13px var(--body);
             color: var(--ink); margin: 0 0 8px; cursor: pointer; }
  .sv-vopt input { margin: 0; }

  /* R49, applied to cross-references: a link to a lesson that is not on this
     machine keeps its words and stops pretending to be a link. Dotted rather
     than struck through, because the text is still a true statement about the
     course; it is the destination that is absent, not the fact. The
     `!important` is the house rule for this file: the lessons style their own
     links and the layer has to win (see the note on overrides). */
  .wrap a.sv-xref-gone {
    color: var(--muted) !important;
    text-decoration: none !important;
    border-bottom: 1px dotted var(--muted) !important;
    cursor: help !important;
  }
  /* 🔴 hostword-exempt: CSS cannot call a JavaScript function.
     This is the ONE site the zero-assertion in `test_machine_word.py` allows,
     and the exemption is named here rather than only in the test so the reason
     travels with the code. Every other "this machine" in this file goes through
     `hostWord()`, which says the server's real name when the reader is not on
     it. A pseudo-element's `content` cannot, so the alternatives are moving
     this string into JavaScript (a real change to how the marker is drawn, for
     one string) or wording it so locality is not claimed. ⚠️ It IS wrong for a
     reader on another machine, which is why it is an exemption and not a
     decision: the sentence beside it in the tooltip is now correct and this one
     still is not. The assertion is a SUPERSET, so fixing this later never turns
     the test red. */
  .wrap a.sv-xref-gone::after {
    content: " (not on this machine)";
    font-size: .82em; font-style: italic; color: var(--muted); white-space: nowrap;
  }
  @media print { .wrap a.sv-xref-gone::after { content: ""; } }

  .sv-matacts { margin: 0; padding: 0 17px 15px; display: flex; gap: 8px; flex-wrap: wrap; }
  .sv-matact {
    display: inline-block; font: 600 12.5px var(--body); color: var(--ink);
    background: var(--hl-d); border: 1px solid var(--hl-d-line); border-radius: 6px;
    padding: 7px 12px; text-decoration: none; cursor: pointer;
  }
  .sv-matact:hover { border-color: var(--regulated); }
  .sv-matact:focus-visible { outline: 2px solid var(--hl-d-line); outline-offset: 1px; }

  .sv-matmsg { margin: 0; padding: 15px 17px; font-size: 13.5px; line-height: 1.55; color: var(--ink); }
  .sv-matmsg.quiet {
    font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--rule);
    padding: 10px 17px;
  }
  /* R26. The lecture plays here rather than only linking out. It sits at the top
     of the body instead of filling it the way a deck does, because the video is
     16:9 and stretching it to the panel's height would letterbox it into a
     strip. `background` rather than `--paper`: the bars beside a 4:3 recording
     should read as part of the player, not as a blank page. */
  .sv-matvid {
    display: block; width: 100%; max-height: 100%; aspect-ratio: 16 / 9;
    background: #000; border-bottom: 1px solid var(--rule);
  }
  /* ======================================================================
     THE PLAYER'S BOTTOM SECTION, BOTH PLAYERS, ONE SET OF RULES
     ======================================================================

     🔴 BUILT FROM EH'S DESIGN HANDOFF, 2026-09-03, option `2a`:
     `design/design_handoff_video_player_wrapper/README.md`. Every value below is
     the design's, expressed as the TOKEN the design names rather than the hex it
     prints -- its own first instruction, and the one that would have been easiest
     to get wrong.

     🔴 ONE SURFACE FOR TWO PLAYERS, WHICH IS EH'S REQUIREMENT AND NOT A TIDY-UP:
     *"one speed control underneath, consistent across all of them."* A narrated
     package runs in a sandboxed iframe and an ordinary recording is a `<video>`
     in this document; **they cannot share plumbing and they now share every rule
     here.** The old `.sv-vidskip` family is gone: it was the same row drawn
     twice, and two copies of one design is how the two drift.

     ⚠️ THE `pkg` IN THESE NAMES IS HISTORICAL. This was the mirrored package's
     bar before the recording's row was folded into it. The names are kept
     because renaming touches a dozen test files and would bury the design
     change in noise; **read `.sv-pkg*` as "the player's", not "the package's".**

     🔴 THE HEIGHTS ARE THE PART EH REVERSED HIMSELF ON. He ruled 44px
     EVERYWHERE on 2026-09-02, over an offered touch-only variant. The design
     specifies 44px on the touch breakpoint only, computing to roughly 29 to 33px
     on a laptop -- **the exact variant he turned down** -- and on 2026-09-03,
     with both rows drawn for him, **he chose the design.** That is why there is
     a breakpoint here at all. */

  /* A mirrored slide package runs in an iframe, which has no intrinsic size the
     way a <video> does, so it is given the export's own slide shape (iSpring
     writes 1304x824 exports; near enough for any of them). The grey is the
     export's own page ground, so letterboxing reads as the player, not a bug.

     🔴 DELETED BY ACCIDENT 2026-09-03 AND RESTORED THE SAME HOUR. It sat
     between two of the strip rules this section replaced, so a range edit took
     it with them. **1,775 tests stayed green**: nothing in the suite knows how
     tall a lecture should be, and the frame collapsed from 383px to 150px with

     that was being taken for EH, which is the argument for taking one. */

    display: block; width: 100%; max-height: 100%; aspect-ratio: 1304 / 824;
    border: 0; border-bottom: 1px solid var(--rule); background: #8a8a8a;
  }

  /* ---- the caption strip: flush under the picture, above the controls ----
     🔴 EH RULED THE PLACEMENT TWICE AND THE SECOND TIME WITH A DESIGN. First in
     chat -- *"put the closed caption bar right underneath the video, above the
     control bar"* -- then in the handoff, with numbers.

     🔴 IT IS NOT RENDERED AT ALL WHEN CAPTIONS ARE OFF. The design's words: *"no
     empty box, no 'captions off' placeholder ... the block gets ~50px shorter
     and the provenance note below shifts up; that was accepted in preference to
     reserving dead space."* ⚠️ THAT REVERSES A CONSTRAINT THIS FILE IMPOSED ON
     ITSELF -- the old reserve existed so the controls could not move -- and the
     design's stated reason is that the CC button sits immediately below the
     text, so cause and effect are adjacent. **His call, recorded here because
     the next person to read the old comment would otherwise re-impose it.**

     🔴 NO `CC` CHIP AND NO LABEL ON THIS STRIP: *"the caption line is marked
     with a 3px accent rule on its left edge"*, which is the device `.note` and
     `.sv-card .term` already use. A chip was tried and rejected.

     🟢 SELECTABLE, which is EH's earlier ruling and still true: he chose this
     placement in order to lift a sentence out of a lecture and into a note, so
     `user-select` here is a feature rather than an inherited default. */
  .sv-pkgcap {
    display: flex; gap: 12px;
    padding: 12px 16px 13px;
    background: var(--surface);
    border-top: 1px solid var(--rule);
    -webkit-user-select: text; user-select: text;
  }
  /* The marker is decoration with a job: it says "this line is the lecture
     speaking" without spending a word on it. `aria-hidden` in the markup, and
     stretched by the flex row so it always matches the text it marks. */
  .sv-pkgcap-mark {
    flex: none; width: 3px; border-radius: 2px;
    background: var(--hl-d-line);
  }
  /* 🔴 `min-height` IS THE DESIGN'S OWN ANSWER TO THE JUMP, and it is worth
     saying exactly what it does and does not cover. 14.5px at 1.5 is a 21.75px
     line, so 44px holds TWO lines and a three-line cue grows the strip and
     moves the controls under it.

     🟢 MEASURED RATHER THAN ASSUMED, 2026-09-03, in a real lesson at one-pixel
     steps: the corpus's longest cue -- 89 characters, of 4,876 across 395 `.vtt`
     files -- needed three lines only below 370px of pane. EH's pane is 605px and
     the shipped default is 440px.

     🟢 RE-DERIVED 2026-09-04 WHEN THE RECORDINGS ARRIVED, because a claim about
     "the corpus" goes stale the moment the corpus grows. The first recording
     added 157 cues and its longest was 85 characters.

     🔴🔴 RE-MEASURED 2026-09-09 OVER THE WHOLE CORPUS, AND THE OLD METHOD WAS
     MEASURING THE WRONG CUE. Four recovered lectures pushed the longest cue to
     93 characters, so the tripwire fired and every cue was measured rather than
     just the longest one, each laid out in a real `.sv-pkgcap` in a real lesson
     page.

     🔴🔴 RE-ANCHORED AND RE-COUNTED 2026-09-10, ON TWO CORRECTIONS FROM
     `study-hub-qa`. Both are corrections to THIS COMMENT rather than to the
     design, and no behaviour changed.

     1. **THE ANCHOR WAS AN ASSUMPTION WEARING THE COSTUME OF A MEASUREMENT.**

        **`panelWidth: 379`**, which the server serves and the layer applies
        (measured `--sv-panel-set: 379px`, a caption box of 378px). **379 is

     2. **THE CORPUS INCLUDED OUR OWN BACKUPS.** The scan globbed every `.vtt`

     **THE TABLE, on the LIVE corpus (451 files, 7,373 cues), measured through
     the real element by `study-hub-qa` 2026-09-09:**

       605px (the old anchor)      0 cues need three lines
       440px (the shipped default) 0
       400px                       0
       379px  <- WHAT IS STORED    8    0.11%
       376px                      11    0.15%
       370px                27 or 31    see the note below
       340px                     815   11.05%
       320px (the grip's minimum)  2,414   32.74%

     ⚠️ **370px CARRIES TWO FIGURES BECAUSE THE SOURCE DOES, and neither is being
     picked here.** The filing gives 31 in its per-width table and 27 in its
     corpus-comparison table, for the same widths on the same live corpus.
     **Writing one of them down as the number would be this comment's own
     mistake repeating**: an unverified figure that reads as measured. It is
     raised with QA; whoever settles it replaces this line with one number and a
     date. **Nothing below depends on which it is.**

     🔴 **THE SENTENCE THAT USED TO CLOSE THIS BLOCK WAS FALSE AND IS DELETED**:
     *"at every width anybody actually uses, 44px holds every cue there is"*.
     **At 379px, the only width in use on this machine, 8 cues do not**, and at
     320px, which the grip allows, **2,414 do (32.7%)** - so the claim was badly
     false at the bottom of the supported range.

     🟢 **8 in 7,373 IS 0.11% AND IS NOT A DEFECT, and nobody is asking for a
     behaviour change.** The design number holds where it matters. **What was
     wrong was the claim, and a claim is what the next person re-derives
     against**: they would have got different numbers and not known why.

     🔴 **BUT CHARACTER COUNT DOES NOT PREDICT WRAPPING, which is why the old
     figure was optimistic.** The cues that need three lines first are **82 to 86
     characters**, not the 93-character longest: short tokens give the browser
     more places to break, and the 93 (`... @) to thea 6) ignoring them @) ...`)
     fits two lines from 357px while an 89-character one needs 376px. **So "41 at
     370px" is not a regression from "0 at 370px"; the old figure only ever
     measured the single longest cue.** ⚠️ The character tripwire in
     `test_captions_render` is kept because it made this measurement happen, but
     it is a "the corpus changed, go and look" trigger and NOT a bound.

     ⚠️ THE FILE'S OWN LINE BREAKS ARE NOT WHAT WRAPS ON SCREEN. `cleanCue`
     collapses whitespace, so a cue written over three lines in the `.vtt` is one
     string here and the browser breaks it at the pane's width. **That is why the
     number that matters is characters and not lines**: 17.6% of shipped cues are
     three lines in the file and none of them is three lines in the pane.

     ⚠️ WRITTEN LONG-HAND, NOT AS `font:`. The design prints

  .sv-pkgcap-text {
    margin: 0; min-height: 44px;
    color: var(--ink);
    font-size: 14.5px; line-height: 1.5;
    text-wrap: pretty;
  }

     nothing to show. A caption and a note about captions must not look alike,
     and colour alone is not the difference. */
  .sv-pkgcap-note .sv-pkgcap-text {
    color: var(--muted); font-style: italic;
  }

  /* ---- the controls: one row, three zones, the bottom edge of the block ---- */
  .sv-pkgbar {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px;
    background: var(--paper);
    border-top: 1px solid var(--rule-soft);
    /* ⚠️ NOT IN THE DESIGN, AND ADDED WITH A NUMBER RATHER THAN BY TASTE. The
       design was drawn at a 556px pane; the reader's pane goes down to 320px,
       where this row is wider than the space it has. Wrapping changes nothing at
       any width where the row fits, and the alternative is horizontal overflow
       inside a fixed column. */
    flex-wrap: wrap;
  }

  /* Left zone: the speed, with the word EH asked for. */
  .sv-pkgbar-lab {
    display: inline-flex; align-items: center; gap: 6px; flex: none;
    cursor: pointer;
  }
  /* 🔴 A MICRO-CAPTION, WHICH IS A LABEL AND NOT A CONTROL. The design's type
     scale: mono, 9.5px, uppercase, tracked. It is the only place in this row
     where `text-transform` does the work, so the markup carries the word in
     ordinary sentence case and the rule shouts it -- which is what a screen
     reader should hear and a WCAG 2.5.3 voice user should be able to say. */
  .sv-pkgbar-cap {
    font-family: var(--mono); font-size: 9.5px; font-weight: 400;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted);
  }
  .sv-pkgbar-rate {
    color: var(--ink); background: var(--surface);
    border: 1px solid var(--rule); border-radius: 5px;
    padding: 6px 5px; cursor: pointer;
    font-family: var(--mono); font-size: 12.5px; font-weight: 600;
  }

  /* ⚠️ `.sv-pkgbar-info` AND `.sv-pkgbar-note` USED TO BE HERE: the two little
     `i` buttons EH asked for on 2026-09-05 morning and the note they opened. He
     took them away the same night, with the voice-only picker they sat beside
     (see ONE SPEED PER PLAYER, below the script's playback strings). Deleted
     rather than hidden, so a grep for either class finds this sentence and not
     a rule nobody draws. */

  /* 🔴 THE LOCKED LECTURE SPEED, and it reuses the seek buttons' own disabled
     treatment rather than inventing a second one: `.45` opacity and a
     not-allowed cursor. The reason is the file's existing rule -- a control that
     is dim for an unexplained reason is worse than one that is missing -- so the
     TITLE carries the explanation and the way out ("pause to change it"), which
     is EH's proof point that the lock must be *"deliberate and visible rather
     than a dead control"*.

     ⚠️ Contrast is NOT scored on a disabled control: WCAG 1.4.3 and 1.4.11 both
     exempt them, and this row's live text is scored elsewhere. Said here so
     nobody re-derives the exemption from the number and files it as a finding. */
  .sv-pkgbar-rate:disabled {
    opacity: .45; cursor: not-allowed;
  }

  /* Centre zone: four segments that read as ONE control.
     🔴 `margin: 0 auto` IS THE DESIGN'S, AND IT IS WORTH KNOWING WHAT IT DOES:
     auto margins on a flex item split the FREE space either side of it, so the
     pill is centred in what is left rather than in the row. It only lands on the
     row's true centre when the two zones flanking it are the same width. The
     design calls it "optically centred under the picture" and that is the
     honest description of the result. Measured, not assumed -- the number is in
     the queue entry. */
  .sv-pkgseek {
    display: inline-flex; align-items: stretch; margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--rule); border-radius: 999px;
    overflow: hidden;
  }
  .sv-pkgseek-b {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 8px 12px;
    background: none; border: 0; color: var(--ink); cursor: pointer;
    font-family: var(--mono); font-size: 12.5px; font-weight: 600;
  }
  .sv-pkgseek-b:hover:not(:disabled) { background: var(--paper); }
  /* Disabled means the lecture forbids seeking, or has not answered yet. The
     title carries the reason either way; a control dim for an unexplained
     reason is worse than one that is missing. */
  .sv-pkgseek-b:disabled { opacity: .45; cursor: not-allowed; }
  /* A hairline WITHIN a direction, so 15 and 5 read as two steps of one thing.
     Not on the first segment of each pair, which is what `+` gives. */
  .sv-pkgseek-b + .sv-pkgseek-b { border-left: 1px solid var(--rule-soft); }
  /* And the stronger divider BETWEEN the directions, so back and forward read
     as two groups without a gap opening in the pill. It is an element rather
     than a border because the two sides of it are buttons, and a border on
     either one would move with that button's own hover. */
  .sv-pkgseek-div {
    flex: none; width: 1px; background: var(--rule);
  }
  /* The direction is quiet and the number carries the weight: the design's
     rule, and the reason the chevrons are their own spans. */
  .sv-pkgseek-chev { font-size: 11px; color: var(--muted); }

  /* Right zone: captions.
     🔴 `CC`, AND THAT IS THE DESIGN OVERRULING EH'S OWN CHAT SENTENCE. He asked
     for the control to say "closed captions"; the handoff specifies `CC` and
     moves the clarity onto the caption line's accent marker instead. Built as
     specced, flagged in the queue entry, and going to him with a picture.

     🟢 THE PRESSED STATE IS THE READER'S EXISTING ONE, `--hl-d` on
     `--hl-d-line`, which is what `button.sv-matbtn[aria-pressed="true"]` already
     uses. It replaces a near-black fill that was, in the design's words, "the
     only black element in the whole reader". ⚠️ The border does the work and the
     fill supports it, so "which of these is on" does not depend on seeing a
     tint. */
  .sv-pkgbar-cc {
    flex: none;
    padding: 7px 11px; border-radius: 5px; cursor: pointer;
    color: var(--muted); background: var(--surface);
    border: 1px solid var(--rule);
    font-family: var(--body); font-size: 11.5px; font-weight: 600;
    letter-spacing: .06em;
  }
  .sv-pkgbar-cc[aria-pressed="true"] {
    color: var(--ink); background: var(--hl-d); border-color: var(--hl-d-line);
  }
  .sv-pkgbar-cc:hover { border-color: var(--hl-d-line); }

  /* The house rule for focus, from the design and from this file: the ring is
     `--hl-d-line` everywhere. `-2px` inside the pill, where the control is flush
     against a bordered container and a positive offset would be clipped by
     `overflow: hidden`. */
  .sv-pkgbar-rate:focus-visible,
  .sv-pkgbar-cc:focus-visible {
    outline: 2px solid var(--hl-d-line); outline-offset: 2px;
  }
  .sv-pkgseek-b:focus-visible {
    outline: 2px solid var(--hl-d-line); outline-offset: -2px;
  }

  /* 🔴 THE TOUCH BREAKPOINT, AS THE DESIGN WRITES IT, ON EH'S RULING OF
     2026-09-03: *"this whole confusion about the 44 pixels. Once again let's
     just go with what we have in the design. That can be our final answer."*

     The design says *"44px minimum height on the touch breakpoint, as the file's
     existing `@media (max-width: 700px)` rules do for every other control."*
     ⚠️ **THE FILE HAS NO SUCH RULE.** Its breakpoints are 899px and 640px; 700
     is the designer's number and nothing here inherits it. The number is theirs
     and it is kept.

     🔴 `(pointer: coarse)` WAS HERE AND WAS REMOVED BY THAT RULING, and the
     consequence is written down rather than left to be rediscovered as a bug:
     **every iPad is wider than 700px in portrait** (744 Mini, 810 iPad, 834
     Pro 11", 1024 Pro 12.9"), **so the touch rule no longer matches a tablet and
     the iPad gets the laptop row, roughly 29 to 33px instead of 44.**

     🟢 **THAT IS THE INTENDED RESULT, not an oversight.** He was told in one
     line, naming the iPad and naming the regression, BEFORE he answered "final
     answer", and he has now ruled on this height three times. ⚠️ **If the iPad
     buttons turn out to feel too small in use, that is this decision and not a
     defect, and the fix is this one clause going back in.**

     ⚠️ The package's OWN overlay (`#sv-pc`) still takes 44px everywhere. The
     design does not cover it, so his 09-02 ruling still stands there; "make them
     consistent" is how one of the two gets unpicked. */
  @media (max-width: 700px) {
    .sv-pkgseek-b, .sv-pkgbar-rate, .sv-pkgbar-cc { min-height: 44px; }
    .sv-pkgbar-lab { min-height: 44px; }
    /* The picture arrows are a control like any other and get the same height
       at the same breakpoint. ⚠️ They sit in an 11px caption row, so this is
       the one place in the file where the touch height is much taller than the
       text beside it; that is deliberate and is worth a look in the browser
       pass rather than being assumed fine. */
    .sv-region-b { min-height: 44px; min-width: 44px; }
  }


  /* ---- R8 and R9: the files attached to a lesson ----
     The list scrolls and the footer does not, so "Attach files" is in the same

    border: 1px solid var(--rule); border-radius: 5px; padding: 7px 13px; cursor: pointer;
  }
  .sv-descsave:hover:not(:disabled) { border-color: var(--hl-d-line); color: var(--hl-d-line); }

  .sv-fileadd {

    background: var(--surface); border-left: 1px solid var(--rule);
    display: flex; flex-direction: column; box-shadow: -8px 0 30px rgba(0,0,0,.18);
