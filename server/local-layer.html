    closePop();
    showFocus(sel.segments);
    openEditor(sel);
  });
  S.bar.appendChild(rewriteBtn);

  /* Double-click a word is the fastest path to "what is that", so it opens the
     lookup directly without going through the toolbar. */
  document.addEventListener('dblclick', function (e) {
    if (e.target.closest && (e.target.closest('.sv-pop') || e.target.closest('.hl-panel'))) return;
    /* The highlight layer records the selection from a setTimeout(0) on mouseup,
       which can land after this event. Wait a tick or the first double-click of
       a session silently does nothing. */
    window.setTimeout(function () {
      var sel = S.selection();
      if (!sel) return;
      var word = sel.text.trim();
      if (word.length < 3 || word.length > 60) return;
      S.hideBar();
      open(word, sel.context, sel.b, sel.rect, 'lookup', sel.segments);
    }, 16);
  });

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePop(); });
  document.addEventListener('mousedown', function (e) {
    if (pop.hidden) return;
    if (e.target.closest && (e.target.closest('.sv-pop') || e.target.closest('.hl-bar'))) return;
    closePop();
  });

  /* ---------- boot ---------- */

  loadSettings();

  api('/api/status').then(function (r) {
    caps.explain = !!(r.body && r.body.explain);
    caps.model = (r.body && r.body.model) || '';
    explBtn.disabled = !caps.explain;
    explBtn.title = caps.explain ? 'Ask Claude about this, using the local CLI' : 'Claude Code CLI not found';
    /* 🔴 Vault publishing is optional (plan 02 §10d item 1). Everything in this
       branch runs ONLY when the server says the vault is off, which is what
       makes it inert on a machine that has one: EH's status carries
       vaultEnabled true and nothing below happens. For everyone else the badge,
       its Settings row and the sync itself simply do not exist, rather than
       existing and failing. */
    /* 🔴 R50 changed this from "remove it" to "reflect it". The row has to stay,
       or there is nowhere to turn it back on. Only the badge comes and goes. */
    /* Before the enabled check, so the name is right even on a machine where
       publishing is off and the row is the only thing showing it. */
    if (r.body && r.body.vaultName) setVaultName(r.body.vaultName);
    var on = !(r.body && r.body.vaultEnabled === false);
    if (vaultBox) vaultBox.checked = on;
    applyVault(on);
    if (!on) return;
    /* Say it up front rather than letting every save fail one at a time. */
    if (r.body && r.body.vaultOk === false) {
      badgeSay('vault not found', true);
      badge.title = 'Expected it near ' + (r.body.vault || '') +
                    '. Fix vault_courses in ~/.kcl-study/config.json.';
    }
  }).catch(function () {
    badgeSay('server not reachable', true);
  });

  /* ---------- a cross-reference to a lesson that is not on this machine ----

     🔴 A lesson links to its siblings, and those links are content: much of what
     this module teaches is in the joins, which is why NOTE-SPEC keeps them as
     citations rather than deleting them. But a shared lesson travels alone.
     Import one part of a topic and every one of those links 404s on the
     recipient's machine (found by installing the kit on a clean account, plan
     02 §9).

     His rule for exactly this, from R49: "they should still have all the content
     and just show that those links are not valid." So the link stays, keeps its
     text, and says what is missing. It is not removed, because the fact that
     Part 2 exists and covers something is worth knowing even when you do not
     have Part 2.

     Client side, like the rest of R49's access work, and it never touches the
     lesson's TEXT: only an attribute and a class, so no highlight moves. */
  api('/api/lessons').then(function (r) {
    var have = (r.body && Array.isArray(r.body.files)) ? r.body.files : null;
    if (!have || !have.length) return;      /* say nothing rather than guess */
    var here = {};
    have.forEach(function (f) { here[f] = true; });

    var wrap = document.querySelector('.wrap');
    if (!wrap) return;
    var missing = 0;
    Array.prototype.forEach.call(wrap.querySelectorAll('a[href]'), function (a) {
      var href = a.getAttribute('href') || '';
      /* Only same-folder lesson links. An absolute URL, a mailto, a DOI and an
         in-page anchor are all somebody else's problem. */
      if (/^[a-z]+:/i.test(href) || href.charAt(0) === '#' || href.charAt(0) === '/') return;
      var file = href.split('#')[0].split('?')[0];
      if (!/\.html$/i.test(file) || here[file]) return;
      missing++;
      a.classList.add('sv-xref-gone');
      a.setAttribute('aria-disabled', 'true');
      a.setAttribute('title', 'This lesson is not on this machine. It is part of '
        + 'the same course, and whoever shared this one did not share it.');
    });
    if (!missing) return;

    /* One handler on the container rather than one per link. */
    wrap.addEventListener('click', function (ev) {
      var a = ev.target && ev.target.closest && ev.target.closest('a.sv-xref-gone');
      if (!a) return;
      ev.preventDefault();
      try {
        S.toast('That lesson is not on this machine. Ask whoever shared this one '
                + 'for "' + (a.textContent || '').trim().slice(0, 40) + '".');
      } catch (e) {}
    });
  }).catch(function () {});

  api('/api/annotations?doc=' + encodeURIComponent(S.docId)).then(function (r) {
    if (r.body && Array.isArray(r.body.items)) {
      adds.items = r.body.items;
      renderAdds();
    }
  }).catch(function () {});

  api('/api/chats?doc=' + encodeURIComponent(S.docId)).then(function (r) {
    if (r.body && Array.isArray(r.body.chats)) {
      chats = r.body.chats;
      if (chats.length) {
        chatFab.textContent = 'Chat ' + chats.length;
      }
    }
  }).catch(function () {});

  /* Restore before anything else can overwrite the file: if this browser has
     nothing and disk does, disk wins. Otherwise mirror what is here. */
  restoreFromDisk(false).then(function (restored) {
    if (!restored) {
      var m = S.marks();
      if (m.items.length || m.notes.length) pushMarks();
    }
  });

  /* A deliberate pull, for the case the automatic rule declines: two browsers,
     or marks made here that he wants to throw away. */
  var restoreBtn = document.createElement('button');
  restoreBtn.type = 'button';
  restoreBtn.textContent = 'Restore from disk';
  restoreBtn.addEventListener('click', function () {
    var m = S.marks();
    if ((m.items.length || m.notes.length) &&
        !window.confirm('Replace the ' + m.items.length + ' highlights and ' + m.notes.length +
                        ' notes on this page with the copy saved on disk?')) return;
    restoreFromDisk(true).then(function (ok) {
      if (!ok) S.toast('Nothing saved on disk for this lesson yet.');
    });
  });
  /* ---------- R40: the notes footer empties into Settings ----------

     Asked 2026-08-16: "we have all these buttons in the notes section at the
     bottom… They seem excessive. If anything, all that functionality should
     probably go into the settings section… I'm not even sure if we need all of
     it in general."

     🔴 The elements are MOVED, not copied. Every one of these except Restore is
     the lesson's own button with the lesson's own listener bound to it, so a
     rebuilt copy here would mean a second implementation of export, import and
     the clear-all confirmation. appendChild moves a node that already has a
     parent, and a listener travels with the node, so the behaviour is
     identical by construction rather than by being kept in step.

     One is dropped rather than moved: "For The Box" copied a markdown blob to
     the clipboard for him to paste into the vault by hand, in the old
     one-note-per-WEEK shape. The layer has published to the vault
     automatically since the badge was built, 1.3s after any change, into the
     per-topic note. So the button was not merely redundant, it produced the
     superseded format. Hidden rather than removed: its listener is bound at
     lesson load and #hlVault is queried there, so the node stays. */

  /* ---------- R41: Clear all, behind a word ----------

     Asked 2026-08-16: "it needs to be behind some kind of guard. There has to
     be a pop-up that asks for confirmation, and maybe I have to type something
     that says 'Type Clear to confirm' so it's not done by mistake."

     🔴 This is the one control R40 does NOT move, and the reason is that its
     guard cannot be added from outside. `window.confirm` takes no input, so the
     lesson's own handler can only ever ask a yes/no question; and wrapping that
     handler would have produced two dialogs in a row, this one and then its
     own. So the lesson's button is hidden the way "For The Box" is, and this
     replaces it.

     The clearing itself still goes through the lesson: `S.replaceMarks` is the
     surface it exposes for exactly this, the same one Import and Restore use,
     and it re-renders the panel and the text and calls save(), so the push to
     disk and the push to the vault both follow from it as usual. Nothing here
     reimplements what a wipe means. */

  function makeWipeButton() {
    var WORD = 'Clear';

    var scrim = document.createElement('div');
    scrim.className = 'sv-scrim sv-wipescrim';
    scrim.hidden = true;
    document.body.appendChild(scrim);

    var box = document.createElement('div');
    box.className = 'sv-wipe';
    box.hidden = true;
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-modal', 'true');
    box.setAttribute('aria-labelledby', 'svWipeTitle');
    box.innerHTML =
      '<strong id="svWipeTitle">Clear every highlight in this lesson?</strong>' +
      '<p data-what></p>' +
      '<p class="keep">The copy this replaces is kept on disk beside the lesson, so it is ' +
        'recoverable, but not from in here.</p>' +
      '<label class="lab" for="svWipeWord">Type <b>' + WORD + '</b> to confirm</label>' +
      '<input type="text" id="svWipeWord" autocomplete="off" autocapitalize="off" ' +
        'autocorrect="off" spellcheck="false" placeholder="' + WORD + '">' +
      '<footer>' +
        '<button type="button" class="act" data-cancel>Cancel</button>' +
        '<button type="button" class="act go" data-go disabled>Clear all</button>' +
      '</footer>';
    document.body.appendChild(box);

    var what   = box.querySelector('[data-what]');
    var word   = box.querySelector('#svWipeWord');
    var go     = box.querySelector('[data-go]');
    var cancel = box.querySelector('[data-cancel]');
    var returnTo = null;

    function count(m) {
      var i = m.items.length, n = m.notes.length;
      var s = i + ' highlight' + (i === 1 ? '' : 's');
      if (n) s += ' and ' + n + ' note' + (n === 1 ? '' : 's');
      return s;
    }

    function shut() {
      box.hidden = true;
      scrim.hidden = true;
      word.value = '';
      go.disabled = true;
      document.removeEventListener('keydown', onKey, true);
      if (returnTo && returnTo.focus) { try { returnTo.focus(); } catch (e) {} }
      returnTo = null;
    }

    /* Capturing, so Escape closes this rather than the sheet behind it. */
    function onKey(e) {
      if (e.key === 'Escape') { e.stopPropagation(); shut(); }
    }

    /* Case-insensitive after trimming: typing it in lower case is every bit as
       deliberate as typing it capitalised, and a gate that rejects "clear" is
       teaching a lesson about capital letters rather than about wiping data. */
    word.addEventListener('input', function () {
      go.disabled = word.value.trim().toLowerCase() !== WORD.toLowerCase();
    });
    word.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !go.disabled) { e.preventDefault(); go.click(); }
    });
    cancel.addEventListener('click', shut);
    scrim.addEventListener('click', shut);

    go.addEventListener('click', function () {
      if (go.disabled) return;
      var was = count(S.marks());
      S.replaceMarks([], []);
      shut();
      S.toast('Cleared ' + was + '.');
    });

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'sv-danger';
    btn.textContent = 'Clear all';
    btn.addEventListener('click', function () {
      var m = S.marks();
      /* Nothing to lose, so no gate: a dialog that guards an empty lesson is
         only teaching him to click through it. */
      if (!m.items.length && !m.notes.length) {
        return S.toast('Nothing to clear in this lesson.');
      }
      what.textContent = count(m) + ' will be removed from this lesson, and from the ' +
                         'copy saved on disk.';
      returnTo = document.activeElement;
      scrim.hidden = false;
      box.hidden = false;
      document.addEventListener('keydown', onKey, true);
      window.setTimeout(function () { word.focus(); }, 0);
    });
    return btn;
  }

  (function emptyTheNotesFooter() {
    var footer = document.querySelector('.hl-panel footer');
    var slot = document.querySelector('.sv-set [data-marksslot]');

    /* No Settings sheet reachable for some reason: put the button back where it
       used to live rather than losing the only manual pull from disk. */
    if (!slot) {
      if (footer) footer.insertBefore(restoreBtn, footer.firstChild);
      return;
    }

    /* Two rows of two, then the destructive one alone. The pairs are the two
       directions rather than an arbitrary order: Export and Copy take the
       marks out, Restore and Import bring marks in. Five in a two-column grid
       would leave a hole beside whichever one came last, which is how this was
       first built and it read as a mistake. */
    ['hlExport', 'hlCopy'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) slot.appendChild(el);
    });

    slot.appendChild(restoreBtn);

    /* Import is a <label> wrapping a hidden <input type=file>, so the label is
       the node to move; taking the input alone would leave the click target
       behind in a hidden footer. */
    var imp = document.getElementById('hlImport');
    var impLabel = imp && imp.closest ? imp.closest('label') : null;
    if (impLabel) slot.appendChild(impLabel);

    var vault = document.getElementById('hlVault');
    if (vault) vault.hidden = true;

    /* R41: hidden, not moved. See makeWipeButton above for why this one cannot
       be carried across the way the other four are. */
    var clear = document.getElementById('hlClear');
    if (clear) clear.hidden = true;

    var last = document.createElement('div');
    last.className = 'sv-marks-danger';
    last.appendChild(makeWipeButton());
    slot.appendChild(last);

    /* Emptied, so it would collapse to its own padding and a border. */
    if (footer) footer.hidden = true;
  }());


  /* ---------- R18 item 3: the header, and the hamburger ----------

     Asked 2026-08-13: "Maybe we need a header at the top and a hamburger menu
     to access some of that stuff."

     🔴 Last in the file on purpose. Every control this drives is created
     further up (gear at the settings block, matFab at materials, chatFab and
     panel at chat, hlFab in the LESSON), and `var` hoisting would hand this an
     undefined `gear` if it ran any earlier. Nothing below depends on it.

     🔴 The header is appended to <body> and never into .wrap. Marks anchor to
     the index of a block inside .wrap, so a block-level tag added in there
     renumbers every block and moves every highlight in the lesson. The lesson's
     own SEL is scoped to .wrap, which makes that structural rather than lucky,
     and it was measured as well: 181 blocks on W3-T3-P3 with the header in the
     DOM and 181 with it pulled out, and its six highlights still land on blocks
     40, 46, 64, 80, 103 and 109 with the text they were made against.

     Materials, Chat, Notes and Settings all end up going through the same four
     original handlers, so the header adds no second copy of any behaviour: the
     panels, their aria-expanded, the notes count and the settings sheet are all
     still owned by whoever owned them before. */

  (function installHead() {
    if (!document.body) return;

    /* Week 3 · Topic 3 · Part 3, from W3-T3-P3. A part number is not always
       there: W5 T3 has none, and its file carries P1 only because every tool in
       this project keys on the W#-T#-P# shape. */
    function readableKey(id) {
      var m = /^W(\d+)-T(\d+)(?:-P(\d+))?$/.exec(String(id || ''));
      if (!m) return '';
      var out = 'Week ' + m[1] + ' · Topic ' + m[2];
      if (m[3]) out += ' · Part ' + m[3];
      return out;
    }

    /* The way up is the same path everywhere now (plans/06, EH approved
       2026-08-23): Courses > this course, each segment a link. A single-module
       install has no /m/<code>/ in its URL and keeps the old single link. */
    var crumbHtml = '<a class="sv-headhome" href="index.html">Lessons</a>';
    var mm = /^\/m\/([^/]+)\//.exec(location.pathname);
    if (mm) {
      crumbHtml =
        '<span class="sv-headcrumbs">' +
          '<a class="sv-headhome" href="/">Courses</a>' +
          '<span class="sv-crumbsep" aria-hidden="true">\u203a</span>' +
          '<a class="sv-headhome" href="index.html">' + mm[1] + '</a>' +
        '</span>';
    }

    var head = document.createElement('div');
    head.className = 'sv-head';
    head.innerHTML =
      crumbHtml +
      '<span class="sv-headkey"></span>' +
      '<nav class="sv-headnav" aria-label="This lesson\'s tools">' +
        '<button type="button" data-head="mat" aria-expanded="false">Materials</button>' +
        '<button type="button" data-head="chat" aria-expanded="false">Chat</button>' +
        '<button type="button" data-head="notes" aria-expanded="false">Notebook</button>' +
        '<button type="button" class="sv-setbtn" data-head="set" aria-expanded="false">' +
          'Settings</button>' +
      '</nav>' +
      '<button type="button" class="sv-burger" aria-expanded="false" aria-controls="svMenu">' +
        '<span class="sv-bars" aria-hidden="true"></span>Menu</button>';
    head.querySelector('.sv-headkey').textContent = readableKey(S.docId);

    var menu = document.createElement('div');
    menu.className = 'sv-menu';
    menu.id = 'svMenu';
    menu.hidden = true;
    menu.innerHTML =
      '<button type="button" data-head="mat" aria-expanded="false">Materials</button>' +
      '<button type="button" data-head="chat" aria-expanded="false">Chat</button>' +
      '<button type="button" data-head="notes" aria-expanded="false">Notebook</button>' +
      '<button type="button" class="sv-setbtn" data-head="set" aria-expanded="false">' +
        'Settings</button>';

    document.body.appendChild(head);
    document.body.appendChild(menu);

    var burger = head.querySelector('.sv-burger');

    function closeMenu() {
      menu.hidden = true;
      burger.setAttribute('aria-expanded', 'false');
    }

    /* Every one of these toggles, because that is what the pill it replaces did
       and what its own aria-expanded claims. The two panel ones also SWITCH:
       pressing Notes while chat is open swaps, rather than leaving one open
       behind the other, which is the same rule R6's tab strip follows. */
    var act = {
      mat:  function () { matFab.click(); },
      chat: function () {
        if (!panel.hidden) { closePanel(); paintTabs(); return; }
        showChat();
      },
      notes: function () {
        if (hlPanel && !hlPanel.hidden && hlFab) { hlFab.click(); paintTabs(); return; }
        showNotes();
      },
      set: function () { gear.click(); }
    };

    Array.prototype.forEach.call(
      document.querySelectorAll('.sv-headnav [data-head], .sv-menu [data-head]'),
      function (b) {
        b.addEventListener('click', function () {
          var which = b.getAttribute('data-head');
          /* Settings is excluded from the sheet's own outside-click close by
             .sv-setbtn, so closing the menu around it has to happen first or
             the sheet opens underneath a menu that is still covering it. */
          closeMenu();
          act[which]();
          paintHead();
        });
      }
    );

    burger.addEventListener('click', function () {
      var open = menu.hidden;
      menu.hidden = !open;
      burger.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (open) paintHead();
    });

    document.addEventListener('mousedown', function (e) {
      if (menu.hidden) return;
      if (e.target.closest && (e.target.closest('.sv-menu') ||
                               e.target.closest('.sv-burger'))) return;
      closeMenu();
    });

    /* Reflects state it does not own, so it reads the originals rather than
       remembering what it was last told: .hidden on each panel, and the count
       the LESSON keeps on its own button. Anything that opens or closes a panel
       by any other route (its own Close, Escape, the tab strip) therefore still
       leaves the header telling the truth. */
    function paintHead() {
      var st = {
        mat:   !matPanel.hidden,
        chat:  !panel.hidden,
        notes: !!(hlPanel && !hlPanel.hidden),
        set:   !setBox.hidden
      };
      Array.prototype.forEach.call(
        document.querySelectorAll('.sv-headnav [data-head], .sv-menu [data-head]'),
        function (b) {
          b.setAttribute('aria-expanded', st[b.getAttribute('data-head')] ? 'true' : 'false');
        }
      );
      /* The row can come back without anything being clicked, because the
         container query answers to the header's width and an open panel takes
         440px of it. Closing the panel widens the header, the row reappears,
         and a menu left open would then be a second copy of it hanging below. */
      if (menu.hidden) return;
      if (getComputedStyle(burger).display === 'none') closeMenu();
    }
    window.addEventListener('resize', paintHead);

    if (window.MutationObserver) {
      var watch = new MutationObserver(paintHead);
      [matPanel, panel, setBox].forEach(function (p) {
        watch.observe(p, { attributes: true, attributeFilter: ['hidden'] });
      });
      if (hlPanel) watch.observe(hlPanel, { attributes: true, attributeFilter: ['hidden'] });
      /* #hlFabN was watched here to keep the button's number fresh. R22
         removed the number; what is left reflects only which panel is open. */
    }
    paintHead();

    /* Only now are the pills hidden, so a throw anywhere above leaves the
       reader exactly as it was rather than with no controls at all. */
    document.documentElement.classList.add('sv-head-on');

    /* ---------- R18 item 4: getting back out of a full-screen panel ----------

       Below 900px a panel covers the whole screen, so the usual way out of an
       overlay (click the page behind it) does not exist. The lesson already
       closes its own notes panel on Escape; the two panels this layer owns did
       not, and that gap only became visible once they filled the screen.

       Guarded on the active element rather than on the event target, because
       the chat and ask boxes deliberately swallow the first Escape to blur
       themselves: a second one then closes the panel. */
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      var a = document.activeElement;
      if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
      if (!menu.hidden) { closeMenu(); return; }
      if (!matPanel.hidden) { closeMaterials(); return; }
      if (!panel.hidden) { closePanel(); paintTabs(); }
    });
  }());

  /* ---------- the selection toolbar must not land under the header ----------

     The lesson positions its own toolbar above the selection, and flips it below
     when there is no room. "No room" is measured against the top of the SCROLL,
     which was right when it was written and stopped being right the day R18 put
     a 52px header over the top of the page. A selection whose top edge sits
     roughly 55 to 95px down the viewport puts the toolbar underneath it.

     🔴 This has always been true on the desktop, in a band about 40px wide, and
     it was hidden on a phone only because R29 moved the toolbar to the bottom of
     the screen. Splitting that at 640px on 2026-08-15 gave the band back to
     tablets, which is what made it worth fixing properly rather than papering
     over.

     Corrected after the fact rather than by replacing the lesson's arithmetic:
     this listener is added later than the lesson's own, so it runs second on the
     same event, reads where the bar ended up and pushes it down if it is under
     the header. Nothing here knows how the position was chosen, which is what
     keeps it working if that ever changes. */
  (function () {
    var bar = document.querySelector('.hl-bar');
    if (!bar) return;

    function nudge() {
      if (bar.hidden) return;
      /* The sheet form is fixed to the bottom and owns its own position. */
      if (window.getComputedStyle(bar).position !== 'absolute') return;
      var head = document.querySelector('.sv-head');
      var floor = (head && !head.hidden ? head.getBoundingClientRect().bottom : 0) + 6;
      if (floor <= 6) return;
      var box = bar.getBoundingClientRect();
      if (box.top >= floor) return;
      /* Inline top is in page coordinates, so the correction is too. */
      var top = parseFloat(bar.style.top || '0') + (floor - box.top);
      bar.style.top = top + 'px';
    }

    document.addEventListener('mouseup', function () { window.setTimeout(nudge, 0); });
    document.addEventListener('selectionchange', function () { window.setTimeout(nudge, 0); });
  }());

  /* ---------- R29: prompts that stop describing a keyboard nobody has -------

     Three boxes carry a placeholder that explains the keys: "Ask about this.
     Enter sends, Shift+Enter for a new line." On a desktop that is the one
     place the shortcut can be learned. On a phone it is worse than useless: the
     advice does not apply, there is no Shift, and the sentence is long enough
     that a one-row box clips it mid-word, which reads as a broken control
     rather than as a hint that ran on.

     Driven by a media query listener rather than read once, so rotating the
     phone or opening the reader on a resized desktop window puts the right one
     back. The long form is kept as the source of truth on the element, so this
     never has to know what the wording is. */
  (function () {
    var SHORT = {
      'Ask about this. Enter sends, Shift+Enter for a new line.': 'Ask about this.',
      'Ask anything about this lesson. Enter sends, Shift+Enter for a new line.':
        'Ask anything about this lesson.',
      'too vague about the mechanism, and it mentions a lecturer':
        'what to change'
    };
    var boxes = [];
    Array.prototype.forEach.call(
      document.querySelectorAll('.sv-pop textarea, .sv-panel textarea, #svEdAsk'),
      function (el) {
        var full = el.getAttribute('placeholder') || '';
        if (SHORT[full]) boxes.push({ el: el, full: full, short: SHORT[full] });
      });
    if (!boxes.length || !window.matchMedia) return;

    var mq = window.matchMedia('(max-width: 899px)');
    function paint() {
      boxes.forEach(function (b) {
        b.el.setAttribute('placeholder', mq.matches ? b.short : b.full);
      });
    }
    if (mq.addEventListener) mq.addEventListener('change', paint);
    else if (mq.addListener) mq.addListener(paint);
    paint();
  }());
})();
</script>
