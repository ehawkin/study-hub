    matPanel.addEventListener('dragleave', function () {
      depth = Math.max(0, depth - 1);
      if (!depth) matPanel.classList.remove('sv-dropping');
    });
    matPanel.addEventListener('drop', function (e) {
      if (!hasFiles(e)) return;
      e.preventDefault();
      depth = 0;
      matPanel.classList.remove('sv-dropping');
      matView = 'files';
      matFileShown = null;
      addFiles(Array.prototype.slice.call(e.dataTransfer.files || []));
    });
  }());

  /* Kaltura publishes two flavours of each lecture, 640x360 and 854x480, and the
     URL the server derives resolves to the smaller one. This reads the HLS
     manifest, which lists both with their bitrates, and swaps the player over to
     the better one. The variant it names is an HLS playlist; the same path under
     /pd/ is the progressive MP4 beside it, which is the file a plain <video> can
     take. Verified against three entries before it was written.

     Everything here is best effort by design. It is one fetch on a network that
     may be slow, and a 360p lecture that plays beats a 480p one that hangs, so a
     failure, a timeout or an unrecognised manifest all simply leave the player
     alone. It also stands down the moment he presses play, because replacing the
     src would restart the video under him. */
  function upgradeFlavour(vid, hls, current) {
    if (!vid || !hls || !window.fetch) return;
    var spent = false;
    var giveUp = setTimeout(function () { spent = true; }, 4000);
    fetch(hls).then(function (r) {
      return r.ok ? r.text() : '';
    }).then(function (txt) {
      clearTimeout(giveUp);
      if (spent || !txt || !vid.isConnected) return;
      if (vid.currentTime > 0 || !vid.paused) return;   /* he has started it */
      var lines = txt.split('\n'), bestBw = -1, best = null;
      for (var i = 0; i < lines.length; i++) {
        var bw = /BANDWIDTH=(\d+)/.exec(lines[i]);
        if (!bw) continue;
        var next = (lines[i + 1] || '').trim();
        if (next.indexOf('http') !== 0) continue;
        if (parseInt(bw[1], 10) > bestBw) { bestBw = parseInt(bw[1], 10); best = next; }
      }
      if (!best) return;
      var mp4 = best.split('?')[0].replace('/scf/hlsr/p/', '/pd/p/').replace(/\/index\.m3u8$/, '');
      if (mp4 === best || mp4 === current) return;      /* nothing was rewritten */
      matShownSrc = mp4;
      vid.src = mp4;
    })['catch'](function () { clearTimeout(giveUp); });
  }

  matBar.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-view]');
    if (!b) return;
    matView = b.getAttribute('data-view');
    renderMaterials();
  });

  function openMaterials() {
    /* All three dock to the same edge, so opening one closes the others rather
       than stacking them invisibly on top of each other.

       🔴 R21 changed HOW they are closed, and the old way was wrong twice.
       It set .hidden on each panel directly: on the chat panel that skipped
       clearFocus(), leaving R4's focus rectangles drawn over a lesson that had
       just reflowed under them, and on the notes panel it skipped the lesson's
       own handler, leaving the lesson believing its panel was open while it was
       shut. Both now go through the routes that own them.

       hlPanel and hlFab are declared further down the file and are undefined
       while this function is being DEFINED. They are assigned long before it can
       be CALLED, since nothing reaches this except a click. */
    if (!panel.hidden) closePanel();
    if (hlPanel && !hlPanel.hidden && hlFab) { hlFab.click(); }

    matPanel.hidden = false;
    matFab.setAttribute('aria-expanded', 'true');
    /* Both, because the Files tab carries a count and the count has to be right
       the first time the bar is drawn rather than a moment later. Refetched on
       every open rather than cached for the session: he can put a file in the
       folder from Finder while this tab is sitting open, and the directory being
       the record is worth nothing if the reader does not go back and look. */
    Promise.all([loadMaterials(), loadFiles(true)]).then(renderMaterials);
  }
  function closeMaterials() {
    matPanel.hidden = true;
    matFab.setAttribute('aria-expanded', 'false');
  }
  matFab.addEventListener('click', function () {
    if (matPanel.hidden) openMaterials(); else closeMaterials();
  });
  matPanel.querySelector('[data-close]').addEventListener('click', closeMaterials);

  /* ---------- back and forward through the module ----------

     Asked 2026-08-13: "I want to be able to navigate without going out into the
     index... a back and forward button, probably at the very top or at the very
     bottom of the page." Both, because the two are wanted at different moments:
     the top pair for changing your mind on arrival, the bottom pair for having
     finished and carrying on.

     🔴 The markup here must contain NO block-level tag. Marks anchor to the
     index of a block inside .wrap, where a block is p, li, h1 to h4, dd, dt,
     figcaption, blockquote, td or th. A single <p> in this bar would renumber
     every block after it and silently move every highlight on the page. nav, a
     and span are invisible to that count. */

  function navBar(where) {
    var nav = document.createElement('nav');
    nav.className = 'sv-nav sv-nav-' + where;
    nav.setAttribute('aria-label', 'Lessons either side of this one');
    return nav;
  }

  function fillNav(nav, data) {
    var side = function (rel, arrow, klass) {
      if (!data[rel]) {
        return '<span class="sv-navend">' +
               (rel === 'prev' ? 'First lesson in the module' : 'Last lesson in the module') +
               '</span>';
      }
      return '<a class="sv-navbtn ' + klass + '" href="' + data[rel].href + '">' +
             '<span class="sv-navdir">' + arrow + '</span>' +
             '<span class="sv-navttl">' + data[rel].title + '</span></a>';
    };
    nav.innerHTML = side('prev', '‹', 'back') + side('next', '›', 'fwd');
  }

  (function installNav() {
    var wrap = document.querySelector('.wrap');
    if (!wrap) return;
    var top = navBar('top'), bottom = navBar('bottom');
    top.hidden = bottom.hidden = true;
    wrap.insertBefore(top, wrap.firstChild);
    wrap.appendChild(bottom);
    loadMaterials().then(function (d) {
      if (!d || d.ok === false || (!d.prev && !d.next)) return;
      fillNav(top, d);
      fillNav(bottom, d);
      top.hidden = bottom.hidden = false;
    });
  }());

  /* ---------- tables that scroll sideways say so ----------

     See the .tblwrap rules above for why this adds no container: every table
     in the module is already inside one that already scrolls. This marks the
     ones that are actually overflowing right now, which is not a fixed set:
     the same table scrolls or does not depending on the window width and on
     whether a panel is open and has narrowed the column. So it is recomputed
     rather than decided once at load. */

  var tblwraps = [];

  /* Which edges have something behind them, so only those get faded. */
  function markEdges(w) {
    w.classList.toggle('sv-atstart', w.scrollLeft <= 1);
    w.classList.toggle('sv-atend', w.scrollLeft + w.clientWidth >= w.scrollWidth - 1);
  }

  function updateTableScroll() {
    for (var i = 0; i < tblwraps.length; i++) {
      var w = tblwraps[i];
      /* A pixel of tolerance: sub-pixel column widths can leave scrollWidth a
         fraction above clientWidth on a table that visibly fits. */
      var over = w.scrollWidth - w.clientWidth > 1;
      var fig = w.classList.contains('figbox');
      w.classList.toggle('sv-canscroll', over);

      /* 🔴 The stop is PERMANENT, and only the label changes. It used to be
         added and removed with the overflow, so that a table which fitted was
         not a stop on the way down the page. EH was asked on 2026-08-15
         whether he ever reads without the trackpad and said sometimes, which
         settles it: what a keyboard reader cannot live with is the Tab order
         moving under them, and the old version moved it on every resize and
         every time the pane opened. The cost is about eight extra stops in a
         typical lesson and eleven in the worst, which is a price worth paying
         for an order that holds still.

         The label still tells the truth about right now, so a table that fits
         announces itself as a table rather than as one that scrolls. */
      w.setAttribute('tabindex', '0');
      w.setAttribute('role', 'region');
      w.setAttribute('aria-label',
        (fig ? 'Diagram' : 'Table') + (over ? ', scrolls sideways' : ''));

      if (over) {
        markEdges(w);
      } else {
        w.classList.remove('sv-atstart');
        w.classList.remove('sv-atend');
      }
    }
  }

  /* R29: the 48 diagrams get the same treatment as the 124 tables. `.figbox`
     already carries overflow-x:auto in every lesson, so like the tables this
     adds the affordance and never the scrolling. One list, because the two
     behave identically once they overflow; only the aria-label differs. */
  (function installTableScroll() {
    tblwraps = Array.prototype.slice.call(
      document.querySelectorAll('.wrap .tblwrap, .wrap .figbox'));
    if (!tblwraps.length) return;
    tblwraps.forEach(function (w) {
      w.addEventListener('scroll', function () { markEdges(w); }, { passive: true });
    });
    window.addEventListener('resize', updateTableScroll);
    updateTableScroll();
  }());


  /* ---------- a written note reads as text until you ask to edit it ----------

     R2, asked 2026-08-13: "I kind of like the idea of having save and edit
     buttons so that the note edit boxes don't stay open at all times, so they
     don't get edited by mistake."

     renderNotes() lives inside each of the 29 lesson files, in a closure, so
     it can be neither called nor replaced from here. So this does what the
     palette does: it lets the lesson render, and then decorates the result.

     🔴 The textarea is hidden, never removed. Everything that makes a note
     save is attached to that element by the lesson: hiding it keeps the
     listener, the value and the autosave, and means nothing in this file ever
     writes to the note's text. The read view is a sibling that mirrors it.

     He asked a question inside the request and was told autosave stays, on a
     debounce, as the crash net, with the button as the thing that closes the
     box. Both are true here: Save closes the editor, it does not perform the
     save, because the save already happened on the keystroke. */

  function svNoteMode(wrap, editing) {
    var ta   = wrap.querySelector('textarea');
    var view = wrap.querySelector('.sv-noteview');
    var btn  = wrap.querySelector('.sv-editnote');
    if (!ta || !view || !btn) return;
    if (!editing) {
      /* Mirror the text across at the moment of closing, so the view shows what
         was actually typed rather than what was there when it was drawn. */
      view.textContent = ta.value.trim() ? ta.value : 'Empty note';
      view.classList.toggle('blank', !ta.value.trim());
    }
    ta.hidden = !editing;
    view.hidden = editing;
    btn.textContent = editing ? 'Save' : 'Edit';
    btn.setAttribute('aria-label', editing ? 'Save this note and close the editor'
                                           : 'Edit this note');
    if (editing) { try { ta.focus(); } catch (e) {} }
  }

  function decorateNotes(box) {
    Array.prototype.forEach.call(box.querySelectorAll('.hl-note'), function (wrap) {
      var ta = wrap.querySelector('textarea');
      if (!ta || ta.dataset.svWrapped === '1') return;
      ta.dataset.svWrapped = '1';

      var view = document.createElement('div');
      view.className = 'sv-noteview';
      wrap.insertBefore(view, ta);

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'mini sv-editnote';
      btn.addEventListener('click', function () { svNoteMode(wrap, ta.hidden); });

      /* Before Remove, so the destructive control stays last. */
      var row = wrap.querySelector('.row');
      var del = row && row.querySelector('.mini');
      if (row) { row.insertBefore(btn, del || null); }

      /* 🔴 A brand new note opens ready to type, and this is load-bearing
         rather than a nicety: addNote() focuses the first textarea it finds
         immediately after rendering, and this callback runs after that. Opening
         an empty note closed would hide the element that just took focus. */
      svNoteMode(wrap, !ta.value.trim());
    });
  }

  /* ---------- R37: a highlight carries several notes, each saved or removed ----------

     Asked 2026-08-15: "the Add Note to a Highlight function should work
     similarly to the regular Add Note function in that it shouldn't keep an
     open text window forever. I should be able to save it or remove it and add
     additional notes if I want, and edit existing ones"

     Same shape as R2 above and for the same reason: renderPanel() is inside
     each lesson's closure, so the lesson renders and this decorates the result.

     🔴 The data, which is the part that is not just a surface. A highlight has
     always carried ONE note, `it.n`, a string. Several notes live in `it.ns`,
     and `it.n` is kept as their joined text, so everything that already reads
     it keeps working with no change at all: the `noted` class on the mark, the
     Copy export, the outline export, and the vault publication, which the
     lesson builds from that same field. Nothing is migrated destructively and
     `n` is never deleted, so a lesson opened with an older layer still shows
     the writing. */

  var SV_NOTE_GAP = '\n\n';

  function svNotes(it) {
    if (!Array.isArray(it.ns)) {
      it.ns = (it.n || '').trim() ? [{ id: 1, t: it.n }] : [];
    }
    return it.ns;
  }

  /* Write `n` from `ns`, repaint the mark, and save. Not replaceMarks: that
     rebuilds the panel, which would pull the focus out of the box being typed
     into on every debounced autosave. */
  function svSyncNotes(it) {
    it.n = svNotes(it).map(function (n) { return (n.t || '').trim(); })
                      .filter(Boolean).join(SV_NOTE_GAP);
    Array.prototype.forEach.call(
      document.querySelectorAll('mark.hl[data-id="' + it.id + '"]'),
      function (m) { m.classList.toggle('noted', !!it.n); });
    if (S.persist) S.persist();
  }

  function svItemFor(id) {
    var found = null;
    S.marks().items.forEach(function (it) { if (String(it.id) === String(id)) found = it; });
    return found;
  }

  function svNoteRow(it, note, editing) {
    var row = document.createElement('div');
    row.className = 'sv-inote';

    var view = document.createElement('div');
    view.className = 'sv-noteview';
    var ta = document.createElement('textarea');
    ta.value = note.t || '';
    ta.placeholder = 'What this passage made you think';

    var bar = document.createElement('div');
    bar.className = 'sv-irow';
    var edit = document.createElement('button');
    edit.type = 'button';
    edit.className = 'mini sv-editnote';
    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'mini';
    del.textContent = 'Remove note';

    function paint(open) {
      if (!open) {
        view.textContent = (ta.value.trim() || 'Empty note');
        view.classList.toggle('blank', !ta.value.trim());
      }
      ta.hidden = !open;
      view.hidden = open;
      edit.textContent = open ? 'Save' : 'Edit';
      edit.setAttribute('aria-label', open ? 'Save this note and close the box' : 'Edit this note');
      if (open) { try { ta.focus(); } catch (e) {} }
    }

    /* The button closes the box; it does not perform the save, because the save
       has already happened. Same answer R2 got: autosave stays as the crash
       net, on a debounce, and the button is what stops the box being open by
       default. */
    var timer = 0;
    ta.addEventListener('input', function () {
      note.t = ta.value;
      window.clearTimeout(timer);
      timer = window.setTimeout(function () { svSyncNotes(it); }, 600);
    });
    ta.addEventListener('blur', function () {
      window.clearTimeout(timer);
      note.t = ta.value;
      svSyncNotes(it);
    });

    edit.addEventListener('click', function () {
      var open = ta.hidden;
      if (open) {
        /* Opening: remember what was there, so a select-all typed over by
           mistake has a way back when the empty save asks. */
        row._was = ta.value;
      }
      if (!open) {
        /* Closing empty. Until 2026-08-22 this deleted the note silently; the
           only silent delete in the reader, and EH overruled it: ask, and
           let Keep bring the words back. */
        note.t = ta.value;
        if (!ta.value.trim()) {
          svAskDelete(bar, edit, del, function () {
            svRemoveNote(it, note, row);
          }, function () {
            var was = (row._was || '');
            if (was.trim()) { ta.value = was; note.t = was; }
            paint(false);
            svSyncNotes(it);
          });
          return;
        }
      }
      paint(open);
      if (!open) svSyncNotes(it);
    });

    del.addEventListener('click', function () {
      svAskDelete(bar, edit, del, function () { svRemoveNote(it, note, row); });
    });

    bar.appendChild(edit);
    bar.appendChild(del);
    row.appendChild(view);
    row.appendChild(ta);
    row.appendChild(bar);
    paint(!!editing);
    return row;
  }

  /* EH, 2026-08-22: nothing may delete a note without asking. Both routes
     (the Remove button, and saving a note emptied by mistake) come through
     this: the row's buttons give way to a one-line question until answered. */
  function svAskDelete(bar, edit, del, onDelete, onKeep) {
    var ask = document.createElement('span');
    ask.className = 'sv-noteask';
    var q = document.createElement('span');
    q.textContent = 'Delete this note?';
    var yes = document.createElement('button');
    yes.type = 'button'; yes.className = 'mini danger'; yes.textContent = 'Delete';
    var no = document.createElement('button');
    no.type = 'button'; no.className = 'mini'; no.textContent = 'Keep it';
    ask.appendChild(q); ask.appendChild(yes); ask.appendChild(no);
    edit.hidden = true; del.hidden = true;
    bar.appendChild(ask);
    function done() {
      if (ask.parentNode) ask.parentNode.removeChild(ask);
      edit.hidden = false; del.hidden = false;
    }
    yes.addEventListener('click', function () { done(); onDelete(); });
    no.addEventListener('click', function () { done(); if (onKeep) onKeep(); });
  }

  function svRemoveNote(it, note, row) {
    var list = svNotes(it);
    var at = list.indexOf(note);
    if (at >= 0) list.splice(at, 1);
    if (row && row.parentNode) row.parentNode.removeChild(row);
    svSyncNotes(it);
  }

  function decorateItems(box) {
    Array.prototype.forEach.call(box.querySelectorAll('.hl-item'), function (wrap) {
      /* The colour id, stamped for the same reason tagMarks() stamps it on a
         mark: the lesson knows three colours and writes a class for two of
         them, so anything else has nothing to select on. Done before the guard
         below, so it happens on every render whether or not this item still
         needs decorating. */
      var mark = svItemFor(wrap.getAttribute('data-item'));
      if (mark) wrap.setAttribute('data-c', mark.c || 'k');

      var ta = wrap.querySelector('textarea');
      if (!ta || ta.dataset.svWrapped === '1') return;
      ta.dataset.svWrapped = '1';

      var it = mark;
      if (!it) return;

      /* 🔴 Hidden, never removed, exactly as R2 does it: the lesson attached
         its own listener and its own autosave to this element, and removing it
         would take those with it. Nothing here ever types into it. */
      ta.hidden = true;

      var holder = document.createElement('div');
      holder.className = 'sv-notes';
      wrap.insertBefore(holder, ta);
      svNotes(it).forEach(function (note) { holder.appendChild(svNoteRow(it, note, false)); });

      var add = document.createElement('button');
      add.type = 'button';
      add.className = 'mini sv-addnote';
      add.textContent = 'Add a note';
      add.addEventListener('click', function () {
        var list = svNotes(it);
        var top = 0;
        list.forEach(function (n) { if (n.id > top) top = n.id; });
        var note = { id: top + 1, t: '' };
        list.push(note);
        var fresh = svNoteRow(it, note, true);
        holder.appendChild(fresh);
        /* 🔴 Focus AFTER it is in the document. svNoteRow paints the row before
           the caller appends it, and focusing a detached element does nothing
           at all, silently: the box opened and the caret stayed where it was. */
        var box = fresh.querySelector('textarea');
        if (box) { try { box.focus(); } catch (e) {} }
      });

      /* Before Remove, so the control that destroys the whole highlight stays
         last in the row. 🔴 A DIRECT child, not querySelector('.row'): the note
         rows above are also called a row by the lesson's own stylesheet and sit
         earlier in the document, so the first match is one of mine. */
      var row = null;
      for (var i = 0; i < wrap.children.length; i++) {
        if (wrap.children[i].classList.contains('row')) { row = wrap.children[i]; break; }
      }
      if (row) {
        var kill = Array.prototype.filter.call(row.querySelectorAll('.mini'), function (b) {
          return b.textContent.trim() === 'Remove';
        })[0];
        row.insertBefore(add, kill || null);
      }
    });
  }

  (function installItemNotes() {
    var box = document.getElementById('hlList');
    if (!box || !window.MutationObserver) return;
    /* childList without subtree: renderPanel() replaces this element's own
       children, and everything above is inserted inside a .hl-item, so this
       cannot re-trigger itself. */
    new MutationObserver(function () { decorateItems(box); })
      .observe(box, { childList: true });
    decorateItems(box);
  }());

  /* ---------- record that this lesson was opened ----------

     R17, asked 2026-08-13: "we also need some kind of [indicator] which we just
     have and have not been opened already which shows what's new and not new,
     and maybe something that shows the last page that was read."

     🔴 Reported to the server rather than to localStorage, because the hub's
     existing read state is per browser and his two Macs have therefore always
     disagreed about what he has read. The hub reads this back at /api/visits.

     Fire and forget: a visit that fails to record costs nothing and must never
     interrupt reading, so there is no retry and no message. */

  (function recordVisit() {
    if (!S.docId) return;
    try {
      api('/api/visit', { method: 'POST',
                          headers: { 'Content-Type': 'application/json' },
                          body: JSON.stringify({ doc: S.docId }) })
        .catch(function () {});
    } catch (e) {}
  }());

  /* ---------- R15: cards, with their definitions resolved on the spot ----------

     Asked 2026-08-13: "We should also be able to, in the right-hand panel, get
     everything we've asked for as a card. Frankly, we might as well just get
     definitions listed right there. We might as well be doing it on the spot
     and recording them instead of waiting for the Obsidian Vault to do it."

     A card is a mark whose colour is `d`. This lists them in their own section
     of the notes panel, and resolves each one's definition once, the first time
     it is seen, through /api/lookup: the glossary first, then MeSH, then
     Wikipedia, all of which already existed and are already cached.

     🔴 The definitions live in their own sidecar, keyed by mark id, and this
     code never writes to the marks. Marks are the file that matters and the one
     already lost once; a definition can always be fetched again, so it has no
     business sharing a file with the only copy of his highlights.

     🔴 It does NOT change what the `d` colour writes to the vault. Whether the
     `term:::` request should stop now is his call and outside this role's
     authority over Terms/. */

  var cards = {};        /* markId -> {term, def, source, url, at} */
  var cardsLoaded = false;
  var cardsBusy = {};
  var cardBox = null;

  function saveCards() {
    return api('/api/cards', { method: 'POST',
                               headers: { 'Content-Type': 'application/json' },
                               body: JSON.stringify({ doc: S.docId, cards: cards }) })
      .catch(function () {});
  }

  function cardItems() {
    return S.marks().items.filter(function (it) { return it.c === 'd'; });
  }

  /* The highlighted text is what gets looked up, and a card is often a phrase
     rather than a single word. The server normalises and refuses anything over
     120 characters, so a long passage simply comes back without a definition
     and the card still lists the passage. */
  function resolveCard(it, force) {
    var id = String(it.id);
    if (cardsBusy[id]) return;
    if (!force && cards[id] && cards[id].def) return;
    cardsBusy[id] = true;
    var term = String(it.t || '').trim();
    api('/api/lookup?q=' + encodeURIComponent(term))
      .then(function (r) {
        var src = (r.body && r.body.sources && r.body.sources[0]) || null;
        cards[id] = {
          term: term,
          def: src ? String(src.text || '') : '',
          source: src ? String(src.source || src.title || '') : '',
          url: src ? String(src.url || '') : '',
          from: 'mark',
          at: new Date().toISOString()
        };
        delete cardsBusy[id];
        renderCards();
        saveCards();
      })
      .catch(function () {
        delete cardsBusy[id];
        renderCards();
      });
  }

  /* One list from two sources (R5): the cards anchored to a mark on the page,
     in the order the marks are in, then the cards made inside a chat answer,
     which have no place on the page to be ordered by. A card whose mark has
     been deleted drops out; a chat card has no mark to lose. */
  function cardRows() {
    var rows = [];
    var seen = {};
    cardItems().forEach(function (it) {
      var id = String(it.id);
      seen[id] = true;
      rows.push({ key: id, term: String(it.t || '').trim(), got: cards[id], item: it, chat: false });
    });
    Object.keys(cards).forEach(function (k) {
      if (seen[k]) return;
      var from = (cards[k] || {}).from;
      /* chat and typed cards have no mark on the page; anything else markless
         is an orphaned page card, not shown */
      if (from !== 'chat' && from !== 'typed') return;
      rows.push({ key: k, term: cards[k].term || '', got: cards[k], item: null,
                  chat: from === 'chat', typed: from === 'typed' });
    });
    return rows;
  }

  function renderCards() {
    if (!cardBox) return;
    var rows = cardRows();
    cardBox.innerHTML = '';
    if (!rows.length) {
      var p = document.createElement('p');
      p.className = 'empty';
      p.textContent = 'Nothing yet. Press Card on a term, on the page or inside a chat, and its definition is looked up and kept here.';
      cardBox.appendChild(p);
      return;
    }
    rows.forEach(function (row) {
      var got = row.got;
      var wrap = document.createElement('div');
      wrap.className = 'sv-card';

      var t = document.createElement('div');
      t.className = 'term';
      t.textContent = row.term;
      wrap.appendChild(t);

      var d = document.createElement('div');
      if (cardsBusy[row.key]) {
        d.className = 'def pending'; d.textContent = 'Looking it up…';
      } else if (got && got.def) {
        d.className = 'def'; d.textContent = got.def;
      } else if (got) {
        d.className = 'def none';
        d.textContent = 'Nothing found for this one. It may be a phrase rather than a term.';
      } else {
        d.className = 'def pending'; d.textContent = 'Not looked up yet.';
      }
      wrap.appendChild(d);

      var s = document.createElement('div');
      s.className = 'src';
      var bits = [];
      if (row.chat) bits.push('from a chat');
      if (got && got.def && got.source) bits.push(got.source);
      if (bits.length) {
        if (got && got.url && !row.chat) {
          var a = document.createElement('a');
          a.href = got.url; a.target = '_blank'; a.rel = 'noopener';
          a.textContent = bits.join(' · ');
          s.appendChild(a);
        } else {
          s.appendChild(document.createTextNode(bits.join(' · ')));
        }
      }

      if (row.chat || row.typed) {
        /* R44: a typed card can be looked up again, unlike a chat card before
           it, because retyping the term is the whole feature. */
        if (row.typed) {
          var retry = document.createElement('button');
          retry.type = 'button';
          retry.className = 'again';
          retry.textContent = 'Look up again';
          retry.addEventListener('click', function () { lookupMarkless(row.key, true); });
          s.appendChild(retry);
        }
        var del = document.createElement('button');
        del.type = 'button';
        del.className = 'again';
        del.textContent = 'Remove';
        del.addEventListener('click', function () {
          delete cards[row.key];
          renderCards(); saveCards();
        });
        s.appendChild(del);
      } else {
        var again = document.createElement('button');
        again.type = 'button';
        again.className = 'again';
        again.textContent = got ? 'Look up again' : 'Look it up';
        again.addEventListener('click', function () { resolveCard(row.item, true); renderCards(); });
        s.appendChild(again);
      }
      wrap.appendChild(s);

      cardBox.appendChild(wrap);
    });
  }

  /* ---------- marks that live in a conversation, not on the page ----------

     The remaining half of BOTH R5 ("highlight things ... from inside the chat")
     and R7 ("bookmark ... a chat"). They stopped at the same wall and it is one
     job: everything else the reader can mark anchors to a block index inside
     `.wrap`, and a chat answer is neither in `.wrap` nor stable, because the
     thread is rebuilt from the chats store every time it is drawn.

     So a chat highlight names {chat id, turn index, start, end} against that
     turn's own text and survives the rebuild by being repainted after it. A
     chat bookmark names a conversation and nothing else, because "bookmark a
     chat" means the whole thing rather than a place inside it.

     🔴 Its own sidecar, and in particular NOT inside -chats.json, whose entries
     are rewritten wholesale every time a conversation gains a turn.

     These are declared here, beside the cards, but everything they touch
     (openChat, pThread, panel, renderThread) is set up further down. They are
     only ever called from a click or an observer, by which time it exists. */

  var chatMarks = [];      /* [{c, i, s, e, t}] highlights inside turns */
  var chatBooks = [];      /* [{c, t}] whole conversations */

  function saveChatMarks() {
    return api('/api/chatmarks', { method: 'POST',
                                   headers: { 'Content-Type': 'application/json' },
                                   body: JSON.stringify({ doc: S.docId, marks: chatMarks,
                                                          chats: chatBooks }) })
      .catch(function () {});
  }

  /* Offset of a point inside a .txt element, counted in that element's own text,
     which is exactly the turn's text. The same trick the page uses: a range from
     the start of the element to the point, measured by its string length. */
  function offsetInTxt(txt, node, off) {
    var r = document.createRange();
    r.selectNodeContents(txt);
    try { r.setEnd(node, off); } catch (e) { return -1; }
    return r.toString().length;
  }

  function paintChatTurn(txt, turnIndex, chatId) {
    var mine = chatMarks.filter(function (m) { return m.c === chatId && m.i === turnIndex; });
    if (!mine.length) return;
    var len = txt.textContent.length;
    /* Painted last range first, so an earlier one's offsets are still valid when
       it is reached: splitting text later in the string cannot move it. */
    mine.slice().sort(function (a, z) { return z.s - a.s; }).forEach(function (m) {
      if (m.s < 0 || m.e > len || m.e <= m.s) return;
      var walker = document.createTreeWalker(txt, NodeFilter.SHOW_TEXT, null);
      var pos = 0, node;
      while ((node = walker.nextNode())) {
        var n = node.data.length;
        if (pos + n >= m.e && pos <= m.s) {
          var range = document.createRange();
          range.setStart(node, m.s - pos);
          range.setEnd(node, m.e - pos);
          var el = document.createElement('mark');
          el.className = 'sv-chl';
          try { range.surroundContents(el); } catch (e) {}
          return;
        }
        pos += n;
      }
    });
  }

  function paintChatMarks() {
    if (!openChat || !pThread) return;
    Array.prototype.forEach.call(pThread.querySelectorAll('.sv-turn .txt'),
      function (txt, i) { paintChatTurn(txt, i, openChat.id); });
  }

  function addChatHighlight() {
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount || sel.isCollapsed || !openChat) return false;
    var r = sel.getRangeAt(0);
    var start = r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentNode;
    var txt = start && start.closest ? start.closest('.sv-turn .txt') : null;
    if (!txt) return false;
    var boxes = Array.prototype.slice.call(pThread.querySelectorAll('.sv-turn .txt'));
    var i = boxes.indexOf(txt);
    if (i < 0) return false;
    var s = offsetInTxt(txt, r.startContainer, r.startOffset);
    var e = offsetInTxt(txt, r.endContainer, r.endOffset);
    if (s < 0 || e < 0 || e <= s) return false;
    chatMarks.push({ c: openChat.id, i: i, s: s, e: e,
                     t: txt.textContent.slice(s, e).slice(0, 400),
                     at: new Date().toISOString() });
    sel.removeAllRanges();
    renderThread();
    saveChatMarks();
    S.toast('Highlighted in this chat.');
    return true;
  }

  function chatIsBookmarked(id) {
    return chatBooks.some(function (x) { return x.c === id; });
  }

  /* Opening a bookmarked conversation from the Bookmarks list. It has to switch
     the sidebar to the chat side as well as load the conversation, since the
     list it was clicked from lives on the notes side. */
  function openSavedChat(id) {
    var c = chats.filter(function (x) { return x.id === id; })[0];
    if (!c) { S.toast('That conversation is no longer saved.'); return; }
    openChat = c;
    showChat();
    renderThread();
    showFocus(c.segments);
  }

  function paintChatBookmarkButton() {
    var b = panel && panel.querySelector('[data-bmchat]');
    if (!b) return;
    b.hidden = !openChat;
    b.setAttribute('aria-pressed', (openChat && chatIsBookmarked(openChat.id)) ? 'true' : 'false');
    b.textContent = (openChat && chatIsBookmarked(openChat.id)) ? 'Bookmarked' : 'Bookmark';
  }

  function toggleChatBookmark() {
    if (!openChat) return;
    var id = openChat.id;
    var had = chatIsBookmarked(id);
    if (had) {
      chatBooks = chatBooks.filter(function (x) { return x.c !== id; });
    } else {
      chatBooks.push({ c: id, t: chatTitle(openChat) || 'A conversation',
                       at: new Date().toISOString() });
    }
    saveChatMarks();
    renderBookmarks();
    paintChatBookmarkButton();
    S.toast(had ? 'Bookmark removed.' : 'Chat bookmarked.');
  }

  /* The lookup for a card with no mark on the page: chat cards and, since R44,
     typed ones. One implementation, because the retry button calls it too. */
  function lookupMarkless(key, quiet) {
    if (!cards[key] || cardsBusy[key]) return;
    cardsBusy[key] = true;
    renderCards();
    api('/api/lookup?q=' + encodeURIComponent(cards[key].term))
      .then(function (r) {
        var src = (r.body && r.body.sources && r.body.sources[0]) || null;
        cards[key].def = src ? String(src.text || '') : '';
        cards[key].source = src ? String(src.source || src.title || '') : '';
        cards[key].url = src ? String(src.url || '') : '';
        delete cardsBusy[key];
        renderCards();
        saveCards();
        if (!quiet) {
          S.toast(cards[key].def ? 'Card made, with its definition.' : 'Card made. Nothing found to define it with.');
        }
      })
      .catch(function () { delete cardsBusy[key]; renderCards(); saveCards(); });
  }

  function markless(term, from) {
    term = String(term || '').replace(/\s+/g, ' ').trim();
    if (!term) return;
    var key = 'c' + Date.now().toString(36);
    cards[key] = { term: term, def: '', source: '', url: '', from: from,
                   at: new Date().toISOString() };
    lookupMarkless(key);
  }

  /* R5: a card made from inside a chat answer. No mark to key on, so it issues
     its own key and carries from:'chat' so the list can tell them apart. */
  function cardFromChat(term) { markless(term, 'chat'); }

  /* Anything marked as a card and not yet resolved gets resolved once. Serial
     rather than all at once: a fresh lesson could have a dozen, and the lookup
     goes out to MeSH and Wikipedia. */
  function fillCards() {
    if (!cardsLoaded) return;
    var pending = cardItems().filter(function (it) {
      return !cards[String(it.id)] && !cardsBusy[String(it.id)];
    });
    if (pending.length) { resolveCard(pending[0], false); }
  }

  /* ---------- R7: bookmarks ----------

     Asked 2026-08-13: "I wonder if we should also add bookmarks where I can
     bookmark a whole paragraph or image or a section or a chat."

     🔴 A bookmark is a pointer, not a highlight with different styling. A
     highlight is a range and exists to say something about the words inside it;
     a bookmark names a whole block and exists to be come back to. So it has its
     own store, its own sidecar and its own list, and the marks file is untouched.

     Bookmarking a CHAT is not built. It is a different target with a different
     store, and doing it badly here would mean pretending a chat is a block. */

  var bookmarks = [];
  var bmBox = null;

  function saveBookmarks() {
    return api('/api/bookmarks', { method: 'POST',
                                   headers: { 'Content-Type': 'application/json' },
                                   body: JSON.stringify({ doc: S.docId, marks: bookmarks }) })
      .catch(function () {});
  }

  function blockEl(b) { return document.querySelector('.wrap [data-hb="' + b + '"]'); }

  function paintBookmarks() {
    Array.prototype.forEach.call(document.querySelectorAll('.wrap [data-hb].sv-bm'),
      function (el) { el.classList.remove('sv-bm'); });
    bookmarks.forEach(function (bm) {
      var el = blockEl(bm.b);
      if (el) el.classList.add('sv-bm');
    });
  }

  function goToBookmark(bm) {
    var el = blockEl(bm.b);
    if (!el) { S.toast('That paragraph is no longer on the page.'); return; }
    /* 🔴 Not behavior:'smooth'. Smooth scrolling is animation-driven, and this
       project has already been caught twice by animation machinery not running
       in a tab that is not painting: rAF never fired for the focus rectangles,
       and ResizeObserver never delivered its initial callback. Measured here
       too, from a scroll position of 3000: smooth moved nothing, instant landed
       at 7. Jumping to a bookmark should also just arrive. */
    el.scrollIntoView({ block: 'center' });
    el.classList.remove('sv-bmflash');
    /* Reading offsetWidth restarts the animation; without it a second visit to
       the same bookmark flashes nothing. */
    void el.offsetWidth;
    el.classList.add('sv-bmflash');
    window.setTimeout(function () { el.classList.remove('sv-bmflash'); }, 1600);
  }

  function renderBookmarks() {
    if (!bmBox) return;
    bmBox.innerHTML = '';
    if (!bookmarks.length && !chatBooks.length) {
      var p = document.createElement('p');
      p.className = 'empty';
      p.textContent = 'Nothing yet. Select anything in a paragraph and press Bookmark, or press Bookmark at the top of a chat, to be able to come back to it.';
      bmBox.appendChild(p);
      return;
    }

    /* Bookmarked conversations first: they are the shorter list and the one you
       cannot find by scrolling the page. */
    chatBooks.forEach(function (cb) {
      var wrap = document.createElement('div');
      wrap.className = 'sv-bmark sv-bmchat';
      var go = document.createElement('button');
      go.type = 'button';
      go.className = 'go';
      go.textContent = cb.t || 'A conversation';
      go.addEventListener('click', function () { openSavedChat(cb.c); });
      wrap.appendChild(go);
      var row = document.createElement('div');
      row.className = 'row';
      var w = document.createElement('span');
      w.className = 'where';
      w.textContent = 'chat';
      row.appendChild(w);
      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'mini';
      del.textContent = 'Remove';
      del.addEventListener('click', function () {
        chatBooks = chatBooks.filter(function (x) { return x.c !== cb.c; });
        renderBookmarks(); paintChatBookmarkButton(); saveChatMarks();
      });
      row.appendChild(del);
      wrap.appendChild(row);
      bmBox.appendChild(wrap);
    });

    if (!bookmarks.length) return;
    bookmarks.slice().sort(function (a, z) { return a.b - z.b; }).forEach(function (bm) {
      var wrap = document.createElement('div');
      wrap.className = 'sv-bmark';

      var go = document.createElement('button');
      go.type = 'button';
      go.className = 'go';
      go.textContent = bm.t || ('Paragraph ' + bm.b);
      go.addEventListener('click', function () { goToBookmark(bm); });
      wrap.appendChild(go);

      var row = document.createElement('div');
      row.className = 'row';
      var w = document.createElement('span');
      w.className = 'where';
      w.textContent = blockEl(bm.b) ? '' : 'no longer on the page';
      row.appendChild(w);

      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'mini';
      del.textContent = 'Remove';
      del.addEventListener('click', function () {
        bookmarks = bookmarks.filter(function (x) { return x.b !== bm.b; });
        renderBookmarks(); paintBookmarks(); saveBookmarks();
      });
      row.appendChild(del);
      wrap.appendChild(row);
      bmBox.appendChild(wrap);
    });
  }

  function toggleBookmark(b, text) {
    var had = bookmarks.some(function (x) { return x.b === b; });
    if (had) {
      bookmarks = bookmarks.filter(function (x) { return x.b !== b; });
    } else {
      bookmarks.push({ b: b, t: text, at: new Date().toISOString() });
    }
    renderBookmarks(); paintBookmarks(); saveBookmarks();
    S.toast(had ? 'Bookmark removed.' : 'Bookmarked.');
  }

  (function installBookmarks() {
    var scroll = document.querySelector('.hl-panel .hl-scroll');
    if (!scroll || !S.docId) return;

    var sec = document.createElement('section');
    sec.className = 'hl-sec sv-bmarks';
    sec.innerHTML = '<div class="hl-sechead"><h3>Bookmarks</h3></div>';
    bmBox = document.createElement('div');
    sec.appendChild(bmBox);
    scroll.appendChild(sec);      /* after the highlights: it is the retrieval list */

    var bmBtn = document.createElement('button');
    bmBtn.type = 'button';
    bmBtn.className = 'sv-act';
    bmBtn.textContent = 'Bookmark';
    bmBtn.title = 'Mark this whole paragraph to come back to';
    bmBtn.addEventListener('mousedown', function (e) { e.preventDefault(); });
    bmBtn.addEventListener('click', function () {
      var sel = S.selection();
      if (!sel) return;
      /* The whole block the selection started in, not the selected words: this
         is the one control here that deliberately ignores the range. */
      var el = blockEl(sel.b);
      var text = el ? el.textContent.replace(/\s+/g, ' ').trim().slice(0, 160) : '';
      S.hideBar();
      toggleBookmark(sel.b, text);
    });
    S.bar.appendChild(bmBtn);

    api('/api/bookmarks?doc=' + encodeURIComponent(S.docId))
      .then(function (r) {
        if (r.body && r.body.ok && Array.isArray(r.body.marks)) { bookmarks = r.body.marks; }
      })
      .catch(function () {})
      .then(function () {
        /* The chat marks share this list, so they load beside it rather than in
           their own pass: one render at the end instead of two that flicker. */
        return api('/api/chatmarks?doc=' + encodeURIComponent(S.docId))
          .then(function (r) {
            if (r.body && r.body.ok) {
              if (Array.isArray(r.body.marks)) chatMarks = r.body.marks;
              if (Array.isArray(r.body.chats)) chatBooks = r.body.chats;
            }
          })
          .catch(function () {});
      })
      .then(function () {
        renderBookmarks();
        paintBookmarks();
        paintChatBookmarkButton();
        paintChatMarks();
      });

    /* renderMarks rebuilds each block's innerHTML, which does not touch the
       class on the block itself, but a restore-from-disk can replace more than
       that, so repaint on change like the palette does. */
    S.onChange(function () { window.setTimeout(paintBookmarks, 0); });
  }());

  (function installCards() {
    var scroll = document.querySelector('.hl-panel .hl-scroll');
    if (!scroll || !S.docId) return;

    var sec = document.createElement('section');
    sec.className = 'hl-sec sv-cards';
    sec.innerHTML = '<div class="hl-sechead"><h3>Cards</h3></div>';

    /* R44: a card typed in, not selected. Same header-button pattern as the
       notes section's "Add a note" beside it. */
    var addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.textContent = 'Add a card';
    sec.querySelector('.hl-sechead').appendChild(addBtn);

    var addRow = document.createElement('div');
    addRow.className = 'sv-cardadd';
    addRow.hidden = true;
    var addIn = document.createElement('input');
    addIn.type = 'text';
    addIn.placeholder = 'The term to define';
    addIn.setAttribute('autocapitalize', 'off');
    addIn.setAttribute('autocorrect', 'off');
    var addGo = document.createElement('button');
    addGo.type = 'button';
    addGo.textContent = 'Look it up';
    addRow.appendChild(addIn);
    addRow.appendChild(addGo);
    sec.appendChild(addRow);

    function submitCard() {
      var term = addIn.value.replace(/\s+/g, ' ').trim();
      if (!term) { addRow.hidden = true; return; }
      markless(term, 'typed');
      addIn.value = '';
      addRow.hidden = true;
    }
    addBtn.addEventListener('click', function () {
      addRow.hidden = !addRow.hidden;
      if (!addRow.hidden) addIn.focus();
    });
    addGo.addEventListener('click', submitCard);
    addIn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); submitCard(); }
      if (e.key === 'Escape') { e.stopPropagation(); addIn.value = ''; addRow.hidden = true; }
    });

    cardBox = document.createElement('div');
    sec.appendChild(cardBox);
    /* Between the notes and the highlights: cards are closer to notes in what
       they are for, and the highlights list is the long one. */
    var secs = scroll.querySelectorAll('.hl-sec');
    if (secs.length > 1) { scroll.insertBefore(sec, secs[1]); } else { scroll.appendChild(sec); }

    api('/api/cards?doc=' + encodeURIComponent(S.docId))
      .then(function (r) {
        if (r.body && r.body.ok && r.body.cards) { cards = r.body.cards; }
      })
      .catch(function () {})
      .then(function () {
        cardsLoaded = true;
        renderCards();
        fillCards();
      });

    /* A new card appears when a mark is made, so follow the store. */
    S.onChange(function () { window.setTimeout(function () { renderCards(); fillCards(); }, 0); });
  }());

  /* ---------- R44: the section nav at the top of the notes panel ----------

     Asked 2026-08-16: "if the list of notes cards and highlights gets really
     long and the bookmark gets really long, it might be hard to get to. Can we
     put a navigation bar at the top?"

     Four pills that scroll the panel to a section. Targets are resolved at
     click time rather than captured here, so this does not care what order the
     install blocks above ran in or where a section ended up. */

  (function installSecNav() {
    var scroll = document.querySelector('.hl-panel .hl-scroll');
    if (!scroll) return;

    var nav = document.createElement('nav');
    nav.className = 'sv-secnav';
    nav.setAttribute('aria-label', 'Sections of this panel');

    function target(which) {
      if (which === 'notes') return document.getElementById('hlNotes');
      if (which === 'cards') return scroll.querySelector('.sv-cards');
      if (which === 'marks') return document.getElementById('hlList');
      if (which === 'bmarks') return scroll.querySelector('.sv-bmarks');
      return null;
    }

    var rail = document.createElement('div');
    rail.className = 'rail';
    [['notes', 'Notes'], ['cards', 'Cards'], ['marks', 'Highlights'], ['bmarks', 'Bookmarks']]
      .forEach(function (pair) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = pair[1];
        b.addEventListener('click', function () {
          var el = target(pair[0]);
          if (!el) return;
          var sec = el.closest('.hl-sec') || el;
          /* Relative to the scroll container, minus the nav itself and the
             sticky section head, so the head lands visible under the nav
             rather than both stacking over the first rows. */
          var top = sec.getBoundingClientRect().top - scroll.getBoundingClientRect().top +
                    scroll.scrollTop - nav.offsetHeight - 4;
          scroll.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
        });
        rail.appendChild(b);
      });
    nav.appendChild(rail);

    /* R51: this panel is one lesson. The whole course lives on its own page, so
       the panel gets a way to it rather than trying to hold it. Under the pill,
       not in it: R47 asked for four equal segments that never wrap, and a fifth
       would break exactly that. */
    var all = document.createElement('a');
    all.className = 'sv-secall';
    all.href = 'notebook';
    all.textContent = 'Everything on this course';
    all.title = 'Every note, card, highlight and bookmark you have made, across every lesson';
    nav.appendChild(all);

    scroll.insertBefore(nav, scroll.firstChild);

    /* The section heads are sticky at top 0 in the lesson's CSS; they slide
       under this nav unless pushed down by its real height, which varies with
       the panel text-size setting and the phone's larger controls. */
    function setH() {
      document.documentElement.style.setProperty('--sv-secnav-h', nav.offsetHeight + 'px');
    }
    /* 🔴 Measured when the PANEL OPENS, not at install. At install the panel is
       hidden and offsetHeight is 0, so the section heads would stick at 0 and
       slide under the nav. A ResizeObserver alone is not enough either: its
       callbacks ride the rendering pipeline, so it never fires in a
       non-painting tab (same family as the scrollIntoView gotcha), and the
       panel can be opened by the lesson's own button as well as ours, so no
       single open-path hook covers every case. Watching the hidden attribute
       does, and MutationObserver runs as a microtask, paint or no paint. */
    setH();
    window.addEventListener('resize', setH);
    var hlPanelEl = document.querySelector('.hl-panel');
    if (hlPanelEl && window.MutationObserver) {
      new MutationObserver(setH).observe(hlPanelEl, { attributes: true, attributeFilter: ['hidden'] });
    }
    /* The panel text-size setting rescales the nav without a window resize. */
    if (window.ResizeObserver) new ResizeObserver(setH).observe(nav);
  }());

  /* ---------- R46: the export carries everything ----------

     Asked 2026-08-16: "we especially need to make sure that we have export
     functions for our notes, our highlights, and our cards", because the vault
     automation is EH's own integration and nobody else will have it.

     The lesson's export covered notes and highlights only; cards were nowhere
     in it, and highlights in HIS OWN added colours appeared only inside the
     machine block, invisible to a reader. The lesson's builder cannot be
     reached from here (closure), so these capture-phase handlers stop the
     click before the lesson's own listener and write the fuller file. The
     machine block keeps the exact "highlight-data v1" marker and the
     items/notes keys, so the lesson's own Import reads the new files. */

  function fullExportMd() {
    var m = S.marks();
    var rows = cardRows();
    var L = [];
    L.push('# Highlights: ' + (S.title || S.docId));
    L.push('');
    L.push('Exported ' + new Date().toISOString().slice(0, 10) + '. ' +
           m.notes.length + (m.notes.length === 1 ? ' note, ' : ' notes, ') +
           m.items.length + (m.items.length === 1 ? ' highlight, ' : ' highlights, ') +
           rows.length + (rows.length === 1 ? ' card, ' : ' cards, ') +
           (bookmarks.length + chatBooks.length) +
           ((bookmarks.length + chatBooks.length) === 1 ? ' bookmark.' : ' bookmarks.'));
    L.push('');
    L.push('Import this same file from Settings to restore the notes and highlights.');
    L.push('');

    if (m.notes.length) {
      L.push('## Notes');
      L.push('');
      m.notes.slice().sort(function (a, z) { return (a.ts || 0) - (z.ts || 0); }).forEach(function (nt) {
        if (nt.text) L.push('- ' + nt.text.replace(/\n+/g, ' ').trim());
      });
      L.push('');
    }

    /* Grouped by the palette itself, so his own colours head their own
       sections instead of vanishing. Retired colours still group, because
       their highlights still exist. */
    var sorted = m.items.slice().sort(function (a, z) { return (a.b - z.b) || (a.s - z.s); });
    var grouped = {};
    function group(title, arr) {
      if (!arr.length) return;
      L.push('## ' + title);
      L.push('');
      arr.forEach(function (it) {
        L.push('> ' + it.t.replace(/\s+/g, ' ').trim());
        if (it.n) { L.push(''); L.push('**Note:** ' + it.n.replace(/\n/g, ' ')); }
        L.push('');
      });
    }
    (palette || []).forEach(function (c) {
      var arr = sorted.filter(function (it) { return (it.c || 'k') === c.id; });
      arr.forEach(function (it) { grouped[String(it.id)] = true; });
      group(c.id === 'd' ? 'Cards to make' : c.label, arr);
    });
    group('Other colours', sorted.filter(function (it) { return !grouped[String(it.id)]; }));

    if (rows.length) {
      L.push('## Cards');
      L.push('');
      rows.forEach(function (row) {
        var d = row.got && row.got.def ? row.got.def.replace(/\s+/g, ' ').trim() : '';
        L.push('- **' + row.term + '**' + (d ? ': ' + d : ''));
        if (row.got && row.got.source) L.push('    - ' + row.got.source + (row.got.url ? ' \u00B7 ' + row.got.url : ''));
      });
      L.push('');
    }

    if (bookmarks.length || chatBooks.length) {
      L.push('## Bookmarks');
      L.push('');
      bookmarks.forEach(function (bm) {
        var t = (S.blockText(bm.b) || '').replace(/\s+/g, ' ').trim();
        if (t.length > 180) t = t.slice(0, 177) + '\u2026';
        if (t) L.push('- ' + t);
      });
      chatBooks.forEach(function (cb) {
        L.push('- Chat: ' + (cb.t || 'a conversation'));
      });
      L.push('');
    }

    L.push('---');
    L.push('');
    L.push('<!-- highlight-data v1, do not edit below this line -->');
    L.push('');
    L.push('```' + 'json');
    L.push(JSON.stringify({ doc: S.docId, items: m.items, notes: m.notes,
                            cards: cards, bookmarks: bookmarks, chatBookmarks: chatBooks }));
    L.push('```');
    L.push('');
    return L.join('\n');
  }

  (function completeTheExport() {
    function anything() {
      var m = S.marks();
      return m.items.length || m.notes.length || cardRows().length ||
             bookmarks.length || chatBooks.length;
    }
    document.addEventListener('click', function (e) {
      var t = e.target;
      if (!t || !t.closest) return;
      var which = t.closest('#hlExport') ? 'export' : (t.closest('#hlCopy') ? 'copy' : null);
      if (!which) return;
      e.stopPropagation();      /* the lesson's own handler must not also run */
      e.preventDefault();
      if (!anything()) return S.toast('Nothing to export yet.');
      var md = fullExportMd();
      if (which === 'copy') {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(md)
            .then(function () { S.toast('Copied. Paste it anywhere.'); })
            .catch(function () { S.toast('Copy blocked here. Use Export instead.'); });
        } else { S.toast('Copy blocked here. Use Export instead.'); }
        return;
      }
      try {
        var url = URL.createObjectURL(new Blob([md], { type: 'text/markdown' }));
        var a = document.createElement('a');
        a.href = url; a.download = S.docId + '-highlights.md';
        document.body.appendChild(a); a.click(); a.remove();
        window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        S.toast('Saved ' + S.docId + '-highlights.md');
      } catch (err) {
        S.toast('Save unavailable here. Use Copy instead.');
      }
    }, true);
  }());

  (function installNoteEditing() {
    var box = document.getElementById('hlNotes');
    if (!box || !window.MutationObserver) return;
    /* childList without subtree: renderNotes() replaces this element's own
       children, while the decorating above only ever inserts inside .hl-note,
       so this cannot re-trigger itself. */
    new MutationObserver(function () { decorateNotes(box); })
      .observe(box, { childList: true });
    decorateNotes(box);
  }());

  var pSub    = panel.querySelector('.sub');
  var pHist   = panel.querySelector('.sv-hist');
  var pThread = panel.querySelector('.thread');
  var pBox    = panel.querySelector('textarea');
  var pSend   = panel.querySelector('[data-send]');
  var pHistBtn= panel.querySelector('[data-hist]');

  function chatTitle(c) {
    if (c.term) return c.term.length > 60 ? c.term.slice(0, 60) + '…' : c.term;
    var first = (c.turns || []).filter(function (t) { return t.role === 'user'; })[0];
    var txt = first ? first.text : '';
    if (!txt && (c.turns || []).length) txt = c.turns[0].text;
    txt = (txt || 'Untitled').replace(/\s+/g, ' ').trim();
    return txt.length > 60 ? txt.slice(0, 60) + '…' : txt;
  }

  function saveChats() {
    return api('/api/chats', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ doc: S.docId, chats: chats })
    });
  }

  /* ---------- R38: the quoted passage takes you back to it ----------

     Asked 2026-08-15: "when I have a chat based on a selection at the top of
     the chat, it says 'In' and then it quotes the selection, but I can't click
     it to jump to that selected area."

     The History rows have done this since R5. The subtitle, which is the thing
     actually on screen while the answer is being read, did not. One function
     now, used by both, so they cannot drift. */

  function chatBlock(c) {
    if (!c) return null;
    var want = (c.term || '').replace(/\s+/g, ' ').trim().slice(0, 40);
    /* 🔴 A conversation saved before R5 has a quoted passage and no segments at
       all, and three of the ones on disk are like that. The words are still the
       words, so look for them rather than showing a dead quote. */
    if (!c.segments || !c.segments.length) {
      if (!want) return null;
      for (var j = 0; S.blockAt(j); j++) {
        var old = S.blockAt(j);
        if (old.textContent.replace(/\s+/g, ' ').indexOf(want) >= 0) {
          return { el: old, moved: true };
        }
      }
      return null;
    }
    var seg = c.segments[0];
    var el = S.blockAt(seg.b);
    var flat = el ? el.textContent.replace(/\s+/g, ' ') : '';
    if (el && (!want || flat.indexOf(want) >= 0)) return { el: el, moved: false };
    if (!want) return el ? { el: el, moved: false } : null;

    /* 🔴 The index went stale. A chat's segments are not re-anchored the way a
       mark is, and rewriting a table now changes how many blocks there are, so
       this went from unlikely to ordinary. Find the words again, searching
       outward from where they were, which is what reanchor() does for marks. */
    var order = [], i = 0;
    while (S.blockAt(i)) { order.push(i); i++; }
    order.sort(function (a, z) { return Math.abs(a - seg.b) - Math.abs(z - seg.b); });
    for (i = 0; i < order.length; i++) {
      var cand = S.blockAt(order[i]);
      if (cand && cand.textContent.replace(/\s+/g, ' ').indexOf(want) >= 0) {
        return { el: cand, moved: true };
      }
    }
    return el ? { el: el, moved: true } : null;
  }

  /* `leave` says whether going there is the POINT of the click. It is for the
     subtitle, which means "take me to this passage". It is not for a History
     row, which means "open this conversation" and only scrolls the lesson
     behind as a courtesy.

     🔴 The distinction only exists because of the phone. Below 900px the pane
     IS the screen and the body is pinned behind it, so a jump has to close the
     pane to be a jump at all, and a History row that closed the pane would
     shut the conversation it was just asked to open. */
  function jumpToChat(c, leave) {
    var found = chatBlock(c);
    if (!found) return false;
    var phone = window.matchMedia && window.matchMedia('(max-width: 899px)').matches;
    /* Close before drawing: closePanel clears the rectangle on its way out. */
    if (phone && leave) closePanel();
    /* The rectangle is drawn from the stored offsets, so it is only honest when
       the stored index is still the right one. */
    if (!found.moved) showFocus(c.segments);
    if (!phone || leave) found.el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    return true;
  }

  pSub.addEventListener('click', function () {
    if (pSub.classList.contains('sv-jump')) jumpToChat(openChat, true);
  });
  pSub.addEventListener('keydown', function (e) {
    if (!pSub.classList.contains('sv-jump')) return;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); jumpToChat(openChat, true); }
  });

  function renderThread() {
    paintScope();          /* the thread on screen owns the scope buttons */
    pThread.innerHTML = '';
    if (!openChat) {
      var empty = document.createElement('div');
      empty.className = 'sv-msg';
      empty.style.padding = '18px 0';
      empty.textContent = 'Ask something below, or press History to reopen an earlier conversation.';
      pThread.appendChild(empty);
      pSub.textContent = '';
      pSub.title = '';
      pSub.classList.remove('sv-jump');
      pSub.removeAttribute('role');
      pSub.removeAttribute('tabindex');
      return;
    }
    pSub.textContent = openChat.term ? ('on “' + chatTitle(openChat) + '”') : 'this lesson';
    /* The excerpt truncates on the single header line, so the whole of it has
       to be reachable somewhere: hovering gives it back. */
    pSub.title = openChat.term ? String(openChat.term) : '';

    /* Only a control when there is somewhere to go: a chat about the whole
       lesson has no passage, and a chat saved before R5 has no segments. An
       affordance that does nothing is worse than none. */
    var target = chatBlock(openChat);
    pSub.classList.toggle('sv-jump', !!target);
    if (target) {
      pSub.setAttribute('role', 'button');
      pSub.setAttribute('tabindex', '0');
      pSub.title = 'Jump to this passage in the lesson' +
                   (openChat.term ? '\n\n' + String(openChat.term) : '');
    } else {
      pSub.removeAttribute('role');
      pSub.removeAttribute('tabindex');
    }
    openChat.turns.forEach(function (turn) {
      var box = document.createElement('div');
      box.className = 'sv-turn' + (turn.role === 'user' ? ' me' : '');
      var who = document.createElement('span');
      who.className = 'who';
      who.textContent = turn.role === 'user' ? 'You' : ('Claude · ' + (caps.model || ''));
      var txt = document.createElement('div');
      txt.className = 'txt';
      txt.textContent = turn.text;
      box.appendChild(who); box.appendChild(txt);
      pThread.appendChild(box);
    });
    /* Pending belongs to the conversation, not the panel: switching chats while
       one is thinking must not put its "Thinking." line on the other. */
    if (openChat.pending) {
      var p = document.createElement('div');
      p.className = 'sv-turn pending';
      var t = document.createElement('div');
      t.className = 'txt';
      t.textContent = openChat.pending;
      p.appendChild(t);
      pThread.appendChild(p);
    }
    /* Repaint the conversation's own highlights, because this function has just
       rebuilt every turn from the store and thrown away whatever was painted
       into them. This is why a chat mark is stored as offsets rather than as
       markup: the markup does not survive, the offsets do. */
    paintChatMarks();
    paintChatBookmarkButton();
    pThread.scrollTop = pThread.scrollHeight;
  }

  function renderHistory() {
    pHist.innerHTML = '';
    if (!chats.length) {
      var none = document.createElement('div');
      none.className = 'none';
      none.textContent = 'No saved conversations for this lesson yet.';
      pHist.appendChild(none);
      return;
    }
    chats.slice().sort(function (a, z) { return (z.ts || 0) - (a.ts || 0); }).forEach(function (c) {
      var row = document.createElement('button');
      row.type = 'button';
      row.className = 'row';
      if (openChat && openChat.id === c.id) row.setAttribute('aria-current', 'true');

      var del = document.createElement('span');
      del.className = 'del';
      del.textContent = 'Delete';
      del.addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (!window.confirm('Delete this conversation?')) return;
        chats = chats.filter(function (x) { return x.id !== c.id; });
        if (openChat && openChat.id === c.id) openChat = null;
        saveChats().then(function () { renderHistory(); renderThread(); });
      });

      var ttl = document.createElement('span');
      ttl.className = 'ttl';
      ttl.textContent = chatTitle(c);

      var meta = document.createElement('span');
      meta.className = 'meta';
      var when = c.ts ? new Date(c.ts) : null;
      meta.textContent = (c.turns ? c.turns.length : 0) + ' messages' +
        (when ? ' · ' + when.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) +
                ' ' + when.toTimeString().slice(0, 5) : '');

      row.appendChild(del); row.appendChild(ttl); row.appendChild(meta);
      row.addEventListener('click', function () {
        openChat = c;
        pHist.hidden = true;
        pHistBtn.setAttribute('aria-pressed', 'false');
        renderThread();

           is most of the point of reopening it. */

        pBox.focus();
      });
      pHist.appendChild(row);
    });
  }

  /* Drives the reflow rules in this layer's stylesheet, so an open panel takes
     layout space from the note instead of covering its figures.

     Measured rather than hard-coded, because the two docked panels are
     different widths and are owned by different files: .sv-panel is created
     here, .hl-panel belongs to the note's own script. Watching the `hidden`
     attribute on both means the note's notes panel is handled without editing
     29 note files, and anything that opens or closes either panel by any route
     keeps the reservation correct. */
  /* ---------- a full-screen pane is a separate screen ----------

     Asked 2026-08-15: "Think of mobile when you go to chat materials or notes:
     you should kind of be on a completely separate screen or overlay from the
     main lesson." He had photographed a scroll indicator running down the right
     edge with nothing on screen to scroll: the pane is `position: fixed`, which
     takes it out of the flow but does nothing to stop the page behind moving
     under it. On a desktop that is correct and even useful, because the pane is
     a sidebar and the lesson beside it is still being read. Below 900px the pane
     IS the screen, and a page scrolling invisibly behind it is nothing but a way
     to lose your place.

     🔴 `overflow: hidden` on the body is the obvious version and is not enough
     on iOS, which goes on scrolling the document anyway. Pinning the body with
     a negative offset is the technique that does work everywhere, and the offset
     is what keeps it from jumping to the top the moment the pane opens. The
     scroll position is put back by hand on the way out, because taking the body
     out of position:fixed forgets it.

     Absolutely positioned overlays (R4's focus rectangles, R7's bookmark
     markers) are children of the body or of a block inside it, so they move with
     it and stay over the text they belong to. */
  var pageLock = null;   /* the scroll position to restore, while locked */

  function lockPage(on) {
    var wide = !window.matchMedia || !window.matchMedia('(max-width: 899px)').matches;
    if (on && wide) on = false;        /* a sidebar, not a screen */

    if (on) {
      if (pageLock !== null) return;
      pageLock = window.scrollY || window.pageYOffset || 0;
      var b = document.body;
      b.style.position = 'fixed';
      b.style.top = (-pageLock) + 'px';
      b.style.left = '0';
      b.style.right = '0';
      b.style.width = '100%';
      document.documentElement.classList.add('sv-locked');
      return;
    }

    if (pageLock === null) return;
    var was = pageLock;
    pageLock = null;
    var body = document.body;
    body.style.position = '';
    body.style.top = '';
    body.style.left = '';
    body.style.right = '';
    body.style.width = '';
    document.documentElement.classList.remove('sv-locked');
    window.scrollTo(0, was);
  }

  /* Rotating the phone, or dragging a desktop window across the breakpoint,
     can make a lock wrong in either direction. Nothing extra is needed to catch
     that: setPanelSpace already runs on resize and calls lockPage again, which
     re-asks matchMedia rather than remembering what it decided. */

  function setPanelSpace() {
    var open = [];
    Array.prototype.forEach.call(
      document.querySelectorAll('.sv-panel, .hl-panel'),
      function (p) { if (!p.hidden) open.push(p.offsetWidth); }
    );
    var w = open.length ? Math.max.apply(null, open) : 0;
    var r = document.documentElement;
    r.style.setProperty('--sv-reserved', w + 'px');
    if (w) r.classList.add('sv-panel-open'); else r.classList.remove('sv-panel-open');
    lockPage(!!w);

    /* 🔴 The note reflows on that line, and the focus rectangles are absolutely
       positioned in PAGE coordinates measured when they were drawn. So they now
       sit over whatever moved into the old position. Reported 2026-08-13 with a
       screenshot of them floating beside a table, while a chat was open about a
       passage: opening the panel narrowed the note and the text slid left out
       from under them.

       Redrawn synchronously rather than on requestAnimationFrame. Reading
       geometry inside drawFocus forces the pending layout anyway, and a rAF
       never runs in a tab that is not painting, which is exactly the case this
       was first tested in. drawFocus returns immediately when nothing is
       focused, so this costs nothing the rest of the time. */
    drawFocus();

    /* Same reason, one layer down: the column just changed width, so a table
       that fitted a moment ago may now overflow, or the reverse. Synchronous
       for the same reason drawFocus is. */
    updateTableScroll();
  }

  if (window.MutationObserver) {
    var spaceWatch = new MutationObserver(setPanelSpace);
    Array.prototype.forEach.call(
      document.querySelectorAll('.sv-panel, .hl-panel'),
      function (p) { spaceWatch.observe(p, { attributes: true, attributeFilter: ['hidden'] }); }
    );
    window.addEventListener('resize', setPanelSpace);
    setPanelSpace();
  }

  function openPanel(which) {
    if (which) openChat = which;
    closeMaterials();          /* same edge, so one at a time */
    panel.hidden = false;
    chatFab.setAttribute('aria-expanded', 'true');
    renderThread();
    /* 🔴 Not on a phone. On a pointer device putting the caret in the box saves
       a click and costs nothing, because the box was already on screen. On a
       phone it throws the keyboard up over half the screen before you have read
       a word of the conversation you just opened, and now that --sv-kb is gated
       on focus it also shrinks the pane at the same moment. The first thing
       wanted here is to read; typing is a deliberate second step. */
    if (!window.matchMedia || !window.matchMedia('(max-width: 899px)').matches) {
      pBox.focus();
    }
  }
  function closePanel() {
    panel.hidden = true;
    chatFab.setAttribute('aria-expanded', 'false');
    clearFocus();
  }

  chatFab.addEventListener('click', function () {
    if (panel.hidden) openPanel(); else closePanel();
  });


  /* ---------- R6, extended by R21: one sidebar, three tabs at the top ----------

     See the .sv-panetabs rules above for why the panels stay separate elements.
     This puts the same strip at the top of all three, so whichever is showing,
     the others are one click away in the same place.

     🔴 R21, asked 2026-08-13: "when I close the materials view, it would be
     great if I could now toggle between notes, chat, and materials." R6 had
     deliberately left materials out, which turned out to cost more than it
     saved: the same pass had hidden every .sv-panel header's Close, and since
     materials is a .sv-panel too that took away the only way it had of closing
     itself. Making it a peer fixes the gap and answers the request with one
     piece of work.

     🔴 Switching to Notes goes through the LESSON'S OWN button rather than
     setting .hidden here. Its handler also renders the panel and updates the
     button's aria-expanded, and skipping it would leave the lesson believing
     its panel is shut while it is on screen.

     The order is Materials, Chat, Notes, matching R18's header, so the three
     controls are in the same order wherever they are read. */

  var hlPanel = document.getElementById('hlPanel');
  var hlFab   = document.querySelector('.hl-fab');

  /* Each of the three shuts the other two, so the sidebar shows exactly one
     thing and every route agrees about which. closeSidebar is the shared piece
     and the Close button is just that with nothing opened after it. */
  function closeSidebar() {
    if (!panel.hidden) closePanel();
    if (!matPanel.hidden) closeMaterials();
    if (hlPanel && !hlPanel.hidden && hlFab) { hlFab.click(); }
  }

  function showChat() {
    if (!matPanel.hidden) closeMaterials();
    if (hlPanel && !hlPanel.hidden && hlFab) { hlFab.click(); }
    if (panel.hidden) openPanel();
    paintTabs();
  }

  function showNotes() {
    if (!panel.hidden) closePanel();
    if (!matPanel.hidden) closeMaterials();
    if (hlPanel && hlPanel.hidden && hlFab) { hlFab.click(); }
    paintTabs();
  }

  function showMaterials() {
    /* openMaterials already shuts the other two, by the routes that own them. */
    if (matPanel.hidden) openMaterials();
    paintTabs();
  }

  /* 🔴 Reads which tab to light from the panels themselves, and loops over
     whatever tabs a strip actually has rather than naming each one. The named
     version threw on a strip that was missing a button, which aborted the loop
     BEFORE the later strips and left one of them never repainted; that was the
     .sv-tabs collision, and writing it this way means adding a fourth tab later
     cannot reproduce it. */
  function paintTabs() {
    var on = !panel.hidden ? 'chat'
           : !matPanel.hidden ? 'mat'
           : (hlPanel && !hlPanel.hidden) ? 'notes' : '';
    Array.prototype.forEach.call(document.querySelectorAll('.sv-panetabs'), function (strip) {
      Array.prototype.forEach.call(strip.querySelectorAll('[data-tab]'), function (b) {
        b.setAttribute('aria-selected', b.getAttribute('data-tab') === on ? 'true' : 'false');
      });
      var g = strip.querySelector('[data-tabset]');
      if (g) g.setAttribute('aria-expanded', setBox && !setBox.hidden ? 'true' : 'false');
    });
  }

  /* R24's two icons, hand-authored so the layer stays self-contained and so they
     inherit currentColor with the rest of the strip. */
  var ICON_X =
    '<svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true" focusable="false">' +
      '<path d="M5.5 5.5 L14.5 14.5 M14.5 5.5 L5.5 14.5" fill="none" stroke="currentColor" ' +
            'stroke-width="1.7" stroke-linecap="round"/>' +
    '</svg>';
  var ICON_GEAR = (function () {
    /* Eight teeth on the rim, because the teeth are what make a circle read as a
       gear rather than as a sun or a record. Computed rather than typed so they
       are actually evenly spaced. */
    var teeth = '';
    for (var i = 0; i < 8; i++) {
      var a = i * Math.PI / 4;
      var c = Math.cos(a), s2 = Math.sin(a);
      teeth += '<path d="M' + (10 + 5.1 * c).toFixed(2) + ' ' + (10 + 5.1 * s2).toFixed(2) +
               ' L' + (10 + 7.5 * c).toFixed(2) + ' ' + (10 + 7.5 * s2).toFixed(2) + '"/>';
    }
    return '<svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true" focusable="false">' +
             '<g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt">' + teeth + '</g>' +
             '<circle cx="10" cy="10" r="5.1" fill="none" stroke="currentColor" stroke-width="1.5"/>' +
             '<circle cx="10" cy="10" r="1.9" fill="none" stroke="currentColor" stroke-width="1.5"/>' +
           '</svg>';
  }());

  function buildTabs() {
    var strip = document.createElement('div');
    strip.className = 'sv-panetabs';
    strip.setAttribute('role', 'tablist');
    strip.innerHTML =
      '<button type="button" role="tab" data-tab="mat" aria-selected="false">Materials</button>' +
      '<button type="button" role="tab" data-tab="chat" aria-selected="false">Chat</button>' +
      '<button type="button" role="tab" data-tab="notes" aria-selected="false">Notebook</button>' +
      /* sv-setbtn keeps the settings sheet's own outside-click handler from
         closing the sheet this button just opened. Same trap R18's header hit. */
      '<button type="button" class="sv-tabicon sv-setbtn" data-tabset aria-expanded="false" ' +
              'aria-label="Settings" title="Settings">' + ICON_GEAR + '</button>' +
      '<button type="button" class="sv-tabicon sv-tabclose" ' +
              'aria-label="Close the sidebar" title="Close">' + ICON_X + '</button>';
    var go = { mat: showMaterials, chat: showChat, notes: showNotes };
    Array.prototype.forEach.call(strip.querySelectorAll('[data-tab]'), function (b) {
      b.addEventListener('click', go[b.getAttribute('data-tab')]);
    });
