    /* 🔴 Two children, and that is the fix for the lecture restarting every time
       you glanced at a slide. Everything used to render by overwriting the
       body's innerHTML, which destroyed the <video> element and built a new one
       on the way back, so the recording began again from zero. EH asked for
       it on 2026-08-15. The player now lives in `sv-matkeep` and is HIDDEN
       rather than removed when another view is showing, so it keeps its position,
       its buffer and its volume; everything else renders into `sv-matswap` and
       goes on being rebuilt freely. */
    '<div class="sv-matbody">' +
      '<div class="sv-matkeep" hidden></div>' +
      '<div class="sv-matswap"><p class="sv-matmsg">Loading…</p></div>' +
    '</div>';
  document.body.appendChild(matPanel);

  var matBar  = matPanel.querySelector('.sv-matbar');
  var matNote = matPanel.querySelector('.sv-matnote');
  var matBody = matPanel.querySelector('.sv-matbody');
  var matKeep = matPanel.querySelector('.sv-matkeep');
  var matSwap = matPanel.querySelector('.sv-matswap');
  var matData = null;      /* the row, once fetched */
  var matPromise = null;

  /* One fetch feeds two features: this panel and the back/forward pair. */
  function loadMaterials() {
    if (!matPromise) {
      matPromise = api('/api/materials?doc=' + encodeURIComponent(S.docId))
        .then(function (r) { matData = r.body || {}; return matData; })
        .catch(function () {
          matPromise = null;   /* so it can be retried rather than stuck */
          matData = { ok: false, error: 'The server did not answer. Is it running?' };
          return matData;
        });
    }
    return matPromise;
  }

  function matLink(href, label, title) {
    return '<a class="sv-matbtn" href="' + href + '" target="_blank" rel="noopener"' +
           (title ? ' title="' + title + '"' : '') + '>' + label + '</a>';
  }

  /* ---------- R20: the transcript shows in the pane, not only out of it ----------

     Asked 2026-08-13: "when we're in the materials view, I can't see the
     transcript in the side pane, which would be good as well." It was a link
     that opened Drive in a new tab, which is the opposite of being in the pane.

     🔴 The bar was four ways OUT of the pane; two of them are things Drive
     will preview, so those two become a switch and only the genuinely external
     ones stay links. The lecture stays a link because it is a video on KEATS
     behind a separate login and nothing here can embed that.

     The embed URL is derived server side in read_materials() rather than stored,
     so no rebuild of materials.json was needed and all 50 parts gained it at
     once. Checked first: every one of the 50 transcripts is a Drive
     /file/d/<id>/ link, so one derivation covers them all. */

  /* 🔴 R25 asked for the lecture to play in the pane, and KEATS will not
     allow it. Measured, not assumed: the response carries

       content-security-policy: frame-ancestors 'self' https://kaf.keats.kcl.ac.uk
         https://*.kaltura.com moodleappfs://* http://localhost https://localhost

     and this reader is served from the tailnet address, which is on no part of
     that list, so the browser refuses the frame before a byte is drawn. It is
     KCL's decision and nothing here can override it. `localhost` is on the list,
     but the server binds the tailnet IP precisely so both Macs can reach it, and
     he reads from the MacBook where localhost is not this server.

     ✅ R26 got there anyway, by not framing anything. The header above governs
     who may put the KEATS *page* inside a frame; it says nothing about loading a
     media file, and a <video> needs no CORS permission unless it is given a
     crossorigin attribute. KEATS hands its recordings to Kaltura, and Kaltura's
     CDN serves them with no session token at all: checked from this reader's own
     origin and again from a shell with no cookies, both 206 with a fast-start
     H.264 MP4 and byte ranges honoured, so it plays and it seeks.

     So the lecture is now a real view. What is stored for it is one entry id per
     part, harvested once from KEATS into the last column of KEATS-LINKS.md;
     nothing is downloaded and nothing is cached. 41 of the 50 parts have one.
     The other nine are narrated slide packages rather than recordings, so there
     is no video to point at and they keep the button out to KEATS. */
  /* The three labels are EH's own words, 2026-08-14, and they are plural on
     purpose: they name what kind of thing the tab holds rather than counting
     what is in it, which is the reading that survives R8 and R9 attaching more
     files to a lesson. The runtime stays on the first one because it is the
     fact he uses to decide whether to start it now. */
  var VIEWS = [
    { id: 'lecture',    label: 'Videos',      embed: 'video_embed',
      href: 'video',      what: 'Lecture recording',         noun: 'lecture',
      kind: 'video',
      out: 'Open the lecture on KEATS in a new tab' },
    { id: 'slides',     label: 'Slides',      embed: 'slides_embed',
      href: 'slides',     what: 'Slide deck for this part',  noun: 'deck',
      out: 'Open the slide deck in Drive, in a new tab' },
    { id: 'transcript', label: 'Transcripts', embed: 'transcript_embed',
      href: 'transcript', what: 'Transcript of this lecture', noun: 'transcript',
      out: 'Open the transcript in Drive, in a new tab' },
    /* R8 and R9. The fourth item is not a URL, it is a directory, so it carries
       no `embed` and no `href` and is the only view that is ALWAYS offered:
       R9 means the first file has to be attachable from an empty list, and a tab
       that appears once there is something in it could never be used to put the
       something there. */
    { id: 'files',      label: 'Files',       kind: 'files',  always: true,
      what: 'Files attached to this lesson' }
  ];

  /* The box with the arrow coming out of it, which is what he asked for by
     description. Hand-authored so the layer stays self-contained. */
  var ICON_OUT =
    '<svg viewBox="0 0 20 20" width="13" height="13" aria-hidden="true" focusable="false">' +
      '<g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" ' +
         'stroke-linejoin="round">' +
        '<path d="M13.2 11.8 V15.4 H4.6 V6.8 H8.2"/>' +
        '<path d="M11.4 4.6 H15.4 V8.6"/>' +
        '<path d="M15.4 4.6 L9.4 10.6"/>' +
      '</g>' +
    '</svg>';

  /* Why the materials half of this pane has nothing to show, when that is the
     case. It is CONTENT now rather than a replacement for the pane, so the
     always-available Files view survives it; see renderMaterials. */
  var matErr = '';
  var matView = 'slides';
  var matShownSrc = null;      /* so switching back does not reload the iframe */
  var matKeepSrc = null;       /* the src the persistent player was built with */

  function availableViews() {
    /* A view earns its place if it can be shown inline OR opened out. The
       lecture only ever qualifies on the second, which is the whole reason the
       test is written this way. Files qualifies on neither and is always there;
       see the note on the VIEWS entry. */
    return VIEWS.filter(function (v) {
      return v.always || (matData && ((v.embed && matData[v.embed]) || matData[v.href]));
    });
  }

  function renderMaterials() {
    /* 🔴 A materials failure must not take the SWITCHER down with it, and until
       2026-08-30 it did: this returned early and painted the error in place of
       the bar, so a view declared `always: true` was unreachable.

       The population that hits is exactly the one the kit was built for. A
       course made from shared lesson packs has no `materials.json` and never
       will, so `read_materials` says so forever (the sentence itself was rewritten
       on 2026-08-30 for that reader rather than for the person who could fix it),
       and for that user the Files view was not degraded, it was
       ABSENT: no attaching a first file, no listing, opening, describing or
       removing one. R9's whole point is that the first file has to be
       attachable from an empty list, and this path removed the one view built
       to survive an empty state.

       So the error is materials CONTENT now, not a replacement for the pane. */
    matErr = (!matData || matData.ok === false)
      ? ((matData && matData.error) || 'Could not load this part\'s materials.')
      : '';

    /* 🔴 A fact about the COURSE, so it is painted BEFORE any branch below and
       lands on every one of them, including the early return to `renderFiles()`
       a few lines down. That early return is the one a careless fix misses, and
       it is the Files tab: the one tab a course with a corrupt index still has
       something in.

       The defect it closes, QA 2026-08-30 on one truncated `materials.json`: a
       part with a package on disk answered `ok: true` with a working Videos tab
       and no hint the course was damaged, while a part with nothing on disk
       said the index could not be read. Whether a person was told their course
       is broken depended on which lesson they happened to open. The server
       sends this on every part now; this line is the half that shows it, and
       without it the server field would be computed and silently dropped
       exactly like `matErr` is when views exist. */
    matNote.innerHTML = (matData && matData.index_error)
      ? '<p class="sv-matmsg quiet">' + esc(matData.index_error) + '</p>'
      : '';

    var views = availableViews();
    if (matErr && !views.length) {
      /* Nothing survives a failure: then the error IS the pane, as before. */
      matBar.innerHTML = '';
      matShownSrc = null;
      matSwap.innerHTML = '<p class="sv-matmsg">' + matErr + '</p>';
      return;
    }
    /* A part with no deck should not open on an empty deck view. */
    if (!views.some(function (v) { return v.id === matView; })) {
      matView = views.length ? views[0].id : 'slides';
    }
    var cur = views.filter(function (v) { return v.id === matView; })[0] || null;

    /* Hidden, never emptied. One line in one place, so no branch below can
       forget it and leave the player showing under a slide deck. */
    matKeep.hidden = !(cur && cur.kind === 'video' &&
                       (v_embed(cur) || matData.package_embed));

    /* Every item is now a label that switches the pane joined to a glyph that
       opens the real thing, so the way out is never more than one click from
       whatever is showing. That also stays the fix for a blank frame: the Drive
       embeds only render for someone signed in to the right Google account, and
       that click is what prompts for it. */
    var bits = views.map(function (v) {
      var label = v.label + (v.id === 'lecture' && matData && matData.minutes
                             ? ' · ' + matData.minutes + ' min' : '');
      /* The only count in this bar, and it earns its place where R22's did not:
         "Notes 0 notes" was restating what the panel showed one click away,
         whereas nothing else on screen says whether this lesson has anything
         attached, and the answer is usually nothing. */
      if (v.id === 'files' && matFiles.length) label += ' · ' + matFiles.length;
      var outSays = wayOut(v);
      var out = (matData && matData[v.href])
        ? '<a class="sv-matout" href="' + matData[v.href] + '" target="_blank" rel="noopener"' +
          ' title="' + outSays + '" aria-label="' + outSays + '">' + ICON_OUT + '</a>'
        : '';
      return '<span class="sv-matitem">' +
               '<button type="button" class="sv-matbtn" data-view="' + v.id + '"' +
               ' aria-pressed="' + (v.id === matView ? 'true' : 'false') + '">' +
               label + needChip(v) + '</button>' + out +
             '</span>';
    });
    matBar.innerHTML = bits.join('');

    if (cur && cur.kind === 'files') { matShownSrc = null; renderFiles(); return; }

    if (!cur) {
      matShownSrc = null;
      matSwap.innerHTML = '<p class="sv-matmsg">' + (matErr ||
        'Nothing is recorded for this part that can be shown here.') + '</p>';
      return;
    }

    /* A mirrored slide package: the whole narrated export is saved on this
       server, so the part plays here with no KEATS session and no internet.
       Same build-once rule as the player below: the iframe IS the running
       player, and rebuilding it on a tab switch would put the narration back
       to the start. */
    if (packageFirst(cur)) {
      var psrc = matData.package_embed;
      matKeep.hidden = false;
      if (matKeepSrc !== psrc) {
        matKeepSrc = psrc;
        /* 🔴 `data-sv-base` IS THE UNDECORATED URL, kept because the speed
           picker needs somewhere to build the next one FROM. Reading the
           frame's own `src` back would compound the rate every time it was
           changed. */
        matKeep.innerHTML =
          '<iframe class="sv-matframe sv-matpkg" src="' + packageSrc(psrc) +
          '" data-sv-base="' + psrc +
          '" title="' + cur.what + '" allow="autoplay"></iframe>';
        /* The controls go UNDER the lecture, in this document, because the
           lecture itself is sandboxed and an overlay was covering the slide. */
        buildPackageBar(matKeep.querySelector('iframe.sv-matpkg'));
      }
      matShownSrc = null;    /* the swap area holds nothing now, not a document */
      /* 🔴 EMPTIED, NOT DELETED, and the assignment has to stay. EH, 2026-09-05:
         "That little part that says 'playing from your own copy on this server,
         saved from the course site', we can get rid of across the board. We
         don't need that anywhere." The provenance line is gone; the CLEAR is
         load-bearing, because this branch is reached by switching tabs and the
         swap area is still showing whatever document the last view put there.
         Dropping the line and the assignment together would leave the slides
         sitting under the running lecture. */
      matSwap.innerHTML = '';
      return;
    }

    /* A narrated slide package that has NOT been mirrored: there is
       no video file to play and no honest way to show one. Saying which of the
       two it is beats an empty box, and the button below is the same link as the
       glyph above. */
    if (!v_embed(cur)) {
      matShownSrc = null;
      matSwap.innerHTML =
        '<div class="sv-matwhy">' +
          '<p>This one cannot be played here. Please open it in a separate tab.</p>' +
          (cur.kind === 'video'
            ? '<p class="sv-matwhy-sub">It is a set of slides with narration that runs on KEATS itself ' +
              'rather than a recording, so there is no video file to play. You will need your KCL login.</p>'
            : '') +
          /* 🔴 This link said `cur.out` verbatim until 2026-08-30, which is the
             hardcoded string the whole `wayOut` change of 2026-08-29 existed to
             delete, surviving in the most prominent button in the pane. Measured
             on a rig: a deck hosted at another university read "Open the slide
             deck in Drive, in a new tab" directly under a chip correctly naming
             the real host. It is keyed to `cur.href` because that is the link
             this button opens, which is now what `wayOut` reads by default. */
          (matData[cur.href]
            ? '<a href="' + matData[cur.href] + '" target="_blank" rel="noopener">' +
              wayOut(cur) + '</a>'
            : '') +
        '</div>';
      return;
    }

    var src = matData[cur.embed];

    /* The lecture is a media file, not a page, so it gets a player rather than a
       frame. `preload="metadata"` keeps opening the tab cheap: it fetches the
       header and the duration and stops, and nothing streams until it is played.
       The upgrade below then swaps in the better of the two flavours, quietly,
       and leaves this one in place if anything about that fails. */
    if (cur.kind === 'video') {
      /* 🔴 The player is BUILT ONCE and then only shown and hidden. Coming back
         to it must not touch the element at all: setting src again, even to the
         same string, reloads the media and puts the recording back to zero,
         which is the whole defect being fixed. */
      matKeep.hidden = false;
      if (matKeepSrc !== src) {
        matKeepSrc = src;
        matKeep.innerHTML =
          '<video class="sv-matvid" controls preload="metadata" playsinline ' +
            'src="' + src + '"></video>';
        upgradeFlavour(matKeep.querySelector('.sv-matvid'), matData.video_hls, src);
        buildVideoBar(matKeep.querySelector('.sv-matvid'));
      }
      matShownSrc = null;    /* the swap area is a caption now, not a document */
      /* Two true sentences, chosen by where the file actually is: a local
         copy starts with / (this server), the stream is an absolute URL. */
      matSwap.innerHTML = (src.charAt(0) === '/')
        ? '<p class="sv-matmsg quiet">Playing from your own downloaded copy on ' +
          'this server: no login, works offline. The arrow beside "' + cur.label +
          '" above opens the original instead. Your place is kept if you look at ' +
          'the slides.</p>'
        : '<p class="sv-matmsg quiet">Playing from KCL\'s video service, the same ' +
          'recording KEATS shows. The arrow beside "' + cur.label + '" above opens ' +
          'it on KEATS instead. Your place is kept if you look at the slides.</p>';
      return;
    }

    if (src === matShownSrc) return;      /* already showing it */
    matShownSrc = src;
    /* R49, 2026-08-16: "someone who's not in the program at all might still end
       up using this software, and if they do, they should still have all the
       content and just show that those links are not valid."

       🔴 So the line under a frame says what this link REQUIRES, taken from the
       server, rather than assuming the reader is EH and merely signed into
       the wrong Google account. Nothing detects whether it loaded: a blank frame
       and a login wall look identical from in here, and guessing would be the
       dishonest half of this. The old wording is kept as the fallback for a
       server that does not send `access` yet. */
    /* 🔴 A PDF this server holds gets the real viewer rather than a frame, and
       the test is the server's OWN content type rather than the filename. Both
       halves matter. A frame is what shows page one and nothing else on iOS,
       which is the defect; and reading the extension is what made a deck named
       `... (deck.pdf)` a download earlier the same day, so a viewer that keyed
       on the extension would have skipped exactly the file the reader is most
       likely to be looking at. `types` is absent on an older server, and the
       frame below is then what happens, unchanged. */
    var isLocalPdf = src.charAt(0) === '/' &&
      !!(matData.types && matData.types[cur.embed] === 'application/pdf');
    if (isLocalPdf && PDFV.can()) {
      matSwap.innerHTML = '<div class="sv-pdf"></div>' +
        '<p class="sv-matmsg quiet">' + accessLine(cur) + '</p>' +
        accessActions(cur);
      PDFV.show(matSwap.querySelector('.sv-pdf'), src);
      return;
    }

    matSwap.innerHTML = '<iframe class="sv-matframe" src="' + src +
      '" title="' + cur.what + '" allow="autoplay"></iframe>' +
      '<p class="sv-matmsg quiet">' + accessLine(cur) + '</p>' +
      accessActions(cur);
    /* Reload rather than "try again": after signing in in the other tab, the
       frame here is still showing whatever it got the first time, and there is
       no event that tells us the session changed. Re-setting src is the whole
       mechanism, and it is offered rather than done automatically because
       reloading under someone reading is worse than a button they can ignore. */
    var again = matSwap.querySelector('[data-matreload]');
    if (again) {
      again.addEventListener('click', function () {
        var frame = matSwap.querySelector('.sv-matframe');
        if (frame) frame.src = frame.src;
      });
    }
  }

  function v_embed(v) { return !!(v && v.embed && matData && matData[v.embed]); }

  /* 🔴 WHEN A LECTURE HAS BOTH, THE MIRRORED PACKAGE WINS. EH's ruling,
     2026-09-10: *"go ahead and implement that fix so we play the HTML lecture
     instead of the Kaltura lecture in our player unless we actually need it."*

     🔴 **THE PROBLEM IT ROUTES AROUND, and it routes around it rather than
     depending on it.** In one course here, `materials.json` gives `W1-T3-P1` and
     `W1-T3-P2` the SAME Kaltura entry id, while their course-site pages, their
     minutes and their file sizes all differ: they are two different lectures
     and only OUR recorded id is duplicated. **So the second one played the
     first one's recording.** Recovering the true id needs a KEATS session and
     is nobody's tonight; **preferring what is on this disk needs nothing and is
     right whatever the id says.**

     🟢 **AND IT IS THE BETTER SOURCE ANYWAY**: the package is the lecture in the
     form it was authored, served from this machine, with per-clip captions and a
     speed control that works. The stream needs the internet and KCL's service.

     ⚠️ **"UNLESS WE ACTUALLY NEED IT" IS HIS CAVEAT AND THE VIDEO PATH IS NOT
     REMOVED.** With no package, the recording plays exactly as before; with one,
     the arrow beside the tab still opens the original lecture in a new tab.

     ⚠️ **WHAT THIS DELIBERATELY DOES NOT DECIDE**: a package beside a DOWNLOADED
     recording. **Measured 2026-09-10 across all three courses on this machine
     and 122 lectures: that combination does not exist anywhere** - the one
     course that has both kinds holds 5 packages and 29 downloaded videos, and
     no lecture with both. The package wins there too,
     because one rule that cannot be got wrong beats two that need telling apart,
     **but nobody has weighed that case and this comment is where they should
     start.** */
  function packageFirst(v) {
    return !!(v && v.kind === 'video' && matData && matData.package_embed);
  }

  /* What this view needs in order to open, said plainly. `none` means the file
     is served without any session at all, so there is nothing to say. */
  /* The way out, named for what it will actually do. A KEATS link sends you to
     KEATS to sign in; a Drive link sends you to Drive to sign in; anything that
     needs nothing just opens. */
  /* R49's second half: what a tab will need, shown ON the tab.

     🔴 The requirement is per TAB and not per file, because the two differ. A
     lecture normally plays from the video service with no session at all, so
     Videos needs nothing; the nine narrated parts have no playable file, so the
     same tab falls back to its KEATS link and does need one. Marking the tab
     from `access[embed]` alone would therefore have called every Videos tab
     free, including the ones that are not.

     Empty string means "nothing needed", which is the common case and draws
     nothing. */
  function needOf(v) {
    if (!matData || !matData.access) return '';
    /* 🔴 The chip has to describe what the tab will SHOW, so it asks the same
       question `renderMaterials` asks, in the same order. Two orders here and
       there is how a tab comes to be labelled for a file it does not open. */
    var key = packageFirst(v) ? 'package_embed'
            : (v.embed && matData[v.embed]) ? v.embed
            : v.href;
    var need = key ? (matData.access[key] || '') : '';
    return (need && need !== 'none') ? need : '';
  }

  var NEED_LABEL = { keats: 'KEATS', drive: 'Drive' };

  /* The chip's own words. 🔴 `site:<host>` carries its label inside it, and
     printing the kind raw put the internal token `site:moodle.otheruni.ac.uk`
     on screen, in caps, in a 9.5px chip. Same root as `wayOut` below: a kind the
     server composed, read as a kind nobody understands. Measured before it was
     changed, on the same payload as the button. */
  function needLabel(need) {
    if (need.indexOf('site:') === 0) return need.slice(5);
    return NEED_LABEL[need] || need;
  }

  function needChip(v) {
    var need = needOf(v);
    if (!need) return '';
    var says = (matData.access_notes && matData.access_notes[need]) || '';
    return '<span class="sv-matneed" title="' + says + '" aria-label="' + says + '">'
         + needLabel(need) + '</span>';
  }

  /* 🔴 The way out, named for what it will actually DO, and derived from where
     the file is rather than fixed per view.

     The fixed version said "Open the slide deck in Drive, in a new tab" under a
     PDF sitting on this machine, and the arrow's tooltip said it too. That is
     the same mistake `access` was created to fix on 2026-08-22: a sentence about
     a service the reader may never have used, attached to their own file. It
     survived because `out:` on each VIEWS entry was written when Drive was the
     only place a deck could be. */
  function wayOut(v) {
    /* 🔴 It describes `v.href`, the link this sentence's button and arrow will
       actually OPEN, and that is the whole of the fix of 2026-08-30.

       It read `v.embed` before, the link the tab FRAMES, which is a different
       resource whenever a part has both. On every lecture of this course they
       differ by design: the tab frames the Kaltura stream, which needs no
       session at all, while the arrow opens the KEATS page, which needs a
       login. So the arrow said "Open the lecture in a new tab" over a
       `keats.kcl.ac.uk` address, two lines under a caption that correctly said
       it "opens it on KEATS instead", and every other KEATS link in the pane
       said "Sign in to KEATS and open it there".

       🔴 The shape first proposed for this, one `needKey` (the embed when there
       is one, the href otherwise) shared by `needOf`, `wayOut` and
       `accessLine`, would NOT have fixed it: on those rows the embed exists, so
       needKey returns it and the sentence does not move. Measured on the real
       course before building, which is the only reason it was caught. The three
       functions describe three different things and each must read its own key:
       the CHIP is about the tab (embed, then href), the LINE under the frame is
       about the framed document (embed), and this is about the link opened. */
    var need = (matData && matData.access && matData.access[v.href]) || '';
    if (need === 'keats') return 'Sign in to KEATS and open it there';
    if (need === 'drive') return 'Open it in Drive, where you can sign in';
    /* 🔴 `site:<host>` is NOT an unknown kind, and treating it as one was this
       same bug wearing a different hat. The server composed that string and put
       the host inside it, so falling through to `v.out` here offered a deck on
       another institution's site "in Drive", directly above a line correctly
       naming the real host: two sentences on one screen naming two different
       places, one of them wrong. It survived the fix because the fallback is
       genuinely right for a kind nobody has taught this layer, and this one only
       looks like one. And it is the path built for people who are NOT at KCL. */
    if (need.indexOf('site:') === 0) {
      return 'Open the ' + (v.noun || 'file') + ' at ' + need.slice(5) +
             ', in a new tab';
    }
    if (need === 'local' || need === 'none') {
      return 'Open the ' + (v.noun || 'file') + ' in a new tab';
    }
    return v.out || 'Open it in a new tab';
  }

  function accessActions(v) {
    var href = matData && matData[v.href];
    return '<p class="sv-matacts">' +
      (href ? '<a class="sv-matact" href="' + href + '" target="_blank" rel="noopener">' +
              wayOut(v) + '</a>' : '') +
      '<button type="button" class="sv-matact" data-matreload>Reload this view</button>' +
      '</p>';
  }

  function accessLine(v) {
    var need = (matData && matData.access && matData.access[v.embed]) || '';
    var says = (matData && matData.access_notes && matData.access_notes[need]) || '';
    /* A file on this machine needs nothing, so it is not told how to sign in to
       anything. It still gets the way out, because a viewer can fail for
       reasons that have nothing to do with permission. */
    if (need === 'local' || need === 'none') {
      return 'This ' + (v.noun || 'file') + ' is on ' + hostWord() + ', so it needs no ' +
             'sign-in. The arrow beside "' + v.label + '" above opens it in a tab.';
    }
    if (!says) {
      return 'If the ' + v.noun + ' stays blank, you are probably not signed in to ' +
             'the account that can see it. The arrow beside "' + v.label + '" above ' +
             'opens it in a tab, which will prompt you.';
    }
    return 'If the ' + v.noun + ' stays blank: ' + says + ' The arrow beside "' +
           v.label + '" above opens it in a tab, which is where you would sign in.';
  }

  /* ---------- R8 and R9: files attached to this lesson ----------

     Asked 2026-08-13, two requests that are one feature: "the ability to open
     associated slides or any other associated file or set of files that's
     associated with that lesson in a side panel or a new tab", and "ability to
     load and attach files to each lesson."

     🔴 They ship together because either one alone is unusable. R9 with no R8
     puts files somewhere you cannot look at them; R8 with no R9 is a viewer for
     a directory nothing can put anything into. Built as a fourth view in the
     pane that already holds this lesson's other material, rather than as a new
     panel, because "beside the lesson" is what he asked for and the pane is
     already that.

     Where they live is HIS decision, 2026-08-14: `resources/<DOC>/`, a directory
     of its own, "which keeps the data clean". There is no manifest; the
     directory is the record, so a file dropped in from Finder appears here and
     nothing can drift out of step. See the server for why.

     Four shapes of preview, decided by the server from the extension so the two
     cannot disagree: pdf and page get a frame, image gets an <img>, video and
     audio get a player, text gets a <pre>, and anything else says so and offers
     a tab. Nothing is guessed from the bytes. */

  var matFiles = [];           /* [{name, size, kind, url, added}] */
  var matFilesLoaded = false;
  /* Where the server says it keeps them, so the sentence below the list cannot
     drift from the directory. It spelled `resources/<DOC>` out for itself until
     courses got a folder each and it started naming one that is not there. */
  var matFolder = '';
  var matStray = null;
  var matFileShown = null;     /* the one being previewed, or null for the list */
  var matFileEditing = null;   /* the one whose title and note are open */
  var matBusy = false;

  function loadFiles(force) {
    if (matFilesLoaded && !force) return Promise.resolve(matFiles);
    return api('/api/resources?doc=' + encodeURIComponent(S.docId))
      .then(function (r) {
        matFiles = (r.body && r.body.files) || [];
        matFolder = (r.body && r.body.folder) || '';
        /* Files left in the FLAT resources/<DOC>/ from before each course had a
           folder of its own. Absent on every healthy install. */
        matStray = (r.body && r.body.stray) || null;
        matFilesLoaded = true;
        return matFiles;
      })
      .catch(function () { matFiles = []; matFilesLoaded = false; return matFiles; });
  }

  function niceSize(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return Math.round(n / 1024) + ' KB';
    return (n / 1048576).toFixed(n < 10485760 ? 1 : 0) + ' MB';
  }

  /* 🔴 Every one of these builds its row with textContent and setAttribute, not
     with an HTML string. The rest of this pane is built from strings safely,
     because everything in it comes from materials.json, which this project
     writes. A filename does not: it is whatever he called the file, it can
     contain angle brackets and quotes, and it is the one piece of text in this
     reader that arrives from outside it. */
  function fileRow(f) {
    var row = document.createElement('div');
    row.className = 'sv-file';

    var open = document.createElement('button');
    open.type = 'button';
    open.className = 'sv-filename';
    /* 🔴 The title wins over the filename when there is one, which is the whole
       point of the manifest EH asked for on 2026-08-15: a paper kept as
       "Nierenberg 2023, bipolar.pdf" is a filename, and "Nierenberg's review of
       bipolar diagnosis" is what it is. The filename is still shown underneath,
       because it is what he will look for in Finder. */
    open.textContent = f.title || f.name;
    open.title = 'Show it here';
    open.addEventListener('click', function () { matFileShown = f.name; renderFiles(); });

    var meta = document.createElement('span');
    meta.className = 'sv-filemeta';
    meta.textContent = niceSize(f.size);

    var out = document.createElement('a');
    out.className = 'sv-matout';
    out.href = f.url;
    out.target = '_blank';
    out.rel = 'noopener';
    out.title = 'Open it in a new tab';
    out.setAttribute('aria-label', 'Open ' + f.name + ' in a new tab');
    out.innerHTML = ICON_OUT;

    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'sv-filedel';
    del.textContent = 'Remove';
    /* The server renames rather than unlinks, so this wording is true: the file
       leaves the list and stays on the disk as a .bak beside where it was. */
    del.title = 'Take it off this lesson. The file itself is kept.';
    del.addEventListener('click', function () { removeFile(f.name); });

    var edit = document.createElement('button');
    edit.type = 'button';
    edit.className = 'sv-fileedit';
    edit.textContent = f.title || f.note ? 'Edit' : 'Describe';
    edit.title = 'Give it a name of your own and a note about why it is here';
    edit.addEventListener('click', function () {
      matFileEditing = (matFileEditing === f.name) ? null : f.name;
      renderFiles();
    });

    row.appendChild(open);
    row.appendChild(meta);
    row.appendChild(out);
    row.appendChild(edit);
    row.appendChild(del);

    /* The second line only exists when there is something on it: the real
       filename once a title has replaced it at the top, and the note. */
    if ((f.title && f.title !== f.name) || f.note) {
      var sub = document.createElement('div');
      sub.className = 'sv-filesub';
      if (f.title && f.title !== f.name) {
        var fn = document.createElement('span');
        fn.className = 'sv-filereal';
        fn.textContent = f.name;
        sub.appendChild(fn);
      }
      if (f.note) {
        var nt = document.createElement('span');
        nt.className = 'sv-filenote';
        nt.textContent = f.note;
        sub.appendChild(nt);
      }
      row.appendChild(sub);
    }

    if (matFileEditing === f.name) row.appendChild(describeBox(f));
    return row;
  }

  /* The little form for one file's title and note. Built and thrown away with
     the row, because nothing about it is worth keeping open. */
  function describeBox(f) {
    var box = document.createElement('div');
    box.className = 'sv-filedesc';

    var t = document.createElement('input');
    t.type = 'text';
    t.className = 'sv-desctitle';
    t.placeholder = 'Call it something';
    t.value = f.title || '';
    t.maxLength = 200;

    var n = document.createElement('input');
    n.type = 'text';
    n.className = 'sv-descnote';
    n.placeholder = 'Why it is here';
    n.value = f.note || '';
    n.maxLength = 200;

    var save = document.createElement('button');
    save.type = 'button';
    save.className = 'sv-descsave';
    save.textContent = 'Save';

    function commit() {
      save.disabled = true;
      api('/api/resources/about', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ doc: S.docId, name: f.name,
                               title: t.value, note: n.value })
      }).then(function (r) {
        save.disabled = false;
        if (!r.body || !r.body.ok) {
          return filesToast('Could not save that: ' + ((r.body && r.body.error) || 'refused'));
        }
        matFileEditing = null;
        return loadFiles(true).then(renderMaterials);
      })['catch'](function () {
        save.disabled = false;
        filesToast('Could not reach the server.');
      });
    }
    save.addEventListener('click', commit);
    /* Enter saves from either box, which is how every other small form in this
       reader behaves. */
    [t, n].forEach(function (el) {
      el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); commit(); }
        if (e.key === 'Escape') { e.stopPropagation(); matFileEditing = null; renderFiles(); }
      });
    });

    box.appendChild(t);
    box.appendChild(n);
    box.appendChild(save);
    window.setTimeout(function () { t.focus(); t.select(); }, 0);
    return box;
  }

  /* What to call the machine holding the files, in a sentence a reader sees.
     Three places said "the Mini" until 2026-08-30: this folder sentence and
     both reconnect messages. The Mini is EH's machine, so on the friend's
     laptop the kit named a computer he had never heard of.

     🔴 The loopback branch is not a heuristic. A page reached over 127.0.0.1
     came from THIS machine, always, because nobody can reach another machine's
     loopback; the implication only runs that way, and that is the direction
     this sentence needs. The kit's launcher opens `http://127.0.0.1:<port>/`,
     so every recipient takes this branch every time and never sees a name at
     all. Reaching the server the long way round while sitting at it (which is
     what EH does, on the tailnet address, on both machines) falls to the other
     branch and gets the machine's real name, which is redundant but true.

     The one counterexample is an SSH port-forward, which presents a REMOTE
     browser as loopback and would have it told "this machine". EH reaches this
     server over Tailscale, which presents a real address, so it cannot bite
     here; recorded because the next person to read this line will think of it,
     not because anything guards against it.

     The name is the server's own, stamped at compose time; the layer never
     guesses it. Empty means nothing served this page, or a server too old to
     stamp it, and "the study server" is true in both. */
  function hostWord() {
    if (/^(localhost|\[?::1\]?|127\.\d+\.\d+\.\d+)$/.test(location.hostname)) {
      return 'this machine';
    }
    return (S && S.machineName) || 'the study server';
  }

  function renderFiles() {
    matSwap.innerHTML = '';

    if (matFileShown) return renderFilePreview();

    var wrap = document.createElement('div');
    wrap.className = 'sv-files';

    if (!matFiles.length) {
      var empty = document.createElement('p');
      empty.className = 'sv-filesempty';
      empty.textContent = 'Nothing is attached to this lesson yet. Add a paper, a ' +
        'handout, a screenshot, anything you want beside it while you read.';
      wrap.appendChild(empty);
    } else {
      matFiles.forEach(function (f) { wrap.appendChild(fileRow(f)); });
    }

    var foot = document.createElement('div');
    foot.className = 'sv-filesfoot';

    /* A real <input type=file> behind a label, rather than a button that calls
       click() on a hidden one: the label IS the control as far as the browser is
       concerned, so it is keyboard reachable and works on a phone, where the
       same tap offers the camera and the files app. */
    var lab = document.createElement('label');
    lab.className = 'sv-fileadd';
    lab.textContent = matBusy ? 'Adding…' : 'Attach files';
    var input = document.createElement('input');
    input.type = 'file';
    input.multiple = true;
    input.addEventListener('change', function () {
      var picked = Array.prototype.slice.call(input.files || []);
      input.value = '';                    /* so the same file can be re-picked */
      addFiles(picked);
    });
    lab.appendChild(input);

    var hint = document.createElement('span');
    hint.className = 'sv-fileshint';
    hint.textContent = 'or drop them here';

    foot.appendChild(lab);
    foot.appendChild(hint);
    wrap.appendChild(foot);

    var note = document.createElement('p');
    note.className = 'sv-matmsg quiet';
    note.textContent = 'Kept ' + (matFolder ? 'in ' + matFolder + ' ' : '') +
      'on ' + hostWord() +
      ', beside the lesson rather than inside it, so nothing here changes the ' +
      'lesson itself.';

    /* 🔴 Files that are on this disk and reachable by no address at all.
       `place_legacy_resources` moves a flat `resources/<DOC>/` into its course
       only when ONE course exists; with two it cannot know which course owns
       them, so it correctly moves nothing. That restraint is right. What was
       wrong is that it said so only in the server log, once, at startup, and
       the person looking for the file is looking at THIS PANE.

       It names no owner and moves nothing: it reports the fact where the reader
       already is and asks them to choose. Both folder names come from the
       server, derived, because the pane used to spell `resources/<DOC>` out as
       a literal and quietly stopped being true. */
    var stray = null;
    if (matStray && matStray.count) {
      stray = document.createElement('p');
      stray.className = 'sv-matmsg quiet';
      stray.textContent =
        matStray.count + (matStray.count === 1 ? ' file is' : ' files are') +
        ' also in ' + matStray.from + ', from before each course had its own ' +
        'folder. Move ' + (matStray.count === 1 ? 'it' : 'them') + ' into ' +
        matStray.to + ' and ' + (matStray.count === 1 ? 'it' : 'they') +
        ' will appear here.';
    }
    matSwap.appendChild(wrap);
    matSwap.appendChild(note);
    /* 🔴 UNDER the folder note and above the missing-tabs line, and appended
       here rather than returned early: an earlier draft of this returned before
       `wrap`, which would have taken the file list and the Attach control down
       with it. The sentence is about files you cannot see; removing the ones
       you can would be a poor trade. */
    if (stray) matSwap.appendChild(stray);

    /* 🔴 Why there is no Slides or Videos tab beside this one. Without it, a
       course with no materials index shows a lone Files tab and no account of
       the missing ones, which is a different kind of silence from the one the
       switcher fix removed. The message is the server's own, so it keeps
       saying what to do about it. */
    if (matErr) {
      var why = document.createElement('p');
      why.className = 'sv-matmsg quiet';
      why.textContent = matErr;
      matSwap.appendChild(why);
    }
  }

  function renderFilePreview() {
    var f = matFiles.filter(function (x) { return x.name === matFileShown; })[0];
    if (!f) { matFileShown = null; return renderFiles(); }

    var bar = document.createElement('div');
    bar.className = 'sv-fileback';
    var back = document.createElement('button');
    back.type = 'button';
    back.className = 'sv-matbtn';
    back.textContent = '‹ All files';
    back.addEventListener('click', function () { matFileShown = null; renderFiles(); });
    var name = document.createElement('span');
    name.className = 'sv-filemeta';
    name.textContent = f.title || f.name;
    bar.appendChild(back);
    bar.appendChild(name);
    matSwap.appendChild(bar);

    if (f.note) {
      var note = document.createElement('p');
      note.className = 'sv-matmsg quiet';
      note.textContent = f.note;
      matSwap.appendChild(note);
    }

    if (f.kind === 'image') {
      var img = document.createElement('img');
      img.className = 'sv-fileimg';
      img.src = f.url;
      img.alt = f.name;
      matSwap.appendChild(img);
      return;
    }
    if (f.kind === 'video' || f.kind === 'audio') {
      var media = document.createElement(f.kind === 'video' ? 'video' : 'audio');
      media.className = f.kind === 'video' ? 'sv-matvid' : 'sv-fileaudio';
      media.controls = true;
      media.setAttribute('playsinline', '');
      media.setAttribute('preload', 'metadata');
      media.src = f.url;
      matSwap.appendChild(media);
      if (f.kind === 'video') buildVideoBar(media);
      return;
    }
    if (f.kind === 'pdf' || f.kind === 'page') {
      var frame = document.createElement('iframe');
      frame.className = 'sv-matframe';
      frame.src = f.url;
      frame.title = f.name;
      matSwap.appendChild(frame);
      return;
    }
    if (f.kind === 'text') {
      var pre = document.createElement('pre');
      pre.className = 'sv-filetext';
      pre.textContent = 'Loading…';
      matSwap.appendChild(pre);
      api(f.url, { raw: true })
        .then(function (r) { pre.textContent = r.text || '(empty)'; })
        ['catch'](function () { pre.textContent = 'Could not read it.'; });
      return;
    }

    var why = document.createElement('div');
    why.className = 'sv-matwhy';
    var p = document.createElement('p');
    p.textContent = 'This one cannot be shown here. Please open it in a separate tab.';
    var sub = document.createElement('p');
    sub.className = 'sv-matwhy-sub';
    sub.textContent = 'The browser has no built-in viewer for this kind of file, so ' +
      'opening it will hand it to whichever app on your machine does.';
    var a = document.createElement('a');
    a.href = f.url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = 'Open it in a tab';
    why.appendChild(p); why.appendChild(sub); why.appendChild(a);
    matSwap.appendChild(why);
  }

  function filesToast(text) { try { S.toast(text); } catch (e) {} }

  /* One at a time rather than in parallel, deliberately: a 64MB cap times four
     files is enough to matter on a home connection, and the count in the label
     is only honest if they land in order. */
  function addFiles(picked) {
    if (!picked || !picked.length || matBusy) return;
    matBusy = true;
    renderFiles();

    var done = 0, failed = [];
    function next() {
      if (!picked.length) {
        matBusy = false;
        return loadFiles(true).then(function () {
          renderMaterials();
          if (failed.length) {
            filesToast(failed.length === 1
              ? ('Could not attach ' + failed[0].name + ': ' + failed[0].why)
              : (failed.length + ' files could not be attached. ' + failed[0].why));
          } else {
            filesToast(done === 1 ? 'Attached.' : ('Attached ' + done + ' files.'));
          }
        });
      }
      var file = picked.shift();
      return api('/api/resources?doc=' + encodeURIComponent(S.docId) +
                 '&name=' + encodeURIComponent(file.name),
                 { method: 'POST', body: file })
        .then(function (r) {
          if (r.body && r.body.ok) done++;
          else failed.push({ name: file.name, why: (r.body && r.body.error) || 'refused' });
        })
        ['catch'](function () {
          failed.push({ name: file.name, why: 'the server did not answer' });
        })
        .then(next);
    }
    next();
  }

  function removeFile(name) {
    if (matBusy) return;
    matBusy = true;
    api('/api/resources/remove', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ doc: S.docId, name: name })
    }).then(function (r) {
      matBusy = false;
      if (!r.body || !r.body.ok) {
        return filesToast('Could not remove it: ' + ((r.body && r.body.error) || 'refused'));
      }
      if (matFileShown === name) matFileShown = null;
      return loadFiles(true).then(function () {
        renderMaterials();
        filesToast('Removed. The file is kept on the disk beside where it was.');
      });
    })['catch'](function () {
      matBusy = false;
      filesToast('Could not reach the server.');
    });
  }

  /* Drop anywhere on the pane, not only on the Files view, and switch to it.
     🔴 dragover must be cancelled or the browser navigates the whole reader to
     the dropped file, which loses whatever is unsaved and is a genuinely bad
     way to find out that dropping is not supported. */
  (function installDrop() {
    var depth = 0;
    function hasFiles(e) {
      var t = e.dataTransfer && e.dataTransfer.types;
      if (!t) return false;
      for (var i = 0; i < t.length; i++) if (t[i] === 'Files') return true;
      return false;
    }
    matPanel.addEventListener('dragenter', function (e) {
      if (!hasFiles(e)) return;
      e.preventDefault();
      depth++;
      matPanel.classList.add('sv-dropping');
    });
    matPanel.addEventListener('dragover', function (e) {
      if (!hasFiles(e)) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
    });
    matPanel.addEventListener('dragleave', function () {
      depth = Math.max(0, depth - 1);
      if (!depth) matPanel.classList.remove('sv-dropping');
    });
    matPanel.addEventListener('drop', function (e) {
      if (!hasFiles(e)) return;
      e.preventDefault();
      depth = 0;
      matPanel.classList.remove('sv-dropping');
      matView = 'files';
      matFileShown = null;
      addFiles(Array.prototype.slice.call(e.dataTransfer.files || []));
    });
  }());

  /* Kaltura publishes two flavours of each lecture, 640x360 and 854x480, and the
     URL the server derives resolves to the smaller one. This reads the HLS
     manifest, which lists both with their bitrates, and swaps the player over to
     the better one. The variant it names is an HLS playlist; the same path under
     /pd/ is the progressive MP4 beside it, which is the file a plain <video> can
     take. Verified against three entries before it was written.

     Everything here is best effort by design. It is one fetch on a network that
     may be slow, and a 360p lecture that plays beats a 480p one that hangs, so a
     failure, a timeout or an unrecognised manifest all simply leave the player
     alone. It also stands down the moment he presses play, because replacing the
     src would restart the video under him. */
  function upgradeFlavour(vid, hls, current) {
    if (!vid || !hls || !window.fetch) return;
    var spent = false;
    var giveUp = setTimeout(function () { spent = true; }, 4000);
    fetch(hls).then(function (r) {
      return r.ok ? r.text() : '';
    }).then(function (txt) {
      clearTimeout(giveUp);
      if (spent || !txt || !vid.isConnected) return;
      if (vid.currentTime > 0 || !vid.paused) return;   /* he has started it */
      var lines = txt.split('\n'), bestBw = -1, best = null;
      for (var i = 0; i < lines.length; i++) {
        var bw = /BANDWIDTH=(\d+)/.exec(lines[i]);
        if (!bw) continue;
        var next = (lines[i + 1] || '').trim();
        if (next.indexOf('http') !== 0) continue;
        if (parseInt(bw[1], 10) > bestBw) { bestBw = parseInt(bw[1], 10); best = next; }
      }
      if (!best) return;
      var mp4 = best.split('?')[0].replace('/scf/hlsr/p/', '/pd/p/').replace(/\/index\.m3u8$/, '');
      if (mp4 === best || mp4 === current) return;      /* nothing was rewritten */
      matShownSrc = mp4;
      vid.src = mp4;
    })['catch'](function () { clearTimeout(giveUp); });
  }

  matBar.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-view]');
    if (!b) return;
    matView = b.getAttribute('data-view');
    renderMaterials();
  });

  function openMaterials() {
    /* All three dock to the same edge, so opening one closes the others rather
       than stacking them invisibly on top of each other.

       🔴 R21 changed HOW they are closed, and the old way was wrong twice.
       It set .hidden on each panel directly: on the chat panel that skipped
       clearFocus(), leaving R4's focus rectangles drawn over a lesson that had
       just reflowed under them, and on the notes panel it skipped the lesson's
       own handler, leaving the lesson believing its panel was open while it was
       shut. Both now go through the routes that own them.

       hlPanel and hlFab are declared further down the file and are undefined
       while this function is being DEFINED. They are assigned long before it can
       be CALLED, since nothing reaches this except a click. */
    if (!panel.hidden) closePanel();
    if (hlPanel && !hlPanel.hidden && hlFab) { hlFab.click(); }

    matPanel.hidden = false;
    matFab.setAttribute('aria-expanded', 'true');
    /* Both, because the Files tab carries a count and the count has to be right
       the first time the bar is drawn rather than a moment later. Refetched on
       every open rather than cached for the session: he can put a file in the
       folder from Finder while this tab is sitting open, and the directory being
       the record is worth nothing if the reader does not go back and look. */
    Promise.all([loadMaterials(), loadFiles(true)]).then(renderMaterials);
  }
  function closeMaterials() {
    matPanel.hidden = true;
    matFab.setAttribute('aria-expanded', 'false');
  }
  matFab.addEventListener('click', function () {
    if (matPanel.hidden) openMaterials(); else closeMaterials();
  });
  matPanel.querySelector('[data-close]').addEventListener('click', closeMaterials);

  /* ---------- back and forward through the module ----------

     Asked 2026-08-13: "I want to be able to navigate without going out into the
     index... a back and forward button, probably at the very top or at the very
     bottom of the page." Both, because the two are wanted at different moments:

     still stays in the findable place but there is also a notification. Maybe
     something similar happens when there is a newer version of the software
     available." And 2026-09-07: "that item about the reader showing when it is
     time to update to the latest version off of GitHub: let us have Coder
     actually implement that right now."

     neither was surfaced: `update_status()` has computed {newer, latest, url,
     note} against the release feed since the kit shipped, cached half a day,
     and `restart_status()` compares the running build id with the one on disk.
     The reader never asked either. So this is wire, and the smallness is the
     point.

     Settings (his own R16) and is not duplicated here: the notice OPENS
     Settings and focuses it. Two restart implementations would drift the first
     time one was touched, and this file has been bitten by exactly that before
     ("moved, not mirrored", the marks buttons).

     🔴 NO BLOCK-LEVEL TAG IN HERE. Marks anchor to the index of a block inside
     `.wrap` (p, li, h1-h4, dd, dt, figcaption, blockquote, td, th), so a single
     <p> in this line would renumber every block after it and silently move
     every highlight on the page. aside, span, a and button are invisible to
     that count, which is why the markup below looks the way it does.

     🔴 IT MUST FAIL SILENT. No token, no network, a rate-limited feed, an
     unreadable build id and a kit with no update URL configured must all render
     as nothing at all. "We could not check for updates" is noise about our own
     plumbing, and a recipient reading on a train must see an ordinary page. The

    try { return JSON.parse(window.localStorage.getItem(NOTICE_KEY)) || {}; }
    catch (e) { return {}; }
  }

  function noticeDismiss(kind, token) {
    /* 🔴 Keyed to the STATE, never to the notice. Dismissing "relaunch for
       c1291f1f" remembers that build id, so the line stays gone until the code
       on disk changes again and then returns on its own. A boolean "dismissed"
       would silence the next real one, which is the failure that makes a
       notification surface worthless. */
    var m = noticeSeen();
    m[kind] = token;
    try { window.localStorage.setItem(NOTICE_KEY, JSON.stringify(m)); } catch (e) {}

  function noticeFor(d) {
    /* The server's answer in, one {kind, token, text, act, href} or null out.
       Pure, so the decision can be driven in a test without a DOM. */
    if (!d || d.ok === false) return null;
    if (d.restart_owed === true && d.disk_build) {
      /* 🔴 REWRITTEN 2026-09-09 from EH's own confusion: "Even I misunderstood
         it just now." He read this, pressed Command-Shift-R, and the line
         stayed, because the condition is that the SERVER is running old code
         and no amount of reloading a page changes which process is serving it.

         Three things were wrong and all three are fixed here rather than in
         the button alone. "Relaunch IT" left the object unnamed, and a reader
         looking at a browser page reads "it" as the page: THE ONE REFERENT
         THAT CANNOT WORK. Nothing said a refresh would not help, which is the
         first thing anybody tries. And "Open Settings" named a navigation step
         instead of an outcome, so nothing on screen said this was the thing
         that fixes what you are reading. */
      return { kind: 'restart', token: String(d.disk_build),
               text: 'The server on ' + hostWord() + ' has been updated, and this page '
                   + 'is still being served by the version that was running '
                   + 'before. Refreshing will not clear this: the server itself '
                   + 'has to be relaunched. It goes away for a moment and this '
                   + 'page comes back on its own.',

    }

       owed is about work already on the disk; an update is about work that is
       not. Stacking them would put the quieter sentence next to the urgent one
       and teach the reader to skim both. */

                   + String(d.latest).split('+')[0] + ').'

    box.className = 'sv-notice sv-notice-' + n.kind;
    box.setAttribute('role', 'status');
    var txt = document.createElement('span');
    txt.className = 'sv-notice-txt';
    txt.textContent = n.text;
    box.appendChild(txt);
    if (n.href) {
      var a = document.createElement('a');
      a.className = 'sv-notice-act';
      a.href = n.href;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = 'What changed';
      box.appendChild(a);
    } else if (n.act) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'sv-notice-act';
      b.textContent = n.act;

         right and it is KEPT: what is shared is the ROUTINE (`relaunchServer`),
         not a second copy of the restart. What changed is that reaching a
         control two clicks away, in a panel, under a different word, is not an
         answer to a reader who has just been told something is wrong here.

         ⚠️ It stays a deliberate click and is never automatic: a restart drops
         whatever is in flight. */
      b.addEventListener('click', function () {
        if (b.disabled) return;
        b.disabled = true;

          if (state === 'going') {

                            + 'on its own.';
            return;
          }
          if (state === 'up') {
            /* 🔴 RELOADING IS THE POINT, not a courtesy. The banner exists to
               say "you are reading a page built by old code"; a restart that
               leaves the reader on that same page has reported success and
               changed nothing they can see, which is the defect repeating
               itself one step further along. */
            try { window.location.reload(); } catch (e) {}

    x.className = 'sv-notice-x';
    x.setAttribute('aria-label', 'Dismiss');
    x.textContent = '\u00d7';
    x.addEventListener('click', function () {
      noticeDismiss(n.kind, n.token);

    });
    box.appendChild(x);
    wrap.insertBefore(box, wrap.firstChild);
    return box;
  }

  function checkNotice() {
    /* 🔴 ONE call per page load, and no timer. The network round trip lives on
       the SERVER side of this, cached there for half a day, so a reader opening
       twenty lessons makes twenty local requests and at most one request to
       GitHub. A timer here would also break `test_sidecar_loaded.py`, which
       asserts this file schedules nothing on an interval anywhere. */
    return api('/api/update').then(function (r) {
      return showNotice(noticeFor(r && r.body));
    })['catch'](function () { return null; });
  }

  (function installNav() {

    wrap.appendChild(bottom);

       token. /api/materials serves the same thing but every /api/ path is
       token-gated, so on an unpaired device this used to leave both strips
       hidden: the reader could read the lesson they landed on and go nowhere,
       while the dismiss control invited exactly that by saying "read without
       it". The server now derives the neighbours at compose time and stamps
       them, the same way it stamps SERVED_FROM and COURSE_NAME.

       Null on a page composed before this existed, and then the API path below

    var stamped = (S && S.lessonNav) || null;

      fillNav(bottom, stamped);

      fillNav(top, d);

       to null and renders nothing on every failure path, and nothing else in
       the page waits on it. */
    try { checkNotice(); } catch (e) {}
  }());

  /* ---------- tables that scroll sideways say so ----------

     See the .tblwrap rules above for why this adds no container: every table
     in the module is already inside one that already scrolls. This marks the
     ones that are actually overflowing right now, which is not a fixed set:
     the same table scrolls or does not depending on the window width and on
     whether a panel is open and has narrowed the column. So it is recomputed
     rather than decided once at load. */

  var tblwraps = [];

  /* Which edges have something behind them, so only those get faded. */
  function markEdges(w) {
    w.classList.toggle('sv-atstart', w.scrollLeft <= 1);
    w.classList.toggle('sv-atend', w.scrollLeft + w.clientWidth >= w.scrollWidth - 1);
  }

  function updateTableScroll() {
    for (var i = 0; i < tblwraps.length; i++) {
      var w = tblwraps[i];
      /* A pixel of tolerance: sub-pixel column widths can leave scrollWidth a
         fraction above clientWidth on a table that visibly fits. */
      var over = w.scrollWidth - w.clientWidth > 1;
      var fig = w.classList.contains('figbox');
      w.classList.toggle('sv-canscroll', over);

      /* 🔴 The stop is PERMANENT, and only the label changes. It used to be
         added and removed with the overflow, so that a table which fitted was
         not a stop on the way down the page. EH was asked on 2026-08-15
         whether he ever reads without the trackpad and said sometimes, which
         settles it: what a keyboard reader cannot live with is the Tab order
         moving under them, and the old version moved it on every resize and
         every time the pane opened. The cost is about eight extra stops in a
         typical lesson and eleven in the worst, which is a price worth paying
         for an order that holds still.

         announces itself as a table rather than as one that scrolls. */
      w.setAttribute('tabindex', '0');
      w.setAttribute('role', 'region');

        w.classList.remove('sv-atend');

  /* R29: the 48 diagrams get the same treatment as the 124 tables. `.figbox`

     adds the affordance and never the scrolling. One list, because the two
     behave identically once they overflow; only the aria-label differs. */
  /* ---------- the nine panes that scroll DOWN say so out loud ----------

     🔴 THE DEFECT, filed by the coder that shipped the visual half and built
     here: `4393833` gave nine scrolling panes a band at the bottom that means
     "there is more below", and it is VISUAL ONLY. A keyboard user and a screen
     reader user get nothing at all. **Discovery is EH's actual complaint**, so

     accessibility nicety bolted on afterwards.

     three decisions taken the same way, so a reader who learns one knows the
     other.

     is pure CSS and holds no state: two background layers, one `local` and one
     `scroll`, which coincide at the end of the content ("truthful by
     construction, no scroll listener, no state, no layout"). There is nothing
     to read. So the announcement asks the same question the browser asks when
     it decides to paint a scrollbar: `scrollHeight - clientHeight > 1`. ⚠️ One

     sub-pixel content can leave a pane a fraction over on a pane that visibly

     case's doctrine and it was settled by EH himself on 2026-08-15: what a
     keyboard reader cannot live with is the Tab order moving under them. A stop
     that appears and disappears as a chat thread grows, a panel opens or a
     window resizes is exactly that. ⚠️ The entry's fourth property warns about
     interposing nine new stops between a reader and the controls they came for,
     and the reason this does not is that these panes live inside PANELS: a
     `display: none` or `hidden` pane holds no focusable anything, so what is
     actually added to the tab order at any moment is the one or two panes on

     here, which is why it can be in the set at all: it is excluded from the

     exactly this condition. A probe that looked for the band's class would

  var SCROLLPANES = [
    ['.sv-mini .out', 'Answer'],
    ['.sv-body', 'Panel'],
    ['.sv-edit .body', 'Note'],
    ['.sv-filetext', 'File'],
    ['.sv-panel .thread', 'Chat'],
    ['.sv-hist', 'History'],
    ['.sv-pal', 'Colours'],
    ['.sv-set', 'Settings'],
    ['.sv-pdf', 'Slides']

  function markPaneScroll(el, name) {
    var over = false;
    try { over = el.scrollHeight - el.clientHeight > 1; } catch (e) { return; }
    /* The label tells the reader what to DO, not what the element is called,

       loop over what exists today. `updateTableScroll` is already called from
       the resize handler and from the pane-drag path; this rides both, and the

    try { window.addEventListener('resize', updatePaneScroll); } catch (e) {}

  /* ---------- a written note reads as text until you ask to edit it ----------

     buttons so that the note edit boxes don't stay open at all times, so they
     don't get edited by mistake."

     renderNotes() lives inside each of the 29 lesson files, in a closure, so
     it can be neither called nor replaced from here. So this does what the
     palette does: it lets the lesson render, and then decorates the result.

     🔴 The textarea is hidden, never removed. Everything that makes a note
     save is attached to that element by the lesson: hiding it keeps the
     listener, the value and the autosave, and means nothing in this file ever
     writes to the note's text. The read view is a sibling that mirrors it.

     He asked a question inside the request and was told autosave stays, on a
     debounce, as the crash net, with the button as the thing that closes the
     box. Both are true here: Save closes the editor, it does not perform the
     save, because the save already happened on the keystroke. */

  function svNoteMode(wrap, editing) {
    var ta   = wrap.querySelector('textarea');
    var view = wrap.querySelector('.sv-noteview');
    var btn  = wrap.querySelector('.sv-editnote');
    if (!ta || !view || !btn) return;
    if (!editing) {
      /* Mirror the text across at the moment of closing, so the view shows what
         was actually typed rather than what was there when it was drawn. */
      view.textContent = ta.value.trim() ? ta.value : 'Empty note';
      view.classList.toggle('blank', !ta.value.trim());
    }
    ta.hidden = !editing;
    view.hidden = editing;
    btn.textContent = editing ? 'Save' : 'Edit';
    btn.setAttribute('aria-label', editing ? 'Save this note and close the editor'
                                           : 'Edit this note');
    if (editing) { try { ta.focus(); } catch (e) {} }

  function decorateNotes(box) {
    Array.prototype.forEach.call(box.querySelectorAll('.hl-note'), function (wrap) {

      if (!ta || ta.dataset.svWrapped === '1') return;
      ta.dataset.svWrapped = '1';

      var view = document.createElement('div');
      view.className = 'sv-noteview';
      wrap.insertBefore(view, ta);

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'mini sv-editnote';
      btn.addEventListener('click', function () { svNoteMode(wrap, ta.hidden); });

      /* Before Remove, so the destructive control stays last. */
      var row = wrap.querySelector('.row');

      if (row) { row.insertBefore(btn, del || null); }

      svNoteMode(wrap, !ta.value.trim());

    svPaintUnsaved();

     it keeps working with no change at all: the `noted` class on the mark, the

  function svSyncNotes(it) {
    it.n = svNotes(it).map(function (n) { return (n.t || '').trim(); })

    S.marks().items.forEach(function (it) { if (String(it.id) === String(id)) found = it; });

     a line was written. They are listed once, here, rather than repeated:

        crossing two blocks is several items sharing `g`; the panel's fold takes
        the ANCHOR's colour while painting stamps `data-c` from each item's OWN

        which is the exact bug this file has already fixed twice. `Remove` is
        the precedent: one selection made it, one action changes it.
     2. **Re-render, never patch attributes.** The engine paints `.q` and `.d`

        `background` and `border-left-color`. Patch `data-c` alone and a former

        about the next new one. This is the trap most likely to ship unnoticed,
        because nothing on screen contradicts it until the next highlight comes
        out wrong.

        colour retires it and offers to keep its highlights, so a mark can be
        stranded on a colour the picker hides. The picker lists only LIVE
        swatches, so a stranded mark can move off; the row's own chip and label
        come from the mark's real entry even when retired.
     5. **Card (`d`) is excluded, and shown DISABLED rather than hidden.** `d`
        is not cosmetic: the vault publication buckets on it and writes `term:::`
        syntax, and the card sidecar is joined by mark id. Recolouring INTO `d`
        would make a card row with no definition; recolouring OUT of `d` would
        leave the card record orphaned on disk. A row that simply lacked the
        control would look different for no stated cause, so it carries the
        reason instead. Whether that is what EH wants is a decide-lane entry. */

  function svColourEntry(id) {
    var found = null;
    (palette || []).forEach(function (c) { if (c.id === id) found = c; });

  function svLiveColours() {

       `d` is fixed and is not a colour, and a retired entry is one the reader
       has already chosen to stop seeing. */
    return (palette || []).filter(function (c) { return c.id !== 'd' && !c.retired; });

  /* 🔴 What the RECOLOUR picker offers, which is not the same list. EH answered
     the decide entry on 2026-08-30 with option (b): Card joins it. That is a

     gave are now handled rather than avoided (into `d` fires the lookup; out of

     colour, in his own words of 2026-08-23: "completely separate from all other
     highlight colors ... a separate functionality". `renderPalette` still uses
     `svLiveColours`, so nothing about Card became editable. And it still never
     becomes the sticky default, because `svRecolour` does not touch
     `lastColour` and neither does anything here. */

    var card = svColourEntry('d');
    return card ? svLiveColours().concat([card]) : svLiveColours();

  /* 🔴 A card whose mark has been deleted stops being SHOWN by `cardRows` and,
     until now, stayed on disk for ever. EH's entry named this as the join
     nobody would think of, and demoting is what makes it invisible: a cleanup
     that only looked at marks still coloured `d` would never see a card that
     was recoloured away and then removed. So this reconciles against mark ids
     rather than against colour. */

     what lets a wipe be told apart from a re-render. Called with nothing, this
     reads the live list and keeps the guard below; called with an array, that
     array IS the answer, empty or not. The wipe is the only caller that knows
     the difference, because it is the only one that knows the emptiness is
     intended. */
  function pruneOrphanCards(survivors) {
    if (!cardsLoaded) return false;
    var told = Array.isArray(survivors);
    var items = told ? survivors : (((S.marks() || {}).items) || []);
    /* 🔴 AN EMPTY MARK LIST IS NOT EVIDENCE THAT EVERY MARK WAS DELETED. It is
       also what a transient re-render looks like from here, and pruning on it
       would wipe every definition on the lesson, silently, with nothing to
       recover them from. That failure is far worse than the one this fixes, so
       the empty case is skipped.

       🔴 THE COST IS NOT ONE ORPHAN. This comment said it was, and
       study-hub-qa DISPROVED that on 2026-08-30. Deleting marks one at a
       time does cost exactly one. `Settings -> Clear all` empties the list in a
       SINGLE change, so this fires once with every card still on disk and
       leaves ALL of them, PERMANENTLY: every later load also starts from an
       empty list, so the prune can never run again. Two highlights leave two,
       ten leave ten.

       🔴 FIXED 2026-08-30 by TELLING the prune, not by relaxing this. `Clear
       all` now calls `pruneOrphanCards([])`, asserting the survivor list, so
       the wipe prunes and a re-render still cannot. The guard below is
       unchanged and still refuses an empty list it merely READ, which is the
       bug it was written for.

       ⚠️ The manager checked the other shape QA proposed and its premise is
       false: the wipe's backup at `study_server.py:3915` writes the MARKS
       document only, so dropping the sidecar there would be a delete with no
       safety net. It is also a second place that deletes cards, and two
       implementations of one idea drift.

       was absent: after a clear, a new highlight takes id 0 and collides with
       an orphan, but promoting it fires a FRESH lookup and overwrites the
       record instead of inheriting the dead definition. Tidiness, not
       integrity. */
    if (!told && !items.length) return false;

    items.forEach(function (x) { live[String(x.id)] = true; });
    var dropped = false;
    Object.keys(cards).forEach(function (k) {
      var from = (cards[k] || {}).from;
      /* Chat and typed cards never had a mark, so they cannot have lost one. */
      if (from === 'chat' || from === 'typed') return;
      if (live[k]) return;
      delete cards[k];
      dropped = true;

  }

  function svGroupOf(it) {
    var all = S.marks().items;
    // 🔴 `x.g && ...` is the load-bearing half, not the early return. Most of a
    // reader's highlights have NO `g` at all (the shell mints none for "a
    // single-block selection touching nothing"), and `undefined === undefined`
    // is true, so without it the ungrouped case is not an edge case that fails
    // loudly: it is a set that silently contains every other ungrouped mark.
    // Recolouring one would then rewrite the whole lesson through replaceMarks
    // and save(), with no undo and nothing on screen saying so. The early
    // return is now a fast path rather than the only thing preventing that.
    if (!it.g) return [it];
    return all.filter(function (x) { return x.g && x.g === it.g; });

    /* Trap 2: the full re-render, which clears the engine's stale classes and
       re-runs tagMarks through S.onChange. Patching `data-c` is what leaves a
       former Card outlined and a former Flag amber.

       🔴 `replaceMarks` is the seam, and it is the RIGHT one rather than a
       convenient one. `renderMarks` and `renderPanel` are inside the shell's
       IIFE and are not on the surface; `replaceMarks` is, and it does exactly
       `save(); renderMarks(); renderPanel();`. Its own comment says it is how
       marks arrive from outside, which stretches a little here, but the
       alternative is widening the surface for a second re-render path, and two
       ways to redraw the panel is how they drift. The same arrays go back in,
       so the id sequence it recomputes is unchanged. */
    S.replaceMarks(m.items, m.notes);
  }

  function svRecolourControl(it) {

    var label = (entry && entry.label) || (it.c || 'k');

    btn.type = 'button';
    btn.className = 'mini sv-recolour';

    var chip = document.createElement('span');
    chip.className = 'sv-rechip';

       shows what it is actually on rather than a guess. */

      if (btn._pick && btn._pick.parentNode) {

           has none, which is what made this a defect rather than a preference.
           The ink is computed from the swatch's own luminance because a swatch

               promotion produces a card row with no definition, which is the
               silent-wrong shape trap 5 was protecting against.

               🔴 And resolve the mark the CARDS PANE will actually list, not
               the row that was clicked. A selection crossing two blocks is
               several marks sharing `g`, and the pane lists one card per group

            var rep = null;

            });

             what the decide entry specified and what he approved the shape of.
             It is also the only safe direction: a definition is looked-up work
             and an accidental recolour is one click, while an unread row in a
