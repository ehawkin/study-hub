  /* Drives the reflow rules in this layer's stylesheet, so an open panel takes
     layout space from the note instead of covering its figures.

     Measured rather than hard-coded, because the two docked panels are
     different widths and are owned by different files: .sv-panel is created
     here, .hl-panel belongs to the note's own script. Watching the `hidden`
     attribute on both means the note's notes panel is handled without editing
     29 note files, and anything that opens or closes either panel by any route
     keeps the reservation correct. */
  /* ---------- a full-screen pane is a separate screen ----------

     Asked 2026-08-15: "Think of mobile when you go to chat materials or notes:
     you should kind of be on a completely separate screen or overlay from the
     main lesson." He had photographed a scroll indicator running down the right
     edge with nothing on screen to scroll: the pane is `position: fixed`, which
     takes it out of the flow but does nothing to stop the page behind moving
     under it. On a desktop that is correct and even useful, because the pane is
     a sidebar and the lesson beside it is still being read. Below 900px the pane
     IS the screen, and a page scrolling invisibly behind it is nothing but a way
     to lose your place.

     🔴 `overflow: hidden` on the body is the obvious version and is not enough
     on iOS, which goes on scrolling the document anyway. Pinning the body with
     a negative offset is the technique that does work everywhere, and the offset
     is what keeps it from jumping to the top the moment the pane opens. The
     scroll position is put back by hand on the way out, because taking the body
     out of position:fixed forgets it.

     Absolutely positioned overlays (R4's focus rectangles, R7's bookmark
     markers) are children of the body or of a block inside it, so they move with
     it and stay over the text they belong to. */
  var pageLock = null;   /* the scroll position to restore, while locked */

  function lockPage(on) {
    var wide = !window.matchMedia || !window.matchMedia('(max-width: 899px)').matches;
    if (on && wide) on = false;        /* a sidebar, not a screen */

    if (on) {
      if (pageLock !== null) return;
      pageLock = window.scrollY || window.pageYOffset || 0;
      var b = document.body;
      b.style.position = 'fixed';
      b.style.top = (-pageLock) + 'px';
      b.style.left = '0';
      b.style.right = '0';
      b.style.width = '100%';
      document.documentElement.classList.add('sv-locked');
      return;
    }

    if (pageLock === null) return;
    var was = pageLock;
    pageLock = null;
    var body = document.body;
    body.style.position = '';
    body.style.top = '';
    body.style.left = '';
    body.style.right = '';
    body.style.width = '';
    document.documentElement.classList.remove('sv-locked');
    window.scrollTo(0, was);
  }

  /* Rotating the phone, or dragging a desktop window across the breakpoint,
     can make a lock wrong in either direction. Nothing extra is needed to catch
     that: setPanelSpace already runs on resize and calls lockPage again, which
     re-asks matchMedia rather than remembering what it decided. */

  /* ---------- keeping the reader's place across a reflow ------------------

     🔴 EH, 2026-09-03, and his sentence is the acceptance test, kept verbatim
     because the obvious paraphrase is the defect: *"when you resize the right
     pane, the left obviously gets resized as well. What happens is you get moved
     around in where you are in the lesson on the left... What should happen is
     it should stay locked: the top of what's visible should stay the top of
     what's visible."*

     🔴🔴 PRESERVING `scrollY` IS THE BUG, NOT THE FIX, and it is what a builder
     reaches for first. Narrow the column and the text REFLOWS into more lines,
     so the same pixel offset lands earlier in the lesson. **The place moves
     precisely because the number was kept.** What has to be kept is an ELEMENT.

     🟢 MEASURED BEFORE BUILDING, because the entry said the mechanism was not:
     the lesson is ordinary HTML in the main document and nothing re-renders it.
     `lockPage()` refuses to lock on a wide screen, so the scroller here is the
     WINDOW; the reflow comes from `html.sv-panel-open body { padding-right:
     var(--sv-reserved) }`, which this function sets. That is why the anchor is
     read at the top of `setPanelSpace` and restored at the bottom of it, rather
     than anywhere near the grip.

     ⚠️ NOT MEASURED, and nobody should assert it from documentation: whether the
     browser's own `overflow-anchor` already fires on a container resize. Nothing
     here sets or clears it. If it turns out to fight this, the escape hatch is
     one declaration, and it needs a browser to decide. */
  /* 🔴 ONE selector, because a chat mark is an INDEX into it and three copies
     that drift are three different opinions about what turn 2 is. The
     `:not(.pending)` is the whole point; see paintChatMarks for the bug. */
  var CHAT_TXT = '.sv-turn:not(.pending) .txt';

  var SV_ANCHOR_SEL = '.wrap p, .wrap li, .wrap h1, .wrap h2, .wrap h3, .wrap h4,' +
                      '.wrap dd, .wrap dt, .wrap figcaption, .wrap blockquote,' +
                      '.wrap td, .wrap th';

  /* Held for the duration of a drag. 🔴 The anchor is taken ONCE, at
     pointerdown, and every frame restores THAT one: re-reading it each frame
     anchors to whatever the previous frame's rounding produced, so a slow drag
     ends somewhere a fast one does not. */
  var heldAnchor = null;

  /* The first block still on screen: the first whose BOTTOM is below the top
     edge. Pure, and takes rects, because this is the arithmetic half. */
  function anchorPick(rects) {
    for (var i = 0; i < rects.length; i++) {
      if (rects[i].bottom > 0) return i;
    }
    return -1;
  }

  /* What to remember about it. 🔴 TWO CASES, and the second is the common one:
     a block that starts BELOW the top edge keeps its exact distance from it,
     and a block the reader is already INSIDE keeps the FRACTION of itself that
     has scrolled past. ⚠️ The fraction is deliberate and it is a deviation from
     the shape the entry sketched, which said to keep the offset in both cases.
     The reason is arithmetic rather than taste: a ten-line paragraph at 700px
     becomes seventeen lines at 420px, and keeping the offset puts the top edge
     five lines into a paragraph that now needs eight and a half lines to say the
     same words. Keeping the offset preserves the LINE NUMBER; keeping the
     fraction preserves the WORDS, and the reader is following words. */
  function anchorFrom(rect) {
    var h = rect.height || 0;
    var into = h > 0 && rect.top < 0 ? Math.min(-rect.top / h, 1) : 0;
    return { top: rect.top, into: into };
  }

  /* How far to scroll, given where that block has ended up. Positive scrolls
     down. Pure for the same reason. */
  function anchorDelta(a, rect) {
    if (!a) return 0;
    var want = a.into > 0 ? -(a.into * (rect.height || 0)) : a.top;
    return rect.top - want;
  }

  function anchorNow() {
    var els = document.querySelectorAll(SV_ANCHOR_SEL), rects = [];
    for (var i = 0; i < els.length; i++) rects.push(els[i].getBoundingClientRect());
    var i2 = anchorPick(rects);
    /* 🔴 No anchor is a real answer and not an error: an empty lesson, or a
       reader above the first block. Top stays top, and nothing divides by
       nothing. */
    if (i2 < 0) return null;
    var a = anchorFrom(rects[i2]);
    a.el = els[i2];
    return a;
  }

  function anchorRestore(a) {
    if (!a || !a.el) return false;
    /* A block that has left the document since the anchor was taken. */
    if (a.el.isConnected === false) return false;
    var by = anchorDelta(a, a.el.getBoundingClientRect());
    if (!by) return false;
    window.scrollTo(0, (window.scrollY || window.pageYOffset || 0) + by);
    return true;
  }

  /* ---------- the LESSON's text size, EH 2026-09-03 ----------------------

     🟢 THE STEPS AND THE WORDS ARE THE PANEL'S, on purpose: `settings.panelSizes`
     is the one list, so the reader meets Smaller / Default / Larger / Largest
     once rather than twice. 🔴 The KEY is its own (`lessonSize`), because they
     are two controls over two surfaces and wanting a big lesson beside a compact
     panel is the ordinary case. */
  /* Assigned by installHead once the header exists, called by loadSettings
     when the size list arrives. Declared HERE, at the scope both share, rather
     than assigned as an implicit global from inside installHead. Either order
     works: installHead runs after loadSettings is CALLED but long before its
     promise resolves, and it calls this itself in case that ever reverses. */
  var buildTextMenu = null;

  function lessonScaleFor(id) {
    var list = (settings && settings.panelSizes) || [];
    for (var i = 0; i < list.length; i++) { if (list[i].id === id) return list[i].scale; }
    return 1;
  }

  function applyLessonSize(id) {
    document.documentElement.style.setProperty(
      '--sv-lzoom', String(lessonScaleFor(id) || 1));
  }

  function paintLessonSize(id) {
    Array.prototype.forEach.call(
      document.querySelectorAll('.sv-textmenu [data-lsize]'),
      function (b) {
        b.setAttribute('aria-pressed',
                       b.getAttribute('data-lsize') === id ? 'true' : 'false');
      });
  }

  function saveLessonSize(id) {
    /* Only this key. `write_settings` defaults every other field from what is
       on disk, so this cannot clobber the palette; same reason as
       savePanelWidth. */
    return api('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lessonSize: id })
    }).catch(function () { S.toast('The lesson text size was not saved.'); });
  }

  /* 🔴 EH ATTACHED THIS TO THE REQUEST MINUTES AFTER MAKING IT: *"The same
     should apply when you change the font size."* Scaling the body changes the
     document's height, so preserving `scrollTop` is the implementation that
     looks right and moves the reader down the lesson. The ELEMENT anchor above
     is the one that works, and it already existed for the pane drag: the block
     the reader is looking at is put back where it was, whatever the reflow did
     to the pixels above it. */
  function setLessonSize(id) {
    var a = anchorNow();
    if (settings) settings.lessonSize = id;
    applyLessonSize(id);
    paintLessonSize(id);
    anchorRestore(a);
    return saveLessonSize(id);
  }

  function setPanelSpace() {
    /* 🔴 READ BEFORE THE REFLOW THIS FUNCTION CAUSES. During a drag the held
       anchor is used instead, so the whole drag is measured from one reading. */
    var hold = heldAnchor || anchorNow();
    var open = [];
    Array.prototype.forEach.call(
      document.querySelectorAll('.sv-panel, .hl-panel'),
      function (p) { if (!p.hidden) open.push(p.offsetWidth); }
    );
    var w = open.length ? Math.max.apply(null, open) : 0;
    var r = document.documentElement;
    r.style.setProperty('--sv-reserved', w + 'px');
    if (w) r.classList.add('sv-panel-open'); else r.classList.remove('sv-panel-open');
    lockPage(!!w);

    /* 🟢 AFTER the reflow and AFTER the lock decision, and only when the page is
       actually the scroller: a locked page has `position: fixed` on the body and
       `lockPage` owns the scroll on both sides of that transition, so scrolling
       here would fight it. */
    if (pageLock === null) anchorRestore(hold);

    /* 🔴 The note reflows on that line, and the focus rectangles are absolutely
       positioned in PAGE coordinates measured when they were drawn. So they now
       sit over whatever moved into the old position. Reported 2026-08-13 with a
       screenshot of them floating beside a table, while a chat was open about a
       passage: opening the panel narrowed the note and the text slid left out
       from under them.

       Redrawn synchronously rather than on requestAnimationFrame. Reading
       geometry inside drawFocus forces the pending layout anyway, and a rAF
       never runs in a tab that is not painting, which is exactly the case this
       was first tested in. drawFocus returns immediately when nothing is
       focused, so this costs nothing the rest of the time. */
    drawFocus();

    /* Same reason, one layer down: the column just changed width, so a table
       that fitted a moment ago may now overflow, or the reverse. Synchronous
       for the same reason drawFocus is. */
    updateTableScroll();

    Array.prototype.forEach.call(
      document.querySelectorAll('.sv-panel, .hl-panel'),
      function (p) { spaceWatch.observe(p, { attributes: true, attributeFilter: ['hidden'] }); }
    );
    window.addEventListener('resize', setPanelSpace);
    setPanelSpace();
  }

  function openPanel(which) {
    if (which) openChat = which;
    closeMaterials();          /* same edge, so one at a time */
    panel.hidden = false;
    chatFab.setAttribute('aria-expanded', 'true');
    renderThread();
    /* 🔴 Not on a phone. On a pointer device putting the caret in the box saves
       a click and costs nothing, because the box was already on screen. On a
       phone it throws the keyboard up over half the screen before you have read
       a word of the conversation you just opened, and now that --sv-kb is gated
       on focus it also shrinks the pane at the same moment. The first thing
       wanted here is to read; typing is a deliberate second step. */
    if (!window.matchMedia || !window.matchMedia('(max-width: 899px)').matches) {
      pBox.focus();
    }
  }
  function closePanel() {
    panel.hidden = true;
    chatFab.setAttribute('aria-expanded', 'false');
    clearFocus();
  }

  chatFab.addEventListener('click', function () {
    if (panel.hidden) openPanel(); else closePanel();
  });


  /* ---------- R6, extended by R21: one sidebar, three tabs at the top ----------

     See the .sv-panetabs rules above for why the panels stay separate elements.
     This puts the same strip at the top of all three, so whichever is showing,
     the others are one click away in the same place.

     🔴 R21, asked 2026-08-13: "when I close the materials view, it would be
     great if I could now toggle between notes, chat, and materials." R6 had
     deliberately left materials out, which turned out to cost more than it
     saved: the same pass had hidden every .sv-panel header's Close, and since
     materials is a .sv-panel too that took away the only way it had of closing
     itself. Making it a peer fixes the gap and answers the request with one
     piece of work.

     🔴 Switching to Notes goes through the LESSON'S OWN button rather than
     setting .hidden here. Its handler also renders the panel and updates the
     button's aria-expanded, and skipping it would leave the lesson believing
     its panel is shut while it is on screen.

     The order is Materials, Chat, Notes, matching R18's header, so the three
     controls are in the same order wherever they are read. */

  var hlPanel = document.getElementById('hlPanel');
  var hlFab   = document.querySelector('.hl-fab');

     thing and every route agrees about which. closeSidebar is the shared piece
     and the Close button is just that with nothing opened after it. */
  function closeSidebar() {
    if (!panel.hidden) closePanel();
    if (!matPanel.hidden) closeMaterials();
    if (hlPanel && !hlPanel.hidden && hlFab) { hlFab.click(); }
  }

  function showChat() {
    if (!matPanel.hidden) closeMaterials();
    if (hlPanel && !hlPanel.hidden && hlFab) { hlFab.click(); }
    if (panel.hidden) openPanel();
    paintTabs();
  }

  function showNotes() {
    if (!panel.hidden) closePanel();
    if (!matPanel.hidden) closeMaterials();
    if (hlPanel && hlPanel.hidden && hlFab) { hlFab.click(); }
    paintTabs();
  }

  function showMaterials() {
    /* openMaterials already shuts the other two, by the routes that own them. */
    if (matPanel.hidden) openMaterials();
    paintTabs();
  }

  /* 🔴 Reads which tab to light from the panels themselves, and loops over
     whatever tabs a strip actually has rather than naming each one. The named
     version threw on a strip that was missing a button, which aborted the loop
     BEFORE the later strips and left one of them never repainted; that was the
     .sv-tabs collision, and writing it this way means adding a fourth tab later
     cannot reproduce it. */
  function paintTabs() {
    var on = !panel.hidden ? 'chat'
           : !matPanel.hidden ? 'mat'

  var ICON_X =
    '<svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true" focusable="false">' +
      '<path d="M5.5 5.5 L14.5 14.5 M14.5 5.5 L5.5 14.5" fill="none" stroke="currentColor" ' +
            'stroke-width="1.7" stroke-linecap="round"/>' +

     ⚠️ THE TWO PLAYERS REACH THEIR SPEEDS BY COMPLETELY DIFFERENT ROUTES, which
     is why this variable exists at all. A package is served its speed by the
     SERVER, stamped into the injected script before the document is sent, so
     this file never sees it; since 2026-09-05 that speed is the LECTURE rate
     for slides and voice alike, and this setting no longer reaches a lecture
     at all (ONE SPEED PER PLAYER, below). A recording is ours, in this
     document, and nothing had ever told it. So the layer reads the setting
     once at boot and holds it here, for recordings.

     🔴 AND `load()` RESETS `playbackRate` TO 1, measured on the package's audio
     elements and true of a `<video>` too. A rate applied once, at build time,
     is silently discarded the moment the media actually loads -- so it is
     re-applied on `loadedmetadata`. ⚠️ NOT on `play`: the browser's own control
     menu can set a speed, and re-applying on every play would fight the reader
     for it. */
  var SAVED_RATE = 1;

  function applySavedRate(v) {
    if (PLAYBACK_RATES.indexOf(v) < 0) return false;
    SAVED_RATE = v;
    var vids = document.querySelectorAll('video.sv-matvid');
    for (var i = 0; i < vids.length; i++) {
      try { vids[i].playbackRate = v; } catch (e) {}
      var bar = vids[i].parentNode && vids[i].parentNode.querySelector('.sv-pkgbar');
      var sel = bar && bar.querySelector('.sv-pkgbar-mrate');
      if (sel) sel.value = String(v);
    }
    return true;
  }

  /* 🔴 REPAINTS THE PICKERS BUT NEVER RELOADS A LECTURE. `applySavedRate` can
     change a recording's speed on the spot because that is what the voice
     control does; this one cannot, because applying it means fetching the
     package again and a reader mid-lecture did not ask for that. So it sets the
     variable and makes the controls tell the truth about it. */
  function applyLectureRate(v) {
    if (PLAYBACK_RATES.indexOf(v) < 0) return false;
    /* Arriving at all is what proves the server understands the key: it is
       derived from the settings file and returned on every read. */
    LECTURE_RATE_OK = true;
    LECTURE_RATE = v;
    var sels = document.querySelectorAll('.sv-pkgbar-lec');
    for (var i = 0; i < sels.length; i++) sels[i].value = String(v);
    return true;
  }

  function nudgeMedia(media, delta) {
    if (!media) return null;
    var now = media.currentTime;
    if (typeof now !== 'number' || !isFinite(now)) now = 0;
    var t = now + delta;
    if (t < 0) t = 0;
    /* 🔴 `duration` is NaN until the metadata arrives and Infinity on a
       live stream, and `currentTime = NaN` throws. So the upper bound is only
       applied when there IS one; the lower bound always is. */
    var end = media.duration;
    if (typeof end === 'number' && isFinite(end) && t > end) t = end;
    try { media.currentTime = t; } catch (e) { return null; }
    return t;
  }

  function buildVideoBar(media) {
    if (!media || !media.parentNode) return null;
    if (media.parentNode.querySelector('.sv-pkgbar')) return null;
    /* 🟢 THE WHOLE DRIVER, and its shortness is the argument for this shape:
       three lines against the package's message channel, and neither one is
       pretending to be the other. `playbackRate` is set inside a `try` because
       a media element that has failed to load throws on it, and a speed that
       cannot be set must not take the strip down with it. */
    var bar = playerRow({
      skip: function (delta) { nudgeMedia(media, delta); },
      rate: function (v) {
        try { media.playbackRate = v; } catch (e) {}
        SAVED_RATE = v;
        /* The reader's saved RECORDING speed. Until 2026-09-05 a narrated
           lecture read it too, for its voice; now a lecture's voice boots at
           the lecture rate and this key is a recording's alone. */
        savePlaybackRate(v);
      }
    });
    media.parentNode.appendChild(bar);
    /* Before the listener, so a media element that is already past
       `loadedmetadata` still gets it. */
    applySavedRate(SAVED_RATE);
    media.addEventListener('loadedmetadata', function () {
      try { media.playbackRate = SAVED_RATE; } catch (e) {}
    });
    /* The caption strip is mounted only when captions are on, which is the
       design's rule for both players: no empty box, no placeholder.

       🔴 AND IT IS FILLED IN THE SAME BREATH, which a test caught rather than a
       reader. `setCaptionsOn` was the only caller of `attachVideoCaptions`, so a
       recording opened while captions were ALREADY on got the strip and nothing
       in it -- an empty band, which is the one outcome this whole unit is meant
       to make impossible. **The same race the package half has**, and the same
       answer: do it at build time as well as at toggle time. */
    if (CAPTIONS_ON) {
      mountCaptions(media);
      attachVideoCaptions(media);
    }
    return bar;
  }

  /* ---------- the speed a reader chose inside a narrated lecture --------

     🔴 THE ONLY WAY OUT OF THE SANDBOX, and it is a one-way door on purpose.
     A mirrored package runs in an opaque origin (`sandbox allow-scripts`, no
     `allow-same-origin`), so it has no localStorage, no cookie and no way to
     call this server as the reader. Its control strip therefore cannot save
     anything; it posts the chosen rate out here, and this saves it.

     🔴 TREATED AS UNTRUSTED INPUT, because it is. `event.origin` is the string
     `"null"` for every opaque origin, so it identifies nothing and cannot be
     checked. Two things are checked instead:

     1. **The sender is one of OUR frames.** `event.source` is compared against
        the `contentWindow` of the package iframes on this page, which is an
        identity a page cannot forge by claiming an origin.
     2. **The value is on a LIST.** Not a range, not a number: one of the six
        the strip itself offers. The worst a hostile package can then do with
        this channel is set a playback speed the reader could have set, and it
        cannot write an arbitrary value into his settings file.

     ⚠️ Deliberately silent on failure. A message that fails either check is a
     message we did not expect, and a toast about it would be a stranger's page
     writing text into the reader's screen. */
  var PLAYBACK_RATES = [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2, 2.25, 2.5, 2.75, 3];

  function packageFrameFor(src) {
    if (!src) return null;
    var frames = document.querySelectorAll('iframe.sv-matpkg');
    for (var i = 0; i < frames.length; i++) {
      try { if (frames[i].contentWindow === src) return frames[i]; } catch (e) {}
    }
    return null;
  }

  function fromOurPackage(src) {
    return !!packageFrameFor(src);
  }

  function savePlaybackRate(v) {
    /* Only this key, for the reason `savePanelWidth` says: write_settings
       defaults every other field from what is on disk, so this cannot clobber
       the palette. */
    return api('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ playbackRate: v })
    }).catch(function () {});
  }

  function saveCaptionsOn(v) {
    /* Only this key, for the reason `savePlaybackRate` gives. */
    return api('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ captionsOn: !!v })
    }).catch(function () {});
  }

  /* 🔴 DEFAULT OFF, and it is a CONSTRUCTION state rather than a product
     decision. Ruled 2026-09-03: this control ships BEFORE the rendering behind
     it, so every intermediate save leaves the reader looking exactly as it does
     today and the drawing half can land in as many saves as it takes.
     **Flipping the default belongs in the same change as the last piece of the
     rendering**, and whoever ships that should say which piece it was. */
  var CAPTIONS_ON = false;
  /* 🔴 TWO STRINGS, NOT ONE, AND WCAG 2.5.3 IS WHY. The design specifies the
     visible text `CC` and this file previously named the control "Captions" for
     a screen reader. **A voice user says the words they can SEE**, so the
     accessible name has to CONTAIN the visible label, and "CC" is not inside
     "Captions". The name carries both.

     ⚠️ EH ASKED IN CHAT FOR THE WORDS *"closed captions"* ON THE CONTROL. The
     design he sent afterwards keeps `CC` and moves the clarity onto the caption
     line's accent marker. Built as the design says; the disagreement is his to
     settle and goes to him with the picture. */
  var CAPTIONS_TEXT = 'CC';
  var CAPTIONS_LABEL = 'CC, closed captions';
  /* The design's own titles, which say what pressing it will DO rather than
     what state it is in. */
  var CAPTIONS_TITLE_ON = 'Captions are on';
  var CAPTIONS_TITLE_OFF = 'Show captions under the slide';

  /* 🔴 THE ONLY FREE-FORM TEXT THAT HAS EVER CROSSED THIS CHANNEL, and the
     doctrine that kept the channel safe does not extend to it. Every other
     command is a value from a fixed list checked in both directions; a caption
     is a sentence, and no list can hold one. So the mitigations are different in
     kind and each is load-bearing:

     1. **`textContent`, NEVER `innerHTML`.** Markup arriving in a cue is drawn
        as the characters it is, and cannot execute or restyle anything.
     2. **The sender is one of OUR frames**, by `event.source` identity, exactly
        as the rate is. An origin string is worth nothing here: an opaque origin
        reports `"null"` and any frame can claim any string.
     3. **CAPPED AND SCRUBBED ON ARRIVAL.** 300 characters, control characters
        and the Unicode line separators removed, whitespace collapsed. The
        longest cue in the corpus is 89 characters, so the cap cannot bite a real
        one; what it stops is a hostile package pushing the controls off the
        screen with a wall of text.
     4. **It is never stored.** A cue goes to one text node and nowhere else:
        not to settings, not to a highlight, not through `api()`. The rate
        channel writes to the reader's settings file, which is why its value has
        to come off a list; this one writes to a pixel.
     5. **It is only accepted while captions are ON.** A reader who has not
        asked for captions cannot be sent text at all. */
  var CAP_MAX = 300;
  var CAP_STATES = ['ready', 'none', 'unsupported'];
  /* 🔴 THE READER'S PAGE SAYS THESE, NOT THE PACKAGE. A lecture with nothing to
     show must SAY so rather than present an empty box, and the sentence that
     says it is ours: the package sends a status off a three-item list and this
     side chooses the words. That keeps the free-form surface at exactly one
     thing, the cue itself. */
  var CAP_NONE = 'No captions were made for this lecture.';
  var CAP_UNSUP = 'This browser cannot show captions.';
  /* 🔴 THE SENTENCE A READER NEEDS BEFORE THEY TRUST A WORD ON THIS TRACK.
     Since 2026-09-04 a lecture whose audio cannot be matched to its transcript
     is captioned from the MACHINE's own words rather than left with nothing.
     That is the difference between having captions and not having them, and EH
     priced the cost himself: the model heard "maximums" for *mechanisms*, and
     KCL's own transcript renders the same word "magnets".

     ⚠️ SAID ONCE, in the same place and by the same rule as the partial-coverage
     note above it: before any cue has arrived, never flashed in the silences
     between cues. A reader who does not know which kind of track they are
     reading cannot judge a word that looks wrong, and one who is told twice a
     minute stops reading the captions. */
  var CAP_HEARD = 'These captions are what the recording was heard to say, '
                + 'not the written transcript, so some words may be wrong.';

  function capCoverage(captioned, clips) {
    return 'Captions cover ' + captioned + ' of ' + clips + ' sections of this lecture.';
  }

  /* 🔴 SCRUBBED, NOT ESCAPED. Escaping would be the wrong verb: this text is
     never parsed as markup anywhere. What is removed is the class of character
     that breaks a layout or hides content in plain sight: the C0 and C1
     controls, and U+2028/U+2029, which are line breaks that would make the box
     taller than the height it reserves. */
  function cleanCue(v) {
    if (typeof v !== 'string') return '';
    return v.replace(/[\u0000-\u001F\u007F-\u009F\u2028\u2029]+/g, ' ')
            .replace(/\s+/g, ' ').trim().slice(0, CAP_MAX);
  }

  /* 🔴 MOUNTED AND UNMOUNTED, NOT HIDDEN, and that is the design's rule rather
     than an implementation choice: *"when captions are off, the strip is not
     rendered at all -- no empty box, no 'captions off' placeholder. The block
     gets ~50px shorter and the provenance note below shifts up; that was
     accepted in preference to reserving dead space."*

     ⚠️ IT REVERSES WHAT THIS FILE DECIDED FOR ITSELF. A reserved band existed so
     that the controls could not move; the design accepts the reflow because the
     CC button sits immediately below the text, so cause and effect are adjacent.
     **His call.** The old reserve's measurements are kept in the stylesheet,
     because the design's `min-height` has to be checked against them.

     🟢 `host` IS THE FRAME OR THE `<video>`, whichever player this is. The strip
     is the same element on both, which is the whole point of the shared row. */
  function captionHosts() {
    return document.querySelectorAll('iframe.sv-matpkg, video.sv-matvid');
  }

  function captionBoxFor(host) {
    return (host && host.parentNode
      && host.parentNode.querySelector('.sv-pkgcap')) || null;
  }

  function captionTextOf(box) {
    return (box && box.querySelector && box.querySelector('.sv-pkgcap-text')) || null;
  }

  function mountCaptions(host) {
    if (!host || !host.parentNode) return null;
    var already = captionBoxFor(host);
    if (already) return already;
    var box = document.createElement('div');
    box.className = 'sv-pkgcap';
    /* Decoration with a job, and it says so: the reader's own marker for "this
       line is the lecture speaking". It carries no text, so it is hidden from
       the accessibility tree rather than announced as an empty element. */
    var mark = document.createElement('span');
    mark.className = 'sv-pkgcap-mark';
    mark.setAttribute('aria-hidden', 'true');
    box.appendChild(mark);
    var text = document.createElement('p');
    text.className = 'sv-pkgcap-text';
    box.appendChild(text);
    /* 🔴 ABOVE THE CONTROLS AND FLUSH UNDER THE PICTURE, which EH asked for in
       chat before the design said the same thing with numbers. The bar is
       already there when captions are switched on and is not when the bar is
       being built, so both orders are handled by inserting BEFORE it or
       appending when it is absent. */
    var bar = host.parentNode.querySelector('.sv-pkgbar');
    if (bar) host.parentNode.insertBefore(box, bar);
    else host.parentNode.appendChild(box);
    return box;
  }

  function unmountCaptions(host) {
    var box = captionBoxFor(host);
    if (box && box.parentNode) box.parentNode.removeChild(box);
    return !!box;
  }

  /* 🔴 IDENTICAL TEXT IS NOT REWRITTEN, AND THAT IS THE SELECTION REQUIREMENT.
     Assigning `textContent` replaces the text node, which destroys any selection
     inside it, even when the characters are identical. EH chose the selectable
     placement in order to lift a sentence into a note, so a redundant write is
     not a wasted cycle here, it is his selection disappearing under his cursor.
     ⚠️ A selection still ends when the cue genuinely CHANGES, which cannot be
     helped: the words on screen are different words. Pausing holds a cue
     indefinitely, and that is the case he will actually use. */
  function showCaption(box, text, note) {
    if (!box) return false;
    if (box.__svCapText === text && box.__svCapNote === !!note) return false;
    box.__svCapText = text;
    box.__svCapNote = !!note;
    if (note) box.classList.add('sv-pkgcap-note');
    else box.classList.remove('sv-pkgcap-note');
    /* 🔴 INTO THE PARAGRAPH, NOT THE BOX. Writing `box.textContent` would
       replace every child, and the first of them is the accent marker the design
       asks for -- the caption would work and its marker would vanish on the
       first cue. */
    var into = captionTextOf(box);
    if (!into) return false;
    into.textContent = text;                /* 🔴 never innerHTML */
    return true;
  }

  /* 🔴 THE RECORDING'S CAPTIONS, AND A RECORDING CAN HAVE THEM NOW.

     ⚠️ **WHAT THIS COMMENT SAID UNTIL 2026-09-04, kept because the shape of the
     mistake is the lesson.** It said there were none, and that this was true
     STRUCTURALLY rather than by a census that could go stale: `captions.py
     build()` reads a package's `index.html` and aligns against the narration MP3s
     inside it, so a part with no package had no audio here and could not produce
     a `.vtt` at all. **Every word of that was true when it was written and the
     reasoning was sound.** 🔴 **It was still a claim with a lifetime.** The day
     `video_captions.py` shipped, the audio came from the recording itself and the
     structural argument evaporated; a reader trusting this paragraph would have
     concluded the feature could not exist while it was running underneath them.
     **A structural claim is not a permanent one: it is a claim about today's
     structure.**

     🟢 SO THE HONEST ANSWER IS NOW A QUESTION ABOUT DISK, and the server answers
     it. `/api/materials` carries `video_captions` when and only when the file is
     there. A lecture nobody has run still SAYS so, in the same sentence as
     before, and an empty track is still the dishonest version of that state.

     🟢 THE AUDIO ARRIVED ON 2026-09-04 and the rendering half is below. What is
     unchanged is the honest answer: a lecture with no caption file still SAYS
     so, and the sentence is the same one. **The server decides which of the two
     it is**, from the file's existence at read time, so this side never has to
     tell a missing file apart from a broken URL by their status code. */

  /* 🔴 A `<track>` ELEMENT, AND `mode = "hidden"` IS THE WHOLE DESIGN IN ONE
     WORD. Hidden means the browser does the timing and draws NOTHING; `showing`
     would paint the browser's own captions over the picture. **That is exactly
     what EH ruled against on 2026-09-04 after seeing both renderings side by
     side: *"let's go implement our system so we don't cover the slide text."***
     On a lecture the slide IS the content, so the words go under it, in the
     strip his narrated lectures already use.

     🟢 SO THE BROWSER IS DOING THE HARD PART AND NONE OF THE VISIBLE PART. It
     parses the WebVTT, keeps the cue list in sync through a pause, a seek and a
     playback rate, and tells us when the active cue changes. **The package half
     has to do all of that by hand** because a sandboxed frame cannot reach a
     same-origin file. Here it is free.

     ⚠️ ONE STRIP, DRAWN BY ONE PIECE OF CODE. The cue text goes through
     `cleanCue` and `showCue`, which are the package's own, so the two players
     cannot drift into two caption looks. A second implementation for video was
     the specific thing the entry said not to write. */
  function videoCaptionTrack(media, url) {
    if (media.__svCapTrack) return media.__svCapTrack;
    if (!media.textTracks || !media.appendChild) return null;
    var el = document.createElement('track');
    if (el.track === undefined) return null;    /* no text tracks in this browser */
    el.kind = 'captions';
    el.srclang = 'en';
    el.label = 'Captions';
    el.src = url;
    media.appendChild(el);
    media.__svCapTrack = el;
    return el;
  }

  function activeCueText(track) {
    var active = track && track.activeCues;
    var said = '';
    for (var i = 0; active && i < active.length; i++) {
      said += (said ? ' ' : '') + (active[i].text || '');
    }
    return cleanCue(said);
  }

  function attachVideoCaptions(media) {
    var box = captionBoxFor(media);
    if (!box) return false;
    /* 🔴 THE SERVER'S ANSWER, not a URL built here out of pieces. `/api/materials`
       carries `video_captions` when and only when the file is on disk. */
    var url = matData && matData.video_captions;
    if (!url) return showCaptionState(box, 'none');
    var el = videoCaptionTrack(media, url);
    var track = el && el.track;
    if (!track) return showCaptionState(box, 'unsupported');
    track.mode = 'hidden';
    /* 🔴 BEFORE THE FIRST CUE IS DRAWN, which is the only moment it can be said.
       `showCue` refuses to overwrite a note until a real cue has arrived, so the
       order here is what makes the sentence visible at all: state it, then let
       the first cue replace it. The server answers `heard` or `transcript`; an
       older sidecar has no answer and the server defaults to the transcript,
       because that is the only route that existed when it was written. */
    if (matData.video_captions_words === 'heard') {
      showCaptionState(box, 'heard');
    }
    var draw = function () { showCue(box, activeCueText(track)); };
    track.oncuechange = draw;
    /* 🔴 AND WHATEVER IS ON SCREEN RIGHT NOW, because `cuechange` fires at the
       NEXT boundary. A reader who switches captions on in the middle of a
       sentence would otherwise watch an empty box until the speaker finishes it,
       which reads as broken. ⚠️ `activeCues` is null until the file has loaded,
       so this waits for the element when it has to. */
    if (el.readyState === 2) draw();
    else el.addEventListener('load', draw);
    /* The file was advertised by the server and then would not load. Rare, and
       the honest answer is the same one a lecture with no captions gets. */
    el.addEventListener('error', function () { showCaptionState(box, 'none'); });
    return true;
  }

  /* 🔴 DISABLED, NOT LEFT RUNNING. `hidden` keeps a track parsed and ticking,
     and the strip it writes into is destroyed when captions go off, so a live
     `cuechange` would be work done for nobody. ⚠️ The element STAYS on the
     media: removing it would refetch the file on every toggle, and re-enabling
     a track is free. */
  function detachVideoCaptions(media) {
    var el = media && media.__svCapTrack;
    if (!el || !el.track) return false;
    el.track.oncuechange = null;
    el.track.mode = 'disabled';
    return true;
  }

  function showCue(box, text) {
    if (!box) return false;
    /* An empty cue before any real one has arrived is silence at the start of a
       lecture, not an answer: it must not wipe the sentence explaining that this
       lecture has only partial captions. Once a real cue has been seen, empty
       means silence and the box clears. */
    if (!text && !box.__svCapHadCue) return false;
    if (text) box.__svCapHadCue = true;
    return showCaption(box, text, false);
  }

  function showCaptionState(box, status, clips, captioned) {
    if (!box) return false;
    if (status === 'unsupported') return showCaption(box, CAP_UNSUP, true);
    if (status === 'none') return showCaption(box, CAP_NONE, true);
    if (status === 'heard' && !box.__svCapHadCue) {
      return showCaption(box, CAP_HEARD, true);
    }
    /* 🔴 PARTLY CAPTIONED IS THE ORDINARY CASE, NOT THE EDGE: 117 clips were
       refused across the corpus and four lectures produced nothing at all. So
       the coverage is stated once, when captions are switched on and before any
       cue has arrived, which is exactly when a reader looking at an empty box
       wonders whether the feature is broken. ⚠️ It is NOT restated in the gaps
       between cues: there is silence between most cues, and a note that flashed
       in every gap would be worse than the doubt it answers. */
    if (clips > 0 && captioned < clips && !box.__svCapHadCue) {
      return showCaption(box, capCoverage(captioned, clips), true);
    }
    if (!box.__svCapHadCue) return showCaption(box, '', false);
    return false;
  }

  function setCaptionsOn(v, persist) {
    CAPTIONS_ON = !!v;
    var buttons = document.querySelectorAll('.sv-pkgbar-cc');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute('aria-pressed', CAPTIONS_ON ? 'true' : 'false');
      buttons[i].title = CAPTIONS_ON ? CAPTIONS_TITLE_ON : CAPTIONS_TITLE_OFF;
    }
    /* 🔴 THE STRIP IS CREATED AND DESTROYED, not shown and hidden: the design
       asks for nothing at all when captions are off. ⚠️ A fresh strip starts
       with no cue seen, which is also what stops the cue that was showing when
       captions went off from flashing back when they are switched on again --
       the same guarantee the old `__svCapHadCue` reset gave, now free. */
    var hosts = captionHosts();
    for (var j = 0; j < hosts.length; j++) {
      if (CAPTIONS_ON) mountCaptions(hosts[j]);
      else unmountCaptions(hosts[j]);
    }
    /* 🔴 AND THE RECORDING'S OWN CAPTIONS, which need no channel: a `<video>` in
       this document either has a caption file on this server or it does not, and
       either answer is drawn in the same strip by the same code. */
    if (CAPTIONS_ON) {
      for (var m = 0; m < hosts.length; m++) {
        if (hosts[m].tagName === 'VIDEO') attachVideoCaptions(hosts[m]);
      }
    } else {
      for (var n = 0; n < hosts.length; n++) {
        if (hosts[n].tagName === 'VIDEO') detachVideoCaptions(hosts[n]);
      }
    }
    /* Every mirrored lecture on the page is told, not just the visible one:
       there is normally one, and a page with two must not leave the second
       timing cues nobody is reading. */
    var frames = document.querySelectorAll('iframe.sv-matpkg');
    for (var k = 0; k < frames.length; k++) {
      tellPackage(frames[k], { kind: 'sv-player-cmd', what: 'captions', on: CAPTIONS_ON });
    }
    if (persist) saveCaptionsOn(CAPTIONS_ON);
    return CAPTIONS_ON;
  }

  /* Named rather than inline so a test can drive it directly: an event handler
     that can only be reached by dispatching a real MessageEvent is one that
     gets tested by hand once and then never again. */
  function onPackageMessage(e) {
    var d = e && e.data;
    if (!d || typeof d !== 'object') return false;
    /* The lecture saying what it can do, so the bar under it can stop being
       grey. Same identity check as the rate: it is the same channel and the
       same untrusted sender. */
    if (d.kind === 'sv-player-ready') {
      var frame = packageFrameFor(e.source);
      if (!frame) return false;
      readyPackageBar(frame, d);
      /* 🔴 AND THIS IS WHERE THE CAPTIONS STATE HAS TO BE SENT, not only where
         the bar is built. Measured in a browser 2026-09-03: a reader with
         captions saved ON opened a lecture and got an EMPTY band that never
         filled, because `buildPackageBar` posts in the same tick as it sets the
         iframe's `src` -- **the package's document has not loaded and its
         message listener does not exist yet, so the command is dropped.**

         🟢 An announcement is PROOF that the listener exists, because the
         listener is what sent it. So the pair works in both orders, exactly like
         `hello` and `announce`: the build-time post covers a bar built after a
         package that had already announced, and this covers a package that
         announces after its bar was built. ⚠️ Repeats are free -- attaching is
         idempotent on the other side and a clip that 404'd is remembered.

         🔴 THIS IS THE DEFECT THAT WOULD HAVE ARRIVED WITH THE DEFAULT. While
         captions default OFF it is invisible: nothing is meant to draw. The day
         the default flips to ON it is every lecture, and it would have read as
         "captions do not work" rather than as a lost message. */
      tellPackage(frame, { kind: 'sv-player-cmd', what: 'captions', on: CAPTIONS_ON });
      /* 🔴 AND THE PLACE THE READER WAS AT, if this frame was reloaded for a
         speed change. Nothing happens for an ordinary first load: there is no
         held place, and this returns false. */
      if (RESTORE_PLACE_AFTER_RATE_CHANGE) restoreLecturePlace(frame);
      return true;
    }
    /* 🔴 THE CUE. Free-form text, so read the five mitigations above
       `cleanCue` before touching this: the frame identity, the cap, the scrub,
       `textContent`, and the fact that it is never stored. ⚠️ THE
       CAPTIONS-ON GATE IS PART OF THAT LIST, not a tidy-up: a reader who has
       not asked for captions cannot be sent text into his page at all. */
    if (d.kind === 'sv-player-cue') {
      var cueFrame = packageFrameFor(e.source);
      if (!cueFrame) return false;
      if (!CAPTIONS_ON) return false;
      showCue(captionBoxFor(cueFrame), cleanCue(d.text));
      return true;
    }
    /* The lecture saying what it has, which is the ONE thing that lets an empty
       box be explained rather than left to look broken. Status off a list, counts
       cleaned to non-negative integers, and the WORDS are this page's own. */
    if (d.kind === 'sv-player-captions') {
      var capFrame = packageFrameFor(e.source);
      if (!capFrame) return false;
      if (!CAPTIONS_ON) return false;
      if (CAP_STATES.indexOf(d.status) < 0) return false;
      showCaptionState(captionBoxFor(capFrame), d.status,
                       capCount(d.clips), capCount(d.captioned));
      return true;
    }
    /* The lecture saying where it is, which is asked for at exactly one moment:
       immediately before its frame is reloaded at a new speed. An answer nobody
       asked for is dropped, which is what `__svRateAsk` being absent means. */
    if (d.kind === 'sv-player-position') {
      var posFrame = packageFrameFor(e.source);
      if (!posFrame) return false;
      var ask = posFrame.__svRateAsk;
      if (!ask) return false;
      return ask.go(d);
    }
    /* ⚠️⚠️ TEMPORARY DIAGNOSTIC, 2026-09-05. REMOVE WITH ITS QUEUE ENTRY.
       🔴 `POSTED ok` proves DELIVERY and nothing else. This is the other half:
       what the lecture actually did with it. EH's three cycles all printed
       `POSTED ok` and he still landed at the start, so this is the line that
       separates "the seek was refused" from "the seek moved somewhere else". */
    /* ⚠️ TEMPORARY DIAGNOSTIC, 2026-09-05. REMOVE WITH ITS QUEUE ENTRY.
       Source-checked like every other branch, for the same reason: a diagnostic
       that accepts a message from any frame can be made to print a lie. */
    if (d.kind === 'sv-player-health') {
      if (!packageFrameFor(e.source)) return false;
      try { svSpeedLog(svHealthLine(d)); } catch (err) {}
      return true;
    }
    if (d.kind === 'sv-player-landed') {
      /* Source-checked like every other branch here, even though this one only
         logs: a diagnostic that accepts a message from any frame is a
         diagnostic that can be made to print a lie. */
      if (!packageFrameFor(e.source)) return false;
      try { svSpeedLog(svLandingLine(d)); } catch (err) {}
      return true;
    }
    /* The lecture crossing between playing and not, which is the only thing
       that moves the lecture-speed lock. A BOOLEAN checked as one, the same
       doctrine as the captions command in the other direction: anything that is
       not the word `true` reads as not playing, and not-playing is the safe
       direction because it leaves the reader a working control. */
    if (d.kind === 'sv-player-playing') {
      var playFrame = packageFrameFor(e.source);
      if (!playFrame) return false;
      lockLectureRate(playFrame, d.playing === true);
      return true;
    }
    if (d.kind !== 'sv-player-rate') return false;
    if (PLAYBACK_RATES.indexOf(d.rate) < 0) return false;
    if (!fromOurPackage(e.source)) return false;
    savePlaybackRate(d.rate);
    return true;
  }

  /* A count from a sandboxed document is a number we did not compute. Anything
     that is not a non-negative finite number becomes 0, which reads as "none of
     them" and is the safe direction: it can only ever make the coverage sentence
     more modest than the truth, never less. */
  function capCount(v) {
    return (typeof v === 'number' && isFinite(v) && v >= 0) ? Math.floor(v) : 0;
  }

  /* ---------- the controls under a narrated lecture ---------------------

     🔴 EH, 2026-09-02: "I'd like this control surface underneath the core
     video screen. not as an overlay that may block part of the video. and I
     want to be able to select speed not just cycle through it."

     Both halves are here. The buttons are in the READER'S document, under the
     frame, so they cover nothing and inherit his theme; and the speed is a
     PICKER, so a reader who wants 1.5 gets it in one move rather than four.

     🔴 THE PLAYER IS UNREACHABLE EXCEPT BY MESSAGE. A mirrored package is
     served `sandbox allow-scripts` with no `allow-same-origin`, so nothing in
     here can call into it: not a click, not a function, not a property read.
     The channel that already carried the chosen rate OUT is the only door, and
     these controls knock on it. */
  /* 🔴 ONE TABLE FOR BOTH PLAYERS, and the CHEVRON IS SPLIT FROM THE NUMBER
     because the design asks for them to be styled apart: *"the chevrons are
     `<span>`s at 11px, `--muted` -- the number carries the weight, the direction
     is quiet."* It was one glyph string per button before, which cannot be
     styled in two weights.

     ⚠️ The thin space that used to sit inside `\u2039\u20095` is gone with it:
     the gap between chevron and number is `gap: 3px` on the segment now, which
     is a number in the stylesheet rather than a character in a string. */
  var SKIPS = [
    [-15, 'Back 15 seconds', '\u226a', '15'],
    [-5, 'Back 5 seconds', '\u2039', '5'],
    [5, 'Forward 5 seconds', '\u203a', '5'],
    [15, 'Forward 15 seconds', '\u226b', '15']
  ];

  /* 🔴 THE VISIBLE WORD BESIDE THE PICKER, and it is a constant rather than a
     literal so that the two strips this project ships cannot label the same
     control differently. `TheTwoStripsUseTheSameWORDS` fails if they do. */
  var RATE_LABEL = 'Speed';

  /* 🔴 ONE SPEED PER PLAYER, SINCE 2026-09-05. EH, that night, on the clock
     (plans/11): *"Speed change works perfectly, so I think we can get rid of
     the voice-only speed change pull-down and the two little info things
     because they're no longer necessary, since we have a comprehensive speed
     change that works."*

     | caption         | on          | what it moves              |
     | --------------- | ----------- | -------------------------- |
     | `Whole lecture` | a lecture   | slides AND voice, together |
     | `Speed`         | a recording | the recording              |

     ⚠️ THE VOICE-ONLY PICKER IS GONE, NOT HIDDEN. It was his design of
     2026-09-02 (a lecture speed that locked while playing, beside a narration
     speed that did not, *"a separate change audio speed setting that you can
     change mid play"*), and the clock made the lock unnecessary: the lecture
     speed now changes in place, voice and slides together, so a second control
     that moved the voice alone could only put them out of step. Its word
     ("Voice only", his, 2026-09-03), its `i` button and the lecture picker's
     `i` button went with it. The strip inside the package still answers a
     `rate` command on the channel; nothing in this file sends one.

     🔴 AND THE VOICE OF A LECTURE NOW BOOTS AT THE LECTURE RATE, ALWAYS. The
     server used to stamp the saved recording speed (`settings.playbackRate`)
     into a lecture served at 1, because the voice picker showed it and could
     move it. With no picker, a saved 1.5 would have left the narration out of
     step with the slides and nothing on the page to say so, so the server now
     passes the played rate for both tokens (`study_server.py`, the package
     route). `SAVED_RATE` below is a RECORDING'S preference and nothing else.

     ⚠️ THE ROW WRAPS AT A NARROWER PANE THAN THE ESTIMATE IN PROJECT-NOTES
     SAYS: a caption, a select and two buttons left it. `rig_label_wrap.py`
     varies the one word that is left. Whoever changes it re-measures, and
     changes it HERE, once.

     🟢 A RECORDING KEEPS THE PLAIN WORD. An ordinary video has no slides and no
     second timeline, so it has one speed and it is called `SPEED`, which is the
     design's own word. The two captions are deliberately different words
     rather than one word used two ways. */
  var LECTURE_LABEL = 'Whole lecture';

  var LECTURE_TITLE = 'Speed of the whole lecture, slides and voice ' +
    'together. Changing it loads the lecture again from the start.';
  /* 🔴 THE LOCKED TITLE HAS TO SAY THE WAY OUT, not just the refusal. EH's own
     proof point: *"what happens when you try is deliberate and visible rather
     than a dead control."* A disabled control with no explanation is exactly
     the complaint this unit began from. */
  var LECTURE_TITLE_LOCKED = 'Lecture speed is locked while the lecture ' +
    'is playing, because changing it starts the lecture again. ' +
    'Pause to change it.';
  /* The same control under the clock (plans/11), where a change is in place
     and there is nothing to lock. The reload wording above stays, word for
     word, because the reload stays: it is the backup this control falls back
     to on a document that has no clock, and its sweep still pins it. */
  var LECTURE_TITLE_LIVE = 'Speed of the whole lecture, slides and voice ' +
    'together. Changing it takes effect straight away, where you are.';

  /* 🔴 THE READER'S LECTURE SPEED, and it is NOT `SAVED_RATE`. That one is a
     recording's speed, applied to `<video>` elements in this document; this
     one is the speed of the lecture itself, slides and voice together, applied
     by the clock below or, as the backup, by the SERVER rebuilding the
     package's timing blob as it serves it. */
  var LECTURE_RATE = 1;

  /* 🔴🔴 THE SWITCH BETWEEN THE TWO WAYS OF CHANGING IT, AND THE ONE BELOW IT
     IS THE BACKUP. EH, 2026-09-05, on the clock proposal (plans/11): *"Don't
     delete what we currently have because it works relatively well. Let's
     save it as a backup but go ahead and build this."*

     `true`: the frame is asked for `?clock_rate=` and the server puts a shim
     in front of the player's own script that replaces `Date.now`, which is
     the only clock the player keeps time by. A speed change is then a message
     to the frame, honoured in place: no reload, no lost place, and nothing to
     lock while it plays. The picker's wording says so (`LECTURE_TITLE_LIVE`).

     `false`: everything below this word behaves exactly as it did on
     2026-09-05 morning. `packageSrc` sends `?lecture_rate=`, the server
     rebuilds the blob, `setLectureRate` reloads the frame from the start, and
     the picker locks while the lecture plays. That is the mechanism EH called
     "works relatively well", and it is the way back if his ears say the clock
     drifts: one word here, and no restart, because this file deploys on save.

     ⚠️ THE SWITCH SAYS WHAT TO ASK FOR, THE FRAME SAYS WHAT IT GOT. A frame
     announces `lectureLive` when it actually has the clock, and every live
     branch checks `lectureIsLive(frame)`, not this word alone: a document
     served by a server that does not know the query has no clock, and the
     reload is what it gets. So the two never disagree in a way the reader can
     see -- the worst case of a half-deployed server is today's behaviour. */
  var LECTURE_SPEED_BY_CLOCK = true;

  /* 🔴🔴 PARKED BY EH, 2026-09-05, AND THE MACHINERY BELOW IS KEPT ON PURPOSE.

     *"I feel like previously they did not freeze when you did a speed change,
     but they just refreshed to the very start of the whole lecture."*

     **That is a regression report and it names the cause.** Before the
     place-restore existed a speed change reloaded to the start and the lecture
     PLAYED. Every measurement of 2026-09-05 fits it: the restore is delivered
     inside `adopt`, while the deck is still booting, and **the deck never
     recovers from being seeked mid-boot** -- 60 `play()` calls, every one
     interrupted with `AbortError`, and a clock that never moves again.

     🟢 THE RESTORE ITSELF IS NOT WRONG, which is why this is a switch rather
     than a deletion. Measured on EH's own machine: asked slide 5 at 2.08, the
     seek put it at slide 5 at 2.08, **in 302ms**, and it was still there 7.7
     seconds later. It lands exactly where it is asked. What it does not do is
     wait until there is a deck fit to be asked.

     🔴 SO THE FIX, WHEN SOMEBODY TAKES IT, IS A WAIT AND NOT A REWRITE, and
     turning it back on is this one word. Its 48 tests and the whole
     `test_lecture_place.py` file stay green either way, because they drive the
     machinery directly. ⚠️ Delete it only if somebody decides the feature is
     not wanted -- not because it is switched off. */
  var RESTORE_PLACE_AFTER_RATE_CHANGE = false;

  /* 🔴 THE PICKER IS NOT DRAWN UNTIL THE SERVER SAYS IT CAN REMEMBER IT, and
     this is a DEPLOY rule rather than a feature flag.

     The two halves of this control ship at different speeds: `local-layer.html`
     is read per request, so it is live the moment it is saved, while
     `study_server.py` needs the process restarted. Between those two moments an
     old server does not know the `lectureRate` key, so it would accept the save
     and drop it -- and the reader would meet a speed control that forgets what
     it was told. **This file already carries the sentence for that case**: "a
     control that forgets what you told it reads as a bug rather than as a
     deploy in progress."

     🟢 So the control is absent rather than forgetful, which is the honest
     degradation and needs no timing. It also covers a recipient running an
     older kit against a newer layer.

     ⚠️ THE RACE IS NOT REAL HERE, and it is worth saying why rather than
     guarding it twice: settings are fetched at boot, and a package bar is only
     built when a reader opens a lecture, which cannot happen before the page
     has loaded. If the settings fetch fails outright, no picker is the right
     answer anyway. */
  var LECTURE_RATE_OK = false;

  var PKG_WAITING = 'Waiting for the lecture to load';
  var PKG_NO_SEEK = 'This lecture was published with skipping switched off';

  /* ---------- the row itself, built once for both players ----------------

     🔴 THE DRIVER IS THREE CALLBACKS AND NOTHING ELSE. `skip(delta)` and
     `rate(v)` are all a player has to supply; the captions toggle is the
     reader's own state and is the same on every surface, so it is not the
     driver's business. A package passes callbacks that post messages into a
     sandbox; a recording passes callbacks that touch a `<video>` directly. **The
     two are visible side by side and neither is hidden behind the other**, which
     was the objection to sharing this code and is the reason it is a driver
     rather than a class.

     `waiting` is optional: the package cannot honour a skip until the lecture
     answers, so its buttons start disabled and say why. A recording has no such
     moment, so it omits it and its buttons are live from the first paint. */
  function seekSegment(spec, onclick, waiting) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'sv-pkgseek-b';
    var chev = document.createElement('span');
    chev.className = 'sv-pkgseek-chev';
    chev.setAttribute('aria-hidden', 'true');
    chev.textContent = spec[2];
    var num = document.createElement('span');
    num.className = 'sv-pkgseek-num';
    num.textContent = spec[3];
    /* Direction reads outward from the number: the chevron leads going back and
       follows going forward, which is what the design draws and what every
       transport control does. */
    if (spec[0] < 0) { b.appendChild(chev); b.appendChild(num); }
    else { b.appendChild(num); b.appendChild(chev); }
    /* 🔴 THE ACCESSIBLE NAME IS THE SENTENCE, not the two glyphs. A button whose
       name is "\u226a 15" tells a screen-reader user nothing about which way it
       goes, and this is the one control in the row that is pure symbol. */
    b.setAttribute('aria-label', spec[1]);
    b.title = waiting || spec[1];
    if (waiting) b.disabled = true;
    b.addEventListener('click', function (e) {
      e.preventDefault();
      onclick();
    });
    return b;
  }

  /* 🔴 ONE PICKER BUILDER FOR BOTH SPEEDS, for the reason the whole row has one
     builder: the moment there are two of these written out separately, one of
     them gets a fix and the other does not. The caller supplies the word, the
     accessible name, the title and what to do with the number; everything a
     reader can SEE about a speed control is decided in here, once. */
  function ratePicker(spec) {
    var lab = document.createElement('label');
    lab.className = 'sv-pkgbar-lab';
    var cap = document.createElement('span');
    cap.className = 'sv-pkgbar-cap';
    cap.textContent = spec.caption;
    lab.appendChild(cap);
    var sel = document.createElement('select');
    sel.className = 'sv-pkgbar-rate' + (spec.cls ? ' ' + spec.cls : '');
    sel.title = spec.title;
    /* 🔴 THE ACCESSIBLE NAME CONTAINS THE VISIBLE WORD, which is WCAG 2.5.3 and
       is why it is built FROM `spec.caption` rather than written out again
       beside it. A voice user who says "Lecture" has to reach the control that
       says LECTURE, and two independently-written strings drift. */
    sel.setAttribute('aria-label', spec.caption + ' speed: ' + spec.what);
    PLAYBACK_RATES.forEach(function (v) {
      var o = document.createElement('option');
      o.value = String(v);
      o.textContent = (v === 1 ? '1' : String(v)) + '\u00d7';
      sel.appendChild(o);
    });
    sel.value = String(spec.value);
    sel.addEventListener('change', function () {
      var v = parseFloat(sel.value);
      /* From the LIST, never parsed and trusted: the same doctrine as every
         other value that crosses out of a control in this file. */
      if (PLAYBACK_RATES.indexOf(v) < 0) return;
      spec.onpick(v);
    });
    /* WRAPPING, not beside: the word becomes a click target and needs no `id`,
       which matters because more than one of these rows can exist in this
       document and a duplicated `id` associates the wrong control silently. */
    lab.appendChild(sel);
    return lab;
  }

  function playerRow(driver) {
    var bar = document.createElement('div');
    bar.className = 'sv-pkgbar';
    bar.setAttribute('role', 'group');
    bar.setAttribute('aria-label', 'Playback controls');

    /* --- left: this player's ONE speed, with the word EH asked to be able to SEE

       🔴 THE LECTURE PICKER IS PACKAGE-ONLY AND THE SPEED PICKER IS
       RECORDING-ONLY, and which of the two a row gets is the ONE PLACE THESE
       TWO ROWS ARE ALLOWED TO DIFFER. An ordinary recording has no slide
       timeline for a lecture speed to move; a lecture has had no narration
       speed of its own since 2026-09-05 (ONE SPEED PER PLAYER, above). The
       driver says which player it is by supplying `lecture` OR `rate`, and a
       driver that supplied both would get the lecture picker alone, because a
       lecture row with two speeds is the thing EH removed.
       `TheTwoPlayersDrawTheSameROW` knows about exactly this difference and
       still fails on any other.

       ⚠️ A LECTURE WHOSE SERVER CANNOT REMEMBER A LECTURE SPEED GETS NO SPEED
       AT ALL: absent rather than forgetful, the doctrine the lecture picker has
       always followed, and the voice picker no longer stands in for it. */
    if (driver.lecture) {
      bar.appendChild(ratePicker({
        caption: LECTURE_LABEL,
        what: 'slides and voice together',
        /* The wording the switch expects; `lockLectureRate` corrects the
           title if the frame then announces that it has no clock. */
        title: LECTURE_SPEED_BY_CLOCK ? LECTURE_TITLE_LIVE : LECTURE_TITLE,
        cls: 'sv-pkgbar-lec',
        value: driver.lecture.value,
        onpick: driver.lecture.pick
      }));
    } else if (driver.rate) {
      bar.appendChild(ratePicker({
        /* 🔴 A RECORDING KEEPS THE PLAIN WORD. One speed, so it is SPEED. */
        caption: RATE_LABEL,
        what: 'this recording',
        title: 'Playback speed',
        /* 🔴 ITS OWN CLASS, AND THIS IS A TRAP THIS FILE HAS ALREADY SPRUNG
           ONCE. `.sv-pkgbar-rate` is worn by both pickers, so every lookup
           that means "the speed of the recording" has to say so. The seek
           buttons used to be found by `.sv-pkgbar-b:not(.sv-pkgbar-cc)` for
           exactly this reason, and a lecture published without seeking
           disabled the CAPTIONS button as a result. The answer then was the
           answer now: give the distinct thing a distinct class rather than a
           `:not()` that somebody drops later. `.sv-pkgbar-rate` is a STYLING
           hook only. */
        cls: 'sv-pkgbar-mrate',
        value: 1,
        onpick: driver.rate
      }));
    }

    /* --- centre: four segments that read as ONE control --- */
    var pill = document.createElement('div');
    pill.className = 'sv-pkgseek';
    pill.setAttribute('role', 'group');
    pill.setAttribute('aria-label', 'Skip');
    SKIPS.forEach(function (spec, i) {
      if (i === 2) {
        /* The stronger divider BETWEEN the directions. An element rather than a
           border, because the two things either side of it are buttons and a
           border on either would move with that button's own hover. */
        var div = document.createElement('span');
        div.className = 'sv-pkgseek-div';
        div.setAttribute('aria-hidden', 'true');
        pill.appendChild(div);
      }
      pill.appendChild(seekSegment(spec, function () { driver.skip(spec[0]); },
                                   driver.waiting));
    });
    bar.appendChild(pill);

    /* --- right: captions --- */
    var cc = document.createElement('button');
    cc.type = 'button';
    cc.className = 'sv-pkgbar-cc';
    cc.textContent = CAPTIONS_TEXT;
    cc.setAttribute('aria-label', CAPTIONS_LABEL);
    cc.setAttribute('aria-pressed', CAPTIONS_ON ? 'true' : 'false');
    cc.title = CAPTIONS_ON ? CAPTIONS_TITLE_ON : CAPTIONS_TITLE_OFF;
    /* ⚠️ NOT disabled while a lecture is loading, unlike the skips. A skip
       cannot be honoured before the player answers; a preference can be set at
       any time and applies when there is something to apply it to. */
    cc.addEventListener('click', function (e) {
      e.preventDefault();
      setCaptionsOn(!CAPTIONS_ON, true);
    });
    bar.appendChild(cc);
    return bar;
  }

  /* ---------- the lecture speed: a URL, a reload, and a lock -------------

     🔴 WHY THIS IS A RELOAD AND NOT A SETTING. The package's timing blob is
     handed to `PresentationPlayer.start()` once, at boot, and never re-read;
     `playbackRate` appears zero times in the player's 1.67MB. So there is no
     property to set and no message to send. `?lecture_rate=` asks the SERVER to
     divide all twelve timing fields as it serves the document, and the reader
     gets a lecture that is genuinely shorter, slides and voice together.

     ⚠️ AND A RELOAD COSTS THE READER THEIR PLACE, which is the entire reason
     EH asked for the control to lock once you press play. */
  function packageSrc(base) {
    if (!base) return base;
    if (PLAYBACK_RATES.indexOf(LECTURE_RATE) < 0) return base;
    /* 🟢 THE CLOCK ASKS AT EVERY RATE, 1 INCLUDED, and that is the point
       rather than an exception to the rule below. The shim's presence is what
       makes the picker live: a lecture opened at 1 with no shim would have to
       RELOAD for its first change and could only be live after that. The
       blob is untouched at every rate on this path, so the rate-1 argument
       below (do not re-encode what was not asked for) does not apply to it. */
    if (LECTURE_SPEED_BY_CLOCK) {
      return base + (base.indexOf('?') < 0 ? '?' : '&') +
             'clock_rate=' + encodeURIComponent(String(LECTURE_RATE));
    }
    if (LECTURE_RATE === 1) return base;
    /* 🔴 Rate 1 sends NOTHING, and that is load-bearing rather than tidy. The
       server returns the file's own bytes when no rate is asked for; asking for
       1 explicitly would re-encode the blob and serve a document this project
       rewrote, on the one route that serves somebody else's HTML. The server
       guards this too (`rebuild` returns its argument at rate 1) -- this is the
       near side of the same rule, so neither half depends on the other. */
    return base + (base.indexOf('?') < 0 ? '?' : '&') +
           'lecture_rate=' + encodeURIComponent(String(LECTURE_RATE));
  }

  function saveLectureRate(v) {
    /* Only this key, for the reason `savePlaybackRate` gives. */
    return api('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lectureRate: v })
    }).catch(function () {});
  }

  /* ---------- keeping the reader's PLACE across that reload -------------
     🔴 EH'S OWN ANSWER TO HIS OWN PROPOSAL: *"let's see if we can do the dynamic
     time change with refresh while keeping the location of where we're at."*
     Until this, a speed change cost him his place, which is the entire reason
     the control had to lock on play.

     🔴 THE PLACE IS HELD OUT HERE, NOT IN THERE. The reload destroys the frame's
     document and everything in it, so the package cannot carry a value across
     its own death. Ask, hold, reload, hand back.

     🟢 ONLY THE TIME IS SCALED, and this is the finding that made the unit
     small. `gotoTimestamp` takes a WITHIN-SLIDE time rather than a position on
     one long timeline -- `seekTarget` crosses slides by subtracting per-slide

  function setLectureRate(frame, v) {
    if (PLAYBACK_RATES.indexOf(v) < 0) return false;

       the time this runs the frame's own `src` already carries a rate and
       appending to it would compound: 1.5 then 1.5 giving 2.25, which is the
       mistake `timeline.scale` has its own test for on the server side. */

    if (!base) return false;

       document and its place; the strip inside it rebases the clock and moves
       the voice with it, then announces, which is how the pickers follow.
       Everything under this `if` is the reload, kept whole as the backup, and
       it is what a frame that has not announced the clock still gets. */
    if (lectureIsLive(frame)) {
      LECTURE_RATE = v;
      saveLectureRate(v);
      return tellPackage(frame, { kind: 'sv-player-cmd', what: 'lecture', rate: v });
    }
    var from = rateOfSrc(frame.src);
    LECTURE_RATE = v;
    saveLectureRate(v);
    /* 🔴🔴 EH RULED 2026-09-05, HAVING ASKED TWICE: *"can we just go back to the
       functionality where changing the speed of the whole lecture just refreshes
       the whole lecture to start from the very beginning of the first slide?"*
       So the reload is the WHOLE behaviour again, and it is the branch that
       runs. */
    if (!RESTORE_PLACE_AFTER_RATE_CHANGE) {
      try { frame.src = packageSrc(base); }
      catch (e) { return false; }
      return true;
    }
    /* Before the ask, because a frame that is mid-reload has nobody to ask. */
    if (frame.__svPlace) return rescalePendingPlace(frame, v, base);
    /* ⚠️ TRUE NOW MEANS "ACCEPTED AND UNDER WAY", not "reloaded". The reload
       happens on the lecture's answer or on the timer, both of which are one
       turn of the event loop away at the earliest. */
    return askLecturePlace(frame, from, v, base);
  }

  /* 🔴 THE LOCK ITSELF. `sv-player-playing` arrives from the sandbox whenever
     the player's own `playbackState()` crosses between playing and not.

     ⚠️ THE LECTURES AUTOSTART -- measured 2026-09-03, not assumed:
     `settings().playback().autoStart()` is `true`, read through the public
     getter on three exporter versions covering 31 of the 38 packages, and the
     playback config in the blob is byte-identical across all 38. So a lecture
     that is left to itself begins playing, and a lock that engaged on the FIRST
     play and never released would leave this control dead from the moment it
     was drawn: born locked, never usable.

     🟢 SO THE RULE IS "LOCKED WHILE PLAYING", NOT "LOCKED ONCE PLAYED", and the
     unlock is the pause the reader already has. That is the reading of EH's
     *"lock once you start playing"* which is correct under BOTH worlds: if the
     lecture autostarts live, the picker opens locked and the title says to
     pause; if the browser holds the autostart back until a gesture, the picker
     opens free, the reader sets it, presses play, and it locks exactly as he
     described. ⚠️ Whether the autostart survives Chrome's own autoplay policy
     in a VISIBLE tab is not knowable from here -- every harness tab is hidden,
     so the clock never runs -- and this design does not need to know. */
