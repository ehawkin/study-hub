<style>
  /* 🔴 The light `--muted` is corrected HERE, in the wrapper, and not in the 67
     lesson files that each bake a copy of the palette.

     QA measured it, 2026-08-29: `#64777F` on `#F1F4F3` is **4.23:1**, and WCAG AA
     wants 4.5:1 for text under 18.66px. Every place this token appears is small:
     the lesson eyebrow at 12px, the hub and settings subtitles at 15.2px.
     `#5F7178` is the same hue two steps darker and measures **4.61:1** on paper
     and 4.96:1 on surface. Dark mode was audited and returned zero failures, so
     it is deliberately untouched.

     Why here rather than in the lessons: a palette baked into course content is
     presentation smuggled into a data pack, which is the thing EH's architecture
     rule exists to stop, and editing 67 files would fix only the courses that
     already exist. This block sits AFTER the lesson's own body in the composed page, so a
     plain `:root` here beats the lesson's own `:root` on source order, while the
     lesson's higher-specificity dark rules still win where they should. One line
     fixes every course, imported packs included. */
  :root { --muted: #5F7178; }

  :root { --hl-key: #C9E4DC; --hl-q: #F3DDBE; --hl-d: #CBDCEA; --hl-d-line: #2F6187; --hl-blend: multiply; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --hl-key: #22504A; --hl-q: #4B3721; --hl-d: #22384E; --hl-d-line: #7FB0D0; --hl-blend: screen; }
  }
  :root[data-theme="dark"] { --hl-key: #22504A; --hl-q: #4B3721; --hl-d: #22384E; --hl-d-line: #7FB0D0; --hl-blend: screen; }

  mark.hl {
    background: var(--hl-key); color: inherit; border-radius: 2px; cursor: pointer;
    -webkit-box-decoration-break: clone; box-decoration-break: clone;
  }
  mark.hl.q { background: var(--hl-q); }
  mark.hl.d { background: var(--hl-d); }

  /* ---------- two or more colours on one passage MIX ----------

     🟢 RULED BY EH, 2026-09-04, twice: "it's okay if mixing two colors
     produces a color that's not in the palette. It's fine. It's not an actual
     like color that needs to be shown up as a tag anywhere. It just shows up
     as part of the highlight. Yes, let's do the color mixing." This REPLACES
     the diagonal stripes he chose the day before, which had a measured limit:
     three colours stack with the same phase and period, so the middle one was
     invisible. A mix has no such limit, because every mark contributes to the
     colour under it whatever the depth.

     🔴 HOW IT WORKS, and why there is still no rule per PAIR of colours: the
     inner mark is BLENDED with what it sits on instead of painted over it.
     `mix-blend-mode` does the arithmetic in the browser, so the inner never
     has to know the outer's colour, and a third mark blends with the result of
     the first two. The single-mark rules above are untouched: a passage with
     one colour paints exactly as it did.

     ⚠️ THE BLEND IS A THEME TOKEN, because the arithmetic has a sign. Light
     highlights are pale on a pale ground, and MULTIPLY darkens the overlap the
     way two highlighter pens do (yellow over teal reads olive). Dark highlights
     are dark on a dark ground, and multiply would send the overlap to near
     black, a hole rather than a highlight; SCREEN is the same operation with
     the lightness reversed, so the overlap lights up instead. What the text
     contrast comes to at each depth in each theme is MEASURED and reported to
     EH, not enforced here: dark mode's look is his call, by his own ruling
     ("if there are any issues with dark mode, let me determine that").

     🟢 `isolation: isolate` on a mark that CONTAINS a mark makes the inner
     blend with the outer's colour and nothing behind it, so the mixed colour is
     the same on the plain page, in a tinted box, or over a figure. A single
     mark never matches `:has(mark.hl)`, so it gains no stacking context.

     🔴 NOTHING NAMES THE MIXED COLOUR. It exists only in paint: the computed
     background of every mark is still its own `--hl-*` token, the notebook and
     the filter read the CLASS, and no tag, button or border ever receives it. */
  mark.hl:has(mark.hl) { isolation: isolate; }
  mark.hl mark.hl { mix-blend-mode: var(--hl-blend); }

  mark.hl.noted { box-shadow: inset 0 -2px 0 var(--regulated); }
  mark.hl.active { outline: 2px solid var(--regulated); outline-offset: 1px; }

  /* These set display:flex, which outranks the UA stylesheet's [hidden]{display:none}.
     Without this the panel and toolbar are permanently visible. */
  .hl-bar[hidden], .hl-panel[hidden] { display: none; }

  .hl-bar {
    position: absolute; z-index: 60; display: flex; gap: 5px; padding: 5px;
    background: var(--surface); border: 1px solid var(--rule); border-radius: 7px;
    box-shadow: 0 6px 20px rgba(0,0,0,.2);
  }
  .hl-bar button {
    font: 600 12px var(--body); border: 1px solid var(--rule); color: var(--ink);
    border-radius: 4px; padding: 6px 11px; cursor: pointer;
  }
  .hl-bar .hl-sep { width: 1px; align-self: stretch; margin: 1px 2px;
                    background: var(--rule); }
  .hl-bar button.k { background: var(--hl-key); }
  .hl-bar button.q { background: var(--hl-q); }
  .hl-bar button.d { background: var(--hl-d); }

  .hl-fab {
    position: fixed; right: 20px; bottom: 20px; z-index: 55;
    font: 600 13px var(--body); color: var(--ink); background: var(--surface);
    border: 1px solid var(--rule); border-radius: 999px; padding: 10px 17px;
    cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.16);
  }
  .hl-fab:focus-visible, .hl-bar button:focus-visible { outline: 2px solid var(--regulated); outline-offset: 2px; }

  .hl-panel {
    position: fixed; right: 0; top: 0; bottom: 0; width: min(410px, 94vw); z-index: 70;
    background: var(--surface); border-left: 1px solid var(--rule);
    display: flex; flex-direction: column; box-shadow: -8px 0 30px rgba(0,0,0,.18);
  }
  .hl-panel header {
    display: flex; align-items: baseline; gap: 10px;
    padding: 16px 18px; border-bottom: 1px solid var(--rule);
  }
  .hl-panel header strong { font-family: var(--display); font-size: 20px; font-weight: 600; }
  .hl-panel header .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .hl-panel header button {
    margin-left: auto; font: 600 12.5px var(--body); background: none;
    border: 1px solid var(--rule); border-radius: 4px; color: var(--ink);
    padding: 5px 10px; cursor: pointer;
  }
  .hl-scroll { overflow-y: auto; flex: 1; padding: 2px 18px 18px; }
  .hl-sec { margin-top: 16px; }
  .hl-sechead {
    display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px;
    position: sticky; top: 0; background: var(--surface); padding: 6px 0 5px; z-index: 2;
  }
  .hl-sechead h3 {
    font-family: var(--mono); font-size: 11px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted); margin: 0; font-weight: 600;
  }
  .hl-sechead button {
    margin-left: auto; font: 600 11.5px var(--body); background: var(--paper);
    border: 1px solid var(--rule); border-radius: 4px; color: var(--ink);
    padding: 4px 11px; cursor: pointer;
  }
  .hl-sechead button:hover { border-color: var(--regulated); color: var(--regulated); }
  .hl-note { border-bottom: 1px solid var(--rule-soft); padding: 12px 0; }
  .hl-note textarea {
    width: 100%; font: 14.5px var(--body); color: var(--ink); background: var(--paper);
    border: 1px solid var(--rule); border-radius: 4px; padding: 9px 10px;
    resize: vertical; min-height: 68px; line-height: 1.5;
  }
  .hl-note textarea:focus { outline: 2px solid var(--regulated); outline-offset: -1px; }
  .hl-note .row { display: flex; gap: 4px; align-items: center; margin-top: 6px; }
  .hl-note .when { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-right: auto; }
  .hl-note .mini {
    font: 500 12px var(--body); background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 4px 7px; border-radius: 3px;
  }
  .hl-note .mini:hover { color: var(--ink); background: var(--paper); }
  .hl-item { border-bottom: 1px solid var(--rule-soft); padding: 14px 0; }
  .hl-item blockquote {
    margin: 0 0 9px; padding-left: 11px; border-left: 3px solid var(--hl-key);
    font-size: 14.5px; line-height: 1.5; color: var(--ink);
  }
  .hl-item.q blockquote { border-left-color: var(--hl-q); }
  .hl-item.d blockquote { border-left-color: var(--hl-d-line); }
  .hl-item.orphan blockquote { border-left-color: var(--broken); opacity: .8; }
  .hl-item textarea {
    width: 100%; font: 14px var(--body); color: var(--ink); background: var(--paper);
    border: 1px solid var(--rule); border-radius: 4px; padding: 7px 9px;
    resize: vertical; min-height: 36px;
  }
  .hl-item .row { display: flex; gap: 4px; margin-top: 6px; }
  .hl-item .mini {
    font: 500 12px var(--body); background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 4px 7px; border-radius: 3px;
  }
  .hl-item .mini:hover { color: var(--ink); background: var(--paper); }
  .hl-panel footer {
    display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 18px;
    border-top: 1px solid var(--rule);
  }
  .hl-panel footer button, .hl-panel footer label {
    font: 600 12.5px var(--body); border: 1px solid var(--rule); background: var(--paper);
    color: var(--ink); border-radius: 4px; padding: 7px 12px; cursor: pointer;
  }
  .hl-warn {
    margin: 14px 18px 0; padding: 10px 12px; border-radius: 4px;
    background: var(--broken-wash); color: var(--ink); font-size: 13px;
    border: 1px solid var(--broken); line-height: 1.45;
  }
  .hl-empty { color: var(--muted); font-size: 14.5px; padding: 20px 0; line-height: 1.55; }
  /* 🔴 z-index 98 and `pointer-events: none` ARE ONE CHANGE, and shipping either
     alone is worse than shipping neither. Ruled 2026-09-01 on a QA finding: the
     toast was at 90 and `.sv-token`, the bar that asks an unpaired device for the
     token, is at 95 and sits in the same place, bottom centre, opaque and larger.
     `elementFromPoint` at the toast's own centre returned the BAR'S PASSWORD INPUT,
     so the stale-page notice lived its 3.2 seconds and was removed entirely behind
     the bar. The reader most likely to need that notice is the one who never saw it.

     🔴 The other half: this rule declared no `pointer-events`, so it defaulted to
     `auto`. Raising the toast alone would have turned "the reader cannot SEE the
     message" into "the reader cannot TYPE THEIR TOKEN for 3.2 seconds", on the exact
     device the notice was raised for, and no test that checks the toast is on top
     would have noticed.

     🟢 A toast is a message and never a target, and that is structural rather than
     circumstantial: `toast()` below builds the node with `t.textContent = msg`, so
     across all 52 call sites it can only ever hold a text node. Making one clickable
     means editing that line, which is where anybody adding a button would be standing.

     The stack above 80: 80 popover · 84 scrim · 85 dialog · 88 panel · 91 wipescrim ·
     92 wipe · 95 token bar · 96 mini · 97 palette · 98 TOAST · 2147483647 watchdog.
     🔴 Below the watchdog on purpose: a bar saying the page did not load must never
     be covered by a toast about highlights. */
  /* 🔴 IT IS CENTRED BY TRANSFORM AND HAD NO WIDTH LIMIT, so a long message
     sized itself to one line and was clipped at BOTH ends the moment that line
     was wider than the window. Measured at 13.5px in a real browser, and the
     two widest are not new: "This page was loaded before the study server was
     updated..." is 600px and "That lesson is not on this machine..." is 483px,
     against 166px for "Bookmark removed."

     `min(92vw, 560px)` rather than a single number: 92vw is what keeps it
     inside a narrow window (EH's reading pane and the popped-out materials
     window are exactly where these are read), and 560px stops a wide screen
     turning a one-line message into a banner. `white-space` is left at its
     default so the text WRAPS at that limit instead of being cut; the pill
     grows a line and stays a pill.

     ⚠️ THE CONTROL, and it is the half that could go wrong: a short toast must
     be unchanged. `max-width` is a cap, not a width, so "Bookmark removed."
     still sizes to its own 166px and does not become a 560px band. A test
     drives both cases rather than trusting that sentence. */
  .hl-toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 26px; z-index: 98;
    pointer-events: none;
    max-width: min(92vw, 560px);
    background: var(--ink); color: var(--paper); font: 13.5px var(--body);
    padding: 9px 17px; border-radius: 999px; box-shadow: 0 6px 20px rgba(0,0,0,.25);
  }
  @media print { .hl-fab, .hl-panel, .hl-bar, .hl-toast { display: none !important; } }

  /* 🔴 The first-generation controls are hidden HERE, in the composed page, and
     not by the layer that replaced them. EH's ruling, 2026-08-29, after a night
     of every lesson rendering with the layer switched off: "nothing is probably
     better". A dead layer must leave a clean page and one clear message, never
     the old engine standing alone, which is what he actually met: highlighting
     that gave only a flag and a card, and a notes button bottom right opening a
     panel that could not be closed.

     🔴 They are HIDDEN, never removed, and that part has not changed: R18 moved
     these pills into the header and every header button still drives the original
     control's own handler, so .hl-fab has to stay in the document with its
     listener, its aria-expanded and its count intact. A programmatic click still
     reaches a display:none button.

     🔴 SCOPED TO html:not(.sv-head-on), and the scope is the entire correctness
     of this rule. The first version of it was unconditional and broke highlighting
     on every lesson of every course for half a day: `.hl-bar` IS the selection
     toolbar, which the layer EXTENDS rather than replaces (it appends its own
     .sv-act buttons to it and restyles it, and `.hl-bar[hidden]` is what shows and
     hides it), and `.hl-panel` is the notes panel the sidebar's Notes tab opens by
     clicking the hidden fab. Force-hiding them with !important beat the `hidden`
     attribute the engine drives, so selecting text did nothing at all.

     🔴 The mistake underneath that is worth more than the fix: the set of four was
     copied from the `@media print` rule directly above. Print hiding answers "what
     should not appear on paper"; this rule answers "what did the layer replace",
     and only .hl-fab is in both. A list that happens to sit nearby is not the same
     list, and the way to tell was to read what the layer does with each one.

     So: when the layer is alive (it sets html.sv-head-on once its header is built)
     only the fab is hidden, by the rule below, and the bar and the panel are its
     working parts. When the layer is DEAD the class is never set and all four go,
     which is EH's ruling honoured with the selection toolbar intact. Deleting the
     old engine outright is the backlog entry "Finish the R18 migration". */
  html:not(.sv-head-on) .hl-fab,
  html:not(.sv-head-on) .hl-panel,
  html:not(.sv-head-on) .hl-bar,
  html:not(.sv-head-on) .hl-toast { display: none !important; }
</style>

<div class="hl-bar" id="hlBar" hidden>

<script>
(function () {
  'use strict';

  var DOC_ID    = '@@DOC_ID@@';
  /* 🔴 The origin the server composed this page FOR. Empty when nothing was
     serving. This is what the reader's layer gates on; see window.STUDY below. */
  var SERVED_FROM = '@@SERVED_FROM@@';
  /* The course's own name, for the header crumb. Empty on a page composed
     before this existed, and the layer falls back to the code. */
  var COURSE_NAME = '@@COURSE_NAME@@';
  /* 🔴 The build id of the server that composed this page. The layer compares
     it against /healthz when the tab comes back into view, so a tab left open
     across a restart can say so instead of writing with an old engine.

     EMPTY IS THE NORMAL ANSWER and means "run no check": a page composed by a
     rebuild, by the kit's builder or by the verifier has no server to be stale
     against. Same unfilled-token rule as SERVED_FROM below, and here the token
     surviving would be strictly worse than empty: it matches no build id the
     server can ever return, so every tab would ask for a reload for ever. */
  var SERVED_BUILD = '@@BUILD_ID@@';
  if (SERVED_BUILD.indexOf('@@') === 0) SERVED_BUILD = '';
  /* What to call the machine this server runs on, for the two sentences that
     have to name it. Empty is the normal answer for a page nobody served, and
     for a reader on loopback it is never consulted at all.

     Same unfilled-token rule as SERVED_FROM below, and here it is the cheap
     kind of wrong: an older server leaves the token verbatim, and the Files
     pane then says an attachment is kept on a machine called by the token's
     own name. Written without spelling the token out, because render() would
     substitute it inside this comment too. */
  var MACHINE_NAME = '@@MACHINE_NAME@@';
  if (MACHINE_NAME.indexOf('@@') === 0) MACHINE_NAME = '';
  /* 🔴 An UNFILLED token means this page template is newer than the server
     composing it: the file is picked up from disk without a restart (it is
     mtime-cached), while the Python that fills the token is only loaded at
     process start. Between saving this file and restarting, an older server
     emits the token verbatim.

     Treat that as "not served", never as an origin. Left as-is it is a truthy
     string that matches no origin, which switches the reader off EVERYWHERE
     rather than only where it was already off. Met for real on 2026-08-29, on
     the live server, in the minutes between the two. A composed page must never
     be able to claim an origin nobody gave it. */
  if (SERVED_FROM.indexOf('@@') === 0) SERVED_FROM = '';

  /* 🔴 The neighbouring lessons, stamped at compose time so a reader with no
     token can still move through the module. `/api/materials` serves the same
     thing but every /api/ path is token-gated, so on an unpaired device both
     nav strips stayed hidden and "read without it" meant "read this one page".

     Same unfilled-token rule as SERVED_FROM above, and the same reason: an
     older server emits the token verbatim. Anything that is not parseable JSON
     becomes null, and the layer then behaves exactly as it did before this
     existed, asking the API. */
  var LESSON_NAV = '@@LESSON_NAV@@';
  try {
    LESSON_NAV = (LESSON_NAV && LESSON_NAV.indexOf('@@') !== 0)
      ? JSON.parse(LESSON_NAV) : null;
  } catch (e) { LESSON_NAV = null; }
  if (LESSON_NAV && !LESSON_NAV.prev && !LESSON_NAV.next) LESSON_NAV = null;

  /* 🔴 The pinned pdf.js version, which is the CACHE KEY in the vendor URL and
     the answer to "is there a viewer at all". Empty means no viewer: a page
     composed by a server built without the vendored files, or opened as a file.
     The pane then behaves exactly as it did before this existed.

     Same unfilled-token rule as everything above, and here it matters more than
     usual: left verbatim it would be a version string of '@@PDFJS@@', the page
     would ask for /reader/vendor/@@PDFJS@@/pdf.min.mjs, and the 404 would arrive
     as a module-load failure with no obvious cause. */
  var PDFJS_VERSION = '@@PDFJS@@';
  if (PDFJS_VERSION.indexOf('@@') === 0) PDFJS_VERSION = '';

  /* This lesson's own stars and bulbs, for the header controls. Same unfilled
     token rule; an older server emits it verbatim and it becomes {}. */
  var LESSON_STATE = '@@LESSON_STATE@@';
  try {
    LESSON_STATE = (LESSON_STATE && LESSON_STATE.indexOf('@@') !== 0)
      ? JSON.parse(LESSON_STATE) : {};
  } catch (e) { LESSON_STATE = {}; }

  /* ---- the watchdog: a dead layer says so, out loud ----------------------
     EH's ruling, 2026-08-29: "nothing is probably better" than a partial
     fallback. So there is no partial fallback. There is a clean page, and if the
     reader's layer should have loaded and did not, there is one sentence saying
     exactly that.

     🔴 It lives HERE, in the composed page, and must never move into
     local-layer.html. Inside a published artifact copy the layer is meant to be
     invisible; a watchdog shipped inside it would fire there and tell somebody
     their perfectly working page is broken.

     🔴 It fires only when this page is being read from the origin it was served
     for. Off that origin the layer is SUPPOSED to be absent, and a warning would
     be a lie. */
  (function () {
    if (!SERVED_FROM || SERVED_FROM !== location.origin) return;
    var broke = false;
    window.addEventListener('error', function () { broke = true; }, true);
    function complain() {
      if (window.SV_LAYER_READY || document.getElementById('sv-watchdog')) return;
      var bar = document.createElement('div');
      bar.id = 'sv-watchdog';
      bar.setAttribute('role', 'alert');
      bar.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:2147483647;' +
        'padding:10px 14px;font:600 14px/1.4 system-ui,-apple-system,sans-serif;' +
        'background:#7a2020;color:#fff;text-align:center';
      bar.textContent = broke
        ? 'The reader did not finish loading, and something on the page failed. Reload the page.'
        : 'The reader did not finish loading, so highlighting and the panels are missing. Reload the page.';
      var host = document.body || document.documentElement;
      host.appendChild(bar);
      /* 🔴 Push the page down by exactly the bar's height. A page whose layer
         died has no header, so nothing has reserved space at the top and a
         fixed bar would sit on the lesson's first line: the reader would be
         told what is wrong while being shown less of what they came for. */
      try {
        var h = bar.getBoundingClientRect().height;
        if (h && document.body) {
          document.body.style.paddingTop =
            (parseFloat(getComputedStyle(document.body).paddingTop) || 0) + h + 'px';
        }
      } catch (e) {}
    }
    /* After load, and then once more a beat later: the layer is the last script
       in the page, so on a slow first paint it can still be running when load
       fires. Two looks cost nothing and stop a false alarm. */
    window.addEventListener('load', function () { window.setTimeout(complain, 1200); });
  }());
  var DOC_TITLE = '@@DOC_TITLE@@';
  var STORE_KEY = '@@STORE_PREFIX@@' + DOC_ID;
  var FENCE     = '```';

  /* Coordinates for the Obsidian vault export. One note per WEEK per class
     (Courses/KCL <Class> W<nn> - <Week title>), with topic and part as headings
     inside it, per the vault's Conventions. */
  var VAULT = {
    cls:       '@@VAULT_CLS@@',
    week:      '@@VAULT_WEEK@@',
    topicNo:  '@@VAULT_TOPICNO@@',
    weekTitle: '@@VAULT_WEEKTITLE@@',
    topic:     '@@VAULT_TOPIC@@',
    part:      '@@VAULT_PART@@',
    keats:     '@@VAULT_KEATS@@'
  };

  /* td and th were missing, which made every table in the module
     unhighlightable: 57 cells across parts 3, 4 and 5. */
  var SEL = '.wrap p, .wrap li, .wrap h1, .wrap h2, .wrap h3, .wrap h4,' +
            '.wrap dd, .wrap dt, .wrap figcaption, .wrap blockquote,' +
            '.wrap td, .wrap th';

  var items   = [];
  var notes   = [];
  var blocks  = [];
  var storeOK = true;
  var syncHooks = [];
  var seq     = 0;
  var nseq    = 0;

  var bar   = document.getElementById('hlBar');
  var fab   = document.getElementById('hlFab');
  var fabN  = document.getElementById('hlFabN');
  var panel = document.getElementById('hlPanel');
  var list  = document.getElementById('hlList');
  var noteBox = document.getElementById('hlNotes');
  var count = document.getElementById('hlCount');
  var warn  = document.getElementById('hlWarn');

  /* ---------- setup ---------- */

  /* Only outermost candidates become blocks. A nested one (a sub-bullet inside
     a list item) would be detached the moment its parent's innerHTML is reset
     during a repaint, silently breaking every highlight inside it. */
  blocks = Array.prototype.slice.call(document.querySelectorAll(SEL))
    .filter(function (el) {
      if (el.closest('.hl-panel') || el.closest('.sv-add')) return false;
      if (el.textContent.trim().length === 0) return false;
      var p = el.parentElement;
      while (p && p !== document.body) {
        if (p.matches && p.matches(SEL)) return false;
        p = p.parentElement;
      }
      return true;
    });

  blocks.forEach(function (el, i) {
    el.setAttribute('data-hb', String(i));
    el._orig = el.innerHTML;
  });

  /* ---------- storage ---------- */

  function load() {
    try {
      var raw = window.localStorage.getItem(STORE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        /* v1 stored a bare array of highlights; v2 stores {items, notes}.
           Read both so nothing saved before free notes existed is lost. */
        if (Array.isArray(parsed)) {
          items = parsed;
        } else if (parsed && typeof parsed === 'object') {
          items = parsed.items || [];
          notes = parsed.notes || [];
        }
      }
    } catch (err) {
      storeOK = false;
    }
    items.forEach(function (it) { if (it.id >= seq) seq = it.id + 1; });
    notes.forEach(function (nt) { if (nt.id >= nseq) nseq = nt.id + 1; });
  }

  function save() {
    if (!storeOK) return;
    try {
      window.localStorage.setItem(STORE_KEY, JSON.stringify({ items: items, notes: notes }));
      syncHooks.forEach(function (fn) { try { fn(); } catch (e) {} });
    } catch (err) {
      storeOK = false;
      renderPanel();
    }
  }

  /* ---------- offsets ---------- */

  function offsetIn(block, node, off) {
    var r = document.createRange();
    r.selectNodeContents(block);
    try { r.setEnd(node, off); } catch (err) { return -1; }
    return r.toString().length;
  }

  function blockOf(node) {
    var el = node.nodeType === 1 ? node : node.parentNode;
    return el ? el.closest('[data-hb]') : null;
  }

  /* ---------- painting ---------- */

  function paint(block, s, e, cls, id) {
    var walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT, null);
    var pos = 0, node, targets = [];
    while ((node = walker.nextNode())) {
      var len = node.nodeValue.length;
      var ns = pos, ne = pos + len;
      if (ne > s && ns < e) {
        targets.push({ node: node, from: Math.max(0, s - ns), to: Math.min(len, e - ns) });
      }
      pos = ne;
      if (pos >= e) break;
    }
    targets.forEach(function (t) {
      var n = t.node;
      if (t.to < n.nodeValue.length) n.splitText(t.to);
      if (t.from > 0) n = n.splitText(t.from);
      var m = document.createElement('mark');
      m.className = 'hl' + (cls === 'q' ? ' q' : (cls === 'd' ? ' d' : ''));
      if (m.dataset) m.dataset.id = String(id);
      n.parentNode.insertBefore(m, n);
      m.appendChild(n);
    });
    return targets.length > 0;
  }

  function renderMarks() {
    blocks.forEach(function (b) { b.innerHTML = b._orig; });

    var byBlock = {};
    items.forEach(function (it) {
      (byBlock[it.b] = byBlock[it.b] || []).push(it);
    });

    Object.keys(byBlock).forEach(function (bi) {
      var block = blocks[Number(bi)];
      if (!block) { byBlock[bi].forEach(function (it) { it.orphan = true; }); return; }
      var text = block.textContent;

      byBlock[bi].sort(function (a, z) { return a.s - z.s; }).forEach(function (it) {
        var s = it.s, e = it.e;
        if (text.slice(s, e) !== it.t) {
          var found = text.indexOf(it.t);
          if (found === -1) { it.orphan = true; return; }
          s = found; e = found + it.t.length;
          it.s = s; it.e = e;
        }
        it.orphan = false;
        paint(block, s, e, it.c, it.id);
      });
    });

    /* 🔴 By GROUP, not by item. A group's note lives on its head, so painting
       `noted` per item put the marker on the first cell of a two-cell highlight
       and left the second bare. Found by reloading the page rather than by a
       test: the panel was right and the page was not. */
    groupMarks(items).forEach(function (g) {
      if (!g.n) return;
      g.ids.forEach(function (id) {
        document.querySelectorAll('mark.hl[data-id="' + id + '"]').forEach(function (m) {
          m.classList.add('noted');
        });
      });
    });
  }

  /* ---------- one selection is one highlight ----------

     EH, 2026-08-30: "when I select what amounts to more than one cell in a
     table and make that a highlight, it currently ends up showing up as two
     separate highlight notes in my notebook... A single selection shouldn't be
     the single note or single highlight. Even if it's two different sections,
     you can separate them in the note, let's say with a dash between the two
     items, but they should nevertheless be considered one note and one
     highlight."

     🔴 The STORE still keeps one item per block, and that is deliberate rather
     than lazy. Painting wraps text nodes inside one block and re-anchoring
     re-finds offsets within one block, so a single item holding several ranges
     would mean rewriting the painter, the re-anchorer and the absorber. What
     the store gained is a shared group id `g`; what changed is every place that
     PRESENTS marks, which now folds a group into one row: text joined in
     document order with " - " (EH's own suggestion), one note, one colour, one
     delete.

     🔴 An item with no `g` is a group of one. That is every highlight made
     before today, so nothing is migrated and nothing can be lost by this. */
  function groupMarks(list) {
    var sorted = (list || []).slice().sort(function (a, z) {
      return (a.b - z.b) || (a.s - z.s);
    });
    /* 🔴 `Object.create(null)`, not `{}`, and it is one character of hardening
       for a loud failure. A group id of `constructor` or `__proto__` would find
       `Object.prototype`, make `byG[g]` truthy for a group that does not exist,
       and throw where Python folds it happily: the whole notebook stops
       rendering. Ids are minted `'g' + seq` below, so it is unreachable from
       this product's own code; it costs nothing while the fold is open. */
    var out = [], byG = Object.create(null);
    sorted.forEach(function (it) {
      var g = it.g;
      if (!g) { out.push({ head: it, parts: [it] }); return; }
      if (byG[g]) { byG[g].parts.push(it); return; }
      byG[g] = { head: it, parts: [it] };
      out.push(byG[g]);
    });
    return out.map(function (grp) {
      var parts = grp.parts;
      var alive = parts.filter(function (p) { return !p.orphan; });
      /* 🔴 The head for ANCHORING is the first surviving part, not the first
         part. The original head is the one most likely to have orphaned (a
         group's note is consolidated onto its first member), and taking `b`
         and `s` from a lost block is how the published form ended up pointing
         at nothing. Everything positional comes from `anchor`; everything that
         belongs to the SELECTION comes from the whole group. */
      var anchor = alive.length ? alive[0] : parts[0];
      /* 🔴 The ANCHOR's own note wins, and only then any other part's. The
         panel addresses a group by its anchor's id, so a note edited after one
         part orphaned is written to the anchor; reading "the first part with a
         note" in document order would find the orphan's OLD note and quietly
         undo the edit. The fallback is what rescues the note when the head is
         the part that was lost. */
      var noted = String(anchor.n || '').trim() ? anchor : parts.filter(function (p) {
        return String(p.n || '').trim();
      })[0];
      var coloured = anchor.c ? anchor : parts.filter(function (p) { return p.c; })[0];
      return {
        /* The anchor's id addresses the group everywhere: `data-item` in the
           panel, the layer's svItemFor, jumpTo's scroll target. So a group of
           one is byte-for-byte the object every consumer already handled. */
        id: anchor.id, g: anchor.g || '', b: anchor.b, s: anchor.s,
        c: (coloured && coloured.c) || 'k',
        head: anchor, parts: parts,
        ids: parts.map(function (p) { return p.id; }),
        /* Every part, orphaned or not: the words EH highlighted are still the
           words he highlighted, whatever happened to one block's anchor. */
        t: parts.map(function (p) {
          return String(p.t || '').replace(/\s+/g, ' ').trim();
        }).filter(Boolean).join(' - '),
        /* The note belongs to the GROUP and survives whichever part was lost.
           Taking it from the head alone is what silently emptied it in the
           vault when the head orphaned. */
        n: (noted && noted.n) || '',
        /* Orphaned only when EVERY part lost its anchor. One surviving part
           still knows where the group is, and the words of the lost part are
           still safe in `t`. */
        orphan: !alive.length

  /* ---------- panel ---------- */

  function renderPanel() {
    /* Counted in GROUPS, not items: one selection is one highlight, so a
       passage dragged across two table cells must not read as two. */
    var nHl = groupMarks(items).length;
    fabN.textContent = String(nHl + notes.length);
    count.textContent = (nHl + notes.length) === 0 ? '' :
      (notes.length + (notes.length === 1 ? ' note' : ' notes') + ', ' +
       nHl + (nHl === 1 ? ' highlight' : ' highlights'));

    if (!storeOK) {
      warn.hidden = false;
      warn.textContent = 'This browser will not let the page store highlights, so they will vanish when you close the tab. Export before you leave.';
    } else {

    }

    renderHighlights();
  }

  function renderNotes() {
    noteBox.innerHTML = '';
    if (notes.length === 0) {
      var p = document.createElement('p');
      p.className = 'hl-empty';
      p.textContent = 'Nothing yet. Anything that comes to mind about this material goes here: a question, a connection to something else, a thought to chase later. Notes are not tied to any passage.';
      noteBox.appendChild(p);
      return;
    }
    notes.slice().sort(function (a, z) { return (z.ts || 0) - (a.ts || 0); }).forEach(function (nt) {
      var wrap = document.createElement('div');
      wrap.className = 'hl-note';
      /* 🔴 Addressable, exactly as a highlight row is by `data-item`. The
         reader's layer decorates these rows and had no way to say WHICH note a
         row was: the list is sorted by time here, so matching by position is a
         race with the next edit. One attribute costs nothing and is the same
         seam that already exists one section down. */
      wrap.setAttribute('data-note', String(nt.id));

      var ta = document.createElement('textarea');
      ta.value = nt.text || '';
      ta.placeholder = 'Write anything';
      /* saves as you type, and deliberately does not re-render, which would steal focus */
      ta.addEventListener('input', function () { nt.text = ta.value; save(); });
      wrap.appendChild(ta);

      var row = document.createElement('div');
      row.className = 'row';

      var when = document.createElement('span');
      when.className = 'when';

      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'mini';
      del.textContent = 'Remove';
      del.addEventListener('click', function () {
        notes = notes.filter(function (x) { return x.id !== nt.id; });
        save(); renderPanel();
      });
      row.appendChild(del);

      wrap.appendChild(row);
      noteBox.appendChild(wrap);
    });
  }

  function addNote() {
    notes.push({ id: nseq++, text: '', ts: Date.now() });
    save();
    openPanel();
    var first = noteBox.querySelector('textarea');
    if (first) { first.focus(); }
  }

  function renderHighlights() {
    list.innerHTML = '';
    if (items.length === 0) {
      var p = document.createElement('p');
      p.className = 'hl-empty';
      p.textContent = 'Select any text in the page to highlight it. Use Flag for anything you want to come back to.';
      list.appendChild(p);
      return;
    }

       what `data-item` has always carried, so the reader's layer decorating
       these rows (svItemFor, the note editor) needs no change at all. */
    groupMarks(items).forEach(function (it) {
      var wrap = document.createElement('div');
      wrap.className = 'hl-item' + (it.c === 'q' ? ' q' : (it.c === 'd' ? ' d' : '')) + (it.orphan ? ' orphan' : '');
      wrap.setAttribute('data-item', String(it.id));
      if (it.ids.length > 1) wrap.setAttribute('data-group', it.ids.join(','));

      var q = document.createElement('blockquote');
      q.textContent = it.t;
      wrap.appendChild(q);

      if (it.orphan) {
        var o = document.createElement('p');
        o.style.cssText = 'font-size:12.5px;color:var(--broken);margin:0 0 8px';
        o.textContent = 'The page text changed, so this one is no longer anchored. The words above are still safe and still export.';
        wrap.appendChild(o);
      }

      var ta = document.createElement('textarea');
      ta.value = it.n || '';
      ta.placeholder = 'Add a note';
      ta.addEventListener('input', function () {

           it can live: `it` here is a fold, not a stored object, so writing to
           it would be writing to something that stops existing on the next
           render. Every part is repainted as noted, so the whole group carries
           the underline rather than only its first block. */
        it.head.n = ta.value;

      var row = document.createElement('div');
      row.className = 'row';

        jump.className = 'mini';
        jump.textContent = 'Jump to';
        jump.addEventListener('click', function () { jumpTo(it.ids); });

      }

      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'mini';
      del.textContent = 'Remove';
      del.addEventListener('click', function () {

           Remove takes it away; leaving the other half painted with no row in
           the panel would be worse than either outcome. */

      wrap.appendChild(row);
      list.appendChild(wrap);
    });

  /* 🔴 Takes the whole GROUP, not one id. A selection across two table cells is

     is half the size it is. It also survives a half-orphaned group: the scroll
     goes to the first part still on the page, rather than giving up because the
     head is the part that lost its anchor. */
  function jumpTo(ids) {
    var list = (typeof ids === 'object' && ids.length) ? ids : [ids];
    var sel = list.map(function (id) { return 'mark.hl[data-id="' + id + '"]'; }).join(',');
    var m = document.querySelector(sel);

       rather than removed. EH, 2026-08-31: "the right panel closes. It should
       not." Above 899px the panel is DOCKED, not an overlay: the layer's
       `setPanelSpace()` writes `--sv-reserved` and `local-layer.html` spends it
       as `body { padding-right }` inside `@media (min-width: 900px)`, so the
       lesson re-centres in what is left and nothing is ever underneath the
       panel. Closing it buys the reader nothing and costs them the list they
       were working from.

       At or below 899px the panel IS the screen and `lockPage()` pins
       `body { position: fixed }`, so the close is what STARTS the unlock and
       without it the page stays pinned for good.

       🔴 STARTS, NOT COMPLETES, AND THE NARROW BRANCH IS BROKEN BECAUSE
       OF IT. Reproduced in a browser 2026-09-01 by `study-hub-qa` at a real
       386px viewport, three runs from three positions: the page ends EXACTLY
       where it began (200→200, 1500→1500, 1200→1200) with the mark 8218px,
       1083px and 7218px away. Two independent reasons, and the second is the
       one that rules out "a faster machine would win it":

         1. `closePanel()` only sets `panel.hidden`. The unlock is the LAYER's,
            reached asynchronously — `MutationObserver(setPanelSpace)` →

            `window.scrollTo(0, was)`. QA recorded it at t+4ms, undoing the jump.

            `position: fixed; top: -1200px`, with `html.sv-locked` still set.**

            argument entirely.

       is load-bearing here and the branch behaved this way before the gate
       existed. 🟢 **FIXED 2026-09-01: the scroll is now deferred past the
       unlock**, immediately below. The coupling this paragraph worried about is
       real and is spelled out there: the shell reads `sv-locked`, which the
       layer owns, and a test pins both ends. **What it does NOT do is wait on a
       timer**, which is what the entry ruled out.

       🔴 899 IS THE LAYER'S BREAKPOINT, CROSSING INTO THE SHELL, and
       this is the only place the two files agree on it by hand: if it moves in
       `local-layer.html` it must move here, and nothing will connect them.
       The same test guards the same problem for the chat panel at
       `local-layer.html:6799` (`jumpToChat`), and the shape is copied from

       distinction is the whole fix. Closing the panel only sets `panel.hidden`;
       the unlock is the LAYER's and arrives later, on its MutationObserver.
       Reproduced here independently of QA, at a 382px viewport, three starting
       positions, both directions, with pass-through recorders self-tested by a
       sentinel first:

         started 200   the mark 17742px below   ended 200   not on screen
         started 1500  the mark 2724px above    ended 1500  not on screen
         started 1200  the mark 15542px below   ended 1200  not on screen

       Every run recorded the same two calls in the same millisecond:

         scrollIntoView   body: fixed, top: -200px, html.sv-locked
         scrollTo(0, 200)

       🔴 So a repair that reorders these two calls, or delays the second by a
       few milliseconds, STILL FAILS. At the moment `scrollIntoView` runs the
       body is pinned and the document has nothing to scroll; the `scrollTo` a

       the microtask checkpoint after that task, is guaranteed to run second. */

         tidy-up beside it. `goToBookmark` in the reader layer already refuses
         smooth for a measured reason: animation-driven scrolling does not run in
         a tab that is not painting.

         ⚠️ CORRECTED 2026-09-01 by `study-hub-qa`, and my own version of this
         was too modest. I shipped it as "a real if small UX change nobody asked
         for", citing the sibling. They measured the case I only cited: in a tab
         that is not painting, **smooth moved the page 0px while instant landed
         at 6,758**. So keeping smooth would have left this fix not working at
         all wherever the tab is not painting. **Do not restore it on the
         strength of "it is only a slide".** */

      document.querySelectorAll('mark.hl.active').forEach(function (x) { x.classList.remove('active'); });
      document.querySelectorAll(sel).forEach(function (x) { x.classList.add('active'); });

  /* Run `fn` once the page can actually be scrolled.

     🟢 A DEAD LAYER COSTS NOTHING HERE, by construction rather than by a
     branch: nothing but the layer ever sets `sv-locked`, so on a page whose
     layer never loaded the class is absent and `fn` runs immediately, which is
     exactly what this file did before.

     🔴 `sv-locked` is the layer's class read from the shell, a hand-shared name
     across two files with nothing connecting them, the same shape as the 899
     breakpoint above. A test pins both ends. The alternative, waiting on a
     timer, is what the entry rules out.

     ⚠️ The cap is not a fallback that fixes anything: if the lock is genuinely
     stuck, scrolling still does nothing and the reader is no worse off than they
     are today. It is there so a lock that never lifts cannot leave an observer
     watching the document for the life of the page, and so `fn` runs exactly
     once whichever way it goes. A second panel left open is the real case: the
     layer keeps the page locked while any of them is open, so this waits, then
     gives up quietly. */
  var UNLOCK_CLASS = 'sv-locked';
  var UNLOCK_WAIT_MS = 1200;

  function whenUnlocked(fn) {
    var root = document.documentElement;
    if (!root.classList.contains(UNLOCK_CLASS)) { fn(); return; }
    if (!window.MutationObserver) { window.setTimeout(fn, 0); return; }
    var done = false, timer = null;
    var obs = new MutationObserver(function () {
      if (!root.classList.contains(UNLOCK_CLASS)) finish();
    });
    function finish() {
      if (done) return;
      done = true;
      obs.disconnect();
      window.clearTimeout(timer);
      fn();
    }
    obs.observe(root, { attributes: true, attributeFilter: ['class'] });
    timer = window.setTimeout(finish, UNLOCK_WAIT_MS);

  function openPanel()  { panel.hidden = false; fab.setAttribute('aria-expanded', 'true');  renderPanel(); }
  function closePanel() { panel.hidden = true;  fab.setAttribute('aria-expanded', 'false'); }

  /* ---------- selection ---------- */

  var pending = null;
  /* 🔴 A selection that anchors to no block, but still has words in it. Diagrams
     are inline SVG inside <figure class="figbox">, which compose does not stamp
     as a block, so `segmentsIn` finds nothing there and the bar used to hide by
     design. EH, 2026-08-29: "selecting text inside a diagram does not pull up
     our usual highlight and lookup tools."

     The tools split honestly. Look up and Ask need only the STRING; Highlight,
     Card, Bookmark and Rewrite all need a block anchor, because a mark is a
     character range inside a stamped block and SVG cannot host the spans the
     marking engine paints with. So this carries the words and nothing else, and
     the bar shows a reduced set. */
  var loose = null;

  function hideBar() { bar.hidden = true; pending = null; loose = null; }

  /* A selection that crosses a list, a table or a card boundary covers several
     blocks. The first version required one, and silently showed no toolbar at
     all for anything wider, which is most of a drag across a card. Now the
     range is clipped to each block it touches and one mark is made per block. */
  function segmentsIn(range) {
    var out = [];
    for (var i = 0; i < blocks.length; i++) {
      var el = blocks[i];
      if (el.closest('.hl-panel')) continue;
      var touches;
      try { touches = range.intersectsNode(el); } catch (err) { touches = false; }
      if (!touches) continue;

      var clip = document.createRange();
      clip.selectNodeContents(el);

          clip.setStart(range.startContainer, range.startOffset);
        }
        if (clip.compareBoundaryPoints(Range.END_TO_END, range) > 0) {
          clip.setEnd(range.endContainer, range.endOffset);
        }
      } catch (err) { continue; }

      var s = offsetIn(el, clip.startContainer, clip.startOffset);
      var e = offsetIn(el, clip.endContainer, clip.endOffset);
      if (s < 0 || e < 0) continue;
      if (e - s < 1) continue;
      out.push({ b: i, s: Math.min(s, e), e: Math.max(s, e) });
    }
    return out;
  }

  function onSelect() {
    var sel = window.getSelection();
    if (!sel || sel.isCollapsed || sel.rangeCount === 0) return hideBar();

    var r = sel.getRangeAt(0);
    if (blockOf(r.startContainer) && blockOf(r.startContainer).closest('.hl-panel')) return hideBar();

    var segs = segmentsIn(r);
    var total = segs.reduce(function (n, sg) { return n + (sg.e - sg.s); }, 0);

    if (segs.length && total >= 2) {
      pending = segs;
      loose = null;
      bar.classList.remove('sv-textonly');
    } else {
      /* No block anchor. Worth a reduced bar only if there are words and the
         selection is inside the lesson body: a drag over the header or the
         panel is not a selection anybody wants tools for. */
      var host = r.commonAncestorContainer;
      host = host && (host.nodeType === 1 ? host : host.parentElement);
      var text = String(sel).replace(/\s+/g, ' ').trim();
      if (!host || !host.closest || !host.closest('.wrap') ||
          host.closest('.hl-panel') || text.length < 2) return hideBar();
      pending = null;
      loose = { text: text, host: host };
      bar.classList.add('sv-textonly');
    }

    var rect = r.getBoundingClientRect();
    bar.hidden = false;
    var top = rect.top + window.scrollY - bar.offsetHeight - 9;
    if (top < window.scrollY + 4) top = rect.bottom + window.scrollY + 9;
    var left = rect.left + window.scrollX + (rect.width / 2) - (bar.offsetWidth / 2);
    left = Math.max(8, Math.min(left, document.documentElement.clientWidth - bar.offsetWidth - 8));
    bar.style.top = top + 'px';
    bar.style.left = left + 'px';

  /* One group, one note. Everything the members carry is joined onto the head,
     because the head is the only note any surface shows once they are a group.
     Leaving a note on a member would make it invisible without deleting it,
     which is the worst of the two outcomes.

     🔴 `ns` (the reader's several-notes-per-highlight array) is DROPPED from the
     head rather than merged, and `n` wins. `n` is defined as the joined text of
     `ns` and is what every other consumer reads, so rebuilding `ns` from the
     merged `n` on the next render loses no writing and keeps one source of
     truth. Merging two `ns` arrays by hand would have to invent an id order. */
  function consolidateGroup(gid, extra) {
    // 🔴 `it.g &&` is here because this was correct only by luck: its ONE
    // caller checks `if (gid)` before calling. A future caller will not know
    // that, and `undefined === undefined` is true, so an empty gid would match
    // every ungrouped mark in the lesson and consolidate the lot into one.
    // Same shape as svGroupOf in local-layer.html; the server's group_marks
    // asks `if not g` before it ever compares, which is why only the
    // JavaScript half of this grouping has ever needed a guard.
    var mine = items.filter(function (it) { return it.g && it.g === gid; });
    if (!mine.length) return;
    var grp = groupMarks(mine)[0];
    var all = [];
    grp.parts.forEach(function (p) {
      if (p.n) all.push(p.n);
      if (p !== grp.head) { delete p.n; delete p.ns; }
    });
    (extra || []).forEach(function (t) { if (t) all.push(t); });
    var joined = all.join('\n');
    if (joined) { grp.head.n = joined; delete grp.head.ns; }
  }


  function add(cls) {
    if (!pending || !pending.length) return;
    var fresh = [], eaten = [], touched = {};

    pending.forEach(function (seg) {
      var block = blocks[seg.b];
      if (!block) return;

      var s = seg.s, e = seg.e;

      /* An overlapping mark in the same block is absorbed rather than stacked,
         so re-marking a passage widens it instead of layering two. */
      items = items.filter(function (it) {
        if (it.b !== seg.b || it.s > e || it.e < s) return true;
        /* 🟢 TWO COLOURS ON ONE PASSAGE. EH's ask, 2026-09-02: *"it should be
           able to store more than one color highlight on a single word ...
           because the different colors may have different meanings."*

           🟢 THE WHOLE OF STACKING, MEASURED BEFORE IT WAS WRITTEN: the absorb
           rule never looked at the colour, and `cls` is already this function's
           only argument, so keeping a DIFFERENT colour is one clause. Returning
           true means "not absorbed", which leaves the existing mark alone and
           lets the new one be added beside it.

           ⚠️ SAME-COLOUR OVERLAP STILL ABSORBS, which is the "widen a
           highlight" gesture and the rule this clause replaced was protecting.
           EH did not ask to lose it, so it is kept deliberately rather than by
           accident: `it.c !== cls` is the entire difference.

           🔴 IT SHIPPED BEHIND A SWITCH AND THE SWITCH IS GONE. Built off by
           default 2026-09-04 (`a08d5c1`), on the manager's ruling that a
           feature travelling through the part of this system with the worst
           history does not get built in a copy of the file. Flipped and the
           switch deleted once six conditions were proved: save, reload, a
           second device, deleting one, recolouring one, and the LOOK.

           🟢 THE LOOK IS THE MIX RULE in this file's stylesheet: colours on
           one passage blend (EH's ruling of 2026-09-04, which replaced the
           stripes he had chosen from three rendered options the day before).
           See `mark.hl mark.hl`. */
        if (it.c !== cls) return true;
        s = Math.min(s, it.s);
        e = Math.max(e, it.e);
        if (it.n) eaten.push(it.n);
        /* 🔴 Which GROUPS this selection ate from, not only which items. Half a
           group absorbed and the other half left wearing a group id nothing
           else carries is precisely the orphan this rule prevents. */
        if (it.g) touched[it.g] = true;
        return false;
      });

      fresh.push({
        id: seq++, b: seg.b, s: s, e: e,
        t: block.textContent.slice(s, e), c: cls, n: ''
      });
    });

    if (!fresh.length) return hideBar();

    /* A group id when the selection crosses blocks, and also when it overlaps
       a group that already exists. A single-block selection touching nothing
       gets no `g` at all, so the common case stores exactly what it stored
       before today and an old page reads it unchanged. */
    var gid = '';
    if (fresh.length > 1 || Object.keys(touched).length) {
      gid = 'g' + (seq++);
      fresh.forEach(function (it) { it.g = gid; });
      items.forEach(function (it) { if (it.g && touched[it.g]) it.g = gid; });
    }

    items = items.concat(fresh);
    if (gid) { consolidateGroup(gid, eaten); }
    else if (eaten.length) { fresh[0].n = eaten.join('\n'); }

    var sel = window.getSelection();
    if (sel) sel.removeAllRanges();
    hideBar();
    save(); renderMarks(); renderPanel();
  }

  /* ---------- export and import ---------- */

  function buildMarkdown() {
    var lines = [];
    var nHl = groupMarks(items).length;
    lines.push('# Highlights: ' + DOC_TITLE);
    lines.push('');
    lines.push('Exported ' + new Date().toISOString().slice(0, 10) + '. ' +
               notes.length + (notes.length === 1 ? ' note, ' : ' notes, ') +
               nHl + (nHl === 1 ? ' highlight.' : ' highlights.'));
    lines.push('');
    lines.push('Re-import this same file in the artifact’s Highlights panel to restore them.');
    lines.push('');

    if (notes.length) {
      lines.push('## Notes');
      lines.push('');
      notes.slice().sort(function (a, z) { return (a.ts || 0) - (z.ts || 0); }).forEach(function (nt) {
        if (!nt.text) return;
        lines.push('- ' + nt.text.replace(/\n+/g, ' ').trim());
      });
      lines.push('');
    }

    /* Folded into groups first, so a selection that crossed two table cells
       leaves ONE line here with its halves joined by " - ", not two. A fold
       carries the same c, t and n an item does, so nothing below changes. */
    var sorted = groupMarks(items);
    function bucket(c) { return sorted.filter(function (i) { return (i.c || 'k') === c; }); }

    function block(title, arr) {
      if (arr.length === 0) return;
      lines.push('## ' + title);
      lines.push('');
      arr.forEach(function (it) {
        lines.push('> ' + it.t.replace(/\s+/g, ' ').trim());
        if (it.n) { lines.push(''); lines.push('**Note:** ' + it.n.replace(/\n/g, ' ')); }
        lines.push('');
      });
    }

    block('Highlighted', bucket('k'));
    block('Flagged to come back to', bucket('q'));
    block('Cards to make', bucket('d'));

    lines.push('---');
    lines.push('');
    lines.push('<!-- highlight-data v1, do not edit below this line -->');
    lines.push('');
    lines.push(FENCE + 'json');
    lines.push(JSON.stringify({ doc: DOC_ID, items: items, notes: notes }));
    lines.push(FENCE);
    lines.push('');
    return lines.join('\n');
  }

  /* Vault-shaped export: a section to sit inside the week note, with EH's
     highlights as ==marks== so the nightly harvest can pick up the short ones,
     and his free notes as prose. Deliberately contains none of the generated
     study note: only what he wrote himself. */
  function buildVaultMd(bare) {
    var L = [];
    /* The Copy button still wants a self-contained section to paste.
       The server owns those headings when it is doing the writing, so
       emitting them again would nest a second copy inside the block. */
    if (!bare) {
      L.push('## Topic - ' + VAULT.topic);
      L.push('');
      L.push('### Part ' + VAULT.part);
      L.push('');
    }
    if (VAULT.keats.indexOf('http') === 0) {
      L.push('[Lecture](' + VAULT.keats + ')');
      L.push('');
    }

    if (notes.length) {
      L.push('**Notes**');
      L.push('');
      notes.slice().sort(function (a, z) { return (a.ts || 0) - (z.ts || 0); }).forEach(function (nt) {
        if (!nt.text) return;
        L.push('- ' + nt.text.replace(/\n+/g, ' ').trim());
      });
      L.push('');
    }

    /* Folded into groups first, so a selection that crossed two table cells
       leaves ONE line here with its halves joined by " - ", not two. A fold
       carries the same c, t and n an item does, so nothing below changes. */
    var sorted = groupMarks(items);
    function bucket(c) { return sorted.filter(function (i) { return (i.c || 'k') === c; }); }

    function block(title, arr, name) {
      if (!arr.length) return;
      L.push('**' + title + '**');
      L.push('');
      arr.forEach(function (it) {
        var t = it.t.replace(/\s+/g, ' ').trim();
        /* ==mark== is the vault's highlight syntax. Short ones become term
           candidates; long ones are read as emphasis and left alone, which is
           the intended behaviour, so prose can be highlighted freely.

           The {kind} after it is EH's design (2026-08-23): the line carries
           the NAME of its kind, so the meaning survives a colour being
           renamed, recoloured or retired, and survives the line being moved
           out of its section by a later sweep. */
        var tag = String(name || it.c || 'k').toLowerCase();
        L.push('- ==' + t + '== {' + tag + '}');
        if (it.n) L.push('    - ' + it.n.replace(/\n+/g, ' ').trim());
      });
      L.push('');
    }
    /* 🔴 Bucketed by the PALETTE, not by colour literals. Until 2026-08-22
       this was two literal buckets (k and q), so a highlight in any custom
       colour was silently dropped from the vault: on the page, in the export,
       and nowhere in the note. The layer knows the palette (it comes with the
       settings) and hands it over as STUDY.palette; the literals survive only
       as the fallback for a page where the layer never loaded, and a colour
       the palette does not know still publishes, under its own honest
       heading. */
    var pal = (window.STUDY && window.STUDY.palette) || [
      { id: 'k', label: 'Highlights', name: 'highlight' },
      { id: 'q', label: 'Flagged to come back to', name: 'flag' }
    ];
    var bucketed = { d: true };
    pal.forEach(function (c) {
      if (c.id === 'd' || bucketed[c.id]) return;
      bucketed[c.id] = true;
      block(c.label || c.id, bucket(c.id), c.name || c.label || c.id);
    });
    /* No shared name for this bucket: each line tags its own colour id,
       which is all that is honestly known about it. */
    block('Other colours', sorted.filter(function (i) {
      return !bucketed[i.c || 'k'];
    }));

    /* Define marks use the vault's definition-request syntax: the term on its
       own line ending in three colons with NOTHING after them. Text after the
       colons would make it a finished card, which the harvest never touches. */
    var defs = bucket('d');
    if (defs.length) {
      L.push('**Cards to make**');
      L.push('');
      defs.forEach(function (it) {
        L.push(it.t.replace(/\s+/g, ' ').trim() + ':::');
        L.push('');
      });
    }

    return L.join('\n');
  }

  function toast(msg) {
    var t = document.createElement('div');

  document.getElementById('hlExport').addEventListener('click', function () {

      if (data.doc && data.doc !== DOC_ID) return toast('That file belongs to ' + data.doc + ', not this page.');

  /* study-surface:start */
  /* The block's own text, plus the nearest heading above it, is what Explain
     is given so it can answer about THIS use of a term rather than the general
     one. Nothing else leaves the machine. */
  function contextFor(block) {
    var head = '', el = block.previousElementSibling, hops = 0;
    while (el && hops < 14) {
      if (/^H[1-4]$/.test(el.tagName)) { head = el.textContent.trim(); break; }
      el = el.previousElementSibling; hops++;

    marks: function () { return { items: items, notes: notes }; },
    /* 🔴 The ONE grouper. The layer builds its own export and its own counts,
       and a second implementation of "one selection is one highlight" would
       drift from this one the first time either changed. Same seam and same
       reason as lessonNav and lessonState: this script is an IIFE, so a bare
       global would be undefined over there and fail in silence. */
    groupMarks: function (list) { return groupMarks(list || items); },
    /* Write what marks() handed out, without re-rendering. R37 needs it: a
       note on a highlight autosaves while it is being typed, and going through
       replaceMarks would rebuild the panel and take the focus out of the box
       being typed into. */
    persist: function () { save(); },
    /* Used to restore from the on-disk copy. Same path the Import button takes,
       so there is one way for marks to arrive from outside, not two. */
    replaceMarks: function (i, n) {
      items = Array.isArray(i) ? i : [];
      notes = Array.isArray(n) ? n : [];
      seq = 0; nseq = 0;
      items.forEach(function (it) { if (it.id >= seq) seq = it.id + 1; });
      notes.forEach(function (nt) { if (nt.id >= nseq) nseq = nt.id + 1; });
      save(); renderMarks(); renderPanel();
    },
    blockHtml: function (i) { return blocks[i] ? blocks[i].innerHTML : ''; },
    blockText: function (i) { return blocks[i] ? blocks[i].textContent : ''; },
    /* _orig is what renderMarks repaints from, so an edit that does not update
       it is undone by the next highlight. */
    setBlockHtml: function (i, h) {
      var el = blocks[i];
      if (!el) return false;
      el.innerHTML = h;
      el._orig = h;
      renderMarks();
      return true;
    },
    selection: function () {
      /* The reduced case first: words, no anchor. `b` and the offsets are null
         rather than 0, so anything that needs a block fails loudly instead of
         silently editing the first paragraph on the page. */
      if ((!pending || !pending.length) && loose) {
        var lrect = null, lsel = window.getSelection();
        if (lsel && lsel.rangeCount && !lsel.isCollapsed) {
          try { lrect = lsel.getRangeAt(0).getBoundingClientRect(); } catch (e2) { lrect = null; }
        }
        if (!lrect || (!lrect.width && !lrect.height)) lrect = bar.getBoundingClientRect();
        var lblock = blockOf(loose.host);
        return { text: loose.text,
                 context: lblock ? contextFor(lblock) : (DOC_TITLE || ''),
                 b: null, s: null, e: null, rect: lrect, segments: [],
                 textOnly: true };
      }
      if (!pending || !pending.length) return null;
      var first = pending[0];
      var block = blocks[first.b];
      if (!block) return null;

      /* A selection can now cross blocks, so the text is every piece joined.
         Look up and Explain want the whole phrase; Rewrite edits one paragraph
         and takes the first, which the editor names in its header. */
      var text = pending.map(function (seg) {
        var el = blocks[seg.b];
        return el ? el.textContent.slice(seg.s, seg.e) : '';
      }).join(' ').replace(/\s+/g, ' ').trim();

      var rect = null, sel = window.getSelection();
      if (sel && sel.rangeCount && !sel.isCollapsed) {
        try { rect = sel.getRangeAt(0).getBoundingClientRect(); } catch (err) { rect = null; }
      }
      if (!rect || (!rect.width && !rect.height)) rect = bar.getBoundingClientRect();
      return {
        text: text,
        context: contextFor(block),
        b: first.b, s: first.s, e: first.e,
        blocks: pending.length,
        /* Block plus offsets rather than a live Range, so the selection can be
           redrawn after a repaint has detached the original nodes. */
        segments: pending.map(function (sg) { return { b: sg.b, s: sg.s, e: sg.e }; }),
        rect: rect
      };
    }
  };
  /* study-surface:end */

  /* study-reanchor:start */
  /* A mark stores a block index and character offsets. Anything that changes
     what counts as a block, or rewrites a note, moves those indices and would
     otherwise leave every mark pointing at the wrong paragraph. So on load,
     check each mark against the text it recorded, and if it no longer matches,
     find that text again. Searching outward from the original index keeps a
     repeated phrase anchored near where it was. */
  function reanchor() {
    var fixed = 0, lost = 0;
    items.forEach(function (it) {
      if (!it.t) return;
      var here = blocks[it.b];
      if (here && here.textContent.slice(it.s, it.e) === it.t) { it.orphan = false; return; }

      var order = [], i;
      for (i = 0; i < blocks.length; i++) order.push(i);
      order.sort(function (a, z) { return Math.abs(a - it.b) - Math.abs(z - it.b); });

      for (i = 0; i < order.length; i++) {
        var at = blocks[order[i]].textContent.indexOf(it.t);
        if (at >= 0) {
          it.b = order[i]; it.s = at; it.e = at + it.t.length; it.orphan = false;
          fixed++;
          return;
        }
      }
      it.orphan = true;
      lost++;
    });
    if (fixed || lost) save();
    return { fixed: fixed, lost: lost };
  }
  /* study-reanchor:end */

  load();
  var _re = reanchor();
  renderMarks();
  renderPanel();
  if (_re.fixed) toast('Re-anchored ' + _re.fixed +
      (_re.fixed === 1 ? ' highlight after the note changed.' :
                         ' highlights after the note changed.'));
})();
</script>
